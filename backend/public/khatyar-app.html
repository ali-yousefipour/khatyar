<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6c324">
<title>خطیار — نسخه وب</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="assets/backend_panel.bundle.css?v=105">
<style>
:root{--brand:#f6c324;--ink:#152235;--muted:#68758a;--paper:#f6f8fb;--card:#fff;--ok:#16845b;--danger:#c43d50;--line:#e5e9ef}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{max-width:1200px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);display:grid;place-items:center;font-weight:900;color:#17202c}.title{font-size:18px;font-weight:900}.sub{font-size:11px;color:var(--muted)}.spacer{flex:1}.btn{border:0;border-radius:12px;padding:10px 14px;font-family:inherit;font-weight:700;cursor:pointer;background:#17202c;color:#fff}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.brand{background:var(--brand);color:#17202c}.login{max-width:430px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 15px 45px #17202c12}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dbe1e9;border-radius:11px;font-family:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:#a8b2c0}.err{background:#fff0f1;color:var(--danger);padding:10px;border-radius:10px;font-size:12px;margin:10px 0;display:none}.hero{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.avatar{width:58px;height:58px;border-radius:18px;background:var(--brand);display:grid;place-items:center;font-weight:900;font-size:22px}.hero h1{margin:0;font-size:20px}.hero p{margin:4px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;min-height:145px;display:flex;flex-direction:column;gap:9px}.card h3{margin:0;font-size:14px}.card p{margin:0;color:var(--muted);font-size:11px;line-height:1.8}.card .actions{margin-top:auto;display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;width:max-content;padding:4px 8px;border-radius:999px;background:#f0f3f7;color:#536174;font-size:10px}.section{margin:22px 0 10px;font-size:15px;font-weight:900}.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-top:14px}.panel.on{display:block}.panel h2{margin-top:0;font-size:17px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eef1f5;font-size:12px}.row:last-child{border-bottom:0}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f4;text-align:right}.map{height:320px;border-radius:14px;background:#eef2f5;display:grid;place-items:center;color:var(--muted);margin-top:10px}.camera{max-width:100%;border-radius:14px;background:#111}.status{font-size:11px;color:var(--muted);white-space:pre-wrap}.hide{display:none!important}@media(max-width:650px){.wrap{padding:12px}.hero{align-items:flex-start}.grid{grid-template-columns:1fr}.topin{padding:10px 12px}.top .sub{display:none}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="logo">خ</div><h2>ورود به خطیار</h2><div class="sub">نسخه وب با قابلیت‌های هم‌تراز با اپلیکیشن</div>
  <div class="field"><label>نام کاربری</label><input id="u" inputmode="numeric" autocomplete="username"></div>
  <div class="field"><label>کلمه عبور</label><input id="p" type="password" autocomplete="current-password"></div>
  <div id="loginErr" class="err"></div><button id="loginBtn" class="btn brand" onclick="login()">ورود</button>
</div>
<div id="app" class="hide">
<header class="top"><div class="topin"><div class="logo">خ</div><div><div class="title">خطیار — نسخه وب</div><div class="sub">قابلیت‌های نسخه اندروید در مرورگر</div></div><div class="spacer"></div><button class="btn alt" onclick="logout()">خروج</button></div></header>
<main class="wrap">
<section class="hero"><div id="avatar" class="avatar">خ</div><div><h1 id="name">کاربر</h1><p id="role">—</p></div><div class="spacer"></div><button class="btn brand" onclick="run('dashboard')">به‌روزرسانی</button></section>
<div class="section">عملیات روزانه</div><div id="daily" class="grid"></div>
<div class="section">اطلاعات، گزارش و کارتابل</div><div id="reports" class="grid"></div>
<div class="section">ارتباطات و تنظیمات</div><div id="settings" class="grid"></div>
<div id="panel" class="panel"><h2 id="panelTitle"></h2><div id="panelBody"></div></div>
</main></div>
<script>
const S={token:localStorage.getItem('khatyar_access'),user:null};
const features={
 daily:[
  ['ثبت حضور من','attendance','ثبت حضور با موقعیت مکانی و رعایت محدودیت زمانی'],['موقعیت مکانی','locations','ارسال موقعیت فعلی مرورگر با اجازه کاربر'],['جستجوی تاکسی و تاکسیران','search','جستجو با کد ملی یا پلاک'],['اطلاعات راننده','driver','نمایش اطلاعات راننده از جستجو'],['اطلاعات خودرو','vehicle','نمایش خودرو و رانندگان متصل'],['بدهی آبونمان','debt','مشاهده بدهی و لینک پرداخت'],['ثبت تذکر','notices','ثبت و مشاهده تذکرات'],['چک‌لیست خودرو','checklist','دریافت قالب و ثبت چک‌لیست'],['ثبت حضور مسئولین در خط','official','ثبت بازدید و حضور مسئول'],['هشدارها و انقضاها','alerts','نمایش هشدارهای مرتبط با عملیات']
 ],
 reports:[
  ['داشبورد من','dashboard','آمار و وضعیت روزانه کاربر'],['گزارش حضور','attendanceReport','گزارش حضور ثبت‌شده'],['تذکرات قبلی','pastNotices','سوابق تذکرات'],['چک‌لیست‌های قبلی','pastChecklists','سوابق چک‌لیست'],['کارکرد من','work','خلاصه کارکرد ماهانه'],['فیش‌های حقوقی من','salary','نمایش/چاپ فیش حقوقی'],['درخواست‌ها','requests','درخواست‌های شخصی و وضعیت آن‌ها'],['کارتابل تأیید درخواست‌ها','inbox','تأیید یا رد درخواست‌های زیرمجموعه'],['گزارشات دریافتی','inboxReports','گزارش‌های دریافتی'],['فعالیت رانندگان هر خط','activity','گزارش فعالیت خطوط'],['وضعیت بیمه و معاینه','insurance','گزارش اعتبار بیمه و معاینه'],['افراد فاقد اعتبار','expired','افراد فاقد اعتبار'],['خودروهای فاقد بهره‌برداری','oplic','خودروهای فاقد بهره‌برداری'],['زیرمجموعه من','team','گزارش زیرمجموعه'],['حاضرین در خط','present','فهرست حاضرین']
 ],
 settings:[
  ['پیام‌ها','messages','پیام‌های دریافتی و علامت‌گذاری خوانده‌شده'],['اعلان‌ها','notifications','اعلان‌ها و وضعیت خوانده‌شدن'],['پیامک‌های راننده','driverSms','پیامک‌های مرتبط با راننده'],['پیامک‌های ارسالی من','mySms','سوابق پیامک‌های ارسال‌شده'],['ارسال پیام در ربات‌ها','bots','ارسال پیام به کانال‌های متصل'],['فرم‌ها','forms','فرم‌های سفارشی'],['فعالیت‌های فرهنگی','cultural','بخش فرهنگی'],['رفاهیات','welfare','خدمات رفاهی'],['رانندگان موقت','tempDrivers','مدیریت رانندگان موقت'],['اقلام تحویلی','inventory','اقلام تحویلی'],['برنامه بازدید خطوط','lineVisits','برنامه بازدید'],['ماموریت روزانه من','mission','ماموریت‌های روزانه'],['داشبورد نقش','roleDashboard','داشبورد متناسب با نقش'],['رتبه‌بندی','leaderboard','رتبه و امتیاز عملکرد'],['پروفایل','profile','پروفایل و اطلاعات حساب'],['تغییر رمز عبور','password','تغییر رمز عبور'],['تنظیمات قفل برنامه','appLock','تنظیم قفل حساب در مرورگر'],['تنظیمات نقشه','mapSettings','تنظیمات موقعیت و نقشه'],['گزارش خطا','crash','ثبت/مشاهده خطاهای کلاینت'],['درخواست برای شرکت','company','ارسال درخواست برای شرکت'],['اشتراک','subscription','وضعیت اشتراک']
 ]
};
function render(){for(const [id,list] of Object.entries({daily:features.daily,reports:features.reports,settings:features.settings})){document.getElementById(id).innerHTML=list.map(([t,k,d])=>`<article class="card"><span class="pill">${k}</span><h3>${t}</h3><p>${d}</p><div class="actions"><button class="btn brand" onclick="run('${k}','${esc(t)}')">باز کردن</button></div></article>`).join('')}}
function esc(s){return s.replace(/'/g,"\\'")}
async function api(path,opt={}){if(!S.token) throw Error('نشست وارد نشده است');const h={'Content-Type':'application/json','Accept':'application/json',...(opt.headers||{}),Authorization:'Bearer '+S.token};let r=await fetch('/api'+path,{...opt,headers:h});if(r.status===401){logout();throw Error('نشست منقضی شد');}const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{throw Error('پاسخ سرور JSON نیست');}if(!r.ok)throw Error(d.error||d.message||('HTTP '+r.status));return d}
async function login(){const err=document.getElementById('loginErr');err.style.display='none';const btn=document.getElementById('loginBtn');btn.disabled=true;try{let id=localStorage.getItem('khatyar_web_device');if(!id){id='WEB-'+crypto.randomUUID();localStorage.setItem('khatyar_web_device',id)}const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value,device_id:id,device_model:navigator.userAgent.slice(0,180),vpn_on:false,dev_options_on:false,gps_on:'geolocation' in navigator})});const d=await r.json();if(!r.ok)throw Error(d.error||'ورود ناموفق');S.token=d.access;S.user=d.user;localStorage.setItem('khatyar_access',S.token);showApp()}catch(e){err.textContent=e.message;err.style.display='block'}finally{btn.disabled=false}}
function showApp(){loginEl(false);document.getElementById('name').textContent=S.user?.name||'کاربر';document.getElementById('role').textContent=S.user?.role||'';document.getElementById('avatar').textContent=(S.user?.name||'خ').trim().charAt(0);render();run('dashboard')}
function loginEl(v){document.getElementById('login').classList.toggle('hide',!v);document.getElementById('app').classList.toggle('hide',v)}
function logout(){localStorage.removeItem('khatyar_access');S.token=null;loginEl(true)}
function panel(title,html){document.getElementById('panelTitle').textContent=title;document.getElementById('panelBody').innerHTML=html;document.getElementById('panel').classList.add('on');document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'})}
function jsonView(x){if(x==null)return '<div class="status">اطلاعاتی دریافت نشد.</div>';if(Array.isArray(x)){if(!x.length)return '<div class="status">موردی یافت نشد.</div>';const keys=[...new Set(x.flatMap(o=>Object.keys(o||{})))].slice(0,8);return `<table class="table"><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${x.map(o=>`<tr>${keys.map(k=>`<td>${typeof o?.[k]==='object'?JSON.stringify(o[k]):(o?.[k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}return '<pre class="status">'+JSON.stringify(x,null,2).replace(/</g,'&lt;')+'</pre>'}
async function run(k,title=k){try{
 if(k==='dashboard'){panel('داشبورد من','در حال دریافت...');panelBody.innerHTML=jsonView(await api('/my/dashboard'));return}
 if(k==='search'){panel(title,'<div class="field"><label>کد ملی</label><input id="qnat"></div><div class="field"><label>پلاک</label><input id="qplate"></div><button class="btn brand" onclick="doSearch()">جستجو</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='attendance'){panel(title,'<p class="status">برای ثبت حضور، مرورگر باید اجازه موقعیت مکانی داشته باشد.</p><button class="btn brand" onclick="doAttendance()">ثبت حضور با موقعیت فعلی</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='locations'){panel(title,'<p class="status">این عملیات فقط پس از اجازه صریح کاربر انجام می‌شود.</p><button class="btn brand" onclick="sendLocation()">ارسال موقعیت فعلی</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='debt'){panel(title,'<div class="field"><label>کد ملی</label><input id="qnat"></div><button class="btn brand" onclick="doDebt()">دریافت بدهی</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='notices'){panel(title,'<div class="field"><label>شناسه راننده</label><input id="driverId" type="number"></div><div class="field"><label>اولویت</label><select id="priority"><option value="low">کم</option><option value="medium">متوسط</option><option value="high">زیاد</option></select></div><div class="field"><label>متن</label><textarea id="body" rows="4"></textarea></div><button class="btn brand" onclick="doNotice()">ثبت تذکر</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='checklist'){panel(title,'<button class="btn brand" onclick="doChecklist()">دریافت قالب چک‌لیست</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='official'){panel(title,'<button class="btn brand" onclick="doOfficials()">دریافت مسئولین</button><div id="out" style="margin-top:12px"></div>');return}
 if(k==='messages'){const d=await api('/my/messages');panel(title,jsonView(d));return}
 if(k==='notifications'){const d=await api('/my/notifications');panel(title,jsonView(d));await api('/my/notifications/read',{method:'POST',body:'{}'});return}
 const maps={attendanceReport:'/attendance/1',pastNotices:'/notices/1',pastChecklists:'/checklists/mine',work:'/my/work-summary',salary:'/my/payslip',requests:'/my/requests',inbox:'/my/request-inbox',inboxReports:'/my/reports',activity:'/reports/activity',insurance:'/reports/exp-insurance',expired:'/reports/expired',oplic:'/reports/exp-oplic',team:'/reports/team',present:'/reports/present',forms:'/forms',cultural:'/cultural',welfare:'/welfare',tempDrivers:'/temp-drivers',inventory:'/inventory',lineVisits:'/line-visit-program',mission:'/my/daily-mission',roleDashboard:'/role-dashboard',leaderboard:'/leaderboard',profile:'/auth/me',company:'/company-requests',subscription:'/subscription/status',crash:'/crash-reports'};
 if(maps[k]){const d=await api(maps[k]);panel(title,jsonView(d));return}
 if(['driver','vehicle'].includes(k)){panel(title,'ابتدا از بخش «جستجوی تاکسی و تاکسیران» راننده یا خودرو را جستجو کنید.');return}
 panel(title,'این بخش در رابط وب فعال است و API آن در نسخه جاری سرور باید به ماژول مربوط متصل شود.');
 }catch(e){panel(title,'<div class="err" style="display:block">'+e.message+'</div>')}}
async function doSearch(){try{const q=qnat.value.trim()?('?national_id='+encodeURIComponent(qnat.value.trim())):('?plate='+encodeURIComponent(qplate.value.trim()));out.innerHTML=jsonView(await api('/search'+q))}catch(e){out.textContent=e.message}}
async function doDebt(){try{out.innerHTML=jsonView(await api('/debt/'+encodeURIComponent(qnat.value.trim())))}catch(e){out.textContent=e.message}}
async function doNotice(){try{out.innerHTML=jsonView(await api('/notices',{method:'POST',body:JSON.stringify({driver_id:Number(driverId.value),priority:priority.value,body:body.value})}))}catch(e){out.textContent=e.message}}
async function doChecklist(){try{out.innerHTML=jsonView(await api('/checklist/template'))}catch(e){out.textContent=e.message}}
async function doOfficials(){try{out.innerHTML=jsonView(await api('/officials'))}catch(e){out.textContent=e.message}}
async function doAttendance(){if(!navigator.geolocation){out.textContent='مرورگر از موقعیت مکانی پشتیبانی نمی‌کند';return}navigator.geolocation.getCurrentPosition(async pos=>{try{const d=await api('/attendance',{method:'POST',body:JSON.stringify({driver_id:Number(S.user?.id||0),lat:pos.coords.latitude,lng:pos.coords.longitude})});out.innerHTML=jsonView(d)}catch(e){out.textContent=e.message}},e=>out.textContent='دسترسی موقعیت مکانی رد شد: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function sendLocation(){if(!navigator.geolocation){out.textContent='مرورگر از موقعیت مکانی پشتیبانی نمی‌کند';return}navigator.geolocation.getCurrentPosition(async pos=>{try{out.innerHTML=jsonView(await api('/locations',{method:'POST',body:JSON.stringify({pings:[{lat:pos.coords.latitude,lng:pos.coords.longitude,captured_at:new Date().toISOString()}]})}))}catch(e){out.textContent=e.message}},e=>out.textContent=e.message,{enableHighAccuracy:true,timeout:15000})}
if(S.token){api('/auth/me').then(r=>{S.user=r.user;showApp()}).catch(()=>logout())}else loginEl(true);
</script>
</body></html>
