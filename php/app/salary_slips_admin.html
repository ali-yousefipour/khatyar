<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت فیش حقوقی</title><style>
@font-face{font-family:Vazir;src:local(Vazir)}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#142033;font-family:Vazir,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:18px;box-shadow:0 8px 24px rgba(20,32,51,.08);padding:18px;margin-bottom:16px}h1{font-size:22px;margin:0 0 14px;color:#086b56}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,button,select{font-family:inherit;border-radius:12px;border:1px solid #d8e1ee;padding:11px;background:#fff}button{background:#086b56;color:#fff;border:0;cursor:pointer;font-weight:700}.muted{color:#748198;font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #eef2f6;padding:10px 0;flex-wrap:wrap}.tag{background:#edf8f4;color:#086b56;padding:5px 10px;border-radius:999px}.danger{background:#fee2e2;color:#b91c1c}.list{margin-top:12px}.name{font-weight:700}.small{font-size:12px;color:#748198}.sel{background:#fff7e6;border-color:#ffc928}</style></head><body><div class="wrap">
  <div class="card"><h1>مدیریت فیش حقوقی PDF کاربران</h1><p class="muted">کاربر را جستجو کنید، ماه فیش را انتخاب کنید و فایل PDF را بارگذاری نمایید.</p><div class="grid"><input id="q" placeholder="نام، موبایل، کد ملی یا نام کاربری"><button onclick="searchUsers()">جستجوی کاربر</button></div><div id="users" class="list"></div></div>
  <div class="card" id="uploadBox" style="display:none"><h1 id="selTitle">بارگذاری فیش</h1><div class="grid"><input id="jy" placeholder="سال شمسی" value="1405"><select id="jm"><option value="1">فروردین</option><option value="2">اردیبهشت</option><option value="3">خرداد</option><option value="4">تیر</option><option value="5">مرداد</option><option value="6">شهریور</option><option value="7">مهر</option><option value="8">آبان</option><option value="9">آذر</option><option value="10">دی</option><option value="11">بهمن</option><option value="12">اسفند</option></select><input id="title" placeholder="عنوان فیش"><input id="file" type="file" accept="application/pdf"><button onclick="upload()">ثبت فیش حقوقی</button></div><div id="slips" class="list"></div></div>
</div><script>
let token=localStorage.getItem('access')||localStorage.getItem('token')||'';let selected=null;const api=(p,opt={})=>fetch('/api'+p,{...opt,headers:{...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}}).then(async r=>{let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'خطا');return j});
async function searchUsers(){let q=document.getElementById('q').value;let r=await api('/admin/salary-slips/users?q='+encodeURIComponent(q));document.getElementById('users').innerHTML=(r.rows||[]).map(u=>`<div class="row"><div><div class="name">${u.name||u.username||'-'}</div><div class="small">${u.mobile||''} ${u.national_code||''}</div></div><button onclick='selectUser(${JSON.stringify(u)})'>انتخاب</button></div>`).join('')||'<p class="muted">موردی یافت نشد.</p>'}
async function selectUser(u){selected=u;document.getElementById('uploadBox').style.display='block';document.getElementById('selTitle').textContent='بارگذاری فیش برای '+(u.name||u.username);await loadSlips()}
async function loadSlips(){let r=await api('/admin/users/'+selected.id+'/salary-slips');document.getElementById('slips').innerHTML='<h3>فیش‌های ثبت‌شده</h3>'+((r.rows||[]).map(x=>`<div class="row"><span><b>${x.title||'فیش حقوقی'}</b> <span class="tag">${x.period_label}</span><br><span class="small">${x.file_name||''}</span></span><button class="danger" onclick="delSlip(${x.id})">حذف</button></div>`).join('')||'<p class="muted">فیشی ثبت نشده است.</p>')}
async function upload(){if(!selected)return alert('ابتدا کاربر را انتخاب کنید');let f=document.getElementById('file').files[0];if(!f)return alert('فایل PDF را انتخاب کنید');let fd=new FormData();fd.append('period_jy',document.getElementById('jy').value);fd.append('period_jm',document.getElementById('jm').value);fd.append('title',document.getElementById('title').value);fd.append('file',f);let r=await fetch('/api/admin/users/'+selected.id+'/salary-slips',{method:'POST',headers:{...(token?{Authorization:'Bearer '+token}:{})},body:fd});let j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'خطا');alert('ثبت شد');document.getElementById('file').value='';await loadSlips()}
async function delSlip(id){if(!confirm('حذف شود؟'))return;await api('/admin/salary-slips/'+id,{method:'DELETE'});await loadSlips()}
searchUsers().catch(()=>{});
</script></body></html>
