<script>
const API='/api';
const _apiCache={};
const _apiTTL={'/settings/public':300000,'/my/dashboard':30000,'/my/stats':60000,'/my/lines':180000,'/notice-reasons':300000,'/officials':180000};
function _ttlFor(p){ for(const k in _apiTTL){ if(p===k || p.startsWith(k+'?')) return _apiTTL[k]; } return 0; }
function _clearApiCache(){ for(const k in _apiCache) delete _apiCache[k]; }
const store={get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v),del:k=>localStorage.removeItem(k)};
if(!store.get('device_id')) store.set('device_id','web-'+Math.random().toString(36).slice(2)+Date.now().toString(36));
let USER=null, current='dashboard', tmp={}, BRAND={title:'مدیریت خطوط تاکسیرانی',logo:''};
function starsForUser(u){ const custom=(u&&u.rank_stars!==null&&u.rank_stars!==undefined)?Number(u.rank_stars):null; if(custom!==null&&!Number.isNaN(custom))return '★'.repeat(Math.max(0,Math.min(5,custom))); const r=String((u&&u.role)||''); if(r.includes('سربازرس'))return '★★★★'; if(r.includes('بازرس'))return '★★'; if(r.includes('ناظر خط')||r.includes('اپراتور'))return '★'; return ''; }
async function loadBrand(){ try{ const b=await GET('/settings/public'); BRAND={title:b.site_title||b.org_title||BRAND.title,logo:b.site_logo||b.org_logo||''}; document.title=BRAND.title; }catch(e){} }

// ---- API helpers ----
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(store.get('token')?{Authorization:'Bearer '+store.get('token')}:{}),...(opt.headers||{})}});
  if(r.status===401){ logout(); throw new Error('نشست منقضی شد'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'خطای سرور');
  return d;
}
async function GET(p){
  const ttl=_ttlFor(p);
  if(ttl && _apiCache[p] && Date.now()-_apiCache[p].t<ttl) return _apiCache[p].v;
  const v=await api(p);
  if(ttl) _apiCache[p]={t:Date.now(),v};
  return v;
}
const POST=async(p,b)=>{ const r=await api(p,{method:'POST',body:JSON.stringify(b||{})}); _clearApiCache(); return r; };
// ارسال یا صف آفلاین
async function postOrQueue(p,b){
  try{ return await POST(p,b); }
  catch(e){ if(!navigator.onLine){ const q=JSON.parse(store.get('queue')||'[]'); q.push({p,b}); store.set('queue',JSON.stringify(q)); refreshOffline(); return {queued:true}; } throw e; }
}
async function flushQueue(){
  let q=JSON.parse(store.get('queue')||'[]'); if(!q.length) return;
  const keep=[]; for(const it of q){ try{ await POST(it.p,it.b); }catch{ keep.push(it); } }
  store.set('queue',JSON.stringify(keep)); refreshOffline();
}
function refreshOffline(){ const q=JSON.parse(store.get('queue')||'[]'); const el=document.getElementById('offline');
  el.classList.toggle('on', !navigator.onLine || q.length>0); el.textContent=`حالت آفلاین — ${toFa(q.length)} مورد در صف ارسال`; }
window.addEventListener('online',()=>{refreshOffline();flushQueue();});
window.addEventListener('offline',refreshOffline);

function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function applyFont(){ const sc=parseFloat(store.get('fontScale')||'1')||1; document.documentElement.style.fontSize=(16*sc)+'px'; }
function setFont(dir){ let sc=parseFloat(store.get('fontScale')||'1')||1; if(dir===0)sc=1; else sc=Math.min(1.5,Math.max(0.85,sc+dir*0.1)); store.set('fontScale',String(sc)); applyFont(); toast('اندازهٔ فونت تغییر کرد'); }
function _g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334], gy2=gm>2?gy+1:gy;
  let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];
  let jy=-1595+33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  let jm,jd; if(days<186){jm=1+Math.floor(days/31);jd=1+days%31;}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30;}
  return [jy,jm,jd];
}
function _p2(n){return String(n).padStart(2,'0');}
function fj(s){
  if(!s)return '';
  try{
    const raw=String(s).trim(), m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2}))?/);
    let Y,M,D,h=0,mi=0;
    const hasZone=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw);
    if(m&&!hasZone){Y=+m[1];M=+m[2];D=+m[3];h=+(m[4]||0);mi=+(m[5]||0);}
    else{const d=new Date(raw.replace(' ','T'));if(isNaN(d))return raw;const t=new Date(d.getTime()+210*60000);Y=t.getUTCFullYear();M=t.getUTCMonth()+1;D=t.getUTCDate();h=t.getUTCHours();mi=t.getUTCMinutes();}
    const j=_g2j(Y,M,D); return toFa(`${j[0]}/${_p2(j[1])}/${_p2(j[2])} ${_p2(h)}:${_p2(mi)}`);
  }catch(e){return String(s);}
}

function geo(){return new Promise(res=>{ if(!navigator.geolocation)return res({}); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res({}),{timeout:6000}); });}
function gpsAvailable(){return new Promise(res=>{ if(!navigator.geolocation)return res(false); navigator.geolocation.getCurrentPosition(()=>res(true),()=>res(false),{timeout:6000}); });}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- auth ----
async function doLogin(){
  const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value, e=document.getElementById('err');
  e.textContent='در حال بررسی موقعیت…';
  const gps=await gpsAvailable();
  if(!gps){ e.textContent='برای ورود باید دسترسی موقعیت (GPS) را اجازه دهید.'; return; }
  e.textContent='در حال ورود…';
  try{
    const d=await POST('/auth/login',{username:u,password:p,device_id:store.get('device_id'),gps_on:true,vpn_on:false,dev_options_on:false,device_type:'web',device_model:'WebApp '+navigator.platform});
    store.set('token',d.access); store.set('refresh',d.refresh); store.set('user',JSON.stringify(d.user)); USER=d.user;
    nav('dashboard');
  }catch(err){ e.textContent=err.message; }
}

async function doReset(){ const c=document.getElementById('rc').value.trim(); const p=document.getElementById('rp').value; const e=document.getElementById('rerr'); if(!c||p.length<6){e.textContent='کد و رمز جدید (حداقل ۶ کاراکتر) را وارد کنید';return;} e.textContent='در حال ثبت…'; try{ await POST('/auth/reset-password',{username:_resetUser,code:c,password:p}); toast('رمز تغییر کرد؛ وارد شوید'); nav('login'); }catch(err){ e.textContent=err.message; } }
function logout(){ store.del('token');store.del('refresh');store.del('user');USER=null;current='login';render(); }

const appAllowed=k=>APP_ALLOWED===null||APP_ALLOWED.includes(k);
const routeAlias={
  PresentList:'present',ActivityReport:'activity',ExpInsurance:'expInsurance',ExpTaxi:'expTaxi',ExpOplic:'expOplic',TeamReport:'team',InboxReports:'inbox',OfficialPresence:'official',Messages:'messages',Notifications:'notifications',Forms:'forms',Reports:'reports',Search:'search',CheckIn:'checkin',Radio:'radio',Help:'help',Profile:'profile'
};
function webPlaceholder(key,label){return async()=>{chrome(true,label,'back');return `<div class="card"><h3>${esc(label)}</h3><p class="muted" style="margin-top:8px">این بخش در نسخه وب با همان نام و دسترسی نسخه اندروید ارائه شده است. رابط اختصاصی این بخش در حال تکمیل است.</p></div>`}}

function fieldHtml(f){
  const cond=f.showIfKey?`data-showif-key="${f.showIfKey}" data-showif-val="${esc(f.showIfVal||'')}"`:'';
  const pf=f.prefill?`data-prefill="${f.prefill}"`:''; const id='ff_'+f.key; let inner;
  switch(f.type){
    case 'national_id': inner=`<div class="row" style="gap:8px"><input class="inp" id="${id}" data-key="${f.key}" inputmode="numeric"><button type="button" class="btn" style="width:auto;margin:0;padding:0 14px" onclick="formAutofill('${f.key}')">فراخوان</button></div>`; break;
    case 'textarea': inner=`<textarea class="inp" id="${id}" data-key="${f.key}" ${pf} rows="3"></textarea>`; break;
    case 'number': inner=`<input class="inp" id="${id}" data-key="${f.key}" ${pf} inputmode="numeric">`; break;
    case 'select': inner=`<select class="inp" id="${id}" data-key="${f.key}" ${pf}><option value=""></option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`; break;
    case 'combobox': inner=`<input class="inp" id="${id}" data-key="${f.key}" ${pf} list="dl_${f.key}"><datalist id="dl_${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}"></option>`).join('')}</datalist>`; break;
    case 'checkbox': inner=`<select class="inp" id="${id}" data-key="${f.key}" ${pf}><option value=""></option><option>بله</option><option>خیر</option></select>`; break;
    case 'signature': inner=`<canvas id="${id}" data-key="${f.key}" data-type="signature" width="320" height="140" style="border:1px solid var(--line);border-radius:10px;width:100%;touch-action:none;background:#fff"></canvas><button type="button" class="btn ghost" style="margin-top:6px" onclick="clearSig('${f.key}')">پاک کردن امضا</button>`; break;
    default: inner=`<input class="inp" id="${id}" data-key="${f.key}" ${pf}>`;
  }
  return `<div class="ffield" data-wrap="${f.key}" ${cond}><label class="label">${esc(f.label)}${f.required?' *':''}</label>${inner}</div>`;
}
function initForm(){
  document.querySelectorAll('canvas[data-type="signature"]').forEach(cv=>{
    const ctx=cv.getContext('2d'); ctx.strokeStyle='#0f1b2d'; ctx.lineWidth=2; ctx.lineCap='round'; let drawing=false,last=null;
    const pos=e=>{const r=cv.getBoundingClientRect(); const tt=e.touches?e.touches[0]:e; return {x:(tt.clientX-r.left)*(cv.width/r.width), y:(tt.clientY-r.top)*(cv.height/r.height)};};
    const start=e=>{drawing=true; last=pos(e); cv.dataset.drawn='1'; e.preventDefault();};
    const move=e=>{ if(!drawing)return; const pnt=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(pnt.x,pnt.y); ctx.stroke(); last=pnt; e.preventDefault();};
    const end=()=>{drawing=false;};
    cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  });
  document.querySelectorAll('.ffield [data-key]').forEach(el=>{ el.addEventListener('input',applyFormConditions); el.addEventListener('change',applyFormConditions); });
  applyFormConditions();
}
function applyFormConditions(){
  document.querySelectorAll('.ffield[data-showif-key]').forEach(w=>{ const ctrl=document.getElementById('ff_'+w.dataset.showifKey); const val=ctrl?(ctrl.value||''):''; w.style.display=(val===w.dataset.showifVal)?'':'none'; });
}
function clearSig(key){ const cv=document.getElementById('ff_'+key); const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); cv.dataset.drawn=''; }
async function formAutofill(key){
  const nid=document.getElementById('ff_'+key).value.replace(/\D/g,''); if(nid.length<8)return toast('کد ملی معتبر وارد کنید');
  try{ const res=await GET('/search?national_id='+nid); if(res.type!=='driver')return toast('راننده یافت نشد'); tmp.driver=res.driver;
    document.querySelectorAll('.ffield [data-prefill]').forEach(el=>{ const attr=el.dataset.prefill; if(res.driver[attr]!=null) el.value=res.driver[attr]; });

  }catch(e){ toast(e.message); }
}

  let list=tmp.offs||[]; if(role)list=list.filter(o=>o.role_title===role);
  if(nm)list=list.filter(o=>((o.first_name||'')+' '+(o.last_name||'')).indexOf(nm)>=0);
  tmp.official=null;
  document.getElementById('offs').innerHTML=list.length?list.map(o=>`<span class="chip" data-id="${o.id}" onclick="pickOne(this,'offs','official')">${esc(o.first_name)} ${esc(o.last_name)}<small>${esc(o.role_title)}</small></span>`).join(''):'<p class="muted">موردی یافت نشد.</p>'; }
async function submitOfficial(){ if(!tmp.official)return toast('یک مسئول را انتخاب کنید'); if(!tmp.line)return toast('انتخاب خط الزامی است'); const g=await geo();
  const r=await postOrQueue('/official-visits',{official_id:tmp.official,line_id:tmp.line,note:document.getElementById('onote').value,...g}); toast(r.queued?'ذخیره شد (آفلاین)':'حضور مسئول ثبت شد'); render(); }
function openForm(f){ tmp.form=f; tmp.formVals={}; render(); }
async function submitForm(){
  const ans={}; let nid=null;
  for(const f of (tmp.form.schema||[])){
    const el=document.getElementById('ff_'+f.key); let v='';
    if(f.type==='signature'){ v=(el&&el.dataset.drawn)?el.toDataURL('image/jpeg',((_limits?.image_quality||45)/100)):''; }
    else if(el){ v=el.value||''; }
    if(f.type==='national_id') nid=v.replace(/\D/g,'');
    const wrap=document.querySelector('.ffield[data-wrap="'+f.key+'"]'); const hidden=wrap&&wrap.style.display==='none';
    if(f.required&&!hidden&&!v) return toast('فیلد «'+f.label+'» الزامی است');
    ans[f.label]=v;
  }
  const r=await postOrQueue('/admin/form-submit',{form_id:tmp.form.id,driver_id:tmp.driver?.id,answers:ans});
  toast(r.queued?'ذخیره شد (آفلاین)':'فرم ثبت شد'); tmp.form=null; render();
}
async function pickReportImg(inp){ const f=inp.files[0]; if(!f)return; await loadLimits(); if(!checkFile('reports',f)){inp.value='';return;} tmp.reportImg={name:f.name,data:await compressImg(f)}; document.getElementById('rimg').textContent='پیوست: '+f.name; }
async function submitReport(){ const sub=document.getElementById('rsub').value, body=document.getElementById('rbody').value; if(!sub||!body)return toast('موضوع و متن لازم است');
  try{ await POST('/reports',{subject:sub,body,attachment_name:tmp.reportImg?.name,attachment_data:tmp.reportImg?.data}); tmp.reportImg=null; toast('گزارش ارسال شد'); nav('dashboard'); }catch(e){ toast(e.message); } }
async function saveEmail(){ try{ await api('/me/profile',{method:'PUT',body:JSON.stringify({email:document.getElementById('em').value})}); USER.email=document.getElementById('em').value; store.set('user',JSON.stringify(USER)); toast('ایمیل ذخیره شد'); }catch(e){ toast(e.message);} }
let _limits=null;
async function loadLimits(){ if(_limits)return _limits; try{ _limits=await GET('/settings/public'); }catch(e){ _limits={}; } return _limits; }
function checkFile(section,file){ const c=(_limits||{})['upload_'+section]||{}; if(c.max_mb && file.size>c.max_mb*1048576){ toast('حجم فایل بیش از حد مجاز ('+c.max_mb+' مگابایت) است'); return false; }
  if(c.types){ const ext=(file.name.split('.').pop()||'').toLowerCase(); const ok=c.types.toLowerCase().split(/[,،]/).map(s=>s.trim()).filter(Boolean); if(ok.length && !ok.includes(ext)){ toast('نوع فایل مجاز نیست'); return false; } } return true; }
async function compressImg(file,maxDim=null,q=null){ await loadLimits(); maxDim=Number(maxDim||_limits?.image_max_width||1024); q=Number(q||((_limits?.image_quality||45)/100)); const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);}); if(!file.type||file.type.indexOf('image/')!==0)return url;
  return await new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height; if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};img.onerror=()=>res(url);img.src=url;}); }
async function uploadPhoto(inp){ const file=inp.files[0]; if(!file)return; const data=await compressImg(file); try{ await POST('/me/photo',{photo:data}); USER.photo=data; store.set('user',JSON.stringify(USER)); toast('عکس ذخیره شد'); render(); }catch(e){ toast(e.message);} }
async function loadMyLines(){ const el=document.getElementById('mylines'); if(!el)return; try{ const ls=await GET('/my/lines'); el.innerHTML = ls.length? ls.map(l=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${esc(l.code)}</b> — ${esc(l.origin||'')} ${l.destination?('→ '+esc(l.destination)):''}</div>`).join('') : '<span class="muted">خطی به شما اختصاص نیافته است.</span>'; }catch(e){ el.innerHTML='<span class="muted">قابل بارگذاری نبود.</span>'; } }
async function changePass(){ const cp=document.getElementById('cp').value, np=document.getElementById('np').value;
  if(!cp && !np){ toast('تغییری در رمز اعمال نشد'); return; }
  if(np.length<6){ toast('رمز جدید حداقل ۶ کاراکتر باشد'); return; }
  try{ await POST('/admin/change-password',{current:cp,next:np}); toast('رمز تغییر کرد'); document.getElementById('cp').value='';document.getElementById('np').value=''; }catch(e){ toast(e.message); } }

// ---- chrome / nav ----
function chrome(show,title,icon){ document.getElementById('hdr').style.display=show?'flex':'none'; document.getElementById('footer').style.display=show?'flex':'none';
  if(title)document.getElementById('hdrTtl').textContent=title; document.getElementById('hdrIc').textContent=icon==='back'?'→':'☰'; tmp._icon=icon; }
function bell(n){ const d=document.getElementById('bellDot'); if(d){ if(n>0){d.style.display='block';d.textContent=toFa(n);}else d.style.display='none'; } }
function msgBadge(n){ const d=document.getElementById('msgDot'); if(d){ if(n>0){d.style.display='block';d.textContent=toFa(n);}else d.style.display='none'; } }
let INBOX_N=0;
function hdrAction(){ if(tmp._icon==='back') nav('dashboard'); else openDrawer(); }
function openDrawer(){ const rows=ANDROID_ITEMS.filter(x=>x[0]!=='Dashboard'&&appAllowed(x[0])); document.getElementById('drawerPanel').innerHTML=`<div class="uhead"><b>${esc(USER.name)}</b><div style="opacity:.85;font-size:12px">${esc(USER.role)}</div></div><div class="ditem" onclick="nav('Dashboard')"><span style="width:22px">🏠</span>داشبورد</div>${rows.map(x=>`<div class="ditem" onclick="nav('${x[0]}')"><span style="width:22px">${x[0]==='Radio'?'📻':'•'}</span>${esc(x[1])}</div>`).join('')}<div class="ditem" style="color:var(--danger)" onclick="logout()"><span style="width:22px">⎋</span>خروج</div>`; document.getElementById('drawer').classList.add('on'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('on'); }

async function renderCheckinTab(){const host=document.getElementById('checkinTabBody');if(!host)return;try{if(tmp.checkTab==='performance'){const d=await GET('/my/daily-performance');const w=d.data||{};host.innerHTML=`<div class="hero"><div class="nm">عملکرد روزانه</div><div class="hi">${esc(d.weekday||'')} (${esc(d.date||'')}) · ${esc(d.shift_title||'شیفت کاری')}</div></div><div class="kpis">${[['کارکرد',w.worked],['حضور در شیفت',w.in_shift],['موظفی',w.expected],['اضافه‌کار',w.overtime],['کسری کار',w.shortage],['شب‌کاری',w.night]].map(([l,v])=>`<div class="kpi"><div class="n">${toFa(Math.floor((Number(v)||0)/60))}:${toFa(String((Number(v)||0)%60).padStart(2,'0'))}</div><div class="l">${l}</div></div>`).join('')}</div>`;return;}if(tmp.checkTab==='shift'){const d=await GET('/my/shift-schedule');host.innerHTML=`<div class="card"><b>${esc(d.shift?.title||'شیفت کاری')}</b><div class="muted" style="margin-top:4px">برنامهٔ ۱۴ روز آینده</div></div>${(d.days||[]).map(x=>`<div class="card between"><div><b>${esc(x.weekday)} (${esc(x.date)})</b><div class="muted" style="margin-top:4px">${x.is_off?'روز استراحت/بدون موظفی':x.is_holiday?'تعطیل: '+esc(x.holiday_title||''): 'شیفت کاری'}</div></div><b>${x.is_off?'—':toFa(x.minutes)+' دقیقه'}</b></div>`).join('')}`;return;}const c=await GET('/my/checkin-config');const o=c.open;host.innerHTML=`<div class="card"><div class="between"><b>${o?'حضور شما ثبت شده است':'ثبت حضور'}</b><span class="badge ${o?'b-ok':'b-no'}">${o?'در شیفت':'خارج از شیفت'}</span></div><p class="muted" style="margin-top:8px">${o?'زمان ورود: '+esc(fj(o.check_in)):'برای ثبت ورود، موقعیت مکانی را دریافت کنید.'}</p><button class="btn" id="webCheckBtn">${o?'ثبت خروج':'ثبت ورود'}</button></div>`;document.getElementById('webCheckBtn').onclick=()=>webCheckinAction(o); }catch(e){host.innerHTML=`<div class="warn">${esc(e.message)}</div>`}}
function webCheckinAction(open){if(!navigator.geolocation){toast('مرورگر به موقعیت مکانی دسترسی ندارد');return}navigator.geolocation.getCurrentPosition(async p=>{try{const url=open?'/my/checkout':'/my/checkin';await POST(url,{lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,method:'gps'});toast(open?'خروج ثبت شد':'ورود ثبت شد');renderCheckinTab()}catch(e){toast(e.message)}} ,e=>toast('دریافت موقعیت ناموفق بود: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:12000})}
let radioWebState={channels:[],cid:0,after:0,liveTimer:null,media:null,recording:false};
async function loadRadioWeb(){try{const d=await fetch('/api/radio-admin-api.php?op=channel-list',{headers:{Authorization:'Bearer '+token()},cache:'no-store'}).then(r=>r.json());radioWebState.channels=d.channels||[];const c=radioWebState.channels[0];radioWebState.cid=radioWebState.cid||c?.id||0;radioWebState.after=Number((radioWebState.channels.find(x=>Number(x.id)===Number(radioWebState.cid))||c||{}).last_message_id||0);}catch(_){}}
async function renderRadioWebTab(tab){const host=document.getElementById('radioWeb');if(!host)return;host.innerHTML=`<div class="card"><div class="between"><b>کانال</b><select class="inp" id="radioCh" style="width:70%">${radioWebState.channels.map(c=>`<option value="${c.id}" ${Number(c.id)===Number(radioWebState.cid)?'selected':''}>${esc(c.name)} (${esc(c.code)})</option>`).join('')}</select></div>${tab==='live'?'<div id="radioPtt" style="margin-top:10px"></div>':''}</div><div class="card"><h3>${tab==='live'?'شنود زنده':'آرشیو پیام‌ها'}</h3><div id="radioMsgs"></div></div>`;document.getElementById('radioCh').onchange=e=>{radioWebState.cid=Number(e.target.value);radioWebState.after=Number((radioWebState.channels.find(c=>Number(c.id)===radioWebState.cid)||{}).last_message_id||0);renderRadioWebTab(tab)};if(tab==='archive'){const d=await fetch(`/api/radio-admin-api.php?op=archive&channel_id=${radioWebState.cid}&limit=100`,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}).then(r=>r.json());renderRadioMessages(d.messages||[]);return;}const liveC=radioWebState.channels.find(c=>Number(c.id)===Number(radioWebState.cid));radioWebState.after=Number(liveC?.last_message_id||radioWebState.after||0);document.getElementById('radioMsgs').innerHTML='<p class="muted">در انتظار پیام زنده…</p>';renderRadioPtt();if(radioWebState.liveTimer)clearInterval(radioWebState.liveTimer);await pollRadioWeb();radioWebState.liveTimer=setInterval(pollRadioWeb,1800);}
function renderRadioMessages(rows){const e=document.getElementById('radioMsgs');if(e)e.innerHTML=rows.length?rows.map(m=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line);gap:8px"><div><b>${esc(m.sender_name||'کاربر')}</b><div class="muted">${esc(m.created_at||'')} · ${toFa(Math.round(Number(m.duration_ms||0)/1000))} ثانیه</div></div><audio controls preload="none" src="${m.audio_url}"></audio></div>`).join(''):'<p class="muted">پیامی برای نمایش وجود ندارد.</p>';}
async function pollRadioWeb(){if(!radioWebState.cid)return;try{const d=await fetch(`/api/radio-admin-api.php?op=monitor&channel_id=${radioWebState.cid}&after=${radioWebState.after}`,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}).then(r=>r.json());if((d.messages||[]).length){radioWebState.after=Math.max(radioWebState.after,...d.messages.map(x=>Number(x.id)));renderRadioMessages(d.messages.map(x=>({...x,audio_url:x.audio_url})).reverse().concat([]));}}catch(_){} }
function renderRadioPtt(){const e=document.getElementById('radioPtt');if(!e)return;e.innerHTML='<button class="btn" id="radioTalk">نگه‌داشتن برای صحبت</button><p class="muted" style="text-align:center;margin-top:6px">برای صحبت، دکمه را نگه دارید؛ پس از رها کردن پیام ارسال می‌شود.</p>';const b=document.getElementById('radioTalk');const start=async ev=>{ev.preventDefault();if(radioWebState.recording)return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream,{mimeType:'audio/webm'});radioWebState.media={mr,stream,chunks:[],started:Date.now()};mr.ondataavailable=x=>{if(x.data.size)radioWebState.media.chunks.push(x.data)};mr.onstop=async()=>{const st=radioWebState.media;radioWebState.media=null;stream.getTracks().forEach(t=>t.stop());const blob=new Blob(st.chunks,{type:'audio/webm'});const fd=new FormData();fd.append('channel_id',String(radioWebState.cid));fd.append('duration_ms',String(Math.min(120000,Date.now()-st.started)));fd.append('audio',blob,'radio.webm');const r=await fetch('/api/radio-api-v2.php?op=send',{method:'POST',headers:{Authorization:'Bearer '+token()},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'ارسال پیام ناموفق بود');toast('پیام بی‌سیم ارسال شد')};mr.start();radioWebState.recording=true;b.textContent='در حال صحبت… رها کنید';}catch(e){toast(e.message||'دسترسی میکروفن برقرار نشد')}};const stop=()=>{if(radioWebState.media?.mr?.state==='recording')radioWebState.media.mr.stop();radioWebState.recording=false;b.textContent='نگه‌داشتن برای صحبت'};b.onmousedown=start;b.onmouseup=stop;b.onmouseleave=stop;b.ontouchstart=start;b.ontouchend=stop;}
function filterWebAndroid(cat){document.querySelectorAll('#webAndroidGrid [data-route]').forEach(e=>{e.style.display=(cat==='all'||e.dataset.cat===cat)?'flex':'none'});document.querySelectorAll('[data-cat].chip').forEach(e=>e.classList.toggle('on',e.dataset.cat===cat));}
function nav(k){ const item=ANDROID_ITEMS.find(x=>x[0]===k)||ANDROID_ITEMS.find(x=>(routeAlias[x[0]]||x[0].toLowerCase())===k); const key=item?.[0]||k; if(item&&!appAllowed(key)){toast('دسترسی این بخش برای سمت شما فعال نیست');return;} current=routeAlias[key]||key.toLowerCase(); closeDrawer(); render(); }
async function render(){
  const body=document.getElementById('body'); body.innerHTML='<div class="spin"></div>';
  try{ body.innerHTML=await screens[current](); }catch(e){ body.innerHTML=`<p class="warn">${esc(e.message)}</p>`; }
  body.scrollTop=0;
  if(current==='checkin') setTimeout(renderCheckinTab,0);
  if(current==='radio') setTimeout(()=>{document.querySelectorAll('[data-radtab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-radtab]').forEach(x=>x.classList.toggle('on',x===b));renderRadioWebTab(b.dataset.radtab)});renderRadioWebTab('live')},0); else if(radioWebState.liveTimer){clearInterval(radioWebState.liveTimer);radioWebState.liveTimer=null;}
  if(tmp._after){ const fn=tmp._after; tmp._after=null; setTimeout(fn,0); }
  if(USER){ const tabs=[['dashboard','🏠','خانه'],['search','🔍','جستجو'],['checkin','🕘','حضور'],['notifications','🔔','اعلان'],['profile','⚙','حساب']];
    document.getElementById('footer').innerHTML=tabs.map(([k,i,l])=>`<button class="${current===k?'on':''}" onclick="nav('${k}')"><span class="fi">${i}</span>${l}</button>`).join(''); }
}

// ---- boot ----
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=20260905.12',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
USER = store.get('user')?JSON.parse(store.get('user')):null;
current = USER?'dashboard':'login';
refreshOffline(); if(navigator.onLine) flushQueue();
try{applyFont();}catch(e){}
loadBrand().finally(render);
</script>
