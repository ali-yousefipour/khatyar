<style>

  .app{display:flex;flex-direction:column;min-height:100vh}
  .offline{background:var(--danger);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:6px;display:none}
  .offline.on{display:block}
  .hdr{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:15px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}

  .body{flex:1;overflow:auto;padding:16px;padding-bottom:80px}

  .btn.taxi{background:var(--taxi);color:var(--taxiInk)} .btn.ghost{background:#eef1f7;color:var(--ink)}

  .card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
  .row{display:flex;align-items:center;gap:10px}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pf{width:46px;height:46px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
  .muted{color:var(--muted);font-size:12px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px 8px;cursor:pointer;font-size:12.5px}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}

  .opt{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;flex:1}
  .opt.on{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad.on{background:var(--danger);border-color:var(--danger)}
  .redcount{background:var(--danger);color:#fff;border-radius:11px;padding:10px;font-size:12.5px;font-weight:800;text-align:center;margin-bottom:11px}
  .pay{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:9px}.bar .nm{width:100px;font-size:11.5px;text-align:right}
  .bar .track{flex:1;height:13px;background:#eef1f7;border-radius:7px;overflow:hidden}.bar .fill{height:13px;background:var(--brand);border-radius:7px}.bar .v{width:26px;font-size:11px;font-weight:800;color:var(--muted)}

  .footer{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-around;padding:8px 0;z-index:6}

  .footer button.on{color:var(--brand);font-weight:800}.footer .fi{font-size:17px}
  .drawer{position:fixed;inset:0;max-width:480px;margin:0 auto;background:rgba(15,27,45,.45);display:none;z-index:9}
  .drawer.on{display:block}.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:78%;background:#fff;padding:18px;overflow:auto}
  .drawer .uhead{background:var(--brand);color:#fff;border-radius:14px;padding:14px;margin-bottom:14px}
  .ditem{padding:12px 8px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;display:flex;gap:10px}
  .toast{position:fixed;bottom:78px;left:16px;right:16px;max-width:448px;margin:0 auto;background:#0f1b2d;color:#fff;padding:13px;border-radius:12px;text-align:center;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
  .center{display:grid;place-items:center;min-height:60vh;text-align:center;padding:20px}
  .lg{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;font-size:26px;color:#fff;margin:0 auto}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}@keyframes s{to{transform:rotate(360deg)}}

<body>
<div class="app">
  <div class="offline" id="offline">حالت آفلاین — موارد در صف ارسال</div>
  <div class="hdr" id="hdr" style="display:none">
    <button class="ic" id="hdrIc" aria-label="باز کردن منو یا بازگشت" onclick="hdrAction()">☰</button>
    <span class="ttl" id="hdrTtl">داشبورد</span>
    <button class="bell" aria-label="پیام‌ها" onclick="nav('messages')"><span class="kh-icon" aria-hidden="true">&#983914;</span><span class="dot" id="msgDot">۰</span></button>
    <button class="bell" aria-label="اعلان‌ها" onclick="nav('notifications')"><span class="kh-icon" aria-hidden="true">&#983196;</span><span class="dot" id="bellDot">۰</span></button>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script>
const API='/api';
const _apiCache={};
const _apiTTL={'/settings/public':300000,'/my/dashboard':30000,'/my/stats':60000,'/my/lines':180000,'/notice-reasons':300000,'/officials':180000};
function _ttlFor(p){ for(const k in _apiTTL){ if(p===k || p.startsWith(k+'?')) return _apiTTL[k]; } return 0; }
function _clearApiCache(){ for(const k in _apiCache) delete _apiCache[k]; }
const store={get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v),del:k=>localStorage.removeItem(k)};
if(!store.get('device_id')) store.set('device_id','web-'+Math.random().toString(36).slice(2)+Date.now().toString(36));
let USER=null, current='dashboard', tmp={}, BRAND={title:'مدیریت خطوط تاکسیرانی',logo:''};
function starsForUser(u){ const custom=(u&&u.rank_stars!==null&&u.rank_stars!==undefined)?Number(u.rank_stars):null; if(custom!==null&&!Number.isNaN(custom))return '★'.repeat(Math.max(0,Math.min(5,custom))); const r=String((u&&u.role)||''); if(r.includes('سربازرس'))return '★★★★'; if(r.includes('بازرس'))return '★★'; if(r.includes('ناظر خط')||r.includes('اپراتور'))return '★'; return ''; }
async function loadBrand(){ try{ const b=await GET('/settings/public'); BRAND={title:b.site_title||b.org_title||BRAND.title,logo:b.site_logo||b.org_logo||''}; document.title=BRAND.title; }catch(e){} }

// ---- API helpers ----
let _refreshPromise=null;
function accessToken(){return store.get('token')||store.get('access')||store.get('access_token')||'';}
async function renewSession(){
  if(_refreshPromise)return _refreshPromise;
  const refresh=store.get('refresh');
  if(!refresh)return false;
  _refreshPromise=(async()=>{
    const response=await fetch(API+'/session/renew',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh}),cache:'no-store'});
    if(response.status===401||response.status===403)return false;
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.access||!data.refresh)throw new Error(data.error||'تمدید نشست فعلاً ممکن نیست؛ دوباره تلاش کنید.');
    if(store.get('refresh')!==refresh)return false;
    store.set('token',data.access);store.set('refresh',data.refresh);
    return true;
  })();
  try{return await _refreshPromise;}finally{_refreshPromise=null;}
}
async function authenticatedFetch(url,opt={}){
  const target=new URL(url,location.href);
  if(target.origin!==location.origin||!target.pathname.startsWith('/api/'))return fetch(url,opt);
  const publicPath=/^\/api\/(?:settings\/public|auth\/(?:login|forgot-password|reset-password)|session\/(?:start|renew|web-login-config|otp-request|otp-verify))\/?$/.test(target.pathname);
  const sentToken=publicPath?'':accessToken();
  if(!publicPath&&!sentToken){if(USER)logout();throw new Error('برای ادامه وارد حساب شوید.');}
  const send=()=>{
    const headers=new Headers(opt.headers||{});
    if(!publicPath){headers.set('Authorization','Bearer '+accessToken());headers.set('X-Access-Token',accessToken());}
    return fetch(url,{...opt,headers,cache:'no-store'});
  };
  let response=await send();
  if(response.status===401&&!publicPath){
    if(accessToken()===sentToken&&!(await renewSession())){
      if(accessToken()===sentToken)logout();
      throw new Error('نشست منقضی شد؛ دوباره وارد شوید.');
    }
    if(!accessToken())throw new Error('نشست منقضی شد؛ دوباره وارد شوید.');
    const retryToken=accessToken();
    response=await send();
    if(response.status===401){if(accessToken()===retryToken)logout();throw new Error('نشست منقضی شد؛ دوباره وارد شوید.');}
  }
  return response;
}
async function api(path,opt={}){
  const r=await authenticatedFetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
  let d;try{d=await r.json();}catch{throw new Error('پاسخ سرور معتبر نیست؛ عملیات تأیید نشد.');}
  if(!r.ok) throw new Error(d.error||'خطای سرور');
  return d;
}
async function GET(p){
  const ttl=_ttlFor(p);
  if(ttl && _apiCache[p] && Date.now()-_apiCache[p].t<ttl) return _apiCache[p].v;
  const v=await api(p);
  if(ttl) _apiCache[p]={t:Date.now(),v};
  return v;
}
const POST=async(p,b)=>{ const r=await api(p,{method:'POST',body:JSON.stringify(b||{})}); _clearApiCache(); return r; };
// ارسال یا صف آفلاین
async function postOrQueue(p,b){
  try{ return await POST(p,b); }
  catch(e){ if(!navigator.onLine){ const q=JSON.parse(store.get('queue')||'[]'); q.push({p,b}); store.set('queue',JSON.stringify(q)); refreshOffline(); return {queued:true}; } throw e; }
}
let _queueFlush=null;
async function flushQueue(){
  if(_queueFlush)return _queueFlush;
  _queueFlush=flushQueueBatch();
  try{return await _queueFlush;}finally{_queueFlush=null;}
}
async function flushQueueBatch(){
  let q=JSON.parse(store.get('queue')||'[]'); if(!q.length) return;
  const keep=[]; for(const it of q){ try{ await POST(it.p,it.b); }catch{ keep.push(it); } }
  store.set('queue',JSON.stringify(keep)); refreshOffline();
}
function refreshOffline(){ const q=JSON.parse(store.get('queue')||'[]'); const el=document.getElementById('offline');
  el.classList.toggle('on', !navigator.onLine || q.length>0); el.textContent=`حالت آفلاین — ${toFa(q.length)} مورد در صف ارسال`; }
window.addEventListener('online',()=>{refreshOffline();flushQueue();});
window.addEventListener('offline',refreshOffline);

function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function applyFont(){ const sc=parseFloat(store.get('fontScale')||'1')||1; document.documentElement.style.fontSize=(16*sc)+'px'; }
function setFont(dir){ let sc=parseFloat(store.get('fontScale')||'1')||1; if(dir===0)sc=1; else sc=Math.min(1.5,Math.max(0.85,sc+dir*0.1)); store.set('fontScale',String(sc)); applyFont(); toast('اندازهٔ فونت تغییر کرد'); }
function _g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334], gy2=gm>2?gy+1:gy;
  let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];
  let jy=-1595+33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  let jm,jd; if(days<186){jm=1+Math.floor(days/31);jd=1+days%31;}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30;}
  return [jy,jm,jd];
}
function _p2(n){return String(n).padStart(2,'0');}
function fj(s){
  if(!s)return '';
  try{
    const raw=String(s).trim(), m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2}))?/);
    let Y,M,D,h=0,mi=0;
    const hasZone=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw);
    if(m&&!hasZone){Y=+m[1];M=+m[2];D=+m[3];h=+(m[4]||0);mi=+(m[5]||0);}
    else{const d=new Date(raw.replace(' ','T'));if(isNaN(d))return raw;const t=new Date(d.getTime()+210*60000);Y=t.getUTCFullYear();M=t.getUTCMonth()+1;D=t.getUTCDate();h=t.getUTCHours();mi=t.getUTCMinutes();}
    const j=_g2j(Y,M,D); return toFa(`${j[0]}/${_p2(j[1])}/${_p2(j[2])} ${_p2(h)}:${_p2(mi)}`);
  }catch(e){return String(s);}
}

function geo(){return new Promise(res=>{ if(!navigator.geolocation)return res({}); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res({}),{timeout:6000}); });}
function gpsAvailable(){return new Promise(res=>{ if(!navigator.geolocation)return res(false); navigator.geolocation.getCurrentPosition(()=>res(true),()=>res(false),{timeout:6000}); });}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- auth ----
let webLogin={username:'',codeRequested:false,busy:false,resendAt:0};
function loginDigits(value){return String(value||'').trim().replace(/[۰-۹]/g,digit=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(digit)).replace(/[٠-٩]/g,digit=>'٠١٢٣٤٥٦٧٨٩'.indexOf(digit));}
function changeLoginUser(){if(webLogin.busy)return;webLogin.codeRequested=false;render();}
async function doLogin(resend=false){
  if(webLogin.busy)return;
  if(!['password','sms_otp','bale_otp'].includes(webLogin.method))return;
  const passwordMode=webLogin.method==='password';
  const error=document.getElementById('err');
  const username=webLogin.codeRequested?webLogin.username:loginDigits(document.getElementById('u').value);
  const verifying=!passwordMode&&webLogin.codeRequested&&!resend;
  const code=verifying?loginDigits(document.getElementById('login-code').value):'';
  if(!username){error.textContent='کد ملی را وارد کنید.';return;}
  if(verifying&&!/^\d{6}$/.test(code)){error.textContent='کد شش‌رقمی ارسال‌شده را وارد کنید.';return;}
  if(!passwordMode&&!verifying&&username===webLogin.username&&Date.now()<webLogin.resendAt){if(!resend){webLogin.codeRequested=true;await render();return;}error.textContent='برای ارسال مجدد '+toFa(Math.ceil((webLogin.resendAt-Date.now())/1000))+' ثانیه صبر کنید.';return;}
  webLogin.busy=true;
  const button=document.getElementById('login-submit');
  button.disabled=true;
  error.textContent='در حال بررسی موقعیت…';
  try{
    if(!(await gpsAvailable()))throw new Error('برای ورود باید دسترسی موقعیت (GPS) را اجازه دهید.');
    if(!passwordMode&&!verifying){
      error.textContent='در حال ارسال کد…';
      await POST('/session/otp-request',{username});
      webLogin.username=username;webLogin.codeRequested=true;webLogin.resendAt=Date.now()+60000;
      await render();
      return;
    }
    error.textContent=passwordMode?'در حال ورود…':'در حال تأیید کد…';
    const credentials=passwordMode?{password:document.getElementById('login-password').value}:{code};
    const data=await POST(passwordMode?'/session/start':'/session/otp-verify',{username,...credentials,device_id:store.get('device_id'),device_type:'web',device_model:'WebApp '+navigator.platform});
    if(!data.access||!data.refresh||!data.user)throw new Error('پاسخ ورود کامل نیست؛ دوباره تلاش کنید.');
    _clearApiCache();store.set('token',data.access);store.set('refresh',data.refresh);store.set('user',JSON.stringify(data.user));USER=data.user;
    webLogin={username:'',codeRequested:false,busy:false,resendAt:0};
    window.dispatchEvent(new Event('khatyar-session-changed'));
    nav('dashboard');
  }catch(failure){error.textContent=failure.message;}
  finally{webLogin.busy=false;const activeButton=document.getElementById('login-submit');if(activeButton)activeButton.disabled=false;}

let _resetUser='';

      ${row('نوع فعالیت راننده',v.activity_type||d.driver_type)}${row('شیفت کاری',v.shift_fa)}${row('بهره‌بردار خودرو',v.beneficiary_name)}${row('وضعیت پروانه بهره‌برداری',d.op_lic_status)}${row('اعتبار پروانه بهره‌برداری',d.op_lic_expire)}${row('وضعیت پروانه تاکسیرانی',d.taxi_lic_status)}${row('اعتبار پروانه تاکسیرانی',d.taxi_lic_expire)}${row('خط محل فعالیت',v.line_code?String(v.line_code)+(v.line_origin?' — '+v.line_origin:''):'')}${row('کد در خط',v.line_code_in_line)}

      ${row('مدل خودرو',v.model_name)}${row('اعتبار معاینه فنی',v.tech_inspection_expire)}${row('وضعیت معاینه فنی',v.inspection_status,true)}${row('اعتبار بیمه شخص ثالث',v.insurance_expire)}${row('وضعیت بیمه شخص ثالث',v.insurance_status,true)}</div>

  pastchecklists:async()=>{chrome(true,'چک‌لیست‌های قبلی','back');if(!tmp.driver?.id)return screenEmpty('ابتدا تاکسیران را جستجو کنید.');const rows=await GET('/checklists/'+encodeURIComponent(tmp.driver.id));tmp.pastChecklists=Array.isArray(rows)?rows:[];return screenHeading('چک‌لیست‌های قبلی','سوابق چک‌لیست تاکسیران','clipboard-list-outline')+(rows.length?rows.map((r,index)=>`<article class="card"><div class="native-list-title"><b>${esc(r.by_name||'ثبت‌کننده')}</b><small>${esc(fj(r.created_at))}</small></div>${(r.items||[]).map(i=>`<div class="driver-detail"><span>${esc(i.label)}</span><b>${esc(screenValue(i.value))}</b></div>`).join('')}${r.photo&&safeScreenMedia(r.photo)?`<button class="btn ghost" onclick="openChecklistPhoto(${index})">مشاهده تصویر چک‌لیست</button>`:''}</article>`).join(''):screenEmpty('چک‌لیستی ثبت نشده است.'));},

function fieldHtml(f){
  const cond=f.showIfKey?`data-showif-key="${f.showIfKey}" data-showif-val="${esc(f.showIfVal||'')}"`:'';
  const pf=f.prefill?`data-prefill="${f.prefill}"`:''; const id='ff_'+f.key; let inner;
  switch(f.type){
    case 'national_id': inner=`<div class="row" style="gap:8px"><input class="inp" id="${id}" data-key="${f.key}" inputmode="numeric"><button type="button" class="btn" style="width:auto;margin:0;padding:0 14px" onclick="formAutofill('${f.key}')">فراخوان</button></div>`; break;
    case 'textarea': inner=`<textarea class="inp" id="${id}" data-key="${f.key}" ${pf} rows="3"></textarea>`; break;
    case 'number': inner=`<input class="inp" id="${id}" data-key="${f.key}" ${pf} inputmode="numeric">`; break;
    case 'select': inner=`<select class="inp" id="${id}" data-key="${f.key}" ${pf}><option value=""></option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`; break;
    case 'combobox': inner=`<input class="inp" id="${id}" data-key="${f.key}" ${pf} list="dl_${f.key}"><datalist id="dl_${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}"></option>`).join('')}</datalist>`; break;
    case 'checkbox': inner=`<select class="inp" id="${id}" data-key="${f.key}" ${pf}><option value=""></option><option>بله</option><option>خیر</option></select>`; break;
    case 'signature': inner=`<canvas id="${id}" data-key="${f.key}" data-type="signature" width="320" height="140" style="border:1px solid var(--line);border-radius:10px;width:100%;touch-action:none;background:#fff"></canvas><button type="button" class="btn ghost" style="margin-top:6px" onclick="clearSig('${f.key}')">پاک کردن امضا</button>`; break;
    default: inner=`<input class="inp" id="${id}" data-key="${f.key}" ${pf}>`;
  }
  return `<div class="ffield" data-wrap="${f.key}" ${cond}><label class="label">${esc(f.label)}${f.required?' *':''}</label>${inner}</div>`;
}
function initForm(){
  document.querySelectorAll('canvas[data-type="signature"]').forEach(cv=>{
    const ctx=cv.getContext('2d'); ctx.strokeStyle='#0f1b2d'; ctx.lineWidth=2; ctx.lineCap='round'; let drawing=false,last=null;
    const pos=e=>{const r=cv.getBoundingClientRect(); const tt=e.touches?e.touches[0]:e; return {x:(tt.clientX-r.left)*(cv.width/r.width), y:(tt.clientY-r.top)*(cv.height/r.height)};};
    const start=e=>{drawing=true; last=pos(e); cv.dataset.drawn='1'; e.preventDefault();};
    const move=e=>{ if(!drawing)return; const pnt=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(pnt.x,pnt.y); ctx.stroke(); last=pnt; e.preventDefault();};
    const end=()=>{drawing=false;};
    cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  });
  document.querySelectorAll('.ffield [data-key]').forEach(el=>{ el.addEventListener('input',applyFormConditions); el.addEventListener('change',applyFormConditions); });
  applyFormConditions();
}
function applyFormConditions(){
  document.querySelectorAll('.ffield[data-showif-key]').forEach(w=>{ const ctrl=document.getElementById('ff_'+w.dataset.showifKey); const val=ctrl?(ctrl.value||''):''; w.style.display=(val===w.dataset.showifVal)?'':'none'; });
}

function checkFile(section,file){ const c=(_limits||{})['upload_'+section]||{}; if(c.max_mb && file.size>c.max_mb*1048576){ toast('حجم فایل بیش از حد مجاز ('+c.max_mb+' مگابایت) است'); return false; }
  if(c.types){ const ext=(file.name.split('.').pop()||'').toLowerCase(); const ok=c.types.toLowerCase().split(/[,،]/).map(s=>s.trim()).filter(Boolean); if(ok.length && !ok.includes(ext)){ toast('نوع فایل مجاز نیست'); return false; } } return true; }

  return await new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height; if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};img.onerror=()=>res(url);img.src=url;}); }
async function uploadPhoto(inp){ const file=inp.files[0]; if(!file)return; const data=await compressImg(file); try{ await POST('/me/photo',{photo:data}); USER.photo=data; store.set('user',JSON.stringify(USER)); toast('عکس ذخیره شد'); render(); }catch(e){ toast(e.message);} }

function androidOrderKey(){return 'android-menu-order:'+USER.id;}
function androidOrderedItems(){let ids=[];try{ids=JSON.parse(store.get(androidOrderKey())||'[]');if(!Array.isArray(ids))ids=[];}catch{}const all=KH_ANDROID_NAV.dashboard;return [...new Set([...ids,...all.map(x=>x.route)])].map(id=>all.find(x=>x.route===id)).filter(Boolean);}
function filterWebAndroid(cat){if(cat)tmp.androidCategory=cat;const selected=tmp.androidCategory||'all',q=String(document.getElementById('android-menu-search')?.value||'').trim().replace(/[يى]/g,'ی').replace(/ك/g,'ک').toLocaleLowerCase();let count=0;document.querySelectorAll('#webAndroidGrid [data-route]').forEach(e=>{const title=e.dataset.title.replace(/[يى]/g,'ی').replace(/ك/g,'ک').toLocaleLowerCase();e.hidden=!((selected==='all'||e.dataset.cat===selected)&&(!q||title.includes(q)));if(!e.hidden)count++;});document.querySelectorAll('[data-cat].chip').forEach(e=>{e.classList.toggle('on',e.dataset.cat===selected);e.setAttribute('aria-pressed',String(e.dataset.cat===selected));});const n=document.getElementById('android-result-count');if(n)n.textContent=toFa(count)+' مورد';const empty=document.getElementById('android-empty');if(empty)empty.hidden=count>0;}
function androidOrderDialog(){let d=document.getElementById('android-order');if(!d){d=document.createElement('dialog');d.id='android-order';d.className='android-order';document.body.appendChild(d);}const items=androidOrderedItems().filter(androidCanShow);d.innerHTML=`<header><h3>مرتب‌سازی داشبورد</h3><button aria-label="بستن مرتب‌سازی" onclick="document.getElementById('android-order').close()">${androidIcon('close')}</button></header><div class="row"><button onclick="androidMoveOrder('sort')">مرتب‌سازی الفبایی</button><button onclick="androidMoveOrder('reset')">بازگردانی ترتیب پیش‌فرض</button></div>${items.map((x,i)=>`<div class="android-order-row"><span>${toFa(i+1)}. ${esc(x.title)}</span><button aria-label="انتقال ${esc(x.title)} به بالا" ${i===0?'disabled':''} onclick="androidMoveOrder('${x.route}',-1)">▲</button><button aria-label="انتقال ${esc(x.title)} به پایین" ${i===items.length-1?'disabled':''} onclick="androidMoveOrder('${x.route}',1)">▼</button></div>`).join('')}<button class="btn" onclick="document.getElementById('android-order').close();nav('Dashboard')">ذخیره و بستن</button>`;if(!d.open)d.showModal();}
function androidMoveOrder(route,dir){let a=androidOrderedItems();if(route==='reset')a=KH_ANDROID_NAV.dashboard;else if(route==='sort')a=a.slice().sort((x,y)=>x.title.localeCompare(y.title,'fa'));else {const visible=a.filter(androidCanShow),i=visible.findIndex(x=>x.route===route),other=visible[i+dir];if(other){const n=a.findIndex(x=>x.route===route),j=a.findIndex(x=>x.route===other.route);[a[n],a[j]]=[a[j],a[n]];}}store.set(androidOrderKey(),JSON.stringify(a.map(x=>x.route)));androidOrderDialog();}

function nav(k){ const item=ANDROID_ITEMS.find(x=>x[0]===k)||ANDROID_ITEMS.find(x=>(routeAlias[x[0]]||x[0].toLowerCase())===k); const key=item?.[0]||k; if(item&&!appAllowed(key)){toast('دسترسی این بخش برای سمت شما فعال نیست');return;} current=routeAlias[key]||key.toLowerCase(); closeDrawer(); render(); }
let _renderGeneration=0;
async function render(){
  const generation=++_renderGeneration; stopRadioWeb();document.querySelectorAll('dialog[data-private-photo]').forEach(d=>d.close());
  const body=document.getElementById('body'); body.classList.toggle('android-subpage',!['dashboard','login','forgot','reset'].includes(current)); body.innerHTML='<div class="spin"></div>';
  try{const html=await screens[current]();if(generation!==_renderGeneration)return;body.innerHTML=html;}catch(e){if(generation!==_renderGeneration)return;body.innerHTML=`<p class="warn">${esc(e.message)}</p>`;}
  body.scrollTop=0;
  if(current==='radio') setTimeout(()=>{if(current==='radio'&&generation===_renderGeneration)renderRadioWebTab('recent');},0);
  if(tmp._after){ const fn=tmp._after; tmp._after=null; setTimeout(fn,0); }
  document.querySelector('.body')?.classList.toggle('android-login',current==='login');
  if(USER){ const tabs=[['dashboard','🏠','خانه'],['search','🔍','جستجو'],['checkin','🕘','حضور'],['notifications','🔔','اعلان'],['profile','⚙','حساب']];
    document.getElementById('footer').innerHTML=tabs.map(([k,i,l])=>`<button class="${current===k?'on':''}" onclick="nav('${k}')"><span class="fi">${i}</span>${l}</button>`).join(''); }
}

// ---- boot ----
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=20261026.attendance1',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
USER = store.get('user')?JSON.parse(store.get('user')):null;
current = USER?'dashboard':'login';
refreshOffline(); if(navigator.onLine) flushQueue();
try{applyFont();}catch(e){}
loadBrand().finally(render);
</script>
