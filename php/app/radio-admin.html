<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خطیار | مرکز بی‌سیم</title><link rel="stylesheet" href="vendor/vazirmatn/Vazirmatn-font-face.css"><style>body{margin:0;background:#f6f8fb;color:#172033;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1280px;margin:auto;padding:20px}.top{background:#0d7a5f;color:#fff;border-radius:18px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{font-size:21px;margin:0}.top p{margin:5px 0 0;font-size:12px;opacity:.85}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tab{border:1px solid #d7dde7;border-radius:10px;padding:9px 14px;background:#fff;font:inherit;cursor:pointer}.tab.active{background:#0d7a5f;color:#fff;border-color:#0d7a5f}.card{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 16px #1020330a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #d7dde7;border-radius:10px;padding:10px;background:#fff;font:inherit;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}.primary{background:#0d7a5f;color:#fff}.muted{background:#eef2f6}.danger{background:#fee4e2;color:#b42318}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:middle}th{background:#f8fafc}.tag{display:inline-block;padding:3px 7px;border-radius:8px;background:#edf7f3;color:#0d7a5f;font-size:10px}.off{background:#f1f3f5;color:#667085}.msg{font-size:12px;margin-top:8px}.empty{padding:20px;text-align:center;color:#667085}.audio{width:240px;max-width:100%}.archive-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.small{font-size:11px;color:#667085}</style></head><body><div class="wrap"><div class="top"><div><h1>مرکز بی‌سیم</h1><p>پخش زنده، آرشیو پیام‌ها و تنظیم نگهداری آرشیو</p></div><button class="btn muted" onclick="location.href='panel.html'">بازگشت به پنل</button></div><div class="tabs"><button id="tab-live" class="tab active" onclick="showTab('live')">پخش زنده بی‌سیم</button><button id="tab-archive" class="tab" onclick="showTab('archive')">آرشیو پیام‌ها</button><button id="tab-settings" class="tab" onclick="showTab('settings')">مدیریت کانال و تنظیمات</button></div><section id="view-live"><div class="card"><div class="grid"><div class="field"><label>کانال</label><select id="live-channel"></select></div><div class="field"><label>وضعیت</label><input class="input" id="live-status" value="در حال آماده‌سازی" readonly></div></div></div><div class="card"><h3>پیام‌های زنده</h3><div id="live-rows" class="small">در حال دریافت…</div></div></section><section id="view-archive" style="display:none"><div class="card"><div class="grid"><div class="field"><label>کانال</label><select id="archive-channel"></select></div><div class="field"><label>تعداد پیام</label><input class="input" id="archive-limit" type="number" min="1" max="100" value="50"></div></div><div class="actions"><button class="btn primary" onclick="loadArchive()">بارگذاری آرشیو</button></div></div><div class="card"><h3>آرشیو پیام‌های صوتی</h3><div id="archive-rows"><div class="empty">هنوز بارگذاری نشده است.</div></div></div></section><section id="view-settings" style="display:none"><div class="card"><h3 id="form-title">ایجاد کانال جدید</h3><input type="hidden" id="id"><div class="grid"><div class="field"><label>نام کانال</label><input class="input" id="name" placeholder="مثلاً منطقه ثامن"></div><div class="field"><label>کد یکتا</label><input class="input" id="code" placeholder="thamen"></div><div class="field"><label>نوع کانال</label><select id="type" onchange="renderRules()"><option value="region">منطقه‌ای</option><option value="users">اعضای انتخابی</option><option value="roles">سمت‌محور</option><option value="custom">ترکیبی / سفارشی</option></select></div><div class="field"><label>منطق ترکیب شروط</label><select id="mode"><option value="OR">OR — هر کدام</option><option value="AND">AND — همه</option></select></div><div class="field"><label>حداکثر زمان صحبت (ثانیه)</label><input class="input" id="max" type="number" min="5" max="120" value="25"></div><div class="field"><label>اولویت کانال</label><input class="input" id="priority" type="number" min="-100" max="100" value="0"></div><div class="field"><label><input type="checkbox" id="active" checked> کانال فعال باشد</label></div><div class="field" style="grid-column:1/-1"><label>توضیحات</label><textarea id="desc" rows="2"></textarea></div></div><div id="rules" class="grid" style="margin-top:10px"></div><div class="actions"><button class="btn primary" onclick="save()">ذخیره کانال</button><button class="btn muted" onclick="resetForm()">پاک کردن</button></div><div id="msg" class="msg"></div></div><div class="card"><h3>نگهداری آرشیو</h3><div class="grid"><div class="field"><label>حذف آرشیو پس از چند روز</label><input class="input" id="retention-days" type="number" min="1" max="3650" value="30"></div></div><div class="actions"><button class="btn primary" onclick="saveRetention()">ذخیره مدت نگهداری</button></div><div id="retention-msg" class="msg"></div></div><div class="card"><h3>کانال‌های تعریف‌شده</h3><div class="table-wrap"><table><thead><tr><th>کانال</th><th>نوع</th><th>عضویت</th><th>وضعیت</th><th>آنلاین</th><th>گوینده</th><th>حداکثر صحبت</th><th>عملیات</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">در حال بارگذاری…</td></tr></tbody></table></div></div></section></div><script src="radio-admin.js?v=1.3.99-r3"></script></body></html>
