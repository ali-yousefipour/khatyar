<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدارک ارسالی شرکت</title><style>body{font-family:Tahoma;background:#f4f6f8;margin:0;padding:24px;color:#1f2937}.wrap{max-width:1200px;margin:auto}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0001}input,select,button,textarea{padding:10px;border:1px solid #d1d5db;border-radius:10px}button{cursor:pointer;background:#126c7e;color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.muted{color:#6b7280}.ok{color:#087f5b}.err{color:#c92a2a}</style></head><body><div class="wrap"><h1>مدارک ارسالی شرکت</h1><div class="card"><div class="grid"><input id="token" placeholder="توکن مدیریتی"><select id="status"><option value="">همه وضعیت‌ها</option><option>pending_review</option><option>payment_pending</option><option>needs_correction</option><option>approved</option><option>completed</option><option>rejected</option></select><input id="q" placeholder="جستجو"><button onclick="load()">بارگذاری</button></div><p id="msg" class="muted"></p></div><div class="card"><table><thead><tr><th>کد رهگیری</th><th>خدمت</th><th>کاربر</th><th>مبلغ</th><th>پرداخت</th><th>وضعیت</th><th>زمان</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const g=id=>document.getElementById(id);async function load(){try{g('msg').textContent='در حال دریافت...';const u='/api/admin/company-requests?status='+encodeURIComponent(g('status').value)+'&q='+encodeURIComponent(g('q').value);const r=await fetch(u,{headers:{Authorization:'Bearer '+g('token').value}});const j=await r.json();if(!r.ok)throw Error(j.error||'خطا');g('rows').innerHTML=(j.items||[]).map(x=>`<tr><td>${x.tracking_code}</td><td>${x.request_type_title}</td><td>${x.user_name||'—'}</td><td>${Number(x.amount||0).toLocaleString('fa-IR')}</td><td>${x.payment_status}</td><td>${x.status}</td><td>${x.created_at}</td></tr>`).join('');g('msg').textContent=j.items.length+' درخواست';}catch(e){g('msg').className='err';g('msg').textContent=e.message}}</script></body></html>
