<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجوز ثبت موقعیت خطوط | خطیار</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;color:#172033;margin:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:18px}.role{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center;border-top:1px solid #eef1f6;padding:12px 0;font-size:12px}.role:first-child{border-top:0}.save{background:#0d7a5f;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:800}.muted{font-size:12px;color:#6b7890}</style><main><div class="card"><h1>مجوز «ثبت موقعیت و تصویر خطوط»</h1><div class="muted">دسترسی بر اساس سمت کنترل می‌شود. مدیران کل و سمت‌های مدیریتی تعریف‌شده در API دسترسی کامل دارند.</div></div><div id="list" class="card">در حال دریافت سمت‌ها…</div></main><script>(()=>{const API='/line-location-api.php',token=localStorage.getItem('access')||localStorage.getItem('token')||localStorage.getItem('access_token');async function api(op,o={}){const r=await fetch(API+'?op='+op,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'خطای سرور');return d}async function boot(){try{const roles=await api('roles');document.getElementById('list').innerHTML='<div class="role"><b>سمت</b><b>ثبت</b><b>مشاهده</b><b>مدیریت</b></div>'+roles.map(r=>`<div class="role"><b>${r.title}</b><label><input type="checkbox" data-r="${r.id}" data-k="can_capture" ${r.can_capture?'checked':''}></label><label><input type="checkbox" data-r="${r.id}" data-k="can_view" ${r.can_view?'checked':''}></label><label><input type="checkbox" data-r="${r.id}" data-k="can_manage" ${r.can_manage?'checked':''}></label></div>`).join('')}catch(e){document.getElementById('list').textContent=e.message;return}document.getElementById('list').insertAdjacentHTML('beforeend','<button class="save" id="save">ذخیره همه مجوزها</button>');document.getElementById('save').onclick=async()=>{const ids=[...new Set([...document.querySelectorAll('[data-r]')].map(x=>x.dataset.r))];for(const id of ids){const b={role_id:+id};document.querySelectorAll(`[data-r="${id}"]`).forEach(x=>b[x.dataset.k]=x.checked);await api('save-role',{method:'POST',body:JSON.stringify(b)})}alert('مجوزها ذخیره شد.')} }boot()})();</script></html>
