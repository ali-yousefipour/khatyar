<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت موقعیت و تصویر خطوط | خطیار</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--brand:#0d7a5f;--yellow:#f7c600;--ink:#172033;--line:#e4e9f2;--paper:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}main{width:min(900px,100%);margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #1720330b}h1{font-size:18px;margin:0 0 6px}.muted{font-size:12px;color:#6c7585}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,select,button{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;background:#fff}button{cursor:pointer;font-weight:800}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.yellow{background:var(--yellow);color:#332900;border-color:var(--yellow)}.status{padding:10px;border-radius:12px;background:#f3f6fb;font-size:12px}.ok{background:#eaf8f0;color:#176b3a}.err{background:#fff0f2;color:#a01826}.coords{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;font-size:12px}.map{height:330px;border-radius:15px;overflow:hidden;border:1px solid var(--line)}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border:1px dashed #c9d0dc;border-radius:14px;min-height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafbfe;position:relative;text-align:center;font-size:12px}.photo img{width:100%;height:190px;object-fit:cover}.photo button{position:absolute;bottom:8px;left:8px;right:8px;width:auto}.hidden{display:none}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.top a{color:var(--brand);font-size:12px;text-decoration:none}</style></head><body><main><div class="card top"><div><h1>ثبت موقعیت و تصویر خطوط</h1><div class="muted">موقعیت دقیق ایستگاه، تصویر محل و تصویر تابلو در اطلاعات خط ثبت و بروزرسانی می‌شود.</div></div><a href="/app">بازگشت به خطیار</a></div><div id="denied" class="card err hidden"></div><section id="form" class="hidden"><div class="card"><div class="row"><div><label>شماره خط *</label><select id="line"></select></div><div><label>نام/عنوان ایستگاه</label><input id="station" placeholder="اختیاری"></div></div><button id="gps" class="yellow" style="margin-top:10px">📍 دریافت موقعیت دقیق از GPS گوشی</button><div id="gpsStatus" class="status" style="margin-top:10px">هنوز موقعیت دریافت نشده است.</div><div class="coords"><div>عرض<br><b id="lat">—</b></div><div>طول<br><b id="lng">—</b></div><div>دقت<br><b id="acc">—</b></div></div></div><div class="card"><div class="muted" style="margin-bottom:8px">نقشه موقعیت ثبت‌شده</div><div id="map" class="map"></div></div><div class="card"><div class="photo-grid"><div><label>تصویر محل خط *</label><div class="photo" id="p1">تصویری انتخاب نشده<button class="yellow" data-photo="1">📷 گرفتن تصویر محل خط</button></div></div><div><label>تصویر تابلو ایستگاه *</label><div class="photo" id="p2">تصویری انتخاب نشده<button class="yellow" data-photo="2">📷 گرفتن تصویر تابلو ایستگاه</button></div></div></div></div><div class="card"><button id="save" class="primary">ثبت و بروزرسانی اطلاعات خط</button><div id="saveStatus" class="status" style="margin-top:10px">خط، GPS و هر دو تصویر را انتخاب کنید.</div></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const API='/line-location-api.php',S={lat:null,lng:null,acc:null,p1:null,p2:null};let token,map,marker;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tok(){for(const k of ['access','token','access_token','khatyar_access']){try{const v=localStorage.getItem(k);if(v)return v}catch(e){}}return null}async function api(op,o={}){const r=await fetch(API+'?op='+op,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+token,Accept:'application/json'}}),t=await r.text();let d={};try{d=JSON.parse(t||'{}')}catch(e){throw Error('پاسخ سرور نامعتبر است')}if(!r.ok)throw Error(d.error||'خطای سرور');return d}function stat(m,ok=false){$('gpsStatus').textContent=m;$('gpsStatus').className='status '+(ok?'ok':'')}function setMap(){if(S.lat==null)return;$('lat').textContent=S.lat.toFixed(7);$('lng').textContent=S.lng.toFixed(7);$('acc').textContent=S.acc?Math.round(S.acc)+' متر':'—';if(!marker)marker=L.marker([S.lat,S.lng]).addTo(map);else marker.setLatLng([S.lat,S.lng]);map.setView([S.lat,S.lng],18)}function photo(n,v){S['p'+n]=v;$('p'+n).innerHTML='<img src="'+v+'"><button class="yellow" data-photo="'+n+'">📷 گرفتن مجدد</button>'}function compress(v){return new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};i.src=v})}function take(n){const i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=()=>{if(!i.files[0])return;const r=new FileReader();r.onload=async()=>photo(n,await compress(r.result));r.readAsDataURL(i.files[0])};i.click()}async function boot(){token=tok();if(!token){$('denied').textContent='نشست خطیار پیدا نشد. ابتدا وارد وب‌اپ شوید.';$('denied').classList.remove('hidden');return}try{const p=await api('permission');if(!p.allowed&&!p.can_view)throw Error('برای سمت فعلی شما دسترسی ثبت موقعیت خطوط فعال نشده است.');$('form').classList.remove('hidden');map=L.map('map').setView([35.6892,51.3890],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const lines=await api('lines');$('line').innerHTML='<option value="">انتخاب خط…</option>'+lines.map(x=>'<option value="'+x.id+'">'+esc(x.code)+' — '+esc(x.origin||'')+' ← '+esc(x.destination||'')+'</option>').join('')}catch(e){$('denied').textContent=e.message;$('denied').classList.remove('hidden')}}$('gps').onclick=()=>{if(!navigator.geolocation)return stat('مرورگر از GPS پشتیبانی نمی‌کند.');stat('در حال دریافت موقعیت دقیق…');navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lng=p.coords.longitude;S.acc=p.coords.accuracy;setMap();stat('موقعیت با دقت '+Math.round(p.coords.accuracy)+' متر دریافت شد.',true)},e=>stat('دریافت GPS ناموفق بود: '+e.message),{enableHighAccuracy:true,timeout:20000,maximumAge:0})};document.addEventListener('click',e=>{const b=e.target.closest('[data-photo]');if(b)take(+b.dataset.photo)});$('save').onclick=async()=>{const line=$('line').value;if(!line||S.lat==null||!S.p1||!S.p2){$('saveStatus').textContent='شماره خط، GPS و هر دو تصویر الزامی است.';return}$('save').disabled=true;$('saveStatus').textContent='در حال ثبت اطلاعات…';try{const r=await api('capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({line_id:+line,station_name:$('station').value,latitude:S.lat,longitude:S.lng,accuracy_m:S.acc,location_photo:S.p1,sign_photo:S.p2})});$('saveStatus').textContent='خط '+r.line_code+' با مختصات دقیق بروزرسانی شد.';$('saveStatus').className='status ok'}catch(e){$('saveStatus').textContent=e.message}finally{$('save').disabled=false}};boot()})();</script></body></html>
