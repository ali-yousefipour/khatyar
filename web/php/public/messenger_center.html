<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرکز پیام‌رسان‌های رباتی</title><link href="vendor/vazirmatn/Vazirmatn-font-face.css" rel="stylesheet"><style>body{font-family:Vazirmatn,Tahoma;background:#f4f7f8;color:#172033;margin:0;padding:20px}.wrap{max-width:1180px;margin:auto}.card{background:#fff;border:1px solid #dde5e8;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 26px rgba(23,32,51,.05)}body.embedded{padding:16px}body.embedded .wrap{max-width:none}body.embedded h1{font-size:20px;margin-bottom:16px}h1,h2{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}.input,select,textarea{font:inherit;border:1px solid #ccd5df;border-radius:10px;padding:10px;box-sizing:border-box}.input{flex:1;min-width:220px}textarea{width:100%;min-height:110px}.btn{border:0;border-radius:10px;padding:10px 16px;background:#0d7a5f;color:#fff;font:inherit;cursor:pointer}.btn.alt{background:#3159a8}.btn.warn{background:#bc7a00}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:right}.muted{color:#667085;font-size:12px}.msg{padding:10px;border-radius:10px;background:#eef7f3;margin:10px 0;display:none}</style></head><body><div class="wrap"><h1>مرکز پیام‌رسان‌های رباتی</h1><div id="msg" class="msg"></div>
<div class="card"><h2>ارسال گروهی در بله، تلگرام و ایتا</h2><div class="row"><select id="target" class="input"><option value="all_drivers">همه رانندگان دارای شماره</option><option value="all_users">همه کاربران فعال</option></select><input id="mobiles" class="input" placeholder="شماره‌های دستی؛ با ویرگول جدا کنید"></div><textarea id="text" placeholder="متن پیام…"></textarea><button class="btn" onclick="sendGroup()">ارسال در ربات‌ها</button></div>
<div class="card"><h2>دعوت شماره‌ها به ربات‌ها</h2><p class="muted">ربات نمی‌تواند به شماره‌ای که هنوز Start نزده پیام مستقیم بدهد؛ دعوت از طریق پیامک و لینک ربات انجام می‌شود.</p><textarea id="inviteMobiles" placeholder="شماره‌ها؛ با ویرگول یا خط جدید جدا کنید"></textarea><textarea id="inviteText" placeholder="متن دعوت اختیاری"></textarea><button class="btn warn" onclick="invite()">ارسال دعوت پیامکی</button></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2>مشترکین ربات‌ها</h2><button class="btn alt" onclick="loadSubs()">بروزرسانی</button></div><div style="overflow:auto"><table><thead><tr><th>پیام‌رسان</th><th>شماره</th><th>شناسه گفتگو</th><th>وضعیت</th><th>تاریخ اتصال</th></tr></thead><tbody id="subs"></tbody></table></div></div></div>
<script>
if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');
const h={Authorization:'Bearer '+(localStorage.token||''),'content-type':'application/json'}; const show=t=>{const x=document.getElementById('msg');x.textContent=t;x.style.display='block'}; const nums=s=>String(s||'').split(/[،,\n\r;]+/).map(x=>x.trim()).filter(Boolean);
async function api(path,opt={}){const r=await fetch('/api'+path,{...opt,headers:{...h,...(opt.headers||{})}});const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch(e){throw Error('پاسخ نامعتبر سرور: '+tx.replace(/<[^>]+>/g,' ').slice(0,180))}if(!r.ok)throw Error(d.error||d.message||'خطای سرور');return d}
async function sendGroup(){try{const target=document.getElementById('target').value,text=document.getElementById('text').value.trim(),manual=nums(document.getElementById('mobiles').value);if(!text)throw Error('متن پیام لازم است');let all=manual;if(target==='all_drivers'||target==='all_users'){for(const p of ['bale','telegram','eitaa']){const r=await api('/admin/messengers/'+p+'/send',{method:'POST',body:JSON.stringify({target,text})});show(`ارسال ${p}: ${r.sent||0} موفق، ${r.not_connected||0} متصل‌نشده`)}if(manual.length){const r=await api('/messengers/send-group',{method:'POST',body:JSON.stringify({mobiles:manual,message:text})});show(`شماره‌های دستی: ${r.sent||0} ارسال، ${r.not_connected||0} متصل‌نشده`)}}}catch(e){show(e.message)}}
async function invite(){try{const mobiles=nums(document.getElementById('inviteMobiles').value),text=document.getElementById('inviteText').value.trim();const r=await api('/admin/messengers/invite',{method:'POST',body:JSON.stringify({mobiles,text})});show('دعوت ارسال شد: '+(r.sent||r.count||mobiles.length))}catch(e){show(e.message)}}
async function loadSubs(){try{const rows=await api('/admin/messengers/subscribers-all');document.getElementById('subs').innerHTML=rows.map(r=>`<tr><td>${r.platform||''}</td><td>${r.mobile||'—'}</td><td>${r.chat_id||'—'}</td><td>${r.status||'—'}</td><td>${r.created_at||'—'}</td></tr>`).join('')||'<tr><td colspan="5">مشترکی ثبت نشده است.</td></tr>'}catch(e){show(e.message)}}loadSubs();
</script></body></html>
