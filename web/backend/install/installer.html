<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
 :root{--ink:#0f1b2d;--paper:#f4f6fb;--line:#e4e9f2;--muted:#6b7890;--brand:#0d7a5f;--brand2:#0a5f4a;--taxi:#f6c324;--danger:#e23b54;--ok:#16a06a;font-family:"Vazirmatn",system-ui,sans-serif}
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
   background-image:radial-gradient(circle at 85% -10%,rgba(13,122,95,.1),transparent 45%)}
 .card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -20px rgba(15,27,45,.3);width:560px;max-width:96vw;overflow:hidden}
 .head{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:24px}
 .head .lg{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;font-weight:800;margin-bottom:10px}
 .head h1{font-size:19px}.head p{opacity:.85;font-size:13px;margin-top:3px}
 .steps{display:flex;gap:6px;padding:16px 24px 0}
 .steps .st{flex:1;height:5px;border-radius:99px;background:var(--line)}
 .steps .st.on{background:var(--taxi)}
 .body{padding:22px 24px 26px}
 .body h2{font-size:16px;margin-bottom:14px}
 label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
 input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;font-size:13px}
 input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
 .row{display:flex;gap:12px}.row>div{flex:1}
 .btns{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
 .btn{border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:12px;padding:11px 20px;font-size:14px}
 .btn.p{background:var(--brand);color:#fff}.btn.g{background:#eef1f7;color:var(--ink)}
 .btn:disabled{opacity:.5;cursor:default}
 .req{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
 .ok{color:var(--ok);font-weight:700}.bad{color:var(--danger);font-weight:700}
 .msg{margin-top:14px;padding:11px;border-radius:11px;font-size:13px;display:none}
 .msg.e{background:#fde6ea;color:var(--danger);display:block}
 .msg.s{background:#e3f6ec;color:var(--ok);display:block}
 .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
 .done{text-align:center;padding:14px 0}
 .done .ic{font-size:40px;color:var(--ok)}
</style>
</head>
<body>
<div class="card">
  <div class="head"><div class="lg">ت</div><h1>نصب سامانه کنترل خطوط تاکسیرانی</h1><p>راه‌انداز خودکار وب‌سرویس و دیتابیس</p></div>
  <div class="steps"><div class="st on" id="s0"></div><div class="st" id="s1"></div><div class="st" id="s2"></div><div class="st" id="s3"></div></div>
  <div class="body" id="body"></div>
</div>
<script>
const state={step:0,db:{},admin:{},jwt:""};
const $=id=>document.getElementById(id);
function setSteps(n){for(let i=0;i<4;i++)$("s"+i).classList.toggle("on",i<=n)}

async function reqCheck(){
  const r=await fetch('/install/requirements').then(r=>r.json()).catch(()=>({items:[]}));
  return r.items||[];
}

const views={
  0: async()=>{
    const items=await reqCheck();
    return {html:`<h2>۱) بررسی پیش‌نیازها</h2>
      ${items.map(i=>`<div class="req"><span>${i.label}</span><span class="${i.ok?'ok':'bad'}">${i.ok?'✓ '+i.detail:'✗ '+i.detail}</span></div>`).join('')}
      <div class="btns"><span></span><button class="btn p" onclick="go(1)">بعدی</button></div>`};
  },
  1: ()=>({html:`<h2>۲) اتصال دیتابیس (PostgreSQL)</h2>
    <div class="row"><div><label>هاست</label><input id="host" value="${state.db.host||'localhost'}"></div>
      <div><label>پورت</label><input id="port" value="${state.db.port||'5432'}"></div></div>
    <label>نام دیتابیس</label><input id="name" value="${state.db.name||'taxi'}">
    <div class="row"><div><label>کاربر</label><input id="user" value="${state.db.user||'postgres'}"></div>
      <div><label>رمز عبور</label><input id="pass" type="password" value="${state.db.pass||''}"></div></div>
    <div class="msg" id="m1"></div>
    <div class="btns"><button class="btn g" onclick="go(0)">قبلی</button><button class="btn p" onclick="testDb()">تست و ادامه</button></div>`}),
  2: ()=>({html:`<h2>۳) حساب مدیرکل سامانه</h2>
    <div class="row"><div><label>نام</label><input id="fn" value="${state.admin.fn||''}"></div>
      <div><label>نام خانوادگی</label><input id="ln" value="${state.admin.ln||''}"></div></div>
    <label>نام کاربری (کد ملی)</label><input id="un" value="${state.admin.un||''}">
    <label>رمز عبور مدیرکل</label><input id="pw" type="password" value="${state.admin.pw||''}">
    <div class="hint">پس از ساخت، ۶۸ حساب پرسنل با رمز ۱۲۳۴۵۶ نیز به‌صورت خودکار ایجاد می‌شود.</div>
    <label>کلید امنیتی توکن (JWT) — خالی بگذارید تا خودکار ساخته شود</label><input id="jwt" value="${state.jwt||''}">
    <div class="msg" id="m2"></div>
    <div class="btns"><button class="btn g" onclick="go(1)">قبلی</button><button class="btn p" id="runBtn" onclick="runInstall()">نصب نهایی</button></div>`}),
  3: ()=>({html:`<div class="done"><div class="ic">✓</div><h2 style="margin-top:10px">نصب با موفقیت انجام شد</h2>
    <p style="color:var(--muted);font-size:13px;margin-top:6px">فایل تنظیمات نوشته شد، جداول ساخته و حساب‌ها ایجاد شدند.</p>
    <p style="margin-top:14px"><b>برای امنیت، اکنون سرور را یک‌بار ری‌استارت کنید.</b></p>
    <div class="btns" style="justify-content:center"><a class="btn p" href="/">ورود به سامانه</a></div></div>`}),
};

async function render(){const v=await views[state.step]();$("body").innerHTML=v.html;setSteps(state.step);}
function go(n){state.step=n;render();}

async function testDb(){
  state.db={host:$("host").value,port:$("port").value,name:$("name").value,user:$("user").value,pass:$("pass").value};
  const m=$("m1");m.className="msg";m.textContent="در حال تست…";m.classList.add("s");
  const r=await fetch('/install/test-db',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state.db)}).then(r=>r.json());
  if(r.ok){m.className="msg s";m.textContent="اتصال موفق بود ✓";setTimeout(()=>go(2),600);}
  else{m.className="msg e";m.textContent="خطا: "+(r.error||'اتصال ناموفق');}
}
async function runInstall(){
  state.admin={fn:$("fn").value,ln:$("ln").value,un:$("un").value,pw:$("pw").value};state.jwt=$("jwt").value;
  const m=$("m2");m.className="msg s";m.textContent="در حال نصب… (ساخت جداول و حساب‌ها)";$("runBtn").disabled=true;
  const r=await fetch('/install/run',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({db:state.db,admin:state.admin,jwt:state.jwt})}).then(r=>r.json());
  if(r.ok)go(3);else{m.className="msg e";m.textContent="خطا: "+(r.error||'نصب ناموفق');$("runBtn").disabled=false;}
}
render();
</script>
</body>
</html>
