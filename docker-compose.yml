# استقرار یک‌مرحله‌ای: docker compose up -d  سپس به http://localhost:4000/install بروید
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxi
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      # در نصب وب پر می‌شود؛ این مقادیر پیش‌فرض برای اولین اتصال نصاب است
      DATABASE_URL: postgres://postgres:postgres@db:5432/taxi
      PORT: 4000
    ports: ["4000:4000"]
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/.installed:/app/.installed

volumes:
  pgdata:
