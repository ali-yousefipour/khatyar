// KhatYar Gradle repository policy for Iran-network constrained environments.
// This file is passed explicitly to the project's Gradle wrapper; it is NOT a
// global ~/.gradle/init.d script.
//
// Resolution policy:
//   1) local Maven (~/.m2/repository)
//   2) Myket Maven
//   3) Runflare mirrors for groups known to be mirrored reliably
//   4) official repositories
//
// IMPORTANT:
// Runflare is deliberately excluded for Expo and React Native coordinates.
// The mirror has returned HTTP 500 for valid Expo POMs/artifacts. Repository
// order alone is NOT a reliable fallback when a repository responds with 5xx;
// excluding affected groups prevents Gradle from querying the unreliable mirror.

ext.khatyarRunflareContentGroovy = { repository ->
    repository.content {
        excludeGroupByRegex 'expo\\.modules(\\..*)?'
        excludeGroup 'host.exp.exponent'
        excludeGroupByRegex 'com\\.facebook\\.react(\\..*)?'
        excludeGroupByRegex 'com\\.facebook\\.fbjni(\\..*)?'
    }
}

ext.khatyarMirrorRepos = {
    mavenLocal()
    maven {
        name = 'KhatYarMyket'
        url = uri('https://maven.myket.ir/')
        metadataSources { gradleMetadata(); mavenPom(); artifact() }
    }
    maven {
        name = 'KhatYarRunflareGoogle'
        url = uri('https://mirror-maven.runflare.com/android/maven2/')
        metadataSources { mavenPom(); artifact() }
        khatyarRunflareContentGroovy(delegate)
    }
    maven {
        name = 'KhatYarRunflareMaven'
        url = uri('https://mirror-maven.runflare.com/maven2/')
        metadataSources { mavenPom(); artifact() }
        khatyarRunflareContentGroovy(delegate)
    }
    maven {
        name = 'KhatYarRunflareGradlePlugins'
        url = uri('https://mirror-maven.runflare.com/gradle-plugins/')
        metadataSources { mavenPom(); artifact() }
        khatyarRunflareContentGroovy(delegate)
    }
    google()
    mavenCentral()
}

gradle.allprojects { project ->
    project.buildscript.repositories {
        khatyarMirrorRepos.delegate = delegate
        khatyarMirrorRepos()
    }
    project.repositories {
        khatyarMirrorRepos.delegate = delegate
        khatyarMirrorRepos()
    }
}

gradle.settingsEvaluated { settings ->
    settings.pluginManagement.repositories {
        khatyarMirrorRepos.delegate = delegate
        khatyarMirrorRepos()
        gradlePluginPortal()
    }
    if (settings.hasProperty('dependencyResolutionManagement')) {
        settings.dependencyResolutionManagement.repositories {
            khatyarMirrorRepos.delegate = delegate
            khatyarMirrorRepos()
        }
    }
}

println '[khatyar-init] Maven policy active: local -> Myket -> Runflare(filtered) -> official.'
println '[khatyar-init] Runflare excluded for Expo/React Native groups because those coordinates may return HTTP 500.'
