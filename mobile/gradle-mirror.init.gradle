// KhatYar Gradle repository policy for Iran-network constrained environments.
// This file is passed explicitly to the project's Gradle wrapper; it is NOT a
// global ~/.gradle/init.d script.
// Priority for Maven repositories:
//   1) local Maven repository (~/.m2/repository)
//   2) Myket
//   3) Runflare mirrors (POM/artifact metadata only; no Gradle Module Metadata)
//   4) official repositories

ext.khatyarMirrorRepos = {
    mavenLocal()
    maven {
        name = 'KhatYarMyket'
        url = uri('https://maven.myket.ir/')
        metadataSources { gradleMetadata(); mavenPom(); artifact() }
    }
    // Runflare may return HTTP 500 for Gradle Module Metadata (.module) on
    // otherwise valid artifacts. Restricting it to POM/artifact metadata keeps
    // it as a reliable fallback without allowing a non-essential .module request
    // to terminate dependency resolution.
    maven {
        name = 'KhatYarRunflareGoogle'
        url = uri('https://mirror-maven.runflare.com/android/maven2/')
        metadataSources { mavenPom(); artifact() }
    }
    maven {
        name = 'KhatYarRunflareMaven'
        url = uri('https://mirror-maven.runflare.com/maven2/')
        metadataSources { mavenPom(); artifact() }
    }
    maven {
        name = 'KhatYarRunflareGradlePlugins'
        url = uri('https://mirror-maven.runflare.com/gradle-plugins/')
        metadataSources { mavenPom(); artifact() }
    }
    google()
    mavenCentral()
}

gradle.allprojects { project ->
    project.buildscript.repositories {
        khatyarMirrorRepos.delegate = delegate
        khatyarMirrorRepos()
    }
    project.repositories {
        khatyarMirrorRepos.delegate = delegate
        khatyarMirrorRepos()
    }
}

gradle.settingsEvaluated { settings ->
    settings.pluginManagement.repositories {
        khatyarMirrorRepos.delegate = delegate
        khatyarMirrorRepos()
        gradlePluginPortal()
    }
    if (settings.hasProperty('dependencyResolutionManagement')) {
        settings.dependencyResolutionManagement.repositories {
            khatyarMirrorRepos.delegate = delegate
            khatyarMirrorRepos()
        }
    }
}

println '[khatyar-init] Maven policy active: local -> Myket -> Runflare(POM/artifact) -> official (all Gradle builds, including included builds).'
