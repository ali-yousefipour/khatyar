// Khatyar global Myket/local Maven init for the main build and all included builds.
// Expo SDK packages ship local-maven-repo artifacts. They must be searched before
// network repositories so Android builds remain usable under Iranian network limits.
// build-release.ps1 sets KHATYAR_NODE_MODULES to mobile/node_modules.

final String myketUrl = 'https://maven.myket.ir/'
final String nodeModules = System.getenv('KHATYAR_NODE_MODULES') ?: ''

def findLocalMavenRepos = {
    if (!nodeModules) return []
    def root = new File(nodeModules)
    if (!root.isDirectory()) return []
    def result = []
    root.eachFileRecurse { file ->
        if (file.isDirectory() && file.name == 'local-maven-repo') result << file
    }
    return result
}

def addLocalExpoRepos = { repos ->
    findLocalMavenRepos().eachWithIndex { localRepo, index ->
        def relative = localRepo.absolutePath
            .replace(new File(nodeModules).absolutePath, '')
            .replaceAll('^[\\/]+', '')
            .replaceAll('[^A-Za-z0-9_]+', '_')
        def repoName = 'ExpoLocal_' + index + '_' + relative
        if (repos.findByName(repoName) == null) {
            repos.maven {
                name = repoName
                url = localRepo.toURI()
                metadataSources { gradleMetadata(); mavenPom(); artifact() }
            }
        }
    }
}

def addMyket = { repos ->
    if (repos.findByName('MyketMirror') == null) {
        repos.maven {
            name = 'MyketMirror'
            url = uri(myketUrl)
            metadataSources { gradleMetadata(); mavenPom(); artifact() }
        }
    }
}

def addStandardRepos = { repos, includePluginPortal = false ->
    if (repos.findByName('Google') == null) repos.google()
    if (repos.findByName('MavenCentral') == null) repos.mavenCentral()
    if (includePluginPortal && repos.findByName('GradlePluginPortal') == null) repos.gradlePluginPortal()
}

beforeSettings { settings ->
    settings.pluginManagement.repositories {
        mavenLocal()
        addLocalExpoRepos(delegate)
        addMyket(delegate)
        addStandardRepos(delegate, true)
    }
    try {
        settings.dependencyResolutionManagement.repositories {
            mavenLocal()
            addLocalExpoRepos(delegate)
            addMyket(delegate)
            addStandardRepos(delegate, false)
        }
    } catch (ignored) { }
}

beforeProject { project ->
    project.buildscript.repositories {
        mavenLocal()
        addLocalExpoRepos(delegate)
        addMyket(delegate)
        addStandardRepos(delegate, true)
    }
    project.repositories {
        mavenLocal()
        addLocalExpoRepos(delegate)
        addMyket(delegate)
        addStandardRepos(delegate, false)
    }
}
