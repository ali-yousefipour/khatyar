// Khatyar Gradle repository policy for the main Android build and all included builds.
// Primary/official sources are kept for compatibility, while accessible mirrors are
// placed before them so Android/Gradle dependencies can be resolved in restricted
// network environments such as Iran.

final String myketUrl = 'https://maven.myket.ir/'
final String aliyunGoogleUrl = 'https://maven.aliyun.com/repository/google'
final String aliyunPublicUrl = 'https://maven.aliyun.com/repository/public'
final String aliyunGradlePluginUrl = 'https://maven.aliyun.com/repository/gradle-plugin'

// Huawei Cloud maintains a public Maven mirror and is used only as an additional
// fallback. It is deliberately after Myket/Aliyun and before the official hosts.
final String huaweiPublicUrl = 'https://repo.huaweicloud.com/repository/maven/'
final String huaweiGoogleUrl = 'https://repo.huaweicloud.com/repository/maven-google/'

def findNodeModules = { settingsDir ->
    File current = settingsDir
    for (int i = 0; i < 8 && current != null; i++) {
        File candidate = new File(current, 'node_modules')
        if (candidate.isDirectory()) return candidate
        current = current.parentFile
    }
    return null
}

def findLocalMavenRepos = { settingsDir ->
    File root = findNodeModules(settingsDir)
    if (root == null) return []
    def result = []
    root.eachFileRecurse { file ->
        if (file.isDirectory() && file.name == 'local-maven-repo') result << file
    }
    return result
}

def addMaven = { repos, name, urlString ->
    if (repos.findByName(name) == null) {
        repos.maven {
            name = name
            url = uri(urlString)
            metadataSources { gradleMetadata(); mavenPom(); artifact() }
        }
    }
}

def addLocalExpoRepos = { repos, settingsDir ->
    findLocalMavenRepos(settingsDir).eachWithIndex { localRepo, index ->
        def relative = localRepo.absolutePath
            .replaceAll('^[\\/]+', '')
            .replaceAll('[^A-Za-z0-9_]+', '_')
        def repoName = 'ExpoLocal_' + index + '_' + relative
        if (repos.findByName(repoName) == null) {
            repos.maven {
                name = repoName
                url = localRepo.toURI()
                metadataSources { gradleMetadata(); mavenPom(); artifact() }
            }
        }
    }
}

def addMirrors = { repos, includePluginPortal = false ->
    // Myket is the project's primary mirror.
    addMaven(repos, 'MyketMirror', myketUrl)

    // Aliyun mirrors Google's Android Maven, Maven Central/public artifacts and
    // the Gradle Plugin Portal. This is important when dl.google.com is blocked.
    addMaven(repos, 'AliyunGoogleMirror', aliyunGoogleUrl)
    addMaven(repos, 'AliyunPublicMirror', aliyunPublicUrl)
    if (includePluginPortal) addMaven(repos, 'AliyunGradlePluginMirror', aliyunGradlePluginUrl)

    // Secondary public fallback.
    addMaven(repos, 'HuaweiGoogleMirror', huaweiGoogleUrl)
    addMaven(repos, 'HuaweiPublicMirror', huaweiPublicUrl)
}

def addStandardRepos = { repos, includePluginPortal = false ->
    if (repos.findByName('Google') == null) repos.google()
    if (repos.findByName('MavenCentral') == null) repos.mavenCentral()
    if (includePluginPortal && repos.findByName('GradlePluginPortal') == null) repos.gradlePluginPortal()
}

beforeSettings { settings ->
    settings.pluginManagement.repositories {
        mavenLocal()
        addLocalExpoRepos(delegate, settings.settingsDir)
        addMirrors(delegate, true)
        addStandardRepos(delegate, true)
    }
    try {
        settings.dependencyResolutionManagement.repositories {
            mavenLocal()
            addLocalExpoRepos(delegate, settings.settingsDir)
            addMirrors(delegate, false)
            addStandardRepos(delegate, false)
        }
    } catch (ignored) { }
}

beforeProject { project ->
    def settingsDir = project.rootProject.projectDir
    project.buildscript.repositories {
        mavenLocal()
        addLocalExpoRepos(delegate, settingsDir)
        addMirrors(delegate, true)
        addStandardRepos(delegate, true)
    }

    // Some Expo/RN included builds declare repositories at project level. Add the
    // same mirrors there as well, otherwise Gradle can resolve from Google/Central
    // only and fail on com.android.tools.build:gradle when those hosts are blocked.
    try {
        project.repositories {
            addLocalExpoRepos(delegate, settingsDir)
            addMirrors(delegate, false)
            addStandardRepos(delegate, false)
        }
    } catch (ignored) { }
}
