# استقرار عملیاتی: HTTPS + پشتیبان‌گیری خودکار شبانه
# اجرا از ریشهٔ پروژه:  docker compose -f deploy/docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-taxi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-taxi}
      PORT: 4000
    volumes:
      - ../backend/.env:/app/.env
      - ../backend/.installed:/app/.installed
    expose: ["4000"]

  nginx:
    image: nginx:alpine
    restart: always
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # یک‌بار برای صدور گواهی:
    # docker compose -f deploy/docker-compose.prod.yml run --rm certbot certonly \
    #   --webroot -w /var/www/certbot -d taxi-control.mashhad.ir

  backup:
    image: postgres:16-alpine
    restart: always
    depends_on: [db]
    environment:
      PGPASSWORD: ${DB_PASS:-postgres}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  certbot-etc:
  certbot-www:
