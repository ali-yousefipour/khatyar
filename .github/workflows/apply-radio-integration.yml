name: Apply KhatYar radio integration
on:
  push:
    branches: [main]
    paths:
      - 'mobile/src/radio/**'
      - 'mobile/src/screens/RadioScreen.js'
      - 'mobile/App.js'
      - 'mobile/src/screens/DashboardScreen.js'
      - 'mobile/app.config.js'
      - 'php/app/radio-api*.php'
      - 'php/app/radio-admin*.js'
      - 'php/app/radio-admin*.html'
      - 'php/app/.htaccess'
      - 'php/migrations/*radio*.sql'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: khatyar-radio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android radio integration
        run: |
          node --check mobile/src/screens/RadioScreen.js
          node --check mobile/src/radio/RadioContext.js
          node --check mobile/src/screens/DashboardScreen.js
          node --check mobile/App.js
          node --check mobile/app.config.js
      - name: Validate PHP radio APIs
        run: |
          php -l php/app/radio-api.php
          php -l php/app/radio-api-v2.php
          php -l php/app/radio-admin-api.php
      - name: Validate admin JavaScript
        run: node --check php/app/radio-admin.js
