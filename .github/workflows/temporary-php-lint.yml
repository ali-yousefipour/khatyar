name: temporary-php-lint
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: PHP version
        run: php -v
      - name: Lint remote PHP files
        run: |
          set -eux
          SHA="${GITHUB_SHA}"
          curl -fsSL "https://raw.githubusercontent.com/ali-yousefipour/khatyar/${SHA}/php/app/index.php" -o /tmp/index.php
          curl -fsSL "https://raw.githubusercontent.com/ali-yousefipour/khatyar/${SHA}/php/lib/routes.php" -o /tmp/routes.php
          curl -fsSL "https://raw.githubusercontent.com/ali-yousefipour/khatyar/${SHA}/php/lib/school_service_routes_extra.php" -o /tmp/school_service_routes_extra.php
          curl -fsSL "https://raw.githubusercontent.com/ali-yousefipour/khatyar/${SHA}/php/lib/LineImageCompressor.php" -o /tmp/LineImageCompressor.php
          php -l /tmp/index.php
          php -l /tmp/routes.php
          php -l /tmp/school_service_routes_extra.php
          php -l /tmp/LineImageCompressor.php
