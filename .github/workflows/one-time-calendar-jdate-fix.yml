name: One-time React JDate migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            php/app/panel.html
            php/app/assets
            php/tools/panel_source.jsx
            php/tools/apply_react_jdate_migration.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migrate React JDate source
        run: python3 php/tools/apply_react_jdate_migration.py

      - name: Install TypeScript compiler
        run: npm install --no-save typescript

      - name: Rebuild panel bundle
        run: ./node_modules/.bin/tsc --allowJs --jsx react --target ES2018 --module none --outFile php/app/assets/panel.bundle.js php/tools/panel_source.jsx

      - name: Bump cache version
        run: python3 -c "from pathlib import Path; p=Path('php/app/panel.html'); p.write_text(p.read_text(encoding='utf-8').replace('1.3.83-r3','1.3.83-r4'),encoding='utf-8')"

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add php/tools/panel_source.jsx php/app/assets/panel.bundle.js php/app/panel.html php/tools/apply_react_jdate_migration.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(calendar): migrate React JDate to shared calendar'
          git push
