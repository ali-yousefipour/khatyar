name: Apply report bot E2E integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Android and Web report delivery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('mobile/src/screens/ReportsScreen.js')
          s=p.read_text(encoding='utf-8')
          if 'report-bot-notify.php' not in s:
            old="""      const r = await postOrQueue('/reports', {\n        subject: subject.trim(), body: body.trim(), priority,\n        attachments, to_user_id: toUserId || undefined,\n        cc_user_id: ccEnabled && ccUserId ? ccUserId : undefined,\n      });"""
            new="""      const r = await postOrQueue('/reports', {\n        subject: subject.trim(), body: body.trim(), priority,\n        attachments, to_user_id: toUserId || undefined,\n        cc_user_id: ccEnabled && ccUserId ? ccUserId : undefined,\n      });\n      let botDelivery = null;\n      if (!r?.queued) {\n        try {\n          botDelivery = await request('/report-bot-notify.php', { method: 'POST', body: { subject: subject.trim(), body: body.trim(), report_id: r?.id || r?.report_id || null, attachments }, timeoutMs: 45000 });\n        } catch (botError) { botDelivery = { ok: false, error: botError?.message || 'ارسال به ربات‌ها ناموفق بود.' }; }\n      }"""
            if old not in s: raise SystemExit('Android insertion point not found')
            s=s.replace(old,new,1)
            old2="""      if (!r.queued) playSound('reportSentSuccess').catch(() => {});\n      Alert.alert(r.queued ? 'آفلاین' : 'ارسال شد', r.queued ? 'گزارش ذخیره شد و بعداً ارسال می‌شود.' : `گزارش به ${toName} ارسال شد.`);"""
            new2="""      if (!r.queued) playSound('reportSentSuccess').catch(() => {});\n      const botFailed = !r.queued && botDelivery && botDelivery.ok === false;\n      const botText = botFailed ? '\\nارسال به ربات‌های پیام‌رسان انجام نشد؛ گزارش اصلی ثبت شده است.' : '';\n      Alert.alert(r.queued ? 'آفلاین' : 'ارسال شد', r.queued ? 'گزارش ذخیره شد و بعداً ارسال می‌شود.' : `گزارش به ${toName} ارسال شد.${botText}`);"""
            if old2 not in s: raise SystemExit('Android alert insertion point not found')
            s=s.replace(old2,new2,1)
            p.write_text(s,encoding='utf-8')

          p=Path('php/app/web-android-parity-v2.js')
          s=p.read_text(encoding='utf-8')
          if '__KH_REPORT_BOT_E2E__' not in s:
            marker="""function scan(){cleanLegacy();if(auth())dash();camera();previews();if(auth())document.getElementById('body')?.classList.add('kh-v31-page')}"""
            inject="""function reportBotE2E(){if(window.__KH_REPORT_BOT_E2E__)return;window.__KH_REPORT_BOT_E2E__=true;const originalFetch=window.fetch.bind(window);window.fetch=async function(input,init){const method=String((init&&init.method)||'GET').toUpperCase();const url=typeof input==='string'?input:(input&&input.url)||'';const isReport=method==='POST'&&/\\/reports(?:[/?#]|$)/.test(url)&&!/report-bot-notify\\.php/.test(url);let payload=null;if(isReport&&init&&typeof init.body==='string'){try{payload=JSON.parse(init.body)}catch(_){}}const res=await originalFetch(input,init);if(isReport&&payload&&res.ok){try{const data=await res.clone().json().catch(()=>({}));const token=localStorage.getItem('token')||localStorage.getItem('access')||localStorage.getItem('access_token')||'';originalFetch('/api/report-bot-notify.php',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({subject:payload.subject||'',body:payload.body||'',report_id:data.id||data.report_id||null,attachments:Array.isArray(payload.attachments)?payload.attachments:[]})}).catch(()=>{});}catch(_){} }return res;};}\nfunction scan(){reportBotE2E();cleanLegacy();if(auth())dash();camera();previews();if(auth())document.getElementById('body')?.classList.add('kh-v31-page')}"""
            if marker not in s: raise SystemExit('Web insertion point not found')
            s=s.replace(marker,inject,1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit E2E integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/src/screens/ReportsScreen.js php/app/web-android-parity-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply report bot e2e'
          git push
