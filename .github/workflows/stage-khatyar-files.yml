name: Stage Khatyar files on new domain without SSL cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-khatyar-files.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khatyar-domain-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify source and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l php/app/index.php
          php -l php/config.php
          test -s php/app/.htaccess
          test -s php/app/index.php
          test -s php/app/panel.html

      - name: Install FTP client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Copy full old site including uploads, overlay current public files, and verify FTP copy
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${FTP_USER:-}" && test -n "${FTP_PASS:-}" || { echo "FTP credentials missing"; exit 1; }
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT

          cat > "$RUNNER_TEMP/read-ftp.cmd" <<EOF
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 3
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          mirror --continue --parallel=2 /app $staging
          bye
          EOF
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "$(cat "$RUNNER_TEMP/read-ftp.cmd")"
          test -s "$staging/index.php"
          test -s "$staging/.htaccess"
          echo "Original production app downloaded, including uploaded media."

          cp -a php/app/. "$staging/"
          python3 - "$staging" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          count = 0
          for file in root.rglob('*'):
              if not file.is_file() or 'uploads' in file.relative_to(root).parts:
                  continue
              if file.suffix.lower() not in {'.php','.html','.js','.css','.json','.xml','.svg','.webmanifest'}:
                  continue
              try:
                  data=file.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):
                  continue
              converted=data.replace('app.yousefipour.ir','khat-yar.ir')
              if converted!=data:
                  file.write_text(converted,encoding='utf-8')
                  count+=1
          print('Canonical-domain references updated in',count,'public source files; uploaded data preserved.')
          PY

          cat > "$RUNNER_TEMP/write-ftp.cmd" <<EOF
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 3
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          mkdir -p /khat-yar.ir
          mirror --reverse --continue --parallel=2 $staging /khat-yar.ir
          bye
          EOF
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "$(cat "$RUNNER_TEMP/write-ftp.cmd")"
          mkdir -p "$RUNNER_TEMP/khatyar-verify"
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit yes; set net:timeout 60; set ftp:passive-mode true;
            set ftp:ssl-force false; set ftp:ssl-protect-data false;
            get /khat-yar.ir/index.php -o $RUNNER_TEMP/khatyar-verify/index.php;
            get /khat-yar.ir/.htaccess -o $RUNNER_TEMP/khatyar-verify/.htaccess;
            bye"
          test -s "$RUNNER_TEMP/khatyar-verify/index.php"
          test -s "$RUNNER_TEMP/khatyar-verify/.htaccess"
          echo "New domain directory and routing entrypoints verified by FTP."
          echo "Old site was not deleted or disabled."

      - name: Public health probe with temporary SSL bypass (NO credentials)
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::HTTPS certificate for khat-yar.ir must be repaired before any authenticated operation or legacy shutdown."
          status="$(curl --insecure --silent --show-error --max-time 25 --retry 2 -o "$RUNNER_TEMP/khatyar-health.json" -w '%{http_code}' https://khat-yar.ir/api/health || true)"
          echo "New-domain public health HTTP: $status"
          if [ "$status" != 200 ]; then
            echo "::warning::New domain public health is not yet usable; FTP staging is complete but cutover remains blocked."
            exit 0
          fi
          if php -r '$v=json_decode(file_get_contents($argv[1]),true);if(($v["ok"]??false)!==true||($v["db"]??false)!==true)exit(1);' "$RUNNER_TEMP/khatyar-health.json"; then
            echo "Public health and database connectivity returned ok, without exchanging credentials."
          else
            echo "::warning::New-domain HTTP responds but PHP/DB health is not yet ready."
          fi
          echo "Legacy API remains active until valid TLS and secure authenticated release verification."
