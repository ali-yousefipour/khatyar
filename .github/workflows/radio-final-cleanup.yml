name: Radio final cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-final-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const path = 'mobile/src/screens/RadioScreen.js';
            const f = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            let text = Buffer.from(f.data.content, 'base64').toString('utf8');
            const oldEffect = "useEffect(()=>{loadRecent();poll();const t=setInterval(()=>{loadRecent();poll()},1500);return()=>clearInterval(t)},[user?.id,channelId,enabled,channels.length]);";
            const newEffect = "useEffect(()=>{poll();const t=setInterval(poll,1500);return()=>clearInterval(t)},[user?.id,channelId,enabled]);";
            if (text.includes(oldEffect)) text = text.replace(oldEffect, newEffect);
            text = text.replace("wrap:{flex:1,backgroundColor:C.paper}", "wrap:{flex:1,backgroundColor:C.paper,direction:'rtl'}");
            if (text.includes('loadRecent()')) throw new Error('stale loadRecent reference remains');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha:f.data.sha,message:'fix(radio): remove stale recent loader and enforce RTL',content:Buffer.from(text,'utf8').toString('base64')});
            const wfPath = '.github/workflows/radio-final-cleanup.yml';
            const wf = await github.rest.repos.getContent({owner, repo, path:wfPath, ref:'main'});
            await github.rest.repos.deleteFile({owner,repo,path:wfPath,branch:'main',sha:wf.data.sha,message:'chore(radio): remove one-time final cleanup workflow'});