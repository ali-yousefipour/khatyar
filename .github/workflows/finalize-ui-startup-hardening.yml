name: Finalize requested Khatyar changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply requested changes
        shell: python {0}
        run: |
          from pathlib import Path
          import json, re
          root=Path('.')

          # Disable the first helper workflow after taking over its work.
          old=root/'.github/workflows/apply-ui-startup-hardening.yml'
          if old.exists(): old.unlink()

          # Android help screen
          help_js=r'''import React from 'react';
import { ScrollView, View, Text, TouchableOpacity, StyleSheet } from 'react-native';
import { C, FONT } from '../theme';
import { faNum } from '../num';
const SECTIONS=[
['شروع کار',['پس از ورود، داشبورد بر اساس نقش و سطح دسترسی شما نمایش داده می‌شود.','در شروع برنامه ابتدا اطلاعات کش و پیکربندی تازه می‌شود و سپس کنترل‌های امنیتی مرحله‌به‌مرحله اجرا می‌شوند.','برای عملیات میدانی، GPS و دسترسی‌های لازم را فعال و آماده نگه دارید.']],
['داشبورد و همگام‌سازی',['چهار کارت آماری بالای داشبورد تعداد رانندگان، خودروها، حضور امروز و چک‌لیست‌های ماه را نشان می‌دهند.','همگام‌سازی اطلاعات آنلاین را تازه می‌کند و درخواست‌های صف‌شده در حالت آفلاین را پس از اتصال ارسال می‌کند.']],
['جستجو و ناوگان',['جستجوی تاکسی و تاکسیران برای یافتن راننده و خودروست.','اطلاعات راننده، خودرو، بدهی، بیمه و معاینه و وضعیت بهره‌برداری از اطلاعات سامانه خوانده می‌شوند.']],
['حضور و عملیات میدانی',['ثبت حضور من برای حضور روزانه است.','حاضرین در خط وضعیت افراد حاضر را نشان می‌دهد.','حضور مسئولین در خط برای ثبت حضور مسئولان است.','مأموریت روزانه من برنامه کار روز را نشان می‌دهد.','برنامه بازدید و پوشش خط برای شروع/پایان بازدید، GPS، تصویر و پوشش است.','ثبت موقعیت و تصویر خطوط برای ثبت دقیق موقعیت ایستگاه و تصاویر محل و تابلوهاست.','ایستگاه‌های ثبت‌شده من سوابق ثبت‌های انجام‌شده را نشان می‌دهد.']],
['گزارش، فرم و تذکر',['ارسال گزارش برای ثبت گزارش و پیوست‌هاست.','فرم‌ها برای تکمیل فرم‌های فعال هستند.','سوابق چک‌لیست و تذکر برای مشاهده و پیگیری استفاده می‌شوند.','گزارشات دریافتی و جزئیات گزارش برای بررسی موارد ارجاعی هستند.']],
['درخواست و شرکت',['درخواست‌ها برای ثبت و پیگیری درخواست‌ها هستند.','تأیید درخواست‌ها فقط برای نقش‌های مجاز فعال است.','ارسال برای شرکت برای ارتباط با شرکت مرتبط است.']],
['پیام و اعلان',['ارسال پیامک، پیامک‌های ارسالی من و ارسال پیام در ربات‌ها ابزارهای ارتباطی هستند.','پیام‌ها و اعلان‌ها برای مشاهده ارتباطات داخلی و هشدارها هستند.']],
['حساب کاربری',['ویرایش اطلاعات من برای اطلاعات تماس، آدرس، تاریخ تولد و امضای پرسنلی است.','فیش‌های حقوقی من، کارکرد من و اشتراک برنامه اطلاعات حساب را نشان می‌دهند.','فعالیت‌های فرهنگی و رفاهیات بر اساس دسترسی نمایش داده می‌شوند.','قفل برنامه، تغییر رمز، تنظیمات اعلان و نقشه در منوی حساب هستند.']],
['امضای پرسنلی',['در ویرایش اطلاعات داخل کادر امضا با انگشت رسم کنید.','دکمه «تمام‌صفحه کردن محل درج امضا» فضای بزرگ‌تری برای ثبت دقیق امضا باز می‌کند.','پس از ثبت، امضا در فرم ذخیره می‌شود؛ پاک کردن برای ثبت امضای جدید است.']],
['آفلاین و امنیت',['در صورت قطع اینترنت، عملیات قابل صف شدن پس از اتصال ارسال می‌شوند.','اگر برنامه از شما خواست دسترسی یا تنظیم امنیتی را اصلاح کنید، آن را انجام دهید و سپس بررسی مجدد را بزنید.']]]
export default function HelpScreen({navigation}){return <ScrollView style={s.wrap} contentContainerStyle={s.content}><View style={s.hero}><Text style={s.brand}>خطیار</Text><Text style={s.title}>راهنمای کامل استفاده از نرم‌افزار</Text><Text style={s.sub}>شرح ابزارها و نحوه استفاده</Text></View>{SECTIONS.map(([h,items])=><View key={h} style={s.card}><Text style={s.section}>{h}</Text>{items.map((x,i)=><View key={i} style={s.item}><Text style={s.num}>{faNum(i+1)}</Text><Text style={s.text}>{x}</Text></View>)}</View>)}<View style={s.about}><Text style={s.aboutTitle}>اطلاعات برنامه</Text><Text style={s.aboutText}>توسعه‌دهنده: علی یوسفی‌پور</Text><Text style={s.aboutText}>شرکت: مبین شات</Text><Text style={s.aboutText}>نام برنامه: خطیار</Text></View><TouchableOpacity style={s.back} onPress={()=>navigation.goBack()}><Text style={s.backText}>بازگشت</Text></TouchableOpacity></ScrollView>}
const s=StyleSheet.create({wrap:{flex:1,backgroundColor:C.paper},content:{padding:14,paddingBottom:40},hero:{backgroundColor:C.brand,borderRadius:20,padding:20,marginBottom:12},brand:{color:'#fff',fontFamily:FONT.bold,fontSize:24,textAlign:'right'},title:{color:'#fff',fontFamily:FONT.bold,fontSize:17,textAlign:'right',marginTop:8},sub:{color:'#d7eee8',fontFamily:FONT.regular,fontSize:12,textAlign:'right',marginTop:6},card:{backgroundColor:'#fff',borderRadius:15,borderWidth:1,borderColor:'#e4e9f2',padding:14,marginBottom:10},section:{color:C.brand,fontFamily:FONT.bold,fontSize:15,textAlign:'right',marginBottom:8},item:{flexDirection:'row-reverse',alignItems:'flex-start',gap:9,paddingVertical:8,borderBottomWidth:1,borderBottomColor:'#f0f2f6'},num:{width:24,height:24,borderRadius:12,backgroundColor:'#e9f7f0',color:C.brand,fontFamily:FONT.bold,fontSize:11,textAlign:'center',paddingTop:4},text:{flex:1,color:'#344054',fontFamily:FONT.regular,fontSize:12.5,lineHeight:22,textAlign:'right'},about:{backgroundColor:'#102033',borderRadius:15,padding:16,marginTop:2},aboutTitle:{color:'#fff',fontFamily:FONT.bold,fontSize:15,textAlign:'right',marginBottom:8},aboutText:{color:'#d7dee9',fontFamily:FONT.regular,fontSize:12,textAlign:'right',lineHeight:24},back:{backgroundColor:C.brand,borderRadius:13,paddingVertical:13,alignItems:'center',marginTop:12},backText:{color:'#fff',fontFamily:FONT.bold,fontSize:14}});
'''
          hp=root/'mobile/src/screens/HelpScreen.js'; hp.parent.mkdir(parents=True,exist_ok=True); hp.write_text(help_js,encoding='utf-8')

          # Navigation and dashboard help entry
          app=root/'mobile/App.js'; t=app.read_text(encoding='utf-8')
          if "from './src/screens/HelpScreen'" not in t:
            t=t.replace("import SetupScreen from './src/screens/SetupScreen';","import SetupScreen from './src/screens/SetupScreen';import HelpScreen from './src/screens/HelpScreen';")
          if 'name="Help"' not in t:
            t=t.replace("<Stack.Screen name=\"Dashboard\" component={DashboardScreen} options={({navigation})=>({title:'داشبورد',headerLeft:()=> <ProfileBtn navigation={navigation}/>})}/>","<Stack.Screen name=\"Dashboard\" component={DashboardScreen} options={({navigation})=>({title:'داشبورد',headerLeft:()=> <ProfileBtn navigation={navigation}/>})}/><Stack.Screen name=\"Help\" component={HelpScreen} options={{title:'راهنمای استفاده'}}/>")
          app.write_text(t,encoding='utf-8')
          dash=root/'mobile/src/screens/DashboardScreen.js'; t=dash.read_text(encoding='utf-8')
          if "t:'راهنمای استفاده'" not in t: t=t.replace('const MENU=[',"const MENU=[{icon3d:ICON3D.activity,t:'راهنمای استفاده',r:'Help',bg:'#e8f3ff',always:true},",1)
          dash.write_text(t,encoding='utf-8')

          # Version consistency
          p=root/'mobile/package.json'; d=json.loads(p.read_text(encoding='utf-8')); d['version']='1.3.74'; d['description']='خطیار — نسخه 1.3.74'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Staged startup security guard: 0s developer-options, +5s GPS, +5s VPN, +5s mock-location.
          guard=r'''import React,{useEffect,useState,useCallback}from'react';
import{View,Text,TouchableOpacity,StyleSheet,Linking,AppState,ScrollView}from'react-native';
import AsyncStorage from'@react-native-async-storage/async-storage';
import*as Location from'expo-location';import*as Notifications from'expo-notifications';import*as Network from'expo-network';
import{C,FONT}from'./theme';import{useAuth}from'./auth';
const CHECK_INTERVAL_MS=60*60*1000,WAIT_MS=5000,BATTERY_KEY='battery_opt_confirmed_v1';
async function checkDev(){try{const{NativeModules}=require('react-native');if(NativeModules?.KhatyarSecurity?.isDeveloperOptionsEnabled)return!!(await NativeModules.KhatyarSecurity.isDeveloperOptionsEnabled())}catch{}return false}
async function checkVpn(){try{const s=await Network.getNetworkStateAsync();return String(s?.type||'').toUpperCase().includes('VPN')}catch{return false}}
async function checkMock(){try{const p=await Location.getCurrentPositionAsync({accuracy:Location.Accuracy.Low,maximumAge:15000});return!!p?.mocked}catch{return false}}
async function checkPerms(){const a=[];try{if((await Location.getForegroundPermissionsAsync()).status!=='granted')a.push({key:'loc',title:'اجازه موقعیت مکانی',action:()=>Location.requestForegroundPermissionsAsync()})}catch{}try{const c=require('expo-camera');if(!(await c.getCameraPermissionsAsync()).granted)a.push({key:'cam',title:'اجازه دوربین',action:()=>c.requestCameraPermissionsAsync()})}catch{}try{if((await Notifications.getPermissionsAsync()).status!=='granted')a.push({key:'notif',title:'اجازه اعلان‌ها',action:()=>Notifications.requestPermissionsAsync()})}catch{}return a}
export default function PermissionGuard({children}){const{user}=useAuth(),exempt=Number(user?.security_exempt||0)===1||user?.security_exempt===true;const[stage,setStage]=useState('در حال آماده‌سازی'),[issues,setIssues]=useState([]),[ready,setReady]=useState(false),[battery,setBattery]=useState(true);const run=useCallback(async()=>{if(exempt){setReady(true);return}setReady(false);setIssues([]);setStage('بررسی خاموش بودن Developer Options');if(await checkDev())setIssues(x=>[...x,{key:'dev',title:'گزینه‌های توسعه‌دهنده فعال است',detail:'Developer options را خاموش کنید.'}]);await new Promise(r=>setTimeout(r,WAIT_MS));setStage('بررسی روشن بودن GPS');if(!(await Location.hasServicesEnabledAsync().catch(()=>true)))setIssues(x=>[...x,{key:'gps',title:'GPS / موقعیت‌یابی خاموش است',detail:'موقعیت‌یابی دستگاه را روشن کنید.'}]);await new Promise(r=>setTimeout(r,WAIT_MS));setStage('بررسی خاموش بودن VPN');if(await checkVpn())setIssues(x=>[...x,{key:'vpn',title:'VPN فعال است',detail:'VPN را خاموش کنید.'}]);await new Promise(r=>setTimeout(r,WAIT_MS));setStage('بررسی غیرفعال بودن موقعیت جعلی');if(await checkMock())setIssues(x=>[...x,{key:'mock',title:'موقعیت جعلی فعال است',detail:'Mock/Fake Location را غیرفعال کنید.'}]);const p=await checkPerms();if(p.length)setIssues(x=>[...x,...p]);setBattery(!!(await AsyncStorage.getItem(BATTERY_KEY).catch(()=>null)));setStage('پایان بررسی');setReady(true)},[exempt]);useEffect(()=>{run();const iv=setInterval(run,CHECK_INTERVAL_MS);const sub=AppState.addEventListener('change',s=>s==='active'&&run());return()=>{clearInterval(iv);sub.remove()}},[run]);if(!ready)return <View style={s.overlay}><Text style={s.title}>{stage}</Text><Text style={s.sub}>بررسی‌ها با فاصله ۵ ثانیه‌ای انجام می‌شوند تا فشار پردازشی دستگاه کاهش یابد.</Text></View>;if(issues.length)return <View style={s.overlay}><ScrollView contentContainerStyle={s.box}><Text style={s.icon}>⚠</Text><Text style={s.title}>بررسی امنیتی نیاز به اقدام دارد</Text>{issues.map(i=><View key={i.key} style={s.row}><View style={{flex:1}}><Text style={s.rowTxt}>{i.title}</Text><Text style={s.detail}>{i.detail||''}</Text></View>{i.action&&<TouchableOpacity style={s.btn} onPress={async()=>{try{await i.action()}catch{}run()}}><Text style={s.btnTxt}>فعال‌سازی</Text></TouchableOpacity>}</View>)}<TouchableOpacity style={s.recheck} onPress={run}><Text style={s.btnTxt}>بررسی مجدد</Text></TouchableOpacity></ScrollView></View>;if(!battery)return <View style={s.overlay}><Text style={s.icon}>🔋</Text><Text style={s.title}>بهینه‌سازی باتری</Text><Text style={s.sub}>برای اجرای پایدار در پس‌زمینه، محدودیت باتری را برای برنامه بردارید.</Text><TouchableOpacity style={s.btn2} onPress={()=>Linking.openSettings()}><Text style={s.btnTxt}>رفتن به تنظیمات</Text></TouchableOpacity><TouchableOpacity style={[s.btn2,{backgroundColor:C.brand}]} onPress={async()=>{await AsyncStorage.setItem(BATTERY_KEY,'1');setBattery(true)}}><Text style={s.btnTxt}>تأیید و ادامه</Text></TouchableOpacity></View>;return <>{children}</>}
const s=StyleSheet.create({overlay:{flex:1,backgroundColor:'#0e141f'},box:{padding:22,paddingTop:56,alignItems:'center'},icon:{fontSize:50,marginBottom:10},title:{fontFamily:FONT.bold,color:'#fff',fontSize:17,textAlign:'center',marginBottom:8},sub:{fontFamily:FONT.regular,color:'#aab4c5',fontSize:13,textAlign:'center',lineHeight:23,marginBottom:18},row:{backgroundColor:'#18202e',borderRadius:14,padding:14,width:'100%',marginBottom:10,flexDirection:'row-reverse',alignItems:'center',gap:10},rowTxt:{fontFamily:FONT.bold,color:'#fff',fontSize:13},detail:{fontFamily:FONT.regular,color:'#aab4c5',fontSize:11,marginTop:4,textAlign:'right'},btn:{backgroundColor:C.brand,borderRadius:9,paddingVertical:8,paddingHorizontal:13},btn2:{backgroundColor:'#2a3445',borderRadius:10,paddingVertical:13,paddingHorizontal:24,width:'100%',alignItems:'center',marginTop:10},btnTxt:{fontFamily:FONT.bold,color:'#fff',fontSize:13},recheck:{marginTop:14,backgroundColor:'#2a3445',borderRadius:10,paddingVertical:11,paddingHorizontal:28}});
'''
          (root/'mobile/src/PermissionGuard.js').write_text(guard,encoding='utf-8')

          # Splash startup: display version while StartupGate is active.
          st=root/'mobile/src/StartupGate.js'; t=st.read_text(encoding='utf-8')
          if "from 'expo-constants'" not in t:t=t.replace("import { faNum } from './num';","import { faNum } from './num';\nimport Constants from 'expo-constants';")
          if 'const versionLabel' not in t:t=t.replace("const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';","const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';\nconst versionLabel = String(Constants.expoConfig?.version || '1.3.74');")
          if '<Text style={s.version}>' not in t:t=t.replace('<Text style={s.phase}>{phase}</Text>','<Text style={s.version}>نسخه {faNum(versionLabel)}</Text><Text style={s.phase}>{phase}</Text>')
          if 'version: {' not in t:t=t.replace('phase: { marginTop: 10,','version: { marginTop: 7, color: \'#d7eee8\', fontFamily: FONT.regular, fontSize: 11, textAlign: \'center\' },\n  phase: { marginTop: 6,')
          st.write_text(t,encoding='utf-8')

          # Fullscreen signature pad.
          acc=root/'mobile/src/screens/AccountScreens.js'; t=acc.read_text(encoding='utf-8')
          t=t.replace('View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder','View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder, Modal')
          pattern=re.compile(r'function SignaturePad\(\{ value, onChange \}\) \{.*?\n\}\n\nexport function EditProfileScreen',re.S)
          repl=r'''function SignaturePad({ value, onChange }) {
  const padRef=useRef(null),[points,setPoints]=useState([]),[full,setFull]=useState(false),last=useRef(null);
  const pan=useRef(PanResponder.create({onStartShouldSetPanResponder:()=>true,onMoveShouldSetPanResponder:()=>true,onPanResponderGrant:e=>{const{x,y}=e.nativeEvent;last.current={x,y};setPoints(a=>[...a,{x,y}])},onPanResponderMove:e=>{const{x,y}=e.nativeEvent,a=last.current;if(!a)return;const dx=x-a.x,dy=y-a.y,d=Math.max(1,Math.ceil(Math.sqrt(dx*dx+dy*dy)/3)),seg=[];for(let i=1;i<=d;i++)seg.push({x:a.x+dx*i/d,y:a.y+dy*i/d});last.current={x,y};setPoints(p=>[...p,...seg])},onPanResponderRelease:()=>{last.current=null},onPanResponderTerminate:()=>{last.current=null}})).current;
  const clear=()=>{setPoints([]);onChange(null)};const save=async()=>{if(!points.length)return Alert.alert('امضا','ابتدا امضای خود را رسم کنید.');try{const uri=await captureRef(padRef,{format:'png',quality:1,result:'data-uri'});onChange(uri);setFull(false);Alert.alert('امضا','امضا آماده ذخیره است.')}catch{Alert.alert('خطا','ذخیره تصویر امضا انجام نشد.')}};
  const pad=<View ref={padRef} collapsable={false} style={[s.signaturePad,full&&s.signaturePadFull]} {...pan.panHandlers}>{points.map((p,i)=><View key={i} pointerEvents="none" style={[s.signatureDot,{left:p.x-2,top:p.y-2}]}/>)}</View>;
  return <View style={s.signatureBox}><Text style={s.zoneTitle}>امضای پرسنلی</Text><Text style={s.zoneHint}>امضای خود را با انگشت داخل کادر رسم کنید.</Text>{value&&!points.length?<Image source={{uri:value}} style={s.signaturePreview} resizeMode="contain"/>:null}{pad}<View style={{flexDirection:'row-reverse',gap:8}}><TouchableOpacity style={[s.btn,{flex:1,marginTop:10}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,marginTop:10,backgroundColor:'#6b7280'}]} onPress={clear}><Text style={s.btnTxt}>پاک کردن</Text></TouchableOpacity></View><TouchableOpacity style={[s.btn,{marginTop:10,backgroundColor:'#173b61'}]} onPress={()=>setFull(true)}><Text style={s.btnTxt}>تمام‌صفحه کردن محل درج امضا</Text></TouchableOpacity><Modal visible={full} animationType="slide" onRequestClose={()=>setFull(false)}><View style={s.fullWrap}><View style={s.fullHead}><Text style={s.fullTitle}>ثبت امضا در حالت تمام‌صفحه</Text><TouchableOpacity onPress={()=>setFull(false)}><Text style={s.fullClose}>بستن</Text></TouchableOpacity></View><Text style={s.fullHint}>با انگشت امضای خود را در فضای بزرگ رسم کنید.</Text>{pad}<View style={s.fullActions}><TouchableOpacity style={[s.btn,{flex:1}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,backgroundColor:'#6b7280'}]} onPress={clear}><Text style={s.btnTxt}>پاک کردن</Text></TouchableOpacity></View></View></Modal></View>;
}

export function EditProfileScreen'''
          t2=pattern.sub(repl,t,count=1)
          if t2==t: print('signature pattern not found')
          else:t=t2
          if 'signaturePadFull:' not in t:t=t.replace('signaturePad:',"signaturePadFull:{flex:1,minHeight:260,borderWidth:2,borderColor:CC.brand,borderStyle:'dashed',borderRadius:16,backgroundColor:'#fff',marginTop:14,position:'relative'},signaturePad:")
          if 'fullWrap:' not in t:
            idx=t.rfind('});'); t=t[:idx]+",fullWrap:{flex:1,backgroundColor:CC.paper,padding:16,paddingTop:28},fullHead:{flexDirection:'row-reverse',justifyContent:'space-between',alignItems:'center'},fullTitle:{fontFamily:FONT.bold,color:CC.ink,fontSize:16},fullClose:{fontFamily:FONT.bold,color:CC.brand,fontSize:13},fullHint:{fontFamily:FONT.regular,color:CC.muted,fontSize:12,textAlign:'right',marginTop:8},fullActions:{flexDirection:'row-reverse',gap:8,marginTop:12}"+t[idx:]
          acc.write_text(t,encoding='utf-8')

          # Web parity/help: same Android help entry and menu-oriented guidance.
          web=root/'php/app/app-parity.js'; t=web.read_text(encoding='utf-8')
          if 'راهنمای استفاده' not in t:t=t.replace('const items=[',"const items=[['ℹ','راهنمای استفاده','help'],",1)
          if 'function showHelp' not in t:
            anchor='function tool(n){'
            fn="function showHelp(){css();const body=document.getElementById('body');if(!body)return;const old=document.getElementById('kh-help');if(old){old.scrollIntoView({behavior:'smooth'});return}const root=document.createElement('section');root.id='kh-help';root.className='kh-parity';const ss=[['شروع کار',['ورود، داشبورد نقش‌محور و همگام‌سازی اطلاعات.','در شروع، کش قبل از کنترل‌های امنیتی تازه می‌شود.']],['عملیات میدانی',['حضور، حاضرین خط، مأموریت، بازدید و پوشش، ثبت موقعیت و تصاویر ایستگاه.']],['گزارش و ارتباطات',['گزارش، فرم، درخواست، پیامک، ربات، پیام و اعلان.']],['حساب کاربری',['ویرایش اطلاعات، امضای پرسنلی، فیش، کارکرد، اشتراک و تنظیمات.']],['امضای پرسنلی',['در ویرایش اطلاعات از گزینه تمام‌صفحه برای فضای بیشتر استفاده کنید.']]];root.innerHTML='<div class=\"kh-parity-card\" style=\"display:block\"><div class=\"kh-parity-title\">راهنمای کامل استفاده از خطیار</div>'+ss.map(x=>'<div class=\"kh-ls-card\"><b>'+esc(x[0])+'</b>'+x[1].map(y=>'<div class=\"kh-ls-status\">'+esc(y)+'</div>').join('')+'</div>').join('')+'<div class=\"kh-ls-card\"><b>اطلاعات برنامه</b><div class=\"kh-ls-status\">توسعه‌دهنده: علی یوسفی‌پور</div><div class=\"kh-ls-status\">شرکت: مبین شات</div></div></div>';body.appendChild(root);root.scrollIntoView({behavior:'smooth'})}"
            t=t.replace(anchor,fn+anchor)
            t=t.replace("if(r&&typeof nav==='function')nav(r.dataset.route);","if(r&&r.dataset.route==='help'){showHelp();return;}if(r&&typeof nav==='function')nav(r.dataset.route);")
          web.write_text(t,encoding='utf-8')

          # Static parity audit
          routes=set(re.findall(r'<Stack\.Screen name="([^"]+)"',(root/'mobile/App.js').read_text(encoding='utf-8')))
          menu=set(re.findall(r"r:'([^']+)'",(root/'mobile/src/screens/DashboardScreen.js').read_text(encoding='utf-8')))
          missing=sorted(x for x in menu if x not in routes)
          report=['# Khatyar UI parity and integration audit','',f'- Android dashboard menu entries: {len(menu)}',f'- Registered navigation screens: {len(routes)}',f'- Menu entries without navigation screen: {len(missing)}']
          if missing: report += ['']+[f'- `{x}`' for x in missing]
          report += ['', '### Runtime verification requirement', 'Static verification confirms route wiring and source-level API integration. Real backend/DB verification requires running the app against the configured server; no production data is modified by this audit.','', '### Implemented', '- Android/Web help guide', '- staged startup checks with 5-second intervals', '- splash version label', '- developer/company metadata', '- fullscreen signature capture', '- Android-oriented Web parity entry']
          (root/'PROJECT_UI_PARITY_AUDIT.md').write_text('\n'.join(report)+'\n',encoding='utf-8')

      - name: Validate syntax
        run: |
          node --check mobile/App.js
          node --check mobile/src/PermissionGuard.js
          node --check mobile/src/StartupGate.js
          node --check mobile/src/screens/HelpScreen.js
          node --check mobile/src/screens/DashboardScreen.js
          node --check mobile/src/screens/AccountScreens.js
          node --check php/app/app-parity.js
          node -e "JSON.parse(require('fs').readFileSync('mobile/package.json','utf8')); console.log('JSON OK')"

      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add help, staged startup checks, fullscreen signature and Android web parity"
          git push
