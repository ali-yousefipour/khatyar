name: Radio UI sync fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-sync-ui-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const path = 'mobile/src/screens/RadioScreen.js';
            const f = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            const text = Buffer.from(f.data.content, 'base64').toString('utf8');
            let out = text;
            const old1 = 'recording,status,lastMessage,maxTalkMs,loading,loadError,setEnabled,setChannel,startTalk,stopTalk,reloadChannels,playRecentMessage,playingMessageId}=useRadio();';
            const new1 = 'recording,status,lastMessage,recentMessages,maxTalkMs,loading,loadError,setEnabled,setChannel,startTalk,stopTalk,reloadChannels,playRecentMessage,playingMessageId}=useRadio();';
            if (!out.includes(old1)) throw new Error('useRadio destructuring marker not found');
            out = out.replace(old1, new1);
            const marker = 'useEffect(()=>{if(!radioNative?.isPlaybackActive)return;';
            const idx = out.indexOf(marker);
            if (idx < 0) throw new Error('native playback effect marker not found');
            const end = out.indexOf('},[radioNative]);', idx);
            if (end < 0) throw new Error('native playback effect end not found');
            const insertAt = end + '},[radioNative]);'.length;
            const sync = 'useEffect(()=>{if(Array.isArray(recentMessages)&&recentMessages.length)setRecent(recentMessages.slice(0,3));},[recentMessages]);';
            if (!out.includes(sync)) out = out.slice(0, insertAt) + sync + out.slice(insertAt);
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha:f.data.sha,message:'fix(radio): sync three-message panel with RadioContext',content:Buffer.from(out,'utf8').toString('base64')});
            const wfPath = '.github/workflows/radio-sync-ui-fix.yml';
            const wf = await github.rest.repos.getContent({owner, repo, path:wfPath, ref:'main'});
            await github.rest.repos.deleteFile({owner,repo,path:wfPath,branch:'main',sha:wf.data.sha,message:'chore(radio): remove one-time UI sync workflow'});