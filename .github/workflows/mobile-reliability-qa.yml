name: Mobile Reliability QA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/src/**'
      - 'mobile/App.js'
      - 'mobile/scripts/test-mobile-reliability.cjs'
      - 'mobile/scripts/test-native-fontscale-policy.cjs'
      - 'mobile/scripts/test-route-grant-scope.cjs'
      - 'mobile/scripts/test-role-app-items-contract.cjs'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/mobile-reliability-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-reliability-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: mobile
      - name: Test offline reliability and permissions
        run: npm run test:reliability
        working-directory: mobile
      - name: Enforce scalable fonts and identity-scoped navigation access
        run: |
          node scripts/test-native-fontscale-policy.cjs
          node scripts/test-route-grant-scope.cjs
          node scripts/test-role-app-items-contract.cjs
        working-directory: mobile
      - name: Verify Babel and React Native syntax
        run: npm run validate:babel
        working-directory: mobile
      - name: Radio transport regression checks
        run: |
          node scripts/test-radio-connection-recovery.cjs
          node scripts/test-radio-live.cjs
        working-directory: mobile
      - name: Android JavaScript bundle compilation
        run: npx expo export --platform android --output-dir ../.build-temp/android-qa
        working-directory: mobile
