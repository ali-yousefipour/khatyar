name: one-time-radio-final-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(radio): final recent list and RTL repair') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch radio files through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function getFile(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              const item = Array.isArray(r.data) ? r.data[0] : r.data;
              return {
                sha: item.sha,
                text: Buffer.from(item.content, 'base64').toString('utf8'),
              };
            }

            async function putFile(path, sha, text, message) {
              return github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                message,
                content: Buffer.from(text, 'utf8').toString('base64'),
                sha,
              });
            }

            const rcPath = 'mobile/src/radio/RadioContext.js';
            const rcFile = await getFile(rcPath);
            let rc = rcFile.text;

            const recentBlock = `const sortRecentMessages=list=>{const map=new Map();for(const m of(Array.isArray(list)?list:[])){if(m&&m.id!=null)map.set(String(m.id),m)}return Array.from(map.values()).sort((a,b)=>{const ta=Date.parse(String(a?.created_at||'').replace(' ','T'))||0,tb=Date.parse(String(b?.created_at||'').replace(' ','T'))||0;return tb-ta||Number(b?.id||0)-Number(a?.id||0)}).slice(0,3)};const loadRecentMessages=async()=>{if(!user?.id||!channelRef.current)return;const requestedChannel=Number(channelRef.current);try{const cr=await request('/radio-api-v2.php?op=channels',{noStore:true});if(!mountedRef.current||requestedChannel!==Number(channelRef.current))return;const fresh=extractChannels(cr),current=fresh.find(x=>Number(x.id)===requestedChannel),serverLast=Number(current?.last_message_id||0),anchor=Math.max(0,serverLast-50);const r=await request(\`/radio-api-v2.php?op=poll&channel_id=\${requestedChannel}&after=\${anchor}\`,{noStore:true});if(!mountedRef.current||requestedChannel!==Number(channelRef.current))return;const list=Array.isArray(r?.messages)?r.messages:[],latest=sortRecentMessages(list);if(latest.length){lastIdRef.current=Math.max(lastIdRef.current,serverLast,...latest.map(m=>Number(m?.id||0)));setRecentMessages(prev=>sortRecentMessages([...latest,...prev]))}}catch(e){}}`;

            const blockRe = /const sortRecentMessages=.*?;const apply=/s;
            if (!blockRe.test(rc)) core.setFailed('RadioContext recent-message block not found');
            else {
              rc = rc.replace(blockRe, recentBlock + ';const apply=');
              const channelNeedle = "setChannelIdState(cid);channelRef.current=cid;lastIdRef.current=Number(c.last_message_id||0);";
              const channelReplacement = "setChannelIdState(cid);channelRef.current=cid;setRecentMessages([]);lastIdRef.current=Number(c.last_message_id||0);";
              if (!rc.includes(channelNeedle)) core.setFailed('RadioContext setChannel anchor not found');
              else rc = rc.replace(channelNeedle, channelReplacement);
            }

            if (rc.includes("setRecentMessages([])}catch(e){if(mountedRef.current)setRecentMessages([])}};const apply=")) {
              core.setFailed('Old recent-message error clearing path remains');
            }

            await putFile(rcPath, rcFile.sha, rc, 'fix(radio): final recent list and RTL repair');

            const rsPath = 'mobile/src/screens/RadioScreen.js';
            const rsFile = await getFile(rsPath);
            let rs = rsFile.text;
            rs = rs.replace(/textAlign:'right'/g, "textAlign:'right',writingDirection:'rtl'");
            rs = rs.replace("label:{fontFamily", "label:{alignSelf:'stretch',fontFamily");
            rs = rs.replace("caption:{fontFamily", "caption:{alignSelf:'stretch',fontFamily");
            rs = rs.replace("selected:{fontFamily", "selected:{alignSelf:'stretch',fontFamily");
            rs = rs.replace("error:{fontFamily", "error:{alignSelf:'stretch',fontFamily");
            rs = rs.replace("hint:{fontFamily", "hint:{alignSelf:'stretch',fontFamily");
            rs = rs.replace("dropdown:{position:'absolute'", "dropdown:{position:'absolute',direction:'rtl'");
            rs = rs.replace("content:{padding:14,paddingBottom:40,direction:'rtl'}", "content:{padding:14,paddingBottom:40,direction:'rtl',alignItems:'stretch'}");
            await putFile(rsPath, rsFile.sha, rs, 'fix(radio): final recent list and RTL repair');

            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: '.github/workflows/one-time-radio-final-fix.yml',
              branch,
              sha: (await getFile('.github/workflows/one-time-radio-final-fix.yml')).sha,
              message: 'chore: remove one-time radio repair workflow'
            });
