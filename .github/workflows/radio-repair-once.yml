name: Radio final repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[radio-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply radio fixes
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing target in {path}: {old[:160]}')
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(s, encoding='utf-8')

          patch('mobile/src/screens/RadioScreen.js', [
              ("import React,{useEffect,useRef,useState}from'react';import{View,Text,TouchableOpacity,Pressable,StyleSheet,ScrollView,Modal}from'react-native';",
               "import React,{useEffect,useRef,useState}from'react';import{View,Text,TouchableOpacity,Pressable,StyleSheet,ScrollView,Modal,NativeModules}from'react-native';"),
              ("const[recent,setRecent]=useState([]);const[playbackLockUntil,setPlaybackLockUntil]=useState(0);",
               "const[recent,setRecent]=useState([]);const[playbackLockUntil,setPlaybackLockUntil]=useState(0);const[nativePlayback,setNativePlayback]=useState(false);const radioNative=NativeModules?.KhatyarRadio;"),
              ("const playbackBusy=!!playingMessageId||playbackLockUntil>0;",
               "const playbackBusy=!!playingMessageId||nativePlayback||playbackLockUntil>0;"),
              ("useEffect(()=>{if(!lastMessage?.id||!lastMessage?.duration_ms){if(lastMessage?.id)setPlaybackLockUntil(0);return}const until=Date.now()+Math.max(1200,Number(lastMessage.duration_ms)+800);setPlaybackLockUntil(until);const t=setTimeout(()=>setPlaybackLockUntil(0),Math.max(1200,Number(lastMessage.duration_ms)+850));return()=>clearTimeout(t)},[lastMessage?.id,lastMessage?.duration_ms]);",
               "useEffect(()=>{if(!lastMessage?.id||!lastMessage?.duration_ms){if(lastMessage?.id)setPlaybackLockUntil(0);return}const until=Date.now()+Math.max(1200,Number(lastMessage.duration_ms)+800);setPlaybackLockUntil(until);const t=setTimeout(()=>setPlaybackLockUntil(0),Math.max(1200,Number(lastMessage.duration_ms)+850));return()=>clearTimeout(t)},[lastMessage?.id,lastMessage?.duration_ms]);useEffect(()=>{if(!radioNative?.isPlaybackActive)return;let alive=true;const check=async()=>{try{const active=await radioNative.isPlaybackActive();if(alive)setNativePlayback(!!active)}catch(_){}};check();const t=setInterval(check,250);return()=>{alive=false;clearInterval(t)}},[radioNative]);"),
              ("const sp=r?.speaker_id?{id:Number(r.speaker_id),name:r.speaker_name||'کاربر در حال صحبت',role:r.speaker_role||''}:null;setLive({busy:!!r?.busy,speaker:sp});await loadRecent()",
               "const sp=r?.speaker_id?{id:Number(r.speaker_id),name:r.speaker_name||'کاربر در حال صحبت',role:r.speaker_role||''}:null;setLive({busy:!!r?.busy,speaker:sp});if(Array.isArray(r?.messages)){const rows=r.messages.slice().sort((a,b)=>Number(b?.id||0)-Number(a?.id||0)).slice(0,3);setRecent(rows)}"),
          ])

          patch('mobile/src/radio/RadioContext.js', [
              ("const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};",
               "const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const RADIO_SQUELCH_DELAY_MS=900;const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};"),
              ("await FileSystem.downloadAsync(url,target,{headers:token?{Authorization:`Bearer ${token}`}:{}});playSfx(squelchPlayer);await new Promise(r=>setTimeout(r,260));const p=createAudioPlayer(target);p.play();",
               "await FileSystem.downloadAsync(url,target,{headers:token?{Authorization:`Bearer ${token}`}:{}});playSfx(squelchPlayer);await new Promise(r=>setTimeout(r,RADIO_SQUELCH_DELAY_MS));const p=createAudioPlayer(target);p.play();"),
          ])

          patch('mobile/plugins/khatyar-radio-native/KhatyarRadioModule.java', [
              ('@ReactMethod public void addListener(String eventName){}', '@ReactMethod public void addListener(String eventName){}\n  @ReactMethod public void isPlaybackActive(Promise promise){try{promise.resolve(context.getSharedPreferences(KhatyarRadioService.PREFS,Context.MODE_PRIVATE).getBoolean("playbackActive",false));}catch(Throwable e){promise.resolve(false);}}'),
          ])

          patch('mobile/plugins/khatyar-radio-native/KhatyarRadioService.java', [
              ('private boolean destroyed = false;', 'private boolean destroyed = false;\n\n  private boolean playbackActive() { return getPrefs().getBoolean("playbackActive", false); }\n  private void setPlaybackActive(boolean active) { try { getPrefs().edit().putBoolean("playbackActive", active).apply(); } catch (Throwable ignored) {} }'),
              ('getPrefs().edit().putLong("sessionStartedAt", serviceStartedAt).putBoolean("initialized", false).apply();', 'getPrefs().edit().putLong("sessionStartedAt", serviceStartedAt).putBoolean("initialized", false).putBoolean("playbackActive", false).apply();'),
              ('if (!getPrefs().getBoolean("enabled", false) || getPrefs().getLong("channelId", 0L) <= 0) return;', 'if (!getPrefs().getBoolean("enabled", false) || getPrefs().getLong("channelId", 0L) <= 0 || playbackActive() || player != null) return;'),
              ('player.setDataSource(this, android.net.Uri.parse(audioUrl), headers);', 'player.setDataSource(this, android.net.Uri.parse(audioUrl), headers);\n      setPlaybackActive(true);'),
              ('player.setOnCompletionListener(mp -> { try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; });', 'player.setOnCompletionListener(mp -> { setPlaybackActive(false); try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; });'),
              ('player.setOnErrorListener((mp, what, extra) -> { try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; return true; });', 'player.setOnErrorListener((mp, what, extra) -> { setPlaybackActive(false); try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; return true; });'),
              ('} catch (Throwable ignored) {}\n  }\n\n  @Override public void onDestroy()', '} catch (Throwable ignored) { setPlaybackActive(false); }\n  }\n\n  @Override public void onDestroy()'),
              ('if (player != null) { try { player.release(); } catch (Throwable ignored) {} player = null; }\n    super.onDestroy();', 'if (player != null) { try { player.release(); } catch (Throwable ignored) {} player = null; } setPlaybackActive(false);\n    super.onDestroy();'),
          ])

          patch('mobile/plugins/withRadioPtt.js', [
              ('if (!prefs.getBoolean("enabled", false) || prefs.getLong("channelId", 0L) <= 0L) return false;', 'if (!prefs.getBoolean("enabled", false) || prefs.getLong("channelId", 0L) <= 0L || prefs.getBoolean("playbackActive", false)) return false;'),
              ('const action = if (event.action == KeyEvent.ACTION_DOWN) "down" else "up"\n    emit(context, action, "headset")', 'const action = if (event.action == KeyEvent.ACTION_DOWN) "down" else "up"\n    if (!volumePttAllowed(context)) return\n    emit(context, action, "headset")'),
          ])

          p=Path('.github/workflows/radio-repair-once.yml')
          p.unlink()
      - name: Commit repaired radio code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/screens/RadioScreen.js mobile/src/radio/RadioContext.js mobile/plugins/khatyar-radio-native/KhatyarRadioModule.java mobile/plugins/khatyar-radio-native/KhatyarRadioService.java mobile/plugins/withRadioPtt.js .github/workflows/radio-repair-once.yml
          git diff --cached --check
          git commit -m "fix(radio): lock PTT during playback and show latest three [radio-repair]"
          git push origin main
