name: Radio one-time repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch radio files
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              original=s
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing target in {path}: {old[:120]}')
                  s=s.replace(old,new,1)
              if s==original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(s,encoding='utf-8')

          patch('mobile/src/screens/RadioScreen.js', [
            ("const loadRecent=async()=>{if(!user?.id||!channelId)return;try{const r=await request(`/radio-api-v2.php?op=responsible-recent&channel_id=${channelId}`,{noStore:true});const rows=Array.isArray(r?.messages)?r.messages:[];setRecent(rows.slice(0,3))}catch(_){setRecent([])}};const poll=async()=>{if(!user?.id||!enabled||!channelId||pollBusyRef.current)return;pollBusyRef.current=true;try{const r=await request(`/radio-api-v2.php?op=poll&channel_id=${channelId}&after=0`,{noStore:true});const sp=r?.speaker_id?{id:Number(r.speaker_id),name:r.speaker_name||'کاربر در حال صحبت',role:r.speaker_role||''}:null;setLive({busy:!!r?.busy,speaker:sp});await loadRecent()}catch(_){ }finally{pollBusyRef.current=false}};",
             "const loadRecent=async()=>{if(!user?.id||!channelId)return;try{const r=await request(`/radio-api-v2.php?op=poll&channel_id=${channelId}&after=0`,{noStore:true});const rows=Array.isArray(r?.messages)?r.messages.slice().sort((a,b)=>Number(b?.id||0)-Number(a?.id||0)).slice(0,3):[];setRecent(rows)}catch(_){setRecent([])}};const poll=async()=>{if(!user?.id||!enabled||!channelId||pollBusyRef.current)return;pollBusyRef.current=true;try{const r=await request(`/radio-api-v2.php?op=poll&channel_id=${channelId}&after=0`,{noStore:true});const sp=r?.speaker_id?{id:Number(r.speaker_id),name:r.speaker_name||'کاربر در حال صحبت',role:r.speaker_role||''}:null;setLive({busy:!!r?.busy,speaker:sp});if(Array.isArray(r?.messages)){const rows=r.messages.slice().sort((a,b)=>Number(b?.id||0)-Number(a?.id||0)).slice(0,3);setRecent(rows)}}catch(_){ }finally{pollBusyRef.current=false}};"),
          ])

          patch('mobile/src/radio/RadioContext.js', [
            ("const enabledRef=useRef(true),channelRef=useRef(0),lastIdRef=useRef(0),pollingRef=useRef(false),mountedRef=useRef(true),recordingRef=useRef(false),limitRef=useRef(DEFAULT_TALK_MS),talkStartRef=useRef(0),autoStoppedRef=useRef(false),pttReleaseTimerRef=useRef(null),pttDownRef=useRef(false),talkGenerationRef=useRef(0),pttInputGenerationRef=useRef(0);",
             "const enabledRef=useRef(true),channelRef=useRef(0),lastIdRef=useRef(0),pollingRef=useRef(false),mountedRef=useRef(true),recordingRef=useRef(false),limitRef=useRef(DEFAULT_TALK_MS),talkStartRef=useRef(0),autoStoppedRef=useRef(false),pttReleaseTimerRef=useRef(null),pttDownRef=useRef(false),talkGenerationRef=useRef(0),pttInputGenerationRef=useRef(0),playingRef=useRef(0);"),
            ("const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};useEffect(()=>{enabledRef.current=enabled},[enabled]);",
             "const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};useEffect(()=>{enabledRef.current=enabled},[enabled]);useEffect(()=>{playingRef.current=playingMessageId},[playingMessageId]);useEffect(()=>{if(!NATIVE)return;const sub=DeviceEventEmitter.addListener('khatyarRadioPlayback',event=>{if(!mountedRef.current)return;if(event?.playing)setPlayingMessageId(-1);else setPlayingMessageId(0)});return()=>{try{sub.remove()}catch(_){} }},[NATIVE]);"),
            ("await FileSystem.downloadAsync(url,target,{headers:token?{Authorization:`Bearer ${token}`}:{}});playSfx(squelchPlayer);await new Promise(r=>setTimeout(r,260));const p=createAudioPlayer(target);p.play();if(mountedRef.current){setLastMessage(message);setPlayingMessageId(Number(message.id)||0)}",
             "await FileSystem.downloadAsync(url,target,{headers:token?{Authorization:`Bearer ${token}`}:{}});if(mountedRef.current){setLastMessage(message);setPlayingMessageId(Number(message.id)||0)}playSfx(squelchPlayer);await new Promise(r=>setTimeout(r,900));const p=createAudioPlayer(target);p.play();"),
            ("const loadRecentMessages=async()=>{if(!user?.id||!channelRef.current)return;try{const r=await request(`/radio-api-v2.php?op=responsible-recent&channel_id=${channelRef.current}`,{noStore:true});if(mountedRef.current)setRecentMessages(Array.isArray(r?.messages)?r.messages:[])}catch(e){if(mountedRef.current)setRecentMessages([])}};",
             "const loadRecentMessages=async()=>{if(!user?.id||!channelRef.current)return;try{const r=await request(`/radio-api-v2.php?op=poll&channel_id=${channelRef.current}&after=0`,{noStore:true});const rows=Array.isArray(r?.messages)?r.messages.slice().sort((a,b)=>Number(b?.id||0)-Number(a?.id||0)).slice(0,3):[];if(mountedRef.current)setRecentMessages(rows)}catch(e){if(mountedRef.current)setRecentMessages([])}};"),
            ("const startTalk=async()=>{if(pttReleaseTimerRef.current){clearTimeout(pttReleaseTimerRef.current);pttReleaseTimerRef.current=null}const inputGeneration=++pttInputGenerationRef.current;pttDownRef.current=true;if(recordingRef.current)return;",
             "const startTalk=async()=>{if(pttReleaseTimerRef.current){clearTimeout(pttReleaseTimerRef.current);pttReleaseTimerRef.current=null}const inputGeneration=++pttInputGenerationRef.current;pttDownRef.current=true;if(playingRef.current)return;if(recordingRef.current)return;"),
          ])

          patch('mobile/plugins/khatyar-radio-native/KhatyarRadioModule.java', [
            ('public static final String ACTION_PTT="ir.mashhad.taxicontrol.radio.PTT";', 'public static final String ACTION_PTT="ir.mashhad.taxicontrol.radio.PTT";\n  public static final String ACTION_PLAYBACK="ir.mashhad.taxicontrol.radio.PLAYBACK";'),
            ('this.context=context;IntentFilter f=new IntentFilter(ACTION_PTT);if(Build.VERSION.SDK_INT>=33)context.registerReceiver(receiver,f,Context.RECEIVER_NOT_EXPORTED);else context.registerReceiver(receiver,f);', 'this.context=context;IntentFilter f=new IntentFilter();f.addAction(ACTION_PTT);f.addAction(ACTION_PLAYBACK);if(Build.VERSION.SDK_INT>=33)context.registerReceiver(receiver,f,Context.RECEIVER_NOT_EXPORTED);else context.registerReceiver(receiver,f);'),
            ('if(!ACTION_PTT.equals(i.getAction()))return;WritableMap map=Arguments.createMap();map.putString("source",i.getStringExtra("source"));map.putBoolean("down",i.getBooleanExtra("down",false));emit(EVENT_PTT,map);', 'if(ACTION_PLAYBACK.equals(i.getAction())){WritableMap map=Arguments.createMap();map.putBoolean("playing",i.getBooleanExtra("playing",false));map.putDouble("messageId",i.getLongExtra("messageId",-1L));emit("khatyarRadioPlayback",map);return;}if(!ACTION_PTT.equals(i.getAction()))return;WritableMap map=Arguments.createMap();map.putString("source",i.getStringExtra("source"));map.putBoolean("down",i.getBooleanExtra("down",false));emit(EVENT_PTT,map);'),
          ])

          patch('mobile/plugins/khatyar-radio-native/KhatyarRadioService.java', [
            ('private boolean destroyed = false;', 'private boolean destroyed = false;\n\n  private void broadcastPlayback(boolean playing, long messageId) {\n    try { Intent i = new Intent(KhatyarRadioModule.ACTION_PLAYBACK); i.setPackage(getPackageName()); i.putExtra("playing", playing); i.putExtra("messageId", messageId); sendBroadcast(i); } catch (Throwable ignored) {}\n  }'),
            ('if (!getPrefs().getBoolean("enabled", false) || getPrefs().getLong("channelId", 0L) <= 0) return;', 'if (!getPrefs().getBoolean("enabled", false) || getPrefs().getLong("channelId", 0L) <= 0 || player != null) return;'),
            ('player.setOnCompletionListener(mp -> { try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; });', 'broadcastPlayback(true, -1L); player.setOnCompletionListener(mp -> { try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; broadcastPlayback(false, -1L); });'),
            ('player.setOnErrorListener((mp, what, extra) -> { try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; return true; });', 'player.setOnErrorListener((mp, what, extra) -> { try { mp.release(); } catch (Throwable ignored) {} if (player == mp) player = null; broadcastPlayback(false, -1L); return true; });'),
            ('if (player != null) { try { player.release(); } catch (Throwable ignored) {} player = null; }', 'if (player != null) { try { player.release(); } catch (Throwable ignored) {} player = null; } broadcastPlayback(false, -1L);'),
          ])

          Path('.github/workflows/radio-repair-once.yml').unlink()
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/screens/RadioScreen.js mobile/src/radio/RadioContext.js mobile/plugins/khatyar-radio-native/KhatyarRadioModule.java mobile/plugins/khatyar-radio-native/KhatyarRadioService.java .github/workflows/radio-repair-once.yml
          git diff --cached --check
          git commit -m "fix(radio): lock PTT during playback and show latest three"
          git push origin main
