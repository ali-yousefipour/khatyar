name: Inject web parity runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[web-parity-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject runtime into web app
        shell: python
        run: |
          from pathlib import Path
          p = Path('php/app/app.html')
          marker = '<!-- KHATYAR_WEB_PARITY_V2 -->'
          pdf_marker = '<!-- KHATYAR_REPORT_PDF_RUNTIME -->'
          if not p.exists():
              raise SystemExit('php/app/app.html not found')
          text = p.read_text(encoding='utf-8')
          pos = text.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('</body> not found in app.html')
          tags = []
          if marker not in text:
              tags.append(f'{marker}\n<script src="web-android-parity-v2.js" defer></script>')
          if pdf_marker not in text:
              tags.append(f'{pdf_marker}\n<script src="report-history-pdf.js" defer></script>')
          if tags:
              text = text[:pos] + '\n' + '\n'.join(tags) + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')
      - name: Commit injected script references
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add php/app/app.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web): load parity and report PDF runtimes [web-parity-injected]'
          git push
