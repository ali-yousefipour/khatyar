name: Radio squelch repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-squelch-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[radio-squelch-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch radio squelch playback
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const path = 'mobile/src/radio/RadioContext.js';
            const text = s => Buffer.from(s, 'base64').toString('utf8');
            const get = async p => github.rest.repos.getContent({owner, repo, path:p, ref:branch});
            const put = async (p, transform, message) => {
              const r = await get(p);
              const item = Array.isArray(r.data) ? r.data[0] : r.data;
              const old = text(item.content);
              const next = transform(old);
              if (next === old) throw new Error(`No change made to ${p}`);
              await github.rest.repos.createOrUpdateFileContents({owner, repo, path:p, branch, message, content:Buffer.from(next,'utf8').toString('base64'), sha:item.sha});
            };
            await put(path, s => {
              const oldSounds = "const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const RADIO_SQUELCH_DELAY_MS=900;const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};";
              const newSounds = "const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const RADIO_SQUELCH_REPEAT_COUNT=6,RADIO_SQUELCH_STEP_MS=260,RADIO_SQUELCH_GAP_MS=70;const squelchPlayingRef=useRef(false);const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};const playSquelchSequence=async()=>{if(squelchPlayingRef.current)return;squelchPlayingRef.current=true;try{for(let i=0;i<RADIO_SQUELCH_REPEAT_COUNT;i++){playSfx(squelchPlayer);if(i<RADIO_SQUELCH_REPEAT_COUNT-1)await sleep(RADIO_SQUELCH_STEP_MS+RADIO_SQUELCH_GAP_MS)}}finally{squelchPlayingRef.current=false}};";
              if (!s.includes(oldSounds)) throw new Error('Radio sound block not found');
              return s.replace(oldSounds,newSounds);
            }, 'fix(radio): repeat squelch effect before message playback [radio-squelch-repair]');
            await put(path, s => {
              const oldSeq = 'playSfx(squelchPlayer);await new Promise(r=>setTimeout(r,RADIO_SQUELCH_DELAY_MS));';
              if (!s.includes(oldSeq)) throw new Error('Squelch delay block not found');
              return s.replace(oldSeq,'await playSquelchSequence();');
            }, 'fix(radio): use repeated squelch sequence before playback [radio-squelch-repair]');
            const current = await get(path);
            const updated = text(current.data.content);
            const nativeOld = 'useEffect(()=>{if(!user?.id||!enabled||!channelRef.current)return;if(NATIVE)return;poll();presence();const t=setInterval(()=>{poll();presence()},1800)';
            const nativeNew = 'useEffect(()=>{if(!user?.id||!enabled||!channelRef.current)return;poll();presence();const t=setInterval(()=>{poll();presence()},1800)';
            if(updated.includes(nativeOld)) {
              await put(path,s=>s.replace(nativeOld,nativeNew),'fix(radio): enable JS radio poll for native squelch cue [radio-squelch-repair]');
            }
            try {
              const tmp = await get('radio_squelch_repair.tmp');
              const item = Array.isArray(tmp.data) ? tmp.data[0] : tmp.data;
              await github.rest.repos.deleteFile({owner,repo,path:'radio_squelch_repair.tmp',branch,message:'chore(radio): remove squelch repair marker [radio-squelch-repair]',sha:item.sha});
            } catch(e) { if(e.status!==404) throw e; }
            try {
              const wf = await get('.github/workflows/radio-squelch-repair.yml');
              const item = Array.isArray(wf.data) ? wf.data[0] : wf.data;
              await github.rest.repos.deleteFile({owner,repo,path:'.github/workflows/radio-squelch-repair.yml',branch,message:'chore(radio): remove one-time squelch repair workflow [radio-squelch-repair]',sha:item.sha});
            } catch(e) { if(e.status!==404) throw e; }