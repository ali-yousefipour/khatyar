name: Sync Khatyar version

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/sync-version.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize shared version and web assets
        shell: python
        run: |
          from pathlib import Path
          import json, re

          pkg_path = Path('mobile/package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          version = str(pkg.get('version', '')).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid mobile/package.json version: {version}')

          routes = Path('php/lib/routes.php')
          text = routes.read_text(encoding='utf-8')
          text = re.sub(r"const\s+SITE_VERSION\s*=\s*['\"][^'\"]+['\"]\s*;", f"const SITE_VERSION = '{version}';", text, count=1)
          text = re.sub(r"const\s+APP_VERSION\s*=\s*['\"][^'\"]+['\"]\s*;", f"const APP_VERSION = '{version}';", text, count=1)
          routes.write_text(text, encoding='utf-8')

          app = Path('mobile/app.config.js')
          text = app.read_text(encoding='utf-8')
          code = int(version.split('.')[0])*10000 + int(version.split('.')[1])*100 + int(version.split('.')[2])
          text = re.sub(r"version:\s*process\.env\.ANDROID_VERSION_NAME\s*\|\|\s*['\"][^'\"]+['\"]", f"version: process.env.ANDROID_VERSION_NAME || '{version}'", text, count=1)
          text = re.sub(r"versionCode:\s*Number\(process\.env\.ANDROID_VERSION_CODE\s*\|\|\s*\d+\)", f"versionCode: Number(process.env.ANDROID_VERSION_CODE || {code})", text, count=1)
          text = re.sub(r"app_version:\s*process\.env\.ANDROID_VERSION_NAME\s*\|\|\s*['\"][^'\"]+['\"]", f"app_version: process.env.ANDROID_VERSION_NAME || '{version}'", text, count=1)
          app.write_text(text, encoding='utf-8')

          panel = Path('php/app/panel.html')
          if panel.exists():
              text = panel.read_text(encoding='utf-8')
              for asset in ('panel\\.bundle\\.css', 'panel\\.bundle\\.js', 'version-badge\\.js', 'line-location-admin-bridge\\.js', 'line-location-export-ui\\.js', 'station-app-item-settings\\.js'):
                  text = re.sub(r'(assets/' + asset + r'\\?v=)[^"\\']+', r'\g<1>' + version, text)
              panel.write_text(text, encoding='utf-8')

          badge = Path('php/app/assets/version-badge.js')
          if badge.exists():
              text = badge.read_text(encoding='utf-8')
              text = re.sub(r"const V='[^']+'", f"const V='{version}'", text, count=1)
              badge.write_text(text, encoding='utf-8')

          bundle = Path('php/app/assets/panel.bundle.js')
          if bundle.exists():
              text = bundle.read_text(encoding='utf-8')
              text2 = re.sub(r"PANEL BUILD:[^\"']+", f"PANEL BUILD: {version}", text, count=1)
              if text2 != text:
                  bundle.write_text(text2, encoding='utf-8')

          print(f'Synchronized project version: {version}')

      - name: Validate version consistency
        shell: python
        run: |
          import json
          from pathlib import Path
          v=json.loads(Path('mobile/package.json').read_text(encoding='utf-8'))['version']
          routes=Path('php/lib/routes.php').read_text(encoding='utf-8')
          panel=Path('php/app/panel.html').read_text(encoding='utf-8')
          badge=Path('php/app/assets/version-badge.js').read_text(encoding='utf-8')
          assert f"const SITE_VERSION = '{v}';" in routes
          assert f"const APP_VERSION = '{v}';" in routes
          assert f'panel.bundle.js?v={v}' in panel
          assert f"const V='{v}'" in badge
          print(f'Version consistency OK: {v}')

      - name: Commit synchronized version
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Version already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./mobile/package.json').version")
          git add mobile/package.json mobile/app.config.js php/lib/routes.php php/app/panel.html php/app/assets/version-badge.js php/app/assets/panel.bundle.js
          git commit -m "chore: synchronize Khatyar version to ${VERSION} [version-synchronized]"
          git push
