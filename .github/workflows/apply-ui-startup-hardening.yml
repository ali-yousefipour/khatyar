name: Apply Khatyar UI and startup hardening

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG_CURRENT.md'
      - 'PROJECT_REMAINING_WORK.md'
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply requested changes
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')

          # 1) Mobile help screen
          help_js = r'''import React from 'react';
import { ScrollView, View, Text, TouchableOpacity, StyleSheet } from 'react-native';
import { C, FONT } from '../theme';
import { faNum } from '../num';

const SECTIONS = [
  ['شروع کار', [
    'پس از ورود، داشبورد بر اساس نقش و سطح دسترسی شما نمایش داده می‌شود.',
    'در اولین اجرا، برنامه وضعیت سامانه و اطلاعات کش را در صفحه شروع به‌روزرسانی می‌کند و سپس نگهبان‌های امنیتی را مرحله‌به‌مرحله بررسی می‌کند.',
    'برای کار میدانی، GPS، دوربین و دسترسی‌های لازم را طبق پیام برنامه فعال نگه دارید.',
  ]],
  ['داشبورد و همگام‌سازی', [
    'چهار کارت بالای داشبورد تعداد رانندگان خطوط شما، خودروها، حضور امروز و چک‌لیست‌های ماه را نشان می‌دهد.',
    'دکمه همگام‌سازی، اطلاعات آنلاین را تازه می‌کند و درخواست‌های ذخیره‌شده در حالت آفلاین را پس از اتصال ارسال می‌کند.',
    'نوار وضعیت میدانی وضعیت موقعیت و الزامات فعالیت در شیفت را نمایش می‌دهد.',
  ]],
  ['جستجو و اطلاعات ناوگان', [
    'جستجوی تاکسی و تاکسیران برای پیدا کردن اطلاعات راننده و خودرو استفاده می‌شود.',
    'صفحات اطلاعات راننده، خودرو، بدهی، اعتبار بیمه و معاینه و وضعیت بهره‌برداری، اطلاعات ثبت‌شده در سامانه را نمایش می‌دهند.',
  ]],
  ['حضور، بازرسی و عملیات میدانی', [
    'ثبت حضور من برای ثبت و پیگیری حضور روزانه استفاده می‌شود.',
    'حاضرین در خط، وضعیت افراد حاضر در خطوط مجاز شما را نمایش می‌دهد.',
    'حضور مسئولین در خط برای ثبت حضور مسئولان و مأموران در محل استفاده می‌شود.',
    'مأموریت روزانه من، برنامه مأموریت و کارهای روز را نمایش می‌دهد.',
    'برنامه بازدید و پوشش خط برای شروع و پایان بازدید، ثبت GPS، تصویر و میزان پوشش استفاده می‌شود.',
    'ثبت موقعیت و تصویر خطوط برای ثبت موقعیت دقیق ایستگاه و تصاویر محل و تابلوهاست.',
    'ایستگاه‌های ثبت‌شده من، سوابق ثبت‌های انجام‌شده توسط شما را نمایش می‌دهد.',
  ]],
  ['گزارش، چک‌لیست و تذکر', [
    'ارسال گزارش برای ثبت گزارش کاری و پیوست‌های آن است.',
    'فرم‌ها برای تکمیل فرم‌های فعال سامانه استفاده می‌شوند.',
    'چک‌لیست‌ها و تذکرات قبلی سوابق ثبت‌شده را نمایش می‌دهند.',
    'گزارشات دریافتی و جزئیات گزارش برای بررسی گزارش‌های ارجاع‌شده استفاده می‌شوند.',
  ]],
  ['درخواست‌ها و شرکت‌ها', [
    'درخواست‌ها برای ثبت و پیگیری درخواست‌های شماست.',
    'تأیید درخواست‌ها فقط برای نقش‌های مجاز فعال است و کارتابل تأیید را نمایش می‌دهد.',
    'ارسال برای شرکت برای ارسال اطلاعات یا درخواست به شرکت مرتبط استفاده می‌شود.',
  ]],
  ['پیام و اعلان', [
    'ارسال پیامک، پیامک‌های ارسالی من و ارسال پیام در ربات‌ها ابزارهای ارتباطی سامانه هستند.',
    'پیام‌ها و اعلان‌ها برای مشاهده پیام‌های داخلی و هشدارهای سامانه استفاده می‌شوند.',
  ]],
  ['حساب کاربری و امکانات شخصی', [
    'ویرایش اطلاعات من برای اصلاح اطلاعات تماس، آدرس، تاریخ تولد و امضای پرسنلی است.',
    'فیش‌های حقوقی من، کارکرد من و اشتراک برنامه اطلاعات شخصی مرتبط با حساب را نمایش می‌دهند.',
    'فعالیت‌های فرهنگی و رفاهیات فقط در صورت داشتن دسترسی مربوط نمایش داده می‌شوند.',
    'قفل برنامه، تغییر رمز، تنظیمات اعلان و تنظیمات نقشه از منوی حساب کاربری در دسترس هستند.',
  ]],
  ['ثبت امضای پرسنلی', [
    'در ویرایش اطلاعات، داخل کادر امضا با انگشت امضا کنید.',
    'برای دقت بیشتر می‌توانید محل امضا را به حالت تمام‌صفحه ببرید، امضا را ثبت کنید و سپس به فرم برگردید.',
    'پاک کردن، امضای فعلی را حذف می‌کند و ثبت امضای جدید را امکان‌پذیر می‌سازد.',
  ]],
  ['حالت آفلاین', [
    'در صورت قطع اینترنت، برخی عملیات قابل صف شدن هستند و پس از اتصال مجدد ارسال می‌شوند.',
    'صف آفلاین را پاک نکنید مگر اینکه مطمئن باشید اطلاعات دیگر موردنیاز نیست؛ برنامه فقط مواردی را که سرور تأیید کند از صف حذف می‌کند.',
  ]],
  ['پشتیبانی و امنیت', [
    'برای ثبت حضور و عملیات میدانی، موقعیت واقعی دستگاه و تنظیمات امنیتی دستگاه اهمیت دارد.',
    'اگر برنامه از شما خواست دسترسی یا تنظیم خاصی را اصلاح کنید، ابتدا همان مورد را انجام دهید و سپس «بررسی مجدد» را بزنید.',
  ]],
];

export default function HelpScreen({ navigation }) {
  return <ScrollView style={s.wrap} contentContainerStyle={s.content}>
    <View style={s.hero}><Text style={s.brand}>خطیار</Text><Text style={s.title}>راهنمای کامل استفاده از نرم‌افزار</Text><Text style={s.sub}>راهنمای امکانات اپلیکیشن و ابزارهای فعال حساب شما</Text></View>
    {SECTIONS.map(([title, items]) => <View key={title} style={s.card}><Text style={s.section}>{title}</Text>{items.map((x,i)=><View key={i} style={s.item}><Text style={s.num}>{faNum(i+1)}</Text><Text style={s.text}>{x}</Text></View>)}</View>)}
    <View style={s.about}><Text style={s.aboutTitle}>اطلاعات برنامه</Text><Text style={s.aboutText}>توسعه‌دهنده: علی یوسفی‌پور</Text><Text style={s.aboutText}>شرکت: مبین شات</Text><Text style={s.aboutText}>نام برنامه: خطیار</Text></View>
    <TouchableOpacity style={s.back} onPress={()=>navigation.goBack()}><Text style={s.backText}>بازگشت</Text></TouchableOpacity>
  </ScrollView>;
}

const s=StyleSheet.create({wrap:{flex:1,backgroundColor:C.paper},content:{padding:14,paddingBottom:40},hero:{backgroundColor:C.brand,borderRadius:20,padding:20,marginBottom:12},brand:{color:'#fff',fontFamily:FONT.bold,fontSize:24,textAlign:'right'},title:{color:'#fff',fontFamily:FONT.bold,fontSize:17,textAlign:'right',marginTop:8},sub:{color:'#d7eee8',fontFamily:FONT.regular,fontSize:12,textAlign:'right',marginTop:6},card:{backgroundColor:'#fff',borderRadius:15,borderWidth:1,borderColor:'#e4e9f2',padding:14,marginBottom:10},section:{color:C.brand,fontFamily:FONT.bold,fontSize:15,textAlign:'right',marginBottom:8},item:{flexDirection:'row-reverse',alignItems:'flex-start',gap:9,paddingVertical:8,borderBottomWidth:1,borderBottomColor:'#f0f2f6'},num:{width:24,height:24,borderRadius:12,backgroundColor:'#e9f7f0',color:C.brand,fontFamily:FONT.bold,fontSize:11,textAlign:'center',paddingTop:4},text:{flex:1,color:'#344054',fontFamily:FONT.regular,fontSize:12.5,lineHeight:22,textAlign:'right'},about:{backgroundColor:'#102033',borderRadius:15,padding:16,marginTop:2},aboutTitle:{color:'#fff',fontFamily:FONT.bold,fontSize:15,textAlign:'right',marginBottom:8},aboutText:{color:'#d7dee9',fontFamily:FONT.regular,fontSize:12,textAlign:'right',lineHeight:24},back:{backgroundColor:C.brand,borderRadius:13,paddingVertical:13,alignItems:'center',marginTop:12},backText:{color:'#fff',fontFamily:FONT.bold,fontSize:14}});
'''
          hp = root/'mobile/src/screens/HelpScreen.js'
          hp.parent.mkdir(parents=True, exist_ok=True)
          if not hp.exists() or 'راهنمای کامل استفاده از نرم‌افزار' not in hp.read_text(encoding='utf-8'):
              hp.write_text(help_js, encoding='utf-8')

          # 2) Add Help screen to navigation and dashboard without disturbing existing routes.
          app = root/'mobile/App.js'
          t = app.read_text(encoding='utf-8')
          if "from './src/screens/HelpScreen'" not in t:
              marker="import SetupScreen from './src/screens/SetupScreen';"
              t=t.replace(marker, marker+"import HelpScreen from './src/screens/HelpScreen';")
          if "name=\"Help\"" not in t:
              marker='<Stack.Screen name="Dashboard" component={DashboardScreen} options={({navigation})=>({title:\'داشبورد\',headerLeft:()=> <ProfileBtn navigation={navigation}/>})}/>'
              t=t.replace(marker, marker+'<Stack.Screen name="Help" component={HelpScreen} options={{title:\'راهنمای استفاده\'}}/>')
          app.write_text(t, encoding='utf-8')

          dash = root/'mobile/src/screens/DashboardScreen.js'
          t = dash.read_text(encoding='utf-8')
          if "t:'راهنمای استفاده'" not in t:
              marker="const MENU=["
              insert="const MENU=[{icon3d:ICON3D.activity,t:'راهنمای استفاده',r:'Help',bg:'#e8f3ff',always:true},"
              t=t.replace(marker,insert,1)
          dash.write_text(t, encoding='utf-8')

          # 3) Version/metadata consistency.
          p=root/'mobile/package.json'; d=json.loads(p.read_text(encoding='utf-8')); d['version']='1.3.74'; d['description']='خطیار — نسخه 1.3.74'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 4) Sequential startup guard. Cache work remains inside StartupGate and completes before this guard.
          guard = r'''import React,{useEffect,useState,useCallback}from'react';
import{View,Text,TouchableOpacity,StyleSheet,Linking,AppState,ScrollView,Platform}from'react-native';
import AsyncStorage from'@react-native-async-storage/async-storage';
import*as Location from'expo-location';
import*as Notifications from'expo-notifications';
import*as Network from'expo-network';
import{C,FONT}from'./theme';
import{useAuth}from'./auth';

const CHECK_INTERVAL_MS=60*60*1000;
const BATTERY_KEY='battery_opt_confirmed_v1';
const AUTOSTART_KEY='autostart_confirmed_v1';
const WAIT_MS=5000;
async function openAutostartSettings(){try{const I=require('expo-intent-launcher');const cs=[{p:'com.miui.securitycenter',c:'com.miui.permcenter.autostart.AutoStartManagementActivity'},{p:'com.huawei.systemmanager',c:'com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity'},{p:'com.coloros.safecenter',c:'com.coloros.safecenter.permission.startup.StartupAppListActivity'},{p:'com.vivo.permissionmanager',c:'com.vivo.permissionmanager.activity.BgStartUpManagerActivity'}];for(const x of cs){try{await I.startActivityAsync('android.intent.action.MAIN',{packageName:x.p,className:x.c});return true}catch{}}}catch{}try{await Linking.openSettings()}catch{}return false}
async function checkLocationPermission(){try{const p=await Location.getForegroundPermissionsAsync();return p.status==='granted'}catch{return true}}
async function checkCamera(){try{const c=require('expo-camera');const p=await c.getCameraPermissionsAsync();return p.granted}catch{return true}}
async function checkNotifications(){try{const p=await Notifications.getPermissionsAsync();return p.status==='granted'}catch{return true}}
async function checkVpn(){try{const s=await Network.getNetworkStateAsync();return String(s?.type||'').toUpperCase().includes('VPN')}catch{return false}}
async function checkMock(){try{const p=await Location.getCurrentPositionAsync({accuracy:Location.Accuracy.Low,maximumAge:15000});return !!p?.mocked}catch{return false}}
async function checkDeveloper(){
  // Expo/React-Native بدون ماژول Native اختصاصی امکان خواندن Settings.Secure.ADB_ENABLED را ندارد.
  // در این حالت فقط مرحله ثبت می‌شود و برنامه قفل نمی‌شود؛ در build native در صورت وجود bridge مقدار واقعی را می‌پذیریم.
  try{const Native=global?.NativeModules?.KhatyarSecurity; if(Native?.isDeveloperOptionsEnabled)return !!(await Native.isDeveloperOptionsEnabled())}catch{}
  return false;
}
export default function PermissionGuard({children}){
 const{user}=useAuth(),exempt=Number(user?.security_exempt||0)===1||user?.security_exempt===true;
 const[stage,setStage]=useState('loading'),[issues,setIssues]=useState([]),[battery,setBattery]=useState(true),[ready,setReady]=useState(false);
 const run=useCallback(async()=>{
   if(exempt){setReady(true);return}
   setReady(false);setIssues([]);setStage('developer');
   const dev=await checkDeveloper(); if(dev)setIssues(x=>[...x,{key:'developer',title:'گزینه‌های توسعه‌دهنده فعال است',detail:'برای ادامه، Developer options را خاموش کنید.'}]);
   await new Promise(r=>setTimeout(r,WAIT_MS));
   setStage('gps'); const gps=await Location.hasServicesEnabledAsync().catch(()=>true); if(!gps)setIssues(x=>[...x,{key:'gps',title:'GPS / موقعیت‌یابی خاموش است',detail:'موقعیت‌یابی دستگاه را روشن کنید.'}]);
   await new Promise(r=>setTimeout(r,WAIT_MS));
   setStage('vpn'); if(await checkVpn())setIssues(x=>[...x,{key:'vpn',title:'VPN فعال است',detail:'برای ثبت صحیح موقعیت، VPN را خاموش کنید.'}]);
   await new Promise(r=>setTimeout(r,WAIT_MS));
   setStage('mock'); if(await checkMock())setIssues(x=>[...x,{key:'mock',title:'موقعیت جعلی فعال است',detail:'Mock/Fake Location را غیرفعال کنید.'}]);
   const perms=[];if(!(await checkLocationPermission()))perms.push({key:'locationPermission',title:'اجازه موقعیت مکانی',action:()=>Location.requestForegroundPermissionsAsync()});if(!(await checkCamera())){try{const c=require('expo-camera');perms.push({key:'camera',title:'اجازه دوربین',action:()=>c.requestCameraPermissionsAsync()})}catch{}}if(!(await checkNotifications()))perms.push({key:'notifications',title:'اجازه اعلان‌ها',action:()=>Notifications.requestPermissionsAsync()});
   if(perms.length)setIssues(x=>[...x,...perms]);
   const b=await AsyncStorage.getItem(BATTERY_KEY).catch(()=>null);setBattery(!!b);setStage('done');setReady(true);
 },[exempt]);
 useEffect(()=>{run();const iv=setInterval(run,CHECK_INTERVAL_MS);const sub=AppState.addEventListener('change',s=>{if(s==='active')run()});return()=>{clearInterval(iv);sub.remove()}},[run]);
 const action=async(it)=>{try{await it.action?.()}catch{}run()};
 if(!ready)return <View style={s.overlay}><Text style={s.title}>در حال بررسی مرحله {stage==='developer'?'اول':stage==='gps'?'دوم':stage==='vpn'?'سوم':stage==='mock'?'چهارم':'امنیت'}…</Text><Text style={s.sub}>هر مرحله با فاصله زمانی انجام می‌شود تا فشار پردازشی دستگاه حداقل بماند.</Text></View>;
 if(issues.length)return <View style={s.overlay}><ScrollView contentContainerStyle={s.box}><Text style={s.icon}>⚠</Text><Text style={s.title}>بررسی‌های امنیتی نیاز به اقدام دارد</Text>{issues.map(it=><View key={it.key} style={s.row}><View style={{flex:1}}><Text style={s.rowTxt}>{it.title}</Text><Text style={s.detail}>{it.detail||''}</Text></View>{it.action?<TouchableOpacity style={s.btn} onPress={()=>action(it)}><Text style={s.btnTxt}>فعال‌سازی</Text></TouchableOpacity>:null}</View>)}<TouchableOpacity style={s.recheck} onPress={run}><Text style={s.btnTxt}>بررسی مجدد</Text></TouchableOpacity></ScrollView></View>;
 if(!battery)return <View style={s.overlay}><ScrollView contentContainerStyle={s.box}><Text style={s.icon}>🔋</Text><Text style={s.title}>تنظیم بهینه‌سازی باتری</Text><Text style={s.sub}>برای عملکرد صحیح در پس‌زمینه، برنامه را از محدودیت باتری معاف کنید.</Text><TouchableOpacity style={s.btn2} onPress={()=>Linking.openSettings()}><Text style={s.btnTxt}>رفتن به تنظیمات</Text></TouchableOpacity><TouchableOpacity style={[s.btn2,{backgroundColor:C.brand}]} onPress={async()=>{await AsyncStorage.setItem(BATTERY_KEY,'1');setBattery(true)}}><Text style={s.btnTxt}>تأیید و ادامه</Text></TouchableOpacity></ScrollView></View>;
 return <>{children}</>;
}
const s=StyleSheet.create({overlay:{flex:1,backgroundColor:'#0e141f'},box:{padding:22,paddingTop:56,alignItems:'center'},icon:{fontSize:50,marginBottom:10},title:{fontFamily:FONT.bold,color:'#fff',fontSize:17,textAlign:'center',marginBottom:8},sub:{fontFamily:FONT.regular,color:'#aab4c5',fontSize:13,textAlign:'center',lineHeight:23,marginBottom:18},row:{backgroundColor:'#18202e',borderRadius:14,padding:14,width:'100%',marginBottom:10,flexDirection:'row-reverse',alignItems:'center',gap:10},rowTxt:{fontFamily:FONT.bold,color:'#fff',fontSize:13},detail:{fontFamily:FONT.regular,color:'#aab4c5',fontSize:11,marginTop:4,textAlign:'right'},btn:{backgroundColor:C.brand,borderRadius:9,paddingVertical:8,paddingHorizontal:13},btn2:{backgroundColor:'#2a3445',borderRadius:10,paddingVertical:13,paddingHorizontal:24,width:'100%',alignItems:'center',marginTop:10},btnTxt:{fontFamily:FONT.bold,color:'#fff',fontSize:13},recheck:{marginTop:14,backgroundColor:'#2a3445',borderRadius:10,paddingVertical:11,paddingHorizontal:28}});
'''
          (root/'mobile/src/PermissionGuard.js').write_text(guard,encoding='utf-8')

          # 5) Splash: show version without changing the splash asset. StartupGate gets version from package at runtime.
          st=root/'mobile/src/StartupGate.js'; t=st.read_text(encoding='utf-8')
          if "expo-constants" not in t:
              t=t.replace("import { faNum } from './num';", "import { faNum } from './num';\nimport Constants from 'expo-constants';")
          if 'versionLabel' not in t:
              t=t.replace("const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';", "const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';\nconst versionLabel = String(Constants.expoConfig?.version || '1.3.74');")
              t=t.replace('<Text style={s.phase}>{phase}</Text>', '<Text style={s.version}>نسخه {faNum(versionLabel)}</Text><Text style={s.phase}>{phase}</Text>')
              t=t.replace("phase: { marginTop: 10,", "version: { marginTop: 7, color: '#d7eee8', fontFamily: FONT.regular, fontSize: 11, textAlign: 'center' },\n  phase: { marginTop: 6,")
          st.write_text(t,encoding='utf-8')

          # 6) Fullscreen signature pad. Replace the existing SignaturePad function only.
          acc=root/'mobile/src/screens/AccountScreens.js'; t=acc.read_text(encoding='utf-8')
          t=t.replace('View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder', 'View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder, Modal')
          sig=re.compile(r'function SignaturePad\(\{ value, onChange \}\) \{.*?\n\}\n\nexport function EditProfileScreen',re.S)
          replacement=r'''function SignaturePad({ value, onChange }) {
  const padRef=useRef(null); const [points,setPoints]=useState([]); const [full,setFull]=useState(false); const last=useRef(null);
  const pan=useRef(PanResponder.create({onStartShouldSetPanResponder:()=>true,onMoveShouldSetPanResponder:()=>true,onPanResponderGrant:e=>{const{x,y}=e.nativeEvent;last.current={x,y};setPoints(a=>[...a,{x,y}])},onPanResponderMove:e=>{const{x,y}=e.nativeEvent,a=last.current;if(!a)return;const dx=x-a.x,dy=y-a.y,d=Math.max(1,Math.ceil(Math.sqrt(dx*dx+dy*dy)/3)),seg=[];for(let i=1;i<=d;i++)seg.push({x:a.x+dx*i/d,y:a.y+dy*i/d});last.current={x,y};setPoints(p=>[...p,...seg])},onPanResponderRelease:()=>{last.current=null},onPanResponderTerminate:()=>{last.current=null}})).current;
  const save=async()=>{if(!points.length)return Alert.alert('امضا','ابتدا امضای خود را رسم کنید.');try{const uri=await captureRef(padRef,{format:'png',quality:1,result:'data-uri'});onChange(uri);setFull(false);Alert.alert('امضا','امضا آماده ذخیره است.')}catch{Alert.alert('خطا','ذخیره تصویر امضا انجام نشد.')}};
  const clear=()=>{setPoints([]);onChange(null)};
  const pad=<View ref={padRef} collapsable={false} style={[s.signaturePad,full&&s.signaturePadFull]} {...pan.panHandlers}>{points.map((p,i)=><View key={i} pointerEvents="none" style={[s.signatureDot,{left:p.x-2,top:p.y-2}]}/>)}</View>;
  return <View style={s.signatureBox}><Text style={s.zoneTitle}>امضای پرسنلی</Text><Text style={s.zoneHint}>امضای خود را با انگشت داخل کادر رسم کنید.</Text>{value&&!points.length?<Image source={{uri:value}} style={s.signaturePreview} resizeMode="contain"/>:null}{pad}<View style={{flexDirection:'row-reverse',gap:8}}><TouchableOpacity style={[s.btn,{flex:1,marginTop:10}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,marginTop:10,backgroundColor:'#6b7280'}]} onPress={clear}><Text style={s.btnTxt}>پاک کردن</Text></TouchableOpacity></View><TouchableOpacity style={[s.btn,{marginTop:10,backgroundColor:'#173b61'}]} onPress={()=>setFull(true)}><Text style={s.btnTxt}>تمام‌صفحه کردن محل درج امضا</Text></TouchableOpacity>
  <Modal visible={full} animationType="slide" onRequestClose={()=>setFull(false)}><View style={s.fullWrap}><View style={s.fullHead}><Text style={s.fullTitle}>ثبت امضا در حالت تمام‌صفحه</Text><TouchableOpacity onPress={()=>setFull(false)}><Text style={s.fullClose}>بستن</Text></TouchableOpacity></View><Text style={s.fullHint}>با انگشت امضای خود را در فضای بزرگ زیر رسم کنید.</Text>{pad}<View style={s.fullActions}><TouchableOpacity style={[s.btn,{flex:1}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,backgroundColor:'#6b7280'}]} onPress={clear}><Text style={s.btnTxt}>پاک کردن</Text></TouchableOpacity></View></View></Modal></View>;
}

