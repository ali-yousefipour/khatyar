name: Apply radio latest-three fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-latest-three-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[radio-latest-three-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const getFile = async path => {
              const r = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
              return Array.isArray(r.data) ? r.data[0] : r.data;
            };
            const decode = x => Buffer.from(x,'base64').toString('utf8');
            const put = async (path, transform, message) => {
              const f = await getFile(path);
              const oldText = decode(f.content);
              const newText = transform(oldText);
              if (newText === oldText) throw new Error(`No change made to ${path}`);
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha:f.sha,message:`${message} [radio-latest-three-fix]`,content:Buffer.from(newText,'utf8').toString('base64')});
            };
            await put('php/app/radio-api-v2.php', text => {
              if (text.includes("$op==='latest-three'")) return text;
              const marker = "$u=au();radio_schema();$op=$_GET['op']??$_POST['op']??'state';$method=$_SERVER['REQUEST_METHOD']??'GET';";
              if (!text.includes(marker)) throw new Error('v2 marker not found');
              const block = marker + "\nif($op==='latest-three'&&$method==='GET'){ $cid=(int)($_GET['channel_id']??0); $c=ec($cid,$u); $sql='SELECT m.id,m.channel_id,m.sender_id,m.sender_name,m.duration_ms,m.bytes_size,m.created_at,r.title role_title FROM radio_messages m LEFT JOIN users su ON su.id=m.sender_id LEFT JOIN roles r ON r.id=su.role_id WHERE m.channel_id=? ORDER BY m.created_at DESC,m.id DESC LIMIT 3'; $rows=Db::all($sql,[$cid]); foreach($rows as &$row)$row['audio_url']='/api/radio-api-v2.php?op=audio&id='.(int)$row['id']; unset($row); rj(['ok'=>true,'messages'=>$rows]); }";
              return text.replace(marker, block);
            }, 'fix(radio): add authenticated latest-three operation');
            await put('mobile/src/screens/RadioScreen.js', text => {
              const old = "const r=await request(`/radio-recent.php?channel_id=${channelId}`,{noStore:true});";
              const neu = "const r=await request(`/radio-api-v2.php?op=latest-three&channel_id=${channelId}`,{noStore:true});";
              if (!text.includes(old)) throw new Error('recent request not found');
              return text.replace(old, neu);
            }, 'fix(radio): use v2 latest-three endpoint');
            const wf = await getFile('.github/workflows/radio-latest-three-fix.yml');
            await github.rest.repos.deleteFile({owner,repo,path:'.github/workflows/radio-latest-three-fix.yml',branch:'main',sha:wf.sha,message:'chore(radio): remove one-time latest-three workflow [radio-latest-three-fix]'});