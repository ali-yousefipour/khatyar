name: Stage and verify Khatyar on new domain
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: khatyar-domain-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check source and target paths
        shell: bash
        run: |
          set -euo pipefail
          test -s php/app/index.php
          test -s php/app/.htaccess
          php -l php/app/index.php
          php -l php/config.php
          php -l .github/scripts/khatyar-cutover-activate.php
          if [ "${{ github.event_name }}" = 'workflow_run' ]; then
            release_sha="${{ github.event.workflow_run.head_sha }}"
            git diff --quiet "$release_sha" HEAD -- mobile/ || { echo 'Signed APK source is older than current mobile code; refusing cutover.'; exit 1; }
          fi
          node --check php/app/assets/login-premium.js
      - name: Install FTP client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Mirror old app files including uploads, then overlay current source
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${FTP_USER:-}" && test -n "${FTP_PASS:-}"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cat > "$RUNNER_TEMP/ftp-read.cmd" <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 3
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          set ftp:list-options -a
          mirror --continue --parallel=2 /app $staging
          bye
          EOF
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -f "$RUNNER_TEMP/ftp-read.cmd"
          test -s "$staging/index.php" || { echo 'Old /app FTP folder is not the production web root'; exit 1; }
          cp -a php/app/. "$staging/"
          # Point source references to the new canonical domain; never mutate uploaded data.
          python3 - "$staging" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for item in root.rglob('*'):
              if not item.is_file() or 'uploads' in item.relative_to(root).parts or item.suffix.lower() not in {'.php','.html','.js','.css','.json','.xml','.svg','.webmanifest'}:
                  continue
              try:
                  text=item.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              replaced=text.replace('app.yousefipour.ir','khat-yar.ir')
              if replaced!=text:item.write_text(replaced,encoding='utf-8')
          PY
          test -s "$staging/.htaccess"
          cat > "$RUNNER_TEMP/ftp-write.cmd" <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 3
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          mkdir -p /khat-yar.ir
          mirror --reverse --continue --parallel=2 $staging /khat-yar.ir
          bye
          EOF
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -f "$RUNNER_TEMP/ftp-write.cmd"
          echo 'Copied existing web content (including uploads) and overlaid current GitHub public application.'
      - name: Verify new domain, PHP libraries, database and login
        shell: bash
        run: |
          set -euo pipefail
          base=https://khat-yar.ir
          body="$(mktemp)"
          code="$(curl -sSL --retry 3 --retry-delay 3 --max-time 30 -w '%{http_code}' "$base/api/health?migration_verify=$GITHUB_SHA" -o "$body" || true)"
          echo "New domain health HTTP: $code"
          test "$code" = 200 || { echo "New domain not yet mapped to /khat-yar.ir or PHP startup failed"; exit 1; }
          php -r '$v=json_decode(file_get_contents($argv[1]),true);if(!is_array($v)||($v["ok"]??false)!==true||($v["db"]??false)!==true||($v["site_version"]??"")!=="2.0.2")exit(1);' "$body"
          for path in / /login /api/app/version; do
            code="$(curl -sSL --retry 2 --max-time 30 -o /dev/null -w '%{http_code}' "$base$path?migration_verify=$GITHUB_SHA")"
            echo "$path HTTP $code"
            test "$code" = 200 || exit 1
          done
          code="$(curl -sSL --max-time 25 -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "$base/api/session/start")"
          echo 'Unauthenticated login contract HTTP:' "$code"
          test "$code" != 000 && test "$code" -lt 500
      - name: Verify public signed APK instead of copying it to the web domain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/khatyar-release"
          gh release download v2.0.2 -R ali-yousefipour/khatyar-releases -p khat-yar.apk -p khat-yar.apk.sha256 -D "$RUNNER_TEMP/khatyar-release" --clobber
          (cd "$RUNNER_TEMP/khatyar-release" && sha256sum -c khat-yar.apk.sha256)
          test -s "$RUNNER_TEMP/khatyar-release/khat-yar.apk"
          echo "Public GitHub APK and checksum verified; no APK hosted on khat-yar.ir."
      - name: Activate mandatory 2.0.2 update after release and domain verification
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/khatyar-release/khat-yar.apk"
          test -s "$apk"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          token="$(openssl rand -hex 32)"
          installer="khatyar-cutover-$(openssl rand -hex 12).php"
          cp .github/scripts/khatyar-cutover-activate.php "$RUNNER_TEMP/$installer"
          sed -i "s/__ACTIVATION_TOKEN__/$token/g;s/__APK_SHA256__/$sha/g" "$RUNNER_TEMP/$installer"
          cleanup() {
            lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "
              set ftp:ssl-force false; set ftp:ssl-protect-data false;
              set ftp:passive-mode true; rm /khat-yar.ir/assets/$installer; bye" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/$installer"
          }
          trap cleanup EXIT
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit yes; set ftp:ssl-force false; set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            put $RUNNER_TEMP/$installer -o /khat-yar.ir/assets/$installer; bye"
          response="$(curl --fail --silent --show-error --max-time 40 -X POST --data-urlencode "token=$token" "https://khat-yar.ir/assets/$installer")"
          echo "$response" | grep -q '"min_version":"2.0.2"'
          curl --fail --silent --show-error --max-time 30 "https://khat-yar.ir/api/app/version" > "$RUNNER_TEMP/cutover-version.json"
          php -r '$v=json_decode(file_get_contents($argv[1]),true);if(($v["min_version"]??null)!=="2.0.2"||($v["latest_version"]??null)!=="2.0.2"||($v["apk_url"]??null)!=="https://github.com/ali-yousefipour/khatyar-releases/releases/latest/download/khat-yar.apk"||!preg_match("/^[a-f0-9]{64}$/",$v["apk_sha256"]??""))exit(1);' "$RUNNER_TEMP/cutover-version.json"
          echo 'Verified mandatory version 2.0.2 and SHA-pinned APK download in live API.'
      - name: Disable legacy API after successful 2.0.2 activation
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit yes; set ftp:ssl-force false; set ftp:ssl-protect-data false;
            set ftp:passive-mode true; get /app/.htaccess -o $RUNNER_TEMP/legacy.htaccess; bye"
          test -s "$RUNNER_TEMP/legacy.htaccess"
          cat > "$RUNNER_TEMP/legacy-prefix" <<'HTACCESS'
          RewriteEngine On
          # All API operations, including version discovery, are disabled on the legacy domain.
          # Cutover runs only after new HTTPS, DB, login, and signed APK verification.
          RewriteCond %{HTTP_HOST} ^app\.yousefipour\.ir$ [NC]
          RewriteRule ^api(/|$) - [G,L]
          RewriteCond %{HTTP_HOST} ^app\.yousefipour\.ir$ [NC]
          RewriteRule ^(.*)$ https://khat-yar.ir/$1 [R=302,L,NE]
          HTACCESS
          cat "$RUNNER_TEMP/legacy-prefix" "$RUNNER_TEMP/legacy.htaccess" > "$RUNNER_TEMP/legacy-cutover.htaccess"
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit yes; set ftp:ssl-force false; set ftp:ssl-protect-data false;
            set ftp:passive-mode true; put $RUNNER_TEMP/legacy-cutover.htaccess -o /app/.htaccess; bye"
          code="$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' https://app.yousefipour.ir/api/health || true)"
          test "$code" = 410 || { echo "Old API restriction not active: HTTP $code"; exit 1; }
          echo 'Old app API returns 410. Old public links redirect to the new domain.'
      - name: Document cutover readiness
        run: |
          echo 'Cutover completed: new domain verified, signed public 2.0.2 APK validated, minimum version activated and old API disabled.'
