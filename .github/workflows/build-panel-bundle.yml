name: build-panel-bundle
# Trigger: regenerate the browser bundle from php/tools/panel_source.jsx.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build panel bundle
        run: |
          cd php
          bash ./tools/build_panel_bundle.sh
      - name: Verify bundle
        run: |
          node --check php/app/assets/panel.bundle.js
          grep -q "schoolservice" php/app/assets/panel.bundle.js
          ! grep -q "school-service.png" php/app/assets/panel.bundle.js
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- php/app/assets/panel.bundle.js; then
            echo "Bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add php/app/assets/panel.bundle.js
          git commit -m "build(panel): regenerate bundle"
          git push
