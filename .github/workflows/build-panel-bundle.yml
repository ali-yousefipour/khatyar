name: Build web panel bundle

on:
  push:
    branches: [main]
    paths:
      - 'php/tools/panel_source.jsx'
      - 'php/tools/build_panel_bundle.sh'
      - '.github/workflows/build-panel-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            php/tools
            php/app/assets
          sparse-checkout-cone-mode: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript
        run: npm install --no-save --no-package-lock typescript@5.8.3
      - name: Build panel bundle
        run: bash php/tools/build_panel_bundle.sh
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- php/app/assets/panel.bundle.js; then
            echo "Bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add php/app/assets/panel.bundle.js
          git commit -m "build: regenerate web panel bundle"
          git push
