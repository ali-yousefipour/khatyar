name: build-panel-bundle
# Build TypeScript explicitly; do not let npx resolve the unrelated npm package named tsc.
on:
  push:
    branches: [main]
    paths:
      - 'php/tools/panel_source.jsx'
      - 'php/**/*.ts'
      - 'php/**/*.tsx'
      - 'php/tools/build_panel_bundle.sh'
      - 'php/tsconfig*.json'
      - '.github/workflows/build-panel-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    concurrency:
      group: panel-bundle-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build panel bundle
        run: |
          cd php
          npm install --no-save --no-package-lock typescript@5.9.3
          bash ./tools/build_panel_bundle.sh
      - name: Verify bundle
        run: |
          node --check php/app/assets/panel.bundle.js
          grep -q "schoolservice" php/app/assets/panel.bundle.js
          ! grep -q "school-service.png" php/app/assets/panel.bundle.js
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- php/app/assets/panel.bundle.js; then
            echo "Bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add php/app/assets/panel.bundle.js
            git commit -m "build(panel): regenerate bundle"
            if git push origin HEAD:main; then exit 0; fi
            # Rebuild from the current branch rather than replaying a stale generated file.
            git fetch origin main
            git reset --hard origin/main
            (cd php && bash ./tools/build_panel_bundle.sh)
            node --check php/app/assets/panel.bundle.js
            if git diff --quiet -- php/app/assets/panel.bundle.js; then exit 0; fi
          done
          echo "::error::Concurrent updates prevented publishing the generated bundle"
          exit 1
