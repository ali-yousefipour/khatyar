name: fix-radio-list-v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'fix(radio): eliminate stale recent-message overwrites' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RadioContext deterministically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile/src/radio/RadioContext.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const enabledRef=useRef(true),channelRef=useRef(0),lastIdRef=useRef(0),pollingRef=useRef(false),mountedRef=useRef(true),recordingRef=useRef(false),limitRef=useRef(DEFAULT_TALK_MS),talkStartRef=useRef(0),autoStoppedRef=useRef(false),pttReleaseTimerRef=useRef(null),pttDownRef=useRef(false),talkGenerationRef=useRef(0),pttInputGenerationRef=useRef(0);", "const enabledRef=useRef(true),channelRef=useRef(0),lastIdRef=useRef(0),pollingRef=useRef(false),recentLoadingRef=useRef(false),recentRequestIdRef=useRef(0),mountedRef=useRef(true),recordingRef=useRef(false),limitRef=useRef(DEFAULT_TALK_MS),talkStartRef=useRef(0),autoStoppedRef=useRef(false),pttReleaseTimerRef=useRef(null),pttDownRef=useRef(false),talkGenerationRef=useRef(0),pttInputGenerationRef=useRef(0);")
          old="const sortRecentMessages=list=>list.slice().sort((a,b)=>{const ta=Date.parse(String(a?.created_at||'').replace(' ','T'))||0,tb=Date.parse(String(b?.created_at||'').replace(' ','T'))||0;return tb-ta||Number(b?.id||0)-Number(a?.id||0)}).slice(0,3);"
          new="const sortRecentMessages=list=>{const map=new Map();for(const m of(Array.isArray(list)?list:[])){if(m&&m.id!=null)map.set(String(m.id),m)}return Array.from(map.values()).sort((a,b)=>Number(b?.id||0)-Number(a?.id||0)).slice(0,3)};"
          s=s.replace(old,new)
          start=s.index('const loadRecentMessages=async()=>')
          end=s.index(';const apply=',start)
          newblock="const loadRecentMessages=async()=>{if(!user?.id||!channelRef.current||recentLoadingRef.current)return;const requestId=++recentRequestIdRef.current;const requestedChannel=Number(channelRef.current);recentLoadingRef.current=true;try{const r=await request(`/radio-api-v2.php?op=poll&channel_id=${requestedChannel}&after=${Math.max(0,Number(lastIdRef.current||0)-20)}`,{noStore:true});if(!mountedRef.current||requestId!==recentRequestIdRef.current||requestedChannel!==Number(channelRef.current))return;const list=Array.isArray(r?.messages)?r.messages:[];if(!list.length)return;const latest=sortRecentMessages(list);lastIdRef.current=Math.max(lastIdRef.current,...latest.map(m=>Number(m?.id||0)));setRecentMessages(prev=>sortRecentMessages([...(Array.isArray(prev)?prev:[]),...latest]))}catch(e){}finally{if(requestId===recentRequestIdRef.current)recentLoadingRef.current=false}}"
          s=s[:start]+newblock+s[end:]
          s=s.replace("setChannelIdState(cid);channelRef.current=cid;lastIdRef.current=Number(c.last_message_id||0);", "setChannelIdState(cid);channelRef.current=cid;recentRequestIdRef.current+=1;setRecentMessages([]);lastIdRef.current=Number(c.last_message_id||0);",1)
          s=s.replace("const list=await apply(r,savedC,savedE);if(!list.length)setLoadError('هیچ کانال مجازی برای حساب شما دریافت نشد.');else if(mountedRef.current)setTimeout(()=>loadRecentMessages(),0);", "const list=await apply(r,savedC,savedE);if(!list.length)setLoadError('هیچ کانال مجازی برای حساب شما دریافت نشد.');else if(mountedRef.current)setTimeout(()=>loadRecentMessages(),0);")
          s=s.replace("setChannelIdState(cid);channelRef.current=cid;lastIdRef.current=Number(c.last_message_id||0);const limit=", "setChannelIdState(cid);channelRef.current=cid;recentRequestIdRef.current+=1;setRecentMessages([]);lastIdRef.current=Number(c.last_message_id||0);const limit=",1)
          s=s.replace("if(mountedRef.current)setRecentMessages(prev=>sortRecentMessages([...newMessages,...prev]))", "if(mountedRef.current)setRecentMessages(prev=>sortRecentMessages([...(Array.isArray(prev)?prev:[]),...newMessages]))",1)
          s=s.replace("useEffect(()=>{if(!user?.id||!enabled||!channelRef.current)return;poll();presence();loadRecentMessages();const t=setInterval(()=>{poll();presence()},1800),sub=", "useEffect(()=>{if(!user?.id||!enabled||!channelRef.current)return;poll();presence();if(!recentLoadingRef.current&&!recentRequestIdRef.current)loadRecentMessages();const t=setInterval(()=>{poll();presence()},1800),sub=",1)
          s=s.replace("if(s==='active'){resyncToLive().then(()=>{loadRecentMessages();poll();presence()})}", "if(s==='active'){resyncToLive().then(()=>{poll();presence()})}",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/radio/RadioContext.js
          git commit -m "fix(radio): stabilize recent messages" || exit 0
          git rm .github/workflows/fix-radio-list-v2.yml
          git commit -m "chore: remove radio list repair workflow"
          git push origin HEAD:main
