name: Isolated Khatyar Static Audit
on:
  push:
    branches:
      - audit/khatyar-static-inventory-20261123
    paths:
      - audit/khatyar_inventory.py
      - audit/advanced_inventory.py
      - audit/independent_loc.py
      - audit/ui_catalog.py
      - .github/workflows/isolated-static-audit.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install independent LOC counter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cloc
      - name: Run read-only static inventory
        run: |
          python3 audit/khatyar_inventory.py
          python3 audit/advanced_inventory.py
          python3 audit/independent_loc.py
          python3 audit/ui_catalog.py
      - name: Upload source snapshot for in-depth static audit
        uses: actions/upload-artifact@v4
        with:
          name: khatyar-source-review-snapshot
          retention-days: 3
          path: |
            mobile/src/
            mobile/App.js
            mobile/package.json
            mobile/app.config.js
            mobile/plugins/
            php/lib/
            php/tools/
            php/app/*.html
            php/app/*.php
            php/app/assets/*.js
            php/app/assets/*.css
            php/db/
            db/
            backend/src/
            backend/package.json
            .github/workflows/
            !**/.env
            !**/*.key
            !**/*.pem
            !**/vendor/**
      - name: Upload complete audit data
        uses: actions/upload-artifact@v4
        with:
          name: khatyar-full-static-audit
          path: audit-results/
          retention-days: 30
      - name: Commit machine-readable results to isolated branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add audit-results/
          git commit -m "docs(audit): static inventory snapshots [skip ci]" || exit 0
          git push origin HEAD:audit/khatyar-static-inventory-20261123
