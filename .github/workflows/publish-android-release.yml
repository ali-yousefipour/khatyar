name: build-android-release

# Legacy Android release builder. Manual only; Myket is the default automatic release workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "نسخه انتشار؛ باید با package.json و app.config.js یکسان باشد"
        required: true
        default: "1.5.15"
      target:
        description: "شاخه/commit مبنای انتشار"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  # Keep the newest source build moving if an older dependency install hangs.
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22.23.1"
      JAVA_VERSION: "17"
      EXPECTED_GRADLE: "8.13"
      EXPECTED_EXPO: "57.0.29"
      EXPECTED_REACT_NATIVE: "0.86.3"
      EXPECTED_REACT: "19.2.3"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./mobile/package.json').version")"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version resolved: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm to local build toolchain
        run: npm install --global npm@12.0.2

      - name: Force official npm registry for GitHub Actions
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 3
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate locked Android/Expo baseline
        working-directory: mobile
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = process.env.EXPECTED_VERSION;
          const root = lock.packages && lock.packages[''];
          const checks = [
            ['package.json version', pkg.version, expected],
            ['package-lock root version', root?.version, expected],
            ['Expo SDK', pkg.dependencies?.expo, '~57.0.29'],
            ['React Native', pkg.dependencies?.['react-native'], '0.86.3'],
            ['React', pkg.dependencies?.react, '19.2.3'],
          ];
          for (const [name, actual, wanted] of checks) {
            if (actual !== wanted) {
              console.error(`::error::${name} mismatch: expected "${wanted}", got "${actual}"`);
              process.exit(1);
            }
          }
          console.log('Declared release baseline validated; lockfile will be installed with npm ci.');
          NODE

      - name: Diagnose npm dependency sources
        working-directory: mobile
        shell: bash
        run: |
          echo "npm registry: $(npm config get registry)"
          echo "npm version: $(npm --version)"
          echo "Node version: $(node --version)"
          node <<'NODE'
          const lock = require('./package-lock.json');
          const hosts = {};
          for (const [name, pkg] of Object.entries(lock.packages || {})) {
            if (!pkg.resolved || !/^https?:\/\//.test(pkg.resolved)) continue;
            const host = new URL(pkg.resolved).hostname;
            hosts[host] = (hosts[host] || 0) + 1;
          }
          console.log('Dependency tarball hosts:', JSON.stringify(hosts, null, 2));
          NODE

      - name: Normalize CI lockfile tarball URLs
        working-directory: mobile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
          let changed = 0;
          for (const [name, pkg] of Object.entries(lock.packages || {})) {
            if (!pkg.resolved || typeof pkg.resolved !== 'string') continue;
            const u = new URL(pkg.resolved);
            if (u.hostname === 'mirror-npm.runflare.com') {
              u.hostname = 'registry.npmjs.org';
              pkg.resolved = u.toString();
              changed++;
            }
            if (pkg.resolved.startsWith('https://mirror-npm.runflare.com/')) {
              throw new Error('Mirror URL remains in ' + name);
            }
          }
          fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
          console.log('Normalized ' + changed + ' Runflare tarball URLs to official npm registry.');
          NODE

      - name: Regenerate dependency lockfile for aligned Expo 57 build
        working-directory: mobile
        timeout-minutes: 12
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        shell: bash
        run: |
          npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); for(const [k,v] of Object.entries(p.dependencies)) if(l.packages[''].dependencies[k]!==v) throw Error('lock mismatch '+k)"
          echo "CI lockfile regenerated for Expo 57; no lockfile changes committed."

      - name: Install locked mobile dependencies
        working-directory: mobile
        timeout-minutes: 12
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
          npm_config_fetch_retries: "2"
          npm_config_fetch_timeout: "120000"
        shell: bash
        run: |
          set -o pipefail
          echo "Effective npm registry: $(npm config get registry)"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          echo "Starting npm ci at $(date -u +%FT%TZ)"
          npm ci --legacy-peer-deps --no-audit --no-fund --loglevel=http --foreground-scripts 2>&1 | while IFS= read -r line; do
            printf '[%s] %s\n' "$(date -u +%FT%TZ)" "$line"
          done

      - name: Verify Expo dependency tree
        working-directory: mobile
        timeout-minutes: 5
        shell: bash
        env:
          CI: "true"
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        run: |
          set -o pipefail
          echo "Expo Doctor started at $(date -u +%FT%TZ)"
          echo "Node: $(node --version); npm: $(npm --version)"
          echo "Registry: $(npm config get registry)"
          set +e
          npx --yes expo-doctor 2>&1 | while IFS= read -r line; do
            printf '[%s] %s\\n' "$(date -u +%FT%TZ)" "$line"
          done
          doctor_status=${PIPESTATUS[0]}
          set -e
          if [ "$doctor_status" -ne 0 ]; then
            echo "::warning::Expo Doctor reported dependency compatibility issues (exit $doctor_status); native APK build will run to reveal any compile errors. Review Expo Doctor logs before release."
          fi
          echo "Expo Doctor completed at $(date -u +%FT%TZ)"

      - name: Validate every mobile JavaScript and TypeScript source
        working-directory: mobile
        run: node scripts/validate-all-sources.cjs

      - name: Validate native config plugin syntax
        working-directory: mobile
        shell: bash
        run: |
          node --check plugins/withWifiRebornSdkCompat.js
          node --check app.config.js
          node scripts/test-company-payroll.cjs
          node scripts/test-update-contract.cjs
          node scripts/test-selfie-delivery.cjs
          node scripts/test-radio-live.cjs
          node scripts/test-radio-sfx.cjs
          node scripts/test-work-timer.cjs

      - name: Generate clean Android project
        working-directory: mobile
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify CI repository policy and Gradle baseline
        working-directory: mobile/android
        shell: bash
        run: |
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Generated Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties
          if ! grep -Fq 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties; then
            echo "::error::Unexpected Gradle wrapper version; expected Expo 57 generated Gradle 9.3.1."
            exit 1
          fi
          if grep -RniE 'maven\.myket\.ir|mirror-maven\.runflare\.com' settings.gradle* build.gradle* app/build.gradle* gradle.properties 2>/dev/null; then
            echo "::error::Iranian Maven mirrors were injected into the GitHub Actions Android project."
            exit 1
          fi
          echo "CI Maven policy validated: official Google/Maven repositories only."

      - name: Restore release signing keystore
        shell: bash
        env:
          MYKET_KEYSTORE_BASE64: ${{ secrets.MYKET_KEYSTORE_BASE64 }}
          MYKET_STORE_PASSWORD: ${{ secrets.MYKET_STORE_PASSWORD }}
          MYKET_KEY_ALIAS: ${{ secrets.MYKET_KEY_ALIAS }}
          MYKET_KEY_PASSWORD: ${{ secrets.MYKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in MYKET_KEYSTORE_BASE64 MYKET_STORE_PASSWORD MYKET_KEY_ALIAS MYKET_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing release signing secret: $key. The APK must be signed with the existing production key."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$MYKET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/khatyar-release.jks"
          test -s "$RUNNER_TEMP/khatyar-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/khatyar-release.jks" -storepass "$MYKET_STORE_PASSWORD" -alias "$MYKET_KEY_ALIAS" >/dev/null
          echo "MYKET_STORE_FILE=$RUNNER_TEMP/khatyar-release.jks" >> "$GITHUB_ENV"
          echo "Production release keystore validated."

      - name: Build release APK
        working-directory: mobile/android
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          MYKET_BUILD: "true"
          MYKET_STORE_PASSWORD: ${{ secrets.MYKET_STORE_PASSWORD }}
          MYKET_KEY_ALIAS: ${{ secrets.MYKET_KEY_ALIAS }}
          MYKET_KEY_PASSWORD: ${{ secrets.MYKET_KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon --stacktrace --console=plain --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify APK version and artifact
        working-directory: mobile
        shell: bash
        run: |
          echo "Available release APK outputs:"
          find android/app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null || true
          mapfile -t APKS < <(find android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' ! -name '*unaligned*' -size +0c 2>/dev/null | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No nonempty signed release APK found under android/app/build/outputs/apk"
            exit 1
          fi
          RELEASE_APKS=()
          for apk in "${APKS[@]}"; do
            case "$apk" in
              */release/*|*/release/*.apk) RELEASE_APKS+=("$apk") ;;
            esac
          done
          if [ "${#RELEASE_APKS[@]}" -eq 0 ]; then
            echo "::error::APK files exist but none are in a release output directory"
            exit 1
          fi
          if [ "${#RELEASE_APKS[@]}" -ne 1 ]; then
            printf 'Found multiple release APKs:\\n%s\\n' "${RELEASE_APKS[@]}"
            echo "::error::Expected exactly one arm64-v8a release APK"
            exit 1
          fi
          APK="${RELEASE_APKS[0]}"
          if unzip -Z1 "$APK" | grep '^lib/armeabi-v7a/' >/dev/null; then
            echo "::error::32-bit native libraries unexpectedly included in arm64-only APK"
            exit 1
          fi
          if ! unzip -Z1 "$APK" | grep '^lib/arm64-v8a/' >/dev/null; then
            echo "::error::Missing arm64-v8a native libraries"
            exit 1
          fi
          mkdir -p ../release
          cp "$APK" ../release/khatyar.apk
          test -s ../release/khatyar.apk
          sha256sum ../release/khatyar.apk | tee ../release/khatyar.apk.sha256
          echo "APK artifact verified from: $APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: khatyar-android-release-${{ steps.version.outputs.version }}
          path: |
            release/khatyar.apk
            release/khatyar.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/test/expo57-hermes-dependency-alignment' && inputs.target != 'test/expo57-hermes-dependency-alignment'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.sha }}
        run: |
          NOTES_FILE="CHANGELOG_${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="CHANGELOG_CURRENT.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/khatyar.apk release/khatyar.apk.sha256 --clobber
          else
            gh release create "$TAG" release/khatyar.apk release/khatyar.apk.sha256 \
              --target "$TARGET" \
              --title "خطیار ${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Print release links
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Stable: https://github.com/ali-yousefipour/khatyar/releases/latest/download/khatyar.apk"
          echo "Versioned: https://github.com/ali-yousefipour/khatyar/releases/download/v${VERSION}/khatyar.apk"
