name: project-integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow structure
        shell: bash
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$workflow" ] || continue
            if ! grep -Eq '^jobs:[[:space:]]*$' "$workflow"; then
              echo "ERROR: required top-level jobs: is missing in $workflow"
              exit 1
            fi
          done
          echo "PASS: all workflow files define top-level jobs."
      - name: PHP syntax
        run: |
          php -v
          for cron_file in php/app/cron*.php php/app/radio-cleanup.php; do php -l "$cron_file" || exit 1; done
          php php/tests/cron_background_test.php
          php php/tests/delivery_queue_retry_test.php
          php -l php/lib/routes.php
          php -l php/lib/CompanyWork.php
          php -l php/lib/company_work_routes.php
          php php/tests/subscription_invoice_test.php
          php php/tests/company_work_test.php
          php php/tests/company_work_archive_test.php
          php php/tests/company_work_collect_test.php
          php php/tests/company_work_reconciliation_test.php
          node php/tests/company_work_reconciliation_ui_test.cjs
          node php/tests/company_work_ui_test.cjs
          node php/tests/company_work_deployment_test.cjs
          node php/tests/company_work_http_test.cjs
          php -l php/lib/KhatyarFormsSchema.php
          php php/tests/forms_schema_test.php
          php php/tests/login_policy_test.php
          php php/tests/zone_context_test.php
          php -l php/lib/WorkContracts.php
          php php/tests/work_contracts_test.php
          php php/tests/work_contract_management_test.php
          php php/tests/api_startup_performance_test.php
          node --check php/app/assets/work-contracts-admin.js
          php php/tests/radio_shift_gate_test.php
          node mobile/scripts/test-radio-shift-native.cjs
          node php/tests/login_policy_ui_test.cjs
          php php/tests/work_policy_requests_test.php
          php php/tests/request_report_test.php
          node php/tests/request_approval_timeline_test.cjs
          node mobile/scripts/test-dashboard-role-visibility.cjs
          php php/tests/request_edit_test.php
          node php/tests/request_edit_ui_test.cjs
          php php/tests/request_substitute_scope_test.php
          node mobile/scripts/test-request-substitute-scope.cjs
          php php/tests/live_map_query_test.php
          php php/tests/bill_import_chunk_scaling_test.php
          php php/tests/shift_rotation_test.php
          node php/tests/shift_rotation_ui_test.cjs
          node php/tests/shift_rotation_xlsx_test.cjs
          php -l php/lib/EmploymentAttendance.php
          php -l php/app/api/admin-holiday-seed.php
          php -l php/lib/ShiftCalc.php
          php php/tests/work_summary_cutoff_test.php
          php php/tests/work_shift_regression_test.php
          php php/tests/work_month_daily_reconciliation_test.php
          php php/tests/attendance_monthly_reconciliation_test.php
          php php/tests/work_month_overtime_reconciliation_test.php
          php php/tests/work_finalization_test.php
          node php/tests/work_finalization_ui_test.cjs
          node php/tests/seniority_deployment_test.cjs
          node php/tests/org_chart_deployment_test.cjs
          node php/tests/regional_team_deployment_test.cjs
          php php/tests/regional_team_test.php
          php php/tests/seniority_test.php
          node php/tests/seniority_ui_test.cjs
          node php/tests/org_regions_ui_test.cjs
          php php/tests/selfie_delivery_test.php
          php php/tests/employment_period_test.php
          node mobile/scripts/test-update-contract.cjs
          node mobile/scripts/test-payroll-period-title.cjs
          php php/tests/presence_street_geocode_test.php
          php php/tests/presence_random_dispatch_test.php
          node mobile/scripts/test-selfie-delivery.cjs
          node mobile/scripts/test-presence-camera.js
          node php/tests/selfie_ui_test.cjs
          php -l php/lib/GpsWorkIntervals.php
          php -l php/app/api/admin-attendance-report-owned.php
          php -l php/app/api/admin-attendance-xlsx.php
          php php/tests/gps_work_intervals_test.php
          php -l php/lib/school_service_routes_extra.php
          php -l php/lib/complaints_routes_extra.php
      - name: Panel bundle syntax
        run: |
          node php/tests/android_web_navigation_test.cjs
          node php/tests/android_web_screens_test.cjs
          node php/tests/web_features_test.cjs
          node php/tests/web_attendance_test.cjs
          php php/tests/inventory_read_contract_test.php
          php php/tests/crash_reports_test.php
          node --check php/app/assets/android-app-ui.js
          node --version
          node --check php/app/assets/panel.bundle.js
          node php/tests/personnel_dashboard_modal_test.cjs
          node php/tests/live_staff_kpi_modal_test.cjs
          node php/tests/panel_navigation_ui_test.cjs
          node php/tests/panel_map_requests_test.cjs
          node php/tests/settings_sections_ui_test.cjs
          node php/tests/request_policy_ui_test.cjs
          node php/tests/request_report_ui_test.cjs
          node php/tests/request_details_ui_test.cjs
          node php/tests/request_export_xlsx_test.cjs
          node php/tests/presence_extension_ui_test.cjs
          node --check php/app/assets/complaints-panel.js
