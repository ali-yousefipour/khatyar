name: report-screens-check
on:
  push:
    branches: [main]
    paths:
      - 'mobile/src/screens/InboxScreen.js'
      - 'mobile/src/screens/ReportsScreen.js'
      - 'mobile/src/components/ReportPersonPickerModal.js'
      - 'mobile/src/screens/LineVisitProgramScreen.js'
      - 'mobile/scripts/test-field-presence-recovery.cjs'
      - 'mobile/src/screens/OfficialPresenceScreen.js'
      - 'mobile/src/offline.js'
      - 'mobile/src/api.js'
      - 'mobile/scripts/test-offline-official-visit.cjs'
      - 'mobile/src/screens/DashboardScreen.js'
      - 'mobile/src/components/DashboardTiles.js'
      - 'mobile/scripts/test-dashboard-menu-design.cjs'
      - 'mobile/scripts/test-report-screens.cjs'
      - '.github/workflows/report-screens-check.yml'
  workflow_dispatch:
jobs:
  report-jsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install isolated Babel parser
        run: npm install --prefix /tmp/khatyar-report-parser --no-save --ignore-scripts --no-audit --no-fund @babel/parser@7.28.4
      - name: Validate report screens JSX and feature contracts
        working-directory: mobile
        env:
          NODE_PATH: /tmp/khatyar-report-parser/node_modules
        run: |
          node scripts/test-report-screens.cjs
          node scripts/test-dashboard-menu-design.cjs
          node scripts/test-offline-official-visit.cjs
          node scripts/test-field-presence-recovery.cjs
          node -e "const fs=require('node:fs');const p=require('@babel/parser');for(const f of ['src/screens/DashboardScreen.js','src/components/DashboardTiles.js','src/screens/OfficialPresenceScreen.js','src/screens/LineVisitProgramScreen.js','src/offline.js','src/api.js']){p.parse(fs.readFileSync(f,'utf8'),{sourceType:'module',plugins:['jsx']});console.log('PASS JSX:',f)}"
