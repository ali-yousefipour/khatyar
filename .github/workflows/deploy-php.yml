name: Deploy PHP backend to shared hosting

on:
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  cancel-in-progress: false

jobs:
  deploy-php:
    name: FTP deploy changed PHP files
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changed PHP deployment payload
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf deploy-payload
          mkdir -p deploy-payload

          if [ "${EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "${EVENT_AFTER}^")"
          elif git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            BASE="${EVENT_BEFORE}"
          else
            BASE="$(git rev-parse "${EVENT_AFTER}^")"
          fi

          echo "Comparing PHP changes: ${BASE}..${EVENT_AFTER}"

          git diff --name-status --find-renames "${BASE}" "${EVENT_AFTER}" -- php/ > /tmp/php-diff.txt

          echo "Changed PHP paths:"
          cat /tmp/php-diff.txt || true

          while IFS=$'\t' read -r status path1 path2; do
            [ -n "${status:-}" ] || continue

            case "${status}" in
              A|M|T)
                mkdir -p "deploy-payload/$(dirname "${path1#php/}")"
                cp "${path1}" "deploy-payload/${path1#php/}"
                ;;
              D)
                printf '%s\n' "${path1#php/}" >> /tmp/php-deletions.txt
                ;;
              R*|C*)
                mkdir -p "deploy-payload/$(dirname "${path2#php/}")"
                cp "${path2}" "deploy-payload/${path2#php/}"
                printf '%s\n' "${path1#php/}" >> /tmp/php-deletions.txt
                ;;
            esac
          done < /tmp/php-diff.txt

          if [ -f /tmp/php-deletions.txt ]; then
            sort -u /tmp/php-deletions.txt > deploy-deletions.txt
          else
            : > deploy-deletions.txt
          fi

          echo "Deployment payload:"
          find deploy-payload -type f -print | sort || true

          echo "Remote deletions:"
          cat deploy-deletions.txt || true

          if [ -z "$(find deploy-payload -type f -print -quit)" ] && [ ! -s deploy-deletions.txt ]; then
            echo "No PHP changes to deploy."
          fi

      - name: Upload changed PHP files to FTP root
        if: ${{ hashFiles('deploy-payload/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 2870352177.cloudylink.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-payload/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/*.log

      - name: Delete removed PHP files from FTP root
        if: ${{ hashFiles('deploy-deletions.txt') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          while IFS= read -r rel; do
            [ -n "${rel}" ] || continue
            echo "Deleting remote: /${rel}"
            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}" -e "
              set ftp:ssl-force false;
              set ftp:passive-mode true;
              set net:timeout 30;
              set net:max-retries 2;
              rm "/${rel}";
              bye
            " || {
              echo "Warning: remote file may already be absent: /${rel}"
            }
          done < deploy-deletions.txt
