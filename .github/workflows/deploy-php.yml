            remote_path="$(mktemp)"
            trap 'rm -f "${remote_path}"' EXIT
            curl --fail --silent --show-error --location --max-time 45 --retry 3 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store' -A 'Khatyar-Deploy-Verify/3.0' \
              "${url}" > "${remote_path}"
            test -s "${remote_path}" || { echo "ERROR: empty response from ${url}" >&2; exit 1; }
            case "${rel}" in
              app/landing.html)
                grep -q 'hero premium-hero' "${remote_path}" || { echo "ERROR: live homepage does not contain the public Khatyar hero" >&2; exit 1; }
                grep -q 'organizational-public.css' "${remote_path}" || { echo "ERROR: public reference stylesheet is missing from live HTML" >&2; exit 1; }
                ;;
              app/panel.html)
                grep -q 'panel.bundle.js' "${remote_path}" || { echo "ERROR: /login does not serve the existing authentication shell" >&2; exit 1; }
                grep -q 'organizational-login.css' "${remote_path}" || { echo "ERROR: /login does not contain the new login design" >&2; exit 1; }
                ;;
              *)
                case "${rel}" in app/assets/*.js) node --check --input-type=commonjs < "${remote_path}" ;; esac
                cmp -s "${local_path}" "${remote_path}" || {
                  echo "ERROR: live asset differs from committed deployment payload: ${rel}" >&2
                  sha256sum "${local_path}" "${remote_path}"
                  exit 1
                }
                ;;
            esac
            echo "Verified production ${rel} via ${url}"
            rm -f "${remote_path}"
          done
          # Verify public subroutes are resolved by the router, not 404s or the admin shell.
          for route in /features /about /faq /contact; do
            public_file="$(mktemp)"
            curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache, no-store' "${base}${route}?deploy_verify=${GITHUB_SHA}" > "${public_file}"
            grep -q 'data-page="' "${public_file}" || { echo "ERROR: ${route} is not the public site" >&2; exit 1; }
            rm -f "${public_file}"
          done

      - name: Smoke-test production API and login routes
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          base="https://khat-yar.ir"
          echo "Checking production API health..."
          health_code="$(curl --silent --show-error --location --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache, no-store' -o /tmp/khatyar-health.json -w '%{http_code}' "${base}/api/health?smoke=${GITHUB_SHA}" || true)"
          echo "GET /api/health HTTP ${health_code}"
          cat /tmp/khatyar-health.json 2>/dev/null || true
          echo
          if [ "${health_code}" != "200" ] || ! php -r '$v=json_decode(file_get_contents("/tmp/khatyar-health.json"),true);if(!is_array($v)||($v["db"]??false)!==true||($v["ok"]??false)!==true)exit(1);'; then
            echo "ERROR: production health did not confirm a functional database connection." >&2
            exit 1
          fi
          for route in /api/session/start /api/auth/login; do
            code="$(curl --silent --show-error --location --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors -X POST -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' --data '{}' -o /tmp/khatyar-login-response.json -w '%{http_code}' "${base}${route}" || true)"
            echo "POST ${route} with empty JSON -> HTTP ${code}"
            cat /tmp/khatyar-login-response.json 2>/dev/null || true
            echo
            if [ "${code}" = "000" ] || [ "${code}" -ge 500 ]; then
              echo "ERROR: production login route returned a server/network error: ${route}" >&2
              exit 1
            fi
          done
          xlsx_code="$(curl --silent --show-error --location --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors -X POST -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' --data '{"rows":[["Date"],["2026-10-14"]]}' -o /tmp/khatyar-attendance-xlsx-auth.json -w '%{http_code}' "${base}/api/admin-attendance-xlsx.php" || true)"
          echo "POST /api/admin-attendance-xlsx.php without a token -> HTTP ${xlsx_code}"
          if [ "${xlsx_code}" != "401" ]; then
            echo "ERROR: attendance Excel route did not enforce authentication as expected." >&2
            cat /tmp/khatyar-attendance-xlsx-auth.json 2>/dev/null || true
            exit 1
          fi
          # All protected endpoints must reject anonymous access with 401,
          # rather than crashing in route bootstrap/authentication with 500.
          for route in /api/admin/stats /api/admin/roles /api/admin/zones /api/admin/users /api/admin/attendance-report /api/admin/dashboard-discipline /api/admin/company-work /api/admin/company-work/sources/0/download; do
            code="$(curl --silent --show-error --location --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/khatyar-protected-route.json -w '%{http_code}' "${base}${route}" || true)"
            echo "Anonymous GET ${route} -> HTTP ${code}"
            if [ "${code}" != "401" ]; then
              echo "ERROR: authenticated API returned unexpected HTTP status before authentication: ${route}" >&2
              cat /tmp/khatyar-protected-route.json 2>/dev/null || true
              exit 1
            fi
          done
          # OTP validation must never send SMS for an empty username.
          for policy in app-login-config web-login-config; do
            curl --fail --silent --show-error --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors "${base}/api/session/${policy}" -o /tmp/khatyar-login-policy.json
            php -r '$v=json_decode(file_get_contents("/tmp/khatyar-login-policy.json"),true); if (!in_array($v["method"]??null,["password","sms_otp","bale_otp"],true)) exit(1);'
            echo "GET /api/session/${policy}: valid configured login method"
          done
          otp_code="$(curl --silent --show-error --location --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors -X POST -H 'Content-Type: application/json' --data '{}' -o /tmp/khatyar-otp-empty.json -w '%{http_code}' "${base}/api/session/otp-request" || true)"
          echo "POST /api/session/otp-request (empty user) -> HTTP ${otp_code}"
          if [ "${otp_code}" != "400" ]; then
            echo "ERROR: OTP route failed before input validation" >&2
            cat /tmp/khatyar-otp-empty.json 2>/dev/null || true
            exit 1
          fi
          me_code="$(curl --silent --show-error --location --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/khatyar-me-anonymous.json -w '%{http_code}' "${base}/api/auth/me" || true)"
          echo "GET /api/auth/me (anonymous) -> HTTP ${me_code}"
          if [ "${me_code}" != "401" ]; then
            echo "ERROR: auth/me did not reject anonymous request cleanly" >&2
            cat /tmp/khatyar-me-anonymous.json 2>/dev/null || true
            exit 1
          fi
          echo "Production API/login/attendance-Excel smoke tests passed (unauthorized requests are expected to be rejected)."
