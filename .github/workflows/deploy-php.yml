          # The new form and contract modules must be present in the same
          # canonical /lib path used by app/index.php; absence fails deployment.
          for name in KhatyarFormsSchema.php WorkContracts.php RegionalTeam.php school_complaint_accounts.php OrganizationWorkPlacement.php WorkReportDefaultPlacement.php WorkReportSnapshot.php WorkReportTemplateArchive.php WorkReportTemplateParser.php WorkReportTemplateExporter.php WorkReportTemplateRepository.php organization-template.xlsx work_report_template_routes.php; do
            if [ ! -f "deploy-payload/lib/${name}" ]; then
              echo "ERROR: missing required module from deployment payload: ${name}" >&2
              exit 1
            fi
            echo "Staged and installed required PHP module: ${name}"
          done
          fi

      - name: Verify uploaded FTP files
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            rel="${file#deploy-payload/}"
            if [ "${rel}" = "lib/complaints_routes_extra.php" ]; then
              echo "FTP verify skipped for ${rel} (host-side installer verified canonical checksum)."
              continue
            fi
            if [ "${rel}" = "lib/school_complaints_routes.php" ] || [ "${rel}" = "lib/school_complaint_accounts.php" ] || [ "${rel}" = "lib/school_service_sepand.php" ] || [ "${rel}" = "lib/DashboardDiscipline.php" ] || [ "${rel}" = "lib/RegionalTeam.php" ] || [ "${rel}" = "lib/Db.php" ] || [ "${rel}" = "lib/Jwt.php" ] || [ "${rel}" = "lib/Http.php" ] || [ "${rel}" = "lib/WorkReportReadScope.php" ] || [ "${rel}" = "lib/OrganizationWorkPlacement.php" ] || [ "${rel}" = "lib/WorkReportDefaultPlacement.php" ] || [ "${rel}" = "lib/WorkReportSnapshot.php" ] || [ "${rel}" = "lib/WorkReportTemplateArchive.php" ] || [ "${rel}" = "lib/WorkReportTemplateParser.php" ] || [ "${rel}" = "lib/WorkReportTemplateExporter.php" ] || [ "${rel}" = "lib/WorkReportTemplateRepository.php" ] || [ "${rel}" = "lib/work_report_template_routes.php" ] || [ "${rel}" = "lib/routes.php" ] || [ "${rel}" = "lib/IranCalendar.php" ] || [ "${rel}" = "lib/ShiftCalc.php" ] || [ "${rel}" = "lib/GpsWorkIntervals.php" ] || [ "${rel}" = "lib/InternetWorkIntervals.php" ] || [ "${rel}" = "lib/presence_reverse_geocode.php" ] || [ "${rel}" = "lib/subscription_invoice_routes.php" ] || [ "${rel}" = "lib/RadioShiftGate.php" ] || [ "${rel}" = "lib/school_service_routes_extra.php" ] || [ "${rel}" = "lib/DeliveryQueue.php" ] || [ "${rel}" = "lib/Xlsx.php" ] || [ "${rel}" = "lib/XlsxWriter.php" ] || [ "${rel}" = "lib/OrgChart.php" ] || [ "${rel}" = "lib/Seniority.php" ] || [ "${rel}" = "lib/Payroll.php" ] || [ "${rel}" = "lib/EmploymentAttendance.php" ] || [ "${rel}" = "lib/KhatyarFormsSchema.php" ] || [ "${rel}" = "lib/WorkContracts.php" ] || [ "${rel}" = "lib/CompanyWork.php" ] || [ "${rel}" = "lib/company_work_routes.php" ] || [ "${rel}" = "lib/company-work-template.xlsx" ] || [ "${rel}" = "lib/organization-template.xlsx" ]; then
              echo "FTP verify skipped for ${rel} (host FTP denies direct write; host-side PHP installer verifies checksum)."
              continue
            fi
            remote="/${rel}"
            if [[ "${rel}" == app/* ]]; then remote="/khat-yar.ir/${rel#app/}"; fi
            local_sha="$(sha256sum "${file}" | awk '{print $1}')"

            remote_basename="$(basename "${rel}")"
            verify_dir="${RUNNER_TEMP}/ftp-verify"
            verify_path="${verify_dir}/${remote_basename}"
            rm -rf "${verify_dir}"
            mkdir -p "${verify_dir}"

            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              set ftp:passive-mode true;
              set ftp:prefer-epsv false;
              set net:timeout 60;
              set net:max-retries 3;
              set ssl:verify-certificate no;
              lcd "${verify_dir}";
              get "${remote}";
              bye
            "

            if [ ! -f "${verify_path}" ]; then
              echo "ERROR: FTP verify download missing: ${verify_path}" >&2
              find "${verify_dir}" -maxdepth 1 -type f -print >&2 || true
              exit 1
            fi

            remote_sha="$(sha256sum "${verify_path}" | awk '{print $1}')"
            echo "FTP verify ${rel}: local=${local_sha} remote=${remote_sha}"
            [ "${local_sha}" = "${remote_sha}" ] || {
              echo "ERROR: FTP checksum mismatch for ${rel}" >&2
              exit 1
            }
          done < <(find deploy-payload -type f -print | sort)

      - name: Delete removed PHP files from FTP root
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-deletions.txt') != '' }}
        shell: bash
        env:
