name: Upload to Khatyar Host
# DEPLOY-RECONCILE: 20261007-v275

on:
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php.yml'
      - '.github/scripts/publish-local-vendor.sh'
      - '.github/scripts/build-local-vendor.py'
      - '.github/workflows/deploy-public-design.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  # Never cancel an active FTP transfer: cancellation can leave a partially completed upload
  # racing with the next deployment and cause checksum mismatches.
  cancel-in-progress: false

jobs:
  deploy-php:
    name: Upload changed PHP files to Khatyar Host
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Build and syntax-check current panel
        shell: bash
        run: |
          set -euo pipefail
          cd php
          npm install --no-save --no-package-lock typescript@5.9.3
          bash ./tools/build_panel_bundle.sh
          node --check app/assets/panel.bundle.js
          node --check app/assets/panel-long-operation-progress.js
          node tests/panel_long_operation_progress_test.cjs
          node tests/panel_post_login_loading_test.cjs
          node tests/report_download_progress_test.cjs
          node tests/panel_read_dedup_test.cjs
          grep -Eiq 'gps' app/assets/panel.bundle.js || { echo 'ERROR: GPS waiver control missing from compiled bundle'; exit 1; }
          node --check app/assets/school-service-admin.js
          node --check app/assets/school-complaints-admin.js
          node tests/school_complaints_export_progress_test.cjs
          node --check app/assets/dashboard-no-charts.js
          node --check app/assets/work-report-default-placement-ui.js
          node tests/dashboard_live_presence_accessibility_test.cjs
          node tests/work_report_placement_modal_accessibility_test.cjs
          grep -q 'schoolcomplaints' app/assets/panel.bundle.js
          php -l lib/Db.php
          php -l lib/Jwt.php
          for cron_file in app/cron*.php app/radio-cleanup.php; do php -l "$cron_file" || exit 1; done
          php tests/cron_background_test.php
          php tests/delivery_queue_retry_test.php
          php -l lib/Http.php
          php -l app/index.php
          php tests/attendance_peak_load_guard_test.php
          php tests/work_report_organization_cutoff_test.php
          php -l lib/WorkReportTemplateRepository.php
          php -l lib/work_report_template_routes.php
          php -l lib/WorkReportTemplateExporter.php
          php tests/work_report_builtin_organization_template_test.php
          php -l lib/WorkReportReadScope.php
          php -l lib/routes.php
          php -l lib/DashboardDiscipline.php
          php tests/dashboard_discipline_test.php
          php tests/gps_work_intervals_test.php
          grep -q 'dashboard-discipline' app/assets/panel.bundle.js
          grep -q 'به‌روزرسانی جدول' app/assets/panel.bundle.js
          php -l lib/school_service_sepand.php
          php -l lib/school_complaints_routes.php
          php -l lib/CompanyWork.php
          php -l lib/company_work_routes.php
          php tests/company_work_test.php
          php tests/company_work_archive_test.php
          php tests/company_work_collect_test.php
          php tests/company_work_reconciliation_test.php
          node tests/company_work_reconciliation_ui_test.cjs
          node tests/company_work_ui_test.cjs
          node tests/company_work_deployment_test.cjs
          node tests/company_work_http_test.cjs
          php -l lib/KhatyarFormsSchema.php
          php tests/forms_schema_test.php
          php tests/login_policy_test.php
          node tests/login_policy_ui_test.cjs
          php tests/work_policy_fixed_routing_test.php
          php tests/work_policy_requests_test.php
          php tests/request_edit_test.php
          node tests/request_edit_ui_test.cjs
          php tests/shift_rotation_test.php
          node tests/shift_rotation_ui_test.cjs
          node tests/shift_manager_tabs_ui_test.cjs
          node tests/shift_rotation_xlsx_test.cjs
          php tests/work_month_daily_reconciliation_test.php
          php tests/attendance_mohammadian_shortage_test.php
          php tests/official_holiday_1405_test.php
          php -l lib/IranCalendar.php
          php -l lib/GpsWorkIntervals.php
          php -l lib/InternetWorkIntervals.php
          php -l lib/presence_reverse_geocode.php
          php -l lib/subscription_invoice_routes.php
          php -l lib/WorkContracts.php
          php tests/work_contracts_test.php
          php tests/work_contract_management_test.php
          php tests/api_startup_performance_test.php
          node --check app/assets/work-contracts-admin.js
          php -l lib/RadioShiftGate.php
          php -l app/radio-api-v2.php
          php -l app/radio-api.php
          php -l app/radio-admin-api.php
          php -l app/api/admin-holiday-seed.php
          php -l app/index.php
          php -l app/api/admin-attendance-report.php
          echo "Panel build and PHP syntax checks passed."
          
      - name: Build deployment payload from this push
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git fetch origin main --force
          # The panel build step intentionally regenerates panel.bundle.js in the
          # working tree. Do not use checkout here because that fails when the
          # concurrent bundle workflow has already committed a newer bundle.
          git reset --hard origin/main

          # Build after syncing main: the previous reset discarded the generated bundle.
          cd php
          bash ./tools/build_panel_bundle.sh
          node --check app/assets/panel.bundle.js
          grep -Eiq 'gps' app/assets/panel.bundle.js || { echo 'ERROR: GPS waiver button not included after resetting main'; exit 1; }
          cd ..
          GITHUB_SHA="$(git rev-parse HEAD)" python3 php/tools/verify_work_template_bundle.py
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA=""

          if [ "${EVENT_NAME}" = "push" ]; then
            # Reconcile a small commit window so a PHP push is still deployed when
            # another automation commit (for example panel bundle regeneration)
            # lands before this workflow starts.
            TEN_COMMIT_BASE="$(git rev-list --max-count=11 "${HEAD_SHA}" | tail -n 1)"
            if [ "$(git rev-list --count "${HEAD_SHA}")" -gt 10 ] && [ -n "${TEN_COMMIT_BASE}" ]; then
              BASE_SHA="${TEN_COMMIT_BASE}"
            elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="${PUSH_BEFORE}"
            else
              BASE_SHA=""
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual deployment reconciles the last 10 commits on main.
            # Resolve the 11th commit as the diff base so the range contains exactly
            # the latest 10 commits. If fewer than 10 commits exist, fall back to
            # the root diff below.
            TEN_COMMIT_BASE="$(git rev-list --max-count=11 "${HEAD_SHA}" | tail -n 1)"
            if [ "$(git rev-list --count "${HEAD_SHA}")" -gt 10 ] && [ -n "${TEN_COMMIT_BASE}" ]; then
              BASE_SHA="${TEN_COMMIT_BASE}"
            else
              BASE_SHA=""
            fi
          else
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          echo "Deployment HEAD: ${HEAD_SHA}"
          echo "Deployment BASE: ${BASE_SHA:-<none>}"
          echo "Event: ${EVENT_NAME}"

          rm -rf deploy-payload
          mkdir -p deploy-payload
          : > deploy-deletions.txt
          : > /tmp/php-diff.txt

          if [ -n "${BASE_SHA}" ]; then
            git diff --name-status --find-renames --find-copies "${BASE_SHA}" "${HEAD_SHA}" -- php/ > /tmp/php-diff.txt
          else
            git diff-tree --root --no-commit-id --name-status --find-renames --find-copies -r "${HEAD_SHA}" -- php/ > /tmp/php-diff.txt
          fi

          echo "PHP changes in this deployment range:"
          cat /tmp/php-diff.txt || true

          while IFS=$'\t' read -r status path1 path2; do
            [ -n "${status:-}" ] || continue

            case "${status}" in
              A|M|T)
                rel="${path1#php/}"
                if [[ "${rel}" == tests/* ]]; then
                  echo "Keeping PHP test out of the FTP payload: ${rel}"
                  continue
                fi
                mkdir -p "deploy-payload/$(dirname "${rel}")"
                cp "${path1}" "deploy-payload/${rel}"
                ;;
              D)
                rel="${path1#php/}"
                if [[ "${rel}" == tests/* ]]; then continue; fi
                printf '%s\n' "${rel}" >> deploy-deletions.txt
                ;;
              R*|C*)
                old_rel="${path1#php/}"
                new_rel="${path2#php/}"
                if [[ "${new_rel}" == tests/* ]]; then continue; fi
                mkdir -p "deploy-payload/$(dirname "${new_rel}")"
                cp "${path2}" "deploy-payload/${new_rel}"
                printf '%s\n' "${old_rel}" >> deploy-deletions.txt
                ;;
              *)
                echo "ERROR: Unsupported PHP diff status: ${status}" >&2
                exit 1
                ;;
            esac
          done < /tmp/php-diff.txt

          # Always reconcile critical production files, even when they fall outside
          # the rolling 10-commit window or were regenerated in this job.
          for rel in app/index.php app/api/presence-immediate-api.php app/presence-immediate-api.php app/api/admin-attendance-report.php app/api/admin-attendance-report-owned.php app/api/admin-holiday-seed.php lib/Db.php lib/Jwt.php lib/Http.php lib/ShiftCalc.php lib/DeliveryQueue.php lib/Xlsx.php lib/XlsxWriter.php lib/IranCalendar.php lib/GpsWorkIntervals.php lib/InternetWorkIntervals.php lib/presence_reverse_geocode.php lib/subscription_invoice_routes.php lib/complaints_routes_extra.php lib/school_complaints_routes.php lib/school_complaint_accounts.php migrations/2026_11_18_school_complaints.sql migrations/2026_11_21_school_complaint_accounts.sql app/school-complaints-portal.html app/assets/school-complaints-portal.js app/assets/school-complaints-qr.js app/assets/school-complaints-pdf.js migrations/2026_11_19_dashboard_discipline_cache.sql lib/school_service_sepand.php lib/RadioShiftGate.php lib/DashboardDiscipline.php lib/WorkReportReadScope.php lib/OrganizationWorkPlacement.php lib/WorkReportDefaultPlacement.php lib/WorkReportSnapshot.php lib/WorkReportTemplateArchive.php lib/WorkReportTemplateParser.php lib/WorkReportTemplateExporter.php lib/WorkReportTemplateRepository.php lib/organization-template.xlsx lib/work_report_template_routes.php migrations/20261120_work_report_templates.sql migrations/20261121_attendance_action_receipts.sql lib/routes.php lib/OrgChart.php lib/Push.php lib/ZoneWorkflow.php lib/RegionalTeam.php lib/EmploymentAttendance.php lib/KhatyarFormsSchema.php lib/WorkContracts.php app/assets/work-contracts-admin.js app/assets/panel.bundle.js app/assets/school-complaints-admin.js app/assets/school-complaints-admin.css app/assets/school-service-admin.js app/panel.html app/landing.html app/khatyar-transparent.png app/assets/public-accurate.css app/assets/organizational-public.css app/assets/login-accurate.css app/assets/organizational-login.css app/assets/zone-workflow.css app/assets/login-premium.js app/assets/khatyar-reference-home-art.webp app/assets/khatyar-reference-login-art.webp app/assets/khatyar-reference-about-art.webp app/assets/khatyar-reference-contact-art.webp app/assets/khatyar-hero-emerald-v3.webp app/assets/khatyar-footer-emerald-v3.webp app/assets/khatyar-login-emerald-v3.webp app/contact-submit.php app/public-stats.php app/robots.txt app/sitemap.xml app/.htaccess app/app.html app/line-location.html app/public-form.html app/vendor/fetch.php; do
            if [ -f "php/${rel}" ]; then
              mkdir -p "deploy-payload/$(dirname "${rel}")"
              cp "php/${rel}" "deploy-payload/${rel}"
              echo "Forced production reconciliation: ${rel}"
            fi
          done

          sort -u deploy-deletions.txt -o deploy-deletions.txt

          payload_count="$(find deploy-payload -type f | wc -l | tr -d ' ')"
          deletion_count="$(grep -c . deploy-deletions.txt || true)"
          change_count="$(grep -c . /tmp/php-diff.txt || true)"

          echo "Deployment payload:"
          find deploy-payload -type f -print | sort || true
          echo "Remote deletions:"
          cat deploy-deletions.txt || true
          echo "PHP diff entries: ${change_count}"
          echo "Payload file count: ${payload_count}"
          echo "Deletion count: ${deletion_count}"

          if [ "${change_count}" -gt 0 ] && [ "${payload_count}" -eq 0 ] && [ "${deletion_count}" -eq 0 ]; then
            echo "ERROR: PHP changes were detected, but the deployment payload is empty." >&2
            exit 1
          fi

          if [ "${change_count}" -eq 0 ] && [ "${payload_count}" -eq 0 ]; then
            echo "No PHP changes in this commit; skipping Khatyar Host upload."
            echo "SKIP_HOST_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      - name: Install lftp
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && (hashFiles('deploy-payload/**') != '' || hashFiles('deploy-deletions.txt') != '') }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not block the whole deployment on a slow/locked APT mirror.
          # lftp is the only external dependency needed by this job.
          if ! command -v lftp >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get install -y -qq lftp; then
              echo "Cached APT install failed; refreshing package indexes with a hard timeout..."
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y -qq lftp
            fi
          fi
          command -v lftp
          lftp --version | head -n 1

      - name: Restore versioned runtime library cache
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        uses: actions/cache@v4
        with:
          path: .vendor-ci-cache
          key: local-vendor-v1-${{ runner.os }}-${{ hashFiles('.github/scripts/build-local-vendor.py') }}

      - name: Publish verified local runtime libraries before pages
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: bash .github/scripts/publish-local-vendor.sh

      - name: Upload changed PHP files to FTP root
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          : > /tmp/lftp-upload.cmd
          {
            echo 'set ftp:ssl-force false'
            echo 'set ftp:ssl-protect-data false'
            echo 'set ftp:passive-mode true'
            echo 'set ftp:prefer-epsv false'
            echo 'set net:timeout 60'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 2'
            echo 'set ssl:verify-certificate no'

            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              rel="${file#deploy-payload/}"

              # This module is owned by PHP on the host, like routes.php.
              if [ "${rel}" = "lib/complaints_routes_extra.php" ]; then
                continue
              fi

              if [ "${rel}" = "lib/school_complaints_routes.php" ] || [ "${rel}" = "lib/school_complaint_accounts.php" ] || [ "${rel}" = "lib/school_service_sepand.php" ] || [ "${rel}" = "lib/DashboardDiscipline.php" ] || [ "${rel}" = "lib/RegionalTeam.php" ] || [ "${rel}" = "lib/Db.php" ] || [ "${rel}" = "lib/Jwt.php" ] || [ "${rel}" = "lib/Http.php" ] || [ "${rel}" = "lib/WorkReportReadScope.php" ] || [ "${rel}" = "lib/OrganizationWorkPlacement.php" ] || [ "${rel}" = "lib/WorkReportDefaultPlacement.php" ] || [ "${rel}" = "lib/WorkReportSnapshot.php" ] || [ "${rel}" = "lib/WorkReportTemplateArchive.php" ] || [ "${rel}" = "lib/WorkReportTemplateParser.php" ] || [ "${rel}" = "lib/WorkReportTemplateExporter.php" ] || [ "${rel}" = "lib/WorkReportTemplateRepository.php" ] || [ "${rel}" = "lib/work_report_template_routes.php" ] || [ "${rel}" = "lib/routes.php" ] || [ "${rel}" = "lib/IranCalendar.php" ] || [ "${rel}" = "lib/ShiftCalc.php" ] || [ "${rel}" = "lib/GpsWorkIntervals.php" ] || [ "${rel}" = "lib/InternetWorkIntervals.php" ] || [ "${rel}" = "lib/presence_reverse_geocode.php" ] || [ "${rel}" = "lib/subscription_invoice_routes.php" ] || [ "${rel}" = "lib/RadioShiftGate.php" ] || [ "${rel}" = "lib/school_service_routes_extra.php" ] || [ "${rel}" = "lib/DeliveryQueue.php" ] || [ "${rel}" = "lib/Xlsx.php" ] || [ "${rel}" = "lib/XlsxWriter.php" ] || [ "${rel}" = "lib/OrgChart.php" ] || [ "${rel}" = "lib/Push.php" ] || [ "${rel}" = "lib/ZoneWorkflow.php" ] || [ "${rel}" = "lib/Seniority.php" ] || [ "${rel}" = "lib/Payroll.php" ] || [ "${rel}" = "lib/EmploymentAttendance.php" ] || [ "${rel}" = "lib/KhatyarFormsSchema.php" ] || [ "${rel}" = "lib/WorkContracts.php" ] || [ "${rel}" = "lib/CompanyWork.php" ] || [ "${rel}" = "lib/company_work_routes.php" ] || [ "${rel}" = "lib/company-work-template.xlsx" ] || [ "${rel}" = "lib/organization-template.xlsx" ]; then
                continue
              fi

              dir="$(dirname "${rel}")"
              if [ "${dir}" = "." ]; then
                remote_dir="/"
              else
                remote_dir="/${dir}"
                if [[ "${dir}" == app* ]]; then remote_dir="/khat-yar.ir${dir#app}"; fi
              fi

              local_file="${GITHUB_WORKSPACE}/${file}"
              remote_file="${remote_dir}/$(basename "${rel}")"
              if [ "${remote_dir}" != "/" ]; then
                printf 'mkdir -p %s\n' "${remote_dir}"
              fi
              printf 'put %s -o %s\n' "${local_file}" "${remote_file}"
            done < <(find deploy-payload -type f -print | sort)

            echo 'bye'
          } >> /tmp/lftp-upload.cmd

          echo "Uploading changed PHP files and creating missing asset directories:"
          find deploy-payload -type f -print | sort | grep -v '^deploy-payload/lib/routes.php$' || true

          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "$(cat /tmp/lftp-upload.cmd)"

          if [ -f deploy-payload/lib/school_complaint_accounts.php ] || [ -f deploy-payload/lib/school_service_sepand.php ] || [ -f deploy-payload/lib/complaints_routes_extra.php ] || [ -f deploy-payload/lib/DashboardDiscipline.php ] || [ -f deploy-payload/lib/RegionalTeam.php ] || [ -f deploy-payload/lib/Db.php ] || [ -f deploy-payload/lib/Jwt.php ] || [ -f deploy-payload/lib/Http.php ] || [ -f deploy-payload/lib/WorkReportDefaultPlacement.php ] || [ -f deploy-payload/lib/WorkReportReadScope.php ] || [ -f deploy-payload/lib/routes.php ] || [ -f deploy-payload/lib/IranCalendar.php ] || [ -f deploy-payload/lib/ShiftCalc.php ] || [ -f deploy-payload/lib/GpsWorkIntervals.php ] || [ -f deploy-payload/lib/InternetWorkIntervals.php ] || [ -f deploy-payload/lib/presence_reverse_geocode.php ] || [ -f deploy-payload/lib/subscription_invoice_routes.php ] || [ -f deploy-payload/lib/RadioShiftGate.php ] || [ -f deploy-payload/lib/school_service_routes_extra.php ] || [ -f deploy-payload/lib/DeliveryQueue.php ] || [ -f deploy-payload/lib/Xlsx.php ] || [ -f deploy-payload/lib/XlsxWriter.php ] || [ -f deploy-payload/lib/OrgChart.php ] || [ -f deploy-payload/lib/Push.php ] || [ -f deploy-payload/lib/ZoneWorkflow.php ] || [ -f deploy-payload/lib/Seniority.php ] || [ -f deploy-payload/lib/Payroll.php ] || [ -f deploy-payload/lib/EmploymentAttendance.php ] || [ -f deploy-payload/lib/CompanyWork.php ] || [ -f deploy-payload/lib/company_work_routes.php ] || [ -f deploy-payload/lib/company-work-template.xlsx ] || [ -f deploy-payload/lib/organization-template.xlsx ]; then
            ROUTES_TOKEN="$(openssl rand -hex 32)"
            INSTALLER_NAME=".attendance-lib-install-${GITHUB_SHA}.php"

            cat > "/tmp/${INSTALLER_NAME}" <<PHP
          <?php
          declare(strict_types=1);
          \$token = '${ROUTES_TOKEN}';
          if (!hash_equals(\$token, (string)(\$_POST['token'] ?? ''))) {
              http_response_code(403);
              exit('forbidden');
          }
          \$files = [
              'Db.php' => 'Db.php',
              'Jwt.php' => 'Jwt.php',
              'Http.php' => 'Http.php',
              'DeliveryQueue.php' => 'DeliveryQueue.php',
              'Xlsx.php' => 'Xlsx.php',
              'XlsxWriter.php' => 'XlsxWriter.php',
              'OrgChart.php' => 'OrgChart.php',
              'Push.php' => 'Push.php',
              'ZoneWorkflow.php' => 'ZoneWorkflow.php',
              'RegionalTeam.php' => 'RegionalTeam.php',
              'Seniority.php' => 'Seniority.php',
              'Payroll.php' => 'Payroll.php',
              'CompanyWork.php' => 'CompanyWork.php',
              'company_work_routes.php' => 'company_work_routes.php',
              'company-work-template.xlsx' => 'company-work-template.xlsx',
              'organization-template.xlsx' => 'organization-template.xlsx',
              'EmploymentAttendance.php' => 'EmploymentAttendance.php',
              'KhatyarFormsSchema.php' => 'KhatyarFormsSchema.php',
              'WorkContracts.php' => 'WorkContracts.php',
              'DashboardDiscipline.php' => 'DashboardDiscipline.php',
              'WorkReportReadScope.php' => 'WorkReportReadScope.php',
              'OrganizationWorkPlacement.php' => 'OrganizationWorkPlacement.php',
              'WorkReportDefaultPlacement.php' => 'WorkReportDefaultPlacement.php',
              'WorkReportSnapshot.php' => 'WorkReportSnapshot.php',
              'WorkReportTemplateArchive.php' => 'WorkReportTemplateArchive.php',
              'WorkReportTemplateParser.php' => 'WorkReportTemplateParser.php',
              'WorkReportTemplateExporter.php' => 'WorkReportTemplateExporter.php',
              'WorkReportTemplateRepository.php' => 'WorkReportTemplateRepository.php',
              'work_report_template_routes.php' => 'work_report_template_routes.php',
              'routes.php' => 'routes.php',
              'IranCalendar.php' => 'IranCalendar.php',
              'ShiftCalc.php' => 'ShiftCalc.php',
              'GpsWorkIntervals.php' => 'GpsWorkIntervals.php',
              'InternetWorkIntervals.php' => 'InternetWorkIntervals.php',
              'presence_reverse_geocode.php' => 'presence_reverse_geocode.php',
              'subscription_invoice_routes.php' => 'subscription_invoice_routes.php',
              'RadioShiftGate.php' => 'RadioShiftGate.php',
              'school_service_routes_extra.php' => 'school_service_routes_extra.php',
              'school_complaints_routes.php' => 'school_complaints_routes.php',
              'school_complaint_accounts.php' => 'school_complaint_accounts.php',
              'school_service_sepand.php' => 'school_service_sepand.php',
              'complaints_routes_extra.php' => 'complaints_routes_extra.php',
          ];
          \$result = [];
          foreach (\$files as \$name => \$canonical) {
              \$src = __DIR__ . '/.attendance-deploy-' . \$name;
              \$dst = dirname(__DIR__, 2) . '/lib/' . \$canonical;
              if (!is_file(\$src)) continue;
              \$targetWritable = is_file(\$dst) ? is_writable(\$dst) : is_writable(dirname(\$dst));
              if (!\$targetWritable) {
                  http_response_code(500);
                  exit('target ' . \$canonical . ' is not writable by PHP');
              }
              if (!copy(\$src, \$dst)) {
                  http_response_code(500);
                  exit('copy to canonical ' . \$canonical . ' failed');
              }
              \$srcSha = hash_file('sha256', \$src);
              \$dstSha = hash_file('sha256', \$dst);
              if (!\$srcSha || !\$dstSha || !hash_equals(\$srcSha, \$dstSha)) {
                  http_response_code(500);
                  exit(\$canonical . ' checksum mismatch after host-side copy');
              }
              \$result[\$canonical] = \$dstSha;
              @unlink(\$src);
          }
          @unlink(__FILE__);
          header('Content-Type: application/json; charset=utf-8');
          echo json_encode(['ok'=>true,'files'=>\$result], JSON_UNESCAPED_UNICODE);
          PHP

            : > /tmp/attendance-lib-stage.cmd
            {
              echo 'set ftp:ssl-force false'
              echo 'set ftp:ssl-protect-data false'
              echo 'set ftp:passive-mode true'
              echo 'set ftp:prefer-epsv false'
              echo 'set net:timeout 60'
              echo 'set net:max-retries 5'
              echo 'set ssl:verify-certificate no'
