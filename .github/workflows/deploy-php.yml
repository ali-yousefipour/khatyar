name: Upload to Khatyar Host
# DEPLOY-RECONCILE: 20261007-v275

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  # Never cancel an active FTP transfer: cancellation can leave a partially completed upload
  # racing with the next deployment and cause checksum mismatches.
  cancel-in-progress: false

jobs:
  deploy-php:
    name: Upload changed PHP files to Khatyar Host
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Build and syntax-check current panel
        shell: bash
        run: |
          set -euo pipefail
          cd php
          npm install --no-save --no-package-lock typescript@5.9.3
          bash ./tools/build_panel_bundle.sh
          node --check app/assets/panel.bundle.js
          grep -Eiq 'gps' app/assets/panel.bundle.js || { echo 'ERROR: GPS waiver control missing from compiled bundle'; exit 1; }
          node --check app/assets/school-service-admin.js
          php -l lib/Db.php
          for cron_file in app/cron*.php app/radio-cleanup.php; do php -l "$cron_file" || exit 1; done
          php tests/cron_background_test.php
          php tests/delivery_queue_retry_test.php
          php -l lib/Http.php
          php -l app/index.php
          php tests/attendance_peak_load_guard_test.php
          php -l lib/routes.php
          php -l lib/CompanyWork.php
          php -l lib/company_work_routes.php
          php tests/company_work_test.php
          php tests/company_work_archive_test.php
          php tests/company_work_collect_test.php
          php tests/company_work_reconciliation_test.php
          node tests/company_work_reconciliation_ui_test.cjs
          node tests/company_work_ui_test.cjs
          node tests/company_work_deployment_test.cjs
          node tests/company_work_http_test.cjs
          php -l lib/KhatyarFormsSchema.php
          php tests/forms_schema_test.php
          php tests/login_policy_test.php
          node tests/login_policy_ui_test.cjs
          php tests/work_policy_requests_test.php
          php tests/request_edit_test.php
          node tests/request_edit_ui_test.cjs
          php tests/shift_rotation_test.php
          node tests/shift_rotation_ui_test.cjs
          node tests/shift_rotation_xlsx_test.cjs
          php tests/work_month_daily_reconciliation_test.php
          php tests/attendance_mohammadian_shortage_test.php
          php tests/official_holiday_1405_test.php
          php -l lib/IranCalendar.php
          php -l lib/GpsWorkIntervals.php
          php -l lib/presence_reverse_geocode.php
          php -l lib/subscription_invoice_routes.php
          php -l lib/WorkContracts.php
          php tests/work_contracts_test.php
          php tests/work_contract_management_test.php
          php tests/api_startup_performance_test.php
          node --check app/assets/work-contracts-admin.js
          php -l lib/RadioShiftGate.php
          php -l app/radio-api-v2.php
          php -l app/radio-api.php
          php -l app/radio-admin-api.php
          php -l app/api/admin-holiday-seed.php
          php -l app/index.php
          php -l app/api/admin-attendance-report.php
          echo "Panel build and PHP syntax checks passed."
          
      - name: Build deployment payload from this push
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git fetch origin main --force
          # The panel build step intentionally regenerates panel.bundle.js in the
          # working tree. Do not use checkout here because that fails when the
          # concurrent bundle workflow has already committed a newer bundle.
          git reset --hard origin/main

          # Build after syncing main: the previous reset discarded the generated bundle.
          cd php
          bash ./tools/build_panel_bundle.sh
          node --check app/assets/panel.bundle.js
          grep -Eiq 'gps' app/assets/panel.bundle.js || { echo 'ERROR: GPS waiver button not included after resetting main'; exit 1; }
          cd ..
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA=""

          if [ "${EVENT_NAME}" = "push" ]; then
            # Reconcile a small commit window so a PHP push is still deployed when
            # another automation commit (for example panel bundle regeneration)
            # lands before this workflow starts.
            TEN_COMMIT_BASE="$(git rev-list --max-count=11 "${HEAD_SHA}" | tail -n 1)"
            if [ "$(git rev-list --count "${HEAD_SHA}")" -gt 10 ] && [ -n "${TEN_COMMIT_BASE}" ]; then
              BASE_SHA="${TEN_COMMIT_BASE}"
            elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="${PUSH_BEFORE}"
            else
              BASE_SHA=""
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual deployment reconciles the last 10 commits on main.
            # Resolve the 11th commit as the diff base so the range contains exactly
            # the latest 10 commits. If fewer than 10 commits exist, fall back to
            # the root diff below.
            TEN_COMMIT_BASE="$(git rev-list --max-count=11 "${HEAD_SHA}" | tail -n 1)"
            if [ "$(git rev-list --count "${HEAD_SHA}")" -gt 10 ] && [ -n "${TEN_COMMIT_BASE}" ]; then
              BASE_SHA="${TEN_COMMIT_BASE}"
            else
              BASE_SHA=""
            fi
          else
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          echo "Deployment HEAD: ${HEAD_SHA}"
          echo "Deployment BASE: ${BASE_SHA:-<none>}"
          echo "Event: ${EVENT_NAME}"

          rm -rf deploy-payload
          mkdir -p deploy-payload
          : > deploy-deletions.txt
          : > /tmp/php-diff.txt

          if [ -n "${BASE_SHA}" ]; then
            git diff --name-status --find-renames --find-copies "${BASE_SHA}" "${HEAD_SHA}" -- php/ > /tmp/php-diff.txt
          else
            git diff-tree --root --no-commit-id --name-status --find-renames --find-copies -r "${HEAD_SHA}" -- php/ > /tmp/php-diff.txt
          fi

          echo "PHP changes in this deployment range:"
          cat /tmp/php-diff.txt || true

          while IFS=$'\t' read -r status path1 path2; do
            [ -n "${status:-}" ] || continue

            case "${status}" in
              A|M|T)
                rel="${path1#php/}"
                if [[ "${rel}" == tests/* ]]; then
                  echo "Keeping PHP test out of the FTP payload: ${rel}"
                  continue
                fi
                mkdir -p "deploy-payload/$(dirname "${rel}")"
                cp "${path1}" "deploy-payload/${rel}"
                ;;
              D)
                rel="${path1#php/}"
                if [[ "${rel}" == tests/* ]]; then continue; fi
                printf '%s\n' "${rel}" >> deploy-deletions.txt
                ;;
              R*|C*)
                old_rel="${path1#php/}"
                new_rel="${path2#php/}"
                if [[ "${new_rel}" == tests/* ]]; then continue; fi
                mkdir -p "deploy-payload/$(dirname "${new_rel}")"
                cp "${path2}" "deploy-payload/${new_rel}"
                printf '%s\n' "${old_rel}" >> deploy-deletions.txt
                ;;
              *)
                echo "ERROR: Unsupported PHP diff status: ${status}" >&2
                exit 1
                ;;
            esac
          done < /tmp/php-diff.txt

          # Always reconcile critical production files, even when they fall outside
          # the rolling 10-commit window or were regenerated in this job.
          for rel in app/index.php app/api/admin-attendance-report.php app/api/admin-attendance-report-owned.php app/api/admin-holiday-seed.php lib/IranCalendar.php lib/GpsWorkIntervals.php lib/presence_reverse_geocode.php lib/subscription_invoice_routes.php lib/RadioShiftGate.php lib/routes.php lib/OrgChart.php lib/RegionalTeam.php lib/EmploymentAttendance.php lib/KhatyarFormsSchema.php lib/WorkContracts.php app/assets/work-contracts-admin.js app/assets/panel.bundle.js app/assets/school-service-admin.js app/panel.html; do
            if [ -f "php/${rel}" ]; then
              mkdir -p "deploy-payload/$(dirname "${rel}")"
              cp "php/${rel}" "deploy-payload/${rel}"
              echo "Forced production reconciliation: ${rel}"
            fi
          done

          sort -u deploy-deletions.txt -o deploy-deletions.txt

          payload_count="$(find deploy-payload -type f | wc -l | tr -d ' ')"
          deletion_count="$(grep -c . deploy-deletions.txt || true)"
          change_count="$(grep -c . /tmp/php-diff.txt || true)"

          echo "Deployment payload:"
          find deploy-payload -type f -print | sort || true
          echo "Remote deletions:"
          cat deploy-deletions.txt || true
          echo "PHP diff entries: ${change_count}"
          echo "Payload file count: ${payload_count}"
          echo "Deletion count: ${deletion_count}"

          if [ "${change_count}" -gt 0 ] && [ "${payload_count}" -eq 0 ] && [ "${deletion_count}" -eq 0 ]; then
            echo "ERROR: PHP changes were detected, but the deployment payload is empty." >&2
            exit 1
          fi

          if [ "${change_count}" -eq 0 ] && [ "${payload_count}" -eq 0 ]; then
            echo "No PHP changes in this commit; skipping Khatyar Host upload."
            echo "SKIP_HOST_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      - name: Install lftp
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && (hashFiles('deploy-payload/**') != '' || hashFiles('deploy-deletions.txt') != '') }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not block the whole deployment on a slow/locked APT mirror.
          # lftp is the only external dependency needed by this job.
          if ! command -v lftp >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get install -y -qq lftp; then
              echo "Cached APT install failed; refreshing package indexes with a hard timeout..."
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y -qq lftp
            fi
          fi
          command -v lftp
          lftp --version | head -n 1

      - name: Upload changed PHP files to FTP root
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          : > /tmp/lftp-upload.cmd
          {
            echo 'set ftp:ssl-force false'
            echo 'set ftp:ssl-protect-data false'
            echo 'set ftp:passive-mode true'
            echo 'set ftp:prefer-epsv false'
            echo 'set net:timeout 60'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 2'
            echo 'set ssl:verify-certificate no'

            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              rel="${file#deploy-payload/}"

              if [ "${rel}" = "lib/RegionalTeam.php" ] || [ "${rel}" = "lib/Db.php" ] || [ "${rel}" = "lib/Http.php" ] || [ "${rel}" = "lib/routes.php" ] || [ "${rel}" = "lib/IranCalendar.php" ] || [ "${rel}" = "lib/ShiftCalc.php" ] || [ "${rel}" = "lib/GpsWorkIntervals.php" ] || [ "${rel}" = "lib/presence_reverse_geocode.php" ] || [ "${rel}" = "lib/subscription_invoice_routes.php" ] || [ "${rel}" = "lib/RadioShiftGate.php" ] || [ "${rel}" = "lib/school_service_routes_extra.php" ] || [ "${rel}" = "lib/DeliveryQueue.php" ] || [ "${rel}" = "lib/Xlsx.php" ] || [ "${rel}" = "lib/XlsxWriter.php" ] || [ "${rel}" = "lib/OrgChart.php" ] || [ "${rel}" = "lib/Seniority.php" ] || [ "${rel}" = "lib/Payroll.php" ] || [ "${rel}" = "lib/EmploymentAttendance.php" ] || [ "${rel}" = "lib/KhatyarFormsSchema.php" ] || [ "${rel}" = "lib/WorkContracts.php" ] || [ "${rel}" = "lib/CompanyWork.php" ] || [ "${rel}" = "lib/company_work_routes.php" ] || [ "${rel}" = "lib/company-work-template.xlsx" ]; then
                continue
              fi

              dir="$(dirname "${rel}")"
              if [ "${dir}" = "." ]; then
                remote_dir="/"
              else
                remote_dir="/${dir}"
              fi

              local_file="${GITHUB_WORKSPACE}/${file}"
              remote_file="${remote_dir}/$(basename "${rel}")"
              printf 'put %s -o %s\n' "${local_file}" "${remote_file}"
            done < <(find deploy-payload -type f -print | sort)

            echo 'bye'
          } >> /tmp/lftp-upload.cmd

          echo "Uploading changed PHP files without remote directory creation:"
          find deploy-payload -type f -print | sort | grep -v '^deploy-payload/lib/routes.php$' || true

          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "$(cat /tmp/lftp-upload.cmd)"

          if [ -f deploy-payload/lib/RegionalTeam.php ] || [ -f deploy-payload/lib/Db.php ] || [ -f deploy-payload/lib/Http.php ] || [ -f deploy-payload/lib/routes.php ] || [ -f deploy-payload/lib/IranCalendar.php ] || [ -f deploy-payload/lib/ShiftCalc.php ] || [ -f deploy-payload/lib/GpsWorkIntervals.php ] || [ -f deploy-payload/lib/presence_reverse_geocode.php ] || [ -f deploy-payload/lib/subscription_invoice_routes.php ] || [ -f deploy-payload/lib/RadioShiftGate.php ] || [ -f deploy-payload/lib/school_service_routes_extra.php ] || [ -f deploy-payload/lib/DeliveryQueue.php ] || [ -f deploy-payload/lib/Xlsx.php ] || [ -f deploy-payload/lib/XlsxWriter.php ] || [ -f deploy-payload/lib/OrgChart.php ] || [ -f deploy-payload/lib/Seniority.php ] || [ -f deploy-payload/lib/Payroll.php ] || [ -f deploy-payload/lib/EmploymentAttendance.php ] || [ -f deploy-payload/lib/CompanyWork.php ] || [ -f deploy-payload/lib/company_work_routes.php ] || [ -f deploy-payload/lib/company-work-template.xlsx ]; then
            ROUTES_TOKEN="$(openssl rand -hex 32)"
            INSTALLER_NAME=".attendance-lib-install-${GITHUB_SHA}.php"

            cat > "/tmp/${INSTALLER_NAME}" <<PHP
          <?php
          declare(strict_types=1);
          \$token = '${ROUTES_TOKEN}';
          if (!hash_equals(\$token, (string)(\$_POST['token'] ?? ''))) {
              http_response_code(403);
              exit('forbidden');
          }
          \$files = [
              'Db.php' => 'Db.php',
              'Http.php' => 'Http.php',
              'DeliveryQueue.php' => 'DeliveryQueue.php',
              'Xlsx.php' => 'Xlsx.php',
              'XlsxWriter.php' => 'XlsxWriter.php',
              'OrgChart.php' => 'OrgChart.php',
              'RegionalTeam.php' => 'RegionalTeam.php',
              'Seniority.php' => 'Seniority.php',
              'Payroll.php' => 'Payroll.php',
              'CompanyWork.php' => 'CompanyWork.php',
              'company_work_routes.php' => 'company_work_routes.php',
              'company-work-template.xlsx' => 'company-work-template.xlsx',
              'EmploymentAttendance.php' => 'EmploymentAttendance.php',
              'KhatyarFormsSchema.php' => 'KhatyarFormsSchema.php',
              'WorkContracts.php' => 'WorkContracts.php',
              'routes.php' => 'routes.php',
              'IranCalendar.php' => 'IranCalendar.php',
              'ShiftCalc.php' => 'ShiftCalc.php',
              'GpsWorkIntervals.php' => 'GpsWorkIntervals.php',
              'presence_reverse_geocode.php' => 'presence_reverse_geocode.php',
              'subscription_invoice_routes.php' => 'subscription_invoice_routes.php',
              'RadioShiftGate.php' => 'RadioShiftGate.php',
              'school_service_routes_extra.php' => 'school_service_routes_extra.php',
          ];
          \$result = [];
          foreach (\$files as \$name => \$canonical) {
              \$src = __DIR__ . '/.attendance-deploy-' . \$name;
              \$dst = dirname(__DIR__, 2) . '/lib/' . \$canonical;
              if (!is_file(\$src)) continue;
              \$targetWritable = is_file(\$dst) ? is_writable(\$dst) : is_writable(dirname(\$dst));
              if (!\$targetWritable) {
                  http_response_code(500);
                  exit('target ' . \$canonical . ' is not writable by PHP');
              }
              if (!copy(\$src, \$dst)) {
                  http_response_code(500);
                  exit('copy to canonical ' . \$canonical . ' failed');
              }
              \$srcSha = hash_file('sha256', \$src);
              \$dstSha = hash_file('sha256', \$dst);
              if (!\$srcSha || !\$dstSha || !hash_equals(\$srcSha, \$dstSha)) {
                  http_response_code(500);
                  exit(\$canonical . ' checksum mismatch after host-side copy');
              }
              \$result[\$canonical] = \$dstSha;
              @unlink(\$src);
          }
          @unlink(__FILE__);
          header('Content-Type: application/json; charset=utf-8');
          echo json_encode(['ok'=>true,'files'=>\$result], JSON_UNESCAPED_UNICODE);
          PHP

            : > /tmp/attendance-lib-stage.cmd
            {
              echo 'set ftp:ssl-force false'
              echo 'set ftp:ssl-protect-data false'
              echo 'set ftp:passive-mode true'
              echo 'set ftp:prefer-epsv false'
              echo 'set net:timeout 60'
              echo 'set net:max-retries 5'
              echo 'set ssl:verify-certificate no'
              for name in Db.php Http.php DeliveryQueue.php Xlsx.php XlsxWriter.php OrgChart.php RegionalTeam.php Seniority.php Payroll.php EmploymentAttendance.php KhatyarFormsSchema.php WorkContracts.php CompanyWork.php company_work_routes.php company-work-template.xlsx routes.php IranCalendar.php ShiftCalc.php GpsWorkIntervals.php presence_reverse_geocode.php subscription_invoice_routes.php RadioShiftGate.php school_service_routes_extra.php; do
                if [ -f "deploy-payload/lib/$name" ]; then
                  printf 'put %s -o %s\n' "${GITHUB_WORKSPACE}/deploy-payload/lib/$name" "/app/assets/.attendance-deploy-$name"
                fi
              done
              printf 'put %s -o %s\n' "/tmp/${INSTALLER_NAME}" "/app/assets/${INSTALLER_NAME}"
              echo 'bye'
            } >> /tmp/attendance-lib-stage.cmd

            lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "$(cat /tmp/attendance-lib-stage.cmd)"

            echo "Installing protected attendance PHP libraries through the host PHP process..."
            install_url="https://app.yousefipour.ir/assets/${INSTALLER_NAME}"
            response="$(curl --fail --silent --show-error --max-time 30 \
              -X POST \
              --data-urlencode "token=${ROUTES_TOKEN}" \
              "${install_url}")"
            echo "${response}"
            echo "${response}" | grep -q '"ok":true'
            # Assert that the host-side installer actually copied each module
            # to the canonical /lib directory. Staging alone is insufficient.
            for name in KhatyarFormsSchema.php WorkContracts.php RegionalTeam.php; do
              local_path="deploy-payload/lib/${name}"
              expected_sha="$(sha256sum "${local_path}" | awk '{print $1}')"
              php -r '
                $response=json_decode($argv[1],true);
                $name=$argv[2];$expected=$argv[3];
                if(!is_array($response)||empty($response["ok"])||
                   !hash_equals($expected,(string)($response["files"][$name]??""))) {
                  fwrite(STDERR,"ERROR: canonical PHP module was not installed or checksum mismatched: ".$name.PHP_EOL);
                  exit(1);
                }
              ' "${response}" "${name}" "${expected_sha}"
            done

            echo
            echo "Host-side attendance PHP library installation completed."
          # The new form and contract modules must be present in the same
          # canonical /lib path used by app/index.php; absence fails deployment.
          for name in KhatyarFormsSchema.php WorkContracts.php RegionalTeam.php; do
            if [ ! -f "deploy-payload/lib/${name}" ]; then
              echo "ERROR: missing required module from deployment payload: ${name}" >&2
              exit 1
            fi
            echo "Staged and installed required PHP module: ${name}"
          done
          fi

      - name: Verify uploaded FTP files
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            rel="${file#deploy-payload/}"
            if [ "${rel}" = "lib/RegionalTeam.php" ] || [ "${rel}" = "lib/Db.php" ] || [ "${rel}" = "lib/Http.php" ] || [ "${rel}" = "lib/routes.php" ] || [ "${rel}" = "lib/IranCalendar.php" ] || [ "${rel}" = "lib/ShiftCalc.php" ] || [ "${rel}" = "lib/GpsWorkIntervals.php" ] || [ "${rel}" = "lib/presence_reverse_geocode.php" ] || [ "${rel}" = "lib/subscription_invoice_routes.php" ] || [ "${rel}" = "lib/RadioShiftGate.php" ] || [ "${rel}" = "lib/school_service_routes_extra.php" ] || [ "${rel}" = "lib/DeliveryQueue.php" ] || [ "${rel}" = "lib/Xlsx.php" ] || [ "${rel}" = "lib/XlsxWriter.php" ] || [ "${rel}" = "lib/OrgChart.php" ] || [ "${rel}" = "lib/Seniority.php" ] || [ "${rel}" = "lib/Payroll.php" ] || [ "${rel}" = "lib/EmploymentAttendance.php" ] || [ "${rel}" = "lib/KhatyarFormsSchema.php" ] || [ "${rel}" = "lib/WorkContracts.php" ] || [ "${rel}" = "lib/CompanyWork.php" ] || [ "${rel}" = "lib/company_work_routes.php" ] || [ "${rel}" = "lib/company-work-template.xlsx" ]; then
              echo "FTP verify skipped for ${rel} (host FTP denies direct write; host-side PHP installer verifies checksum)."
              continue
            fi
            remote="/${rel}"
            local_sha="$(sha256sum "${file}" | awk '{print $1}')"

            remote_basename="$(basename "${rel}")"
            verify_dir="${RUNNER_TEMP}/ftp-verify"
            verify_path="${verify_dir}/${remote_basename}"
            rm -rf "${verify_dir}"
            mkdir -p "${verify_dir}"

            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              set ftp:passive-mode true;
              set ftp:prefer-epsv false;
              set net:timeout 60;
              set net:max-retries 3;
              set ssl:verify-certificate no;
              lcd "${verify_dir}";
              get "${remote}";
              bye
            "

            if [ ! -f "${verify_path}" ]; then
              echo "ERROR: FTP verify download missing: ${verify_path}" >&2
              find "${verify_dir}" -maxdepth 1 -type f -print >&2 || true
              exit 1
            fi

            remote_sha="$(sha256sum "${verify_path}" | awk '{print $1}')"
            echo "FTP verify ${rel}: local=${local_sha} remote=${remote_sha}"
            [ "${local_sha}" = "${remote_sha}" ] || {
              echo "ERROR: FTP checksum mismatch for ${rel}" >&2
              exit 1
            }
          done < <(find deploy-payload -type f -print | sort)

      - name: Delete removed PHP files from FTP root
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-deletions.txt') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          while IFS= read -r rel; do
            [ -n "${rel}" ] || continue
            echo "Deleting remote: /${rel}"

            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              set ftp:passive-mode true;
              set ftp:prefer-epsv false;
              set net:timeout 30;
              set net:max-retries 2;
              set ssl:verify-certificate no;
              rm "/${rel}";
              bye
            " || {
              echo "Warning: remote file may already be absent: /${rel}"
            }
          done < deploy-deletions.txt

      - name: Apply and verify employment date schema on host
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          installer=".employment-schema-${GITHUB_SHA}.php"
          cat > "/tmp/${installer}" <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          try {
              $received = (string)($_POST['token'] ?? '');
              $expected = getenv('KHATYAR_SCHEMA_TOKEN') ?: '';
              // Replaced with a fresh token in the deployment script before upload.
              $expected = '__SCHEMA_TOKEN__';
              if ($received === '' || !hash_equals($expected, $received)) {
                  http_response_code(403);
                  exit(json_encode(['ok'=>false, 'error'=>'forbidden']));
              }
              $config = require dirname(__DIR__, 2) . '/config.php';
              $pdo = new PDO(
                  "mysql:host={$config['db_host']};dbname={$config['db_name']};charset=utf8mb4",
                  $config['db_user'], $config['db_pass'],
                  [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]
              );
              foreach (['employment_start_date','employment_end_date'] as $column) {
                  $check = $pdo->prepare("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='users' AND column_name=?");
                  $check->execute([$column]);
                  if ((int)$check->fetchColumn() === 0) {
                      $pdo->exec("ALTER TABLE users ADD COLUMN `{$column}` VARCHAR(10) NULL");
                  }
              }
              $check = $pdo->query("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='users' AND column_name IN ('employment_start_date','employment_end_date')");
              if ((int)$check->fetchColumn() !== 2) throw new RuntimeException('Schema columns not present after migration');
              // All attendance tables and columns are migrated here, outside the
              // morning rush. Never issue CREATE/ALTER in normal API requests.
              $pdo->exec("CREATE TABLE IF NOT EXISTS shift_handovers (
                id INT AUTO_INCREMENT PRIMARY KEY, token VARCHAR(80) NOT NULL UNIQUE,
                from_user_id INT NOT NULL, to_user_id INT NULL, line_id INT NULL,
                attendance_id INT NULL, status VARCHAR(20) NOT NULL DEFAULT 'pending',
                expires_at DATETIME NOT NULL, accepted_at DATETIME NULL,
                created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                INDEX idx_handover_token (token), INDEX idx_handover_from (from_user_id,status)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
              $pdo->exec("CREATE TABLE IF NOT EXISTS attendance_ot_adjustments (
                id INT AUTO_INCREMENT PRIMARY KEY, user_id INT NOT NULL,
                jdate VARCHAR(10) NOT NULL, minutes INT NOT NULL DEFAULT 0,
                reason TEXT NULL, approved_by INT NULL,
                created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                UNIQUE KEY uq_att_adj (user_id,jdate),
                INDEX idx_att_adj_user (user_id,jdate)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
              $pdo->exec("CREATE TABLE IF NOT EXISTS attendance_reject_logs (
                id INT AUTO_INCREMENT PRIMARY KEY, user_id INT NOT NULL,
                line_id INT NULL, method VARCHAR(30) NULL,
                lat DECIMAL(10,7) NULL, lng DECIMAL(10,7) NULL,
                accuracy_m DECIMAL(10,2) NULL, reason TEXT NULL,
                meta JSON NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                INDEX idx_arl_user_time(user_id,created_at),
                INDEX idx_arl_line_time(line_id,created_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
              $pdo->exec("CREATE TABLE IF NOT EXISTS login_otp (
                id INT AUTO_INCREMENT PRIMARY KEY,
                user_id INT NOT NULL,
                mobile VARCHAR(20) NOT NULL,
                code_hash VARCHAR(64) NOT NULL,
                attempts INT NOT NULL DEFAULT 0,
                expires_at DATETIME NOT NULL,
                consumed_at DATETIME NULL,
                created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                INDEX idx_login_otp_mobile (mobile, created_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
              // OTP lookup patterns are user-scoped and time sensitive.
              $otpIndex = $pdo->prepare("SELECT COUNT(*) FROM information_schema.statistics
                WHERE table_schema=DATABASE() AND table_name='login_otp' AND index_name=?");
              $otpIndex->execute(['idx_login_otp_user_created']);
              if (!(int)$otpIndex->fetchColumn()) {
                $pdo->exec("ALTER TABLE login_otp ADD INDEX idx_login_otp_user_created (user_id, created_at)");
              }
              $pdo->exec("CREATE TABLE IF NOT EXISTS api_client_requests_v2 (
                id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                request_hash CHAR(64) NOT NULL, client_uuid VARCHAR(191) NOT NULL,
                method VARCHAR(10) NOT NULL, path VARCHAR(191) NOT NULL,
                status_code SMALLINT NOT NULL DEFAULT 102,
                response_json LONGTEXT NULL,
                created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                completed_at DATETIME NULL,
                PRIMARY KEY(id), UNIQUE KEY uq_api_client_request_hash(request_hash),
                KEY idx_api_client_request_created(created_at),
                KEY idx_api_client_request_uuid(client_uuid)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci");
              $columns = [
                'handover_id' => 'INT NULL',
                'calc_json' => 'JSON NULL',
                'client_check_in' => 'DATETIME NULL',
                'client_check_out' => 'DATETIME NULL',
                'out_line_id' => 'INT NULL',
                'in_station' => 'VARCHAR(150) NULL',
                'out_station' => 'VARCHAR(150) NULL'
              ];
              $columnCheck = $pdo->prepare("SELECT COUNT(*) FROM information_schema.columns
                WHERE table_schema=DATABASE() AND table_name='staff_attendance' AND column_name=?");
              foreach ($columns as $column => $definition) {
                $columnCheck->execute([$column]);
                if (!(int)$columnCheck->fetchColumn())
                  $pdo->exec("ALTER TABLE staff_attendance ADD COLUMN `{$column}` {$definition}");
              }
              // Index checks happen only during deployment, never per user.
              $indexCheck = $pdo->prepare("SELECT COUNT(*) FROM information_schema.statistics
                WHERE table_schema=DATABASE() AND table_name='staff_attendance' AND index_name=?");
              $indexCheck->execute(['idx_att_user_open_in']);
              if (!(int)$indexCheck->fetchColumn()) {
                $pdo->exec("ALTER TABLE staff_attendance ADD INDEX idx_att_user_open_in
                  (user_id, check_out, check_in)");
              }
              @unlink(__FILE__);
              echo json_encode(['ok'=>true, 'employment_columns'=>2, 'attendance_schema'=>true]);
          } catch (Throwable $error) {
              http_response_code(500);
              error_log('Employment schema deployment: '.$error->getMessage());
              echo json_encode(['ok'=>false, 'error'=>'schema migration failed']);
          }
          PHP
          sed -i "s/__SCHEMA_TOKEN__/${token}/g" "/tmp/${installer}"
          lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set net:max-retries 4;
            set ssl:verify-certificate no;
            put /tmp/${installer} -o /app/assets/${installer};
            bye
          "
          response="$(curl --fail --silent --show-error --max-time 45 --retry 2 \
            -X POST --data-urlencode "token=${token}" \
            "https://app.yousefipour.ir/assets/${installer}")"
          echo "${response}"
          echo "${response}" | grep -q '"employment_columns":2'
          echo "Employment schema verified on production database."

      - name: Verify deployed panel and bundle against committed payload
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://app.yousefipour.ir"
          for rel in app/panel.html app/assets/panel.bundle.js app/assets/school-service-admin.js; do
            local_path="deploy-payload/${rel}"
            [ -f "${local_path}" ] || continue
            case "${rel}" in
              app/panel.html) url="${base}/?deploy_verify=${GITHUB_SHA}" ;;
              app/assets/panel.bundle.js) url="${base}/assets/panel.bundle.js?deploy_verify=${GITHUB_SHA}" ;;
              app/assets/school-service-admin.js) url="${base}/assets/school-service-admin.js?deploy_verify=${GITHUB_SHA}" ;;
            esac
            remote_path="/tmp/khatyar-verify-$(basename "${rel}")"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store' -A 'Khatyar-Deploy-Verify/2.0' \
              "${url}" > "${remote_path}"
            test -s "${remote_path}"
            if [ "${rel}" = "app/assets/panel.bundle.js" ] || [ "${rel}" = "app/assets/school-service-admin.js" ]; then
              node --check "${remote_path}"
              cmp -s "${local_path}" "${remote_path}" || {
                echo "ERROR: live panel bundle differs from the deployment payload" >&2
                sha256sum "${local_path}" "${remote_path}"
                exit 1
              }
            else
              grep -q 'panel.bundle.js' "${remote_path}" || { echo "ERROR: panel HTML missing bundle reference" >&2; exit 1; }
            fi
            echo "Verified public ${rel}"
          done

      - name: Smoke-test production API and login routes
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          base="https://app.yousefipour.ir"
          echo "Checking production API health..."
          health_code="$(curl --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache, no-store' -o /tmp/khatyar-health.json -w '%{http_code}' "${base}/api/health?smoke=${GITHUB_SHA}" || true)"
          echo "GET /api/health HTTP ${health_code}"
          cat /tmp/khatyar-health.json 2>/dev/null || true
          echo
          if [ "${health_code}" -ge 500 ] || [ "${health_code}" = "000" ]; then
            echo "ERROR: production API health endpoint failed." >&2
            exit 1
          fi
          for route in /api/session/start /api/auth/login; do
            code="$(curl --silent --show-error --location --max-time 25 -X POST -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' --data '{}' -o /tmp/khatyar-login-response.json -w '%{http_code}' "${base}${route}" || true)"
            echo "POST ${route} with empty JSON -> HTTP ${code}"
            cat /tmp/khatyar-login-response.json 2>/dev/null || true
            echo
            if [ "${code}" = "000" ] || [ "${code}" -ge 500 ]; then
              echo "ERROR: production login route returned a server/network error: ${route}" >&2
              exit 1
            fi
          done
          xlsx_code="$(curl --silent --show-error --location --max-time 25 -X POST -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' --data '{"rows":[["Date"],["2026-10-14"]]}' -o /tmp/khatyar-attendance-xlsx-auth.json -w '%{http_code}' "${base}/api/admin-attendance-xlsx.php" || true)"
          echo "POST /api/admin-attendance-xlsx.php without a token -> HTTP ${xlsx_code}"
          if [ "${xlsx_code}" != "401" ]; then
            echo "ERROR: attendance Excel route did not enforce authentication as expected." >&2
            cat /tmp/khatyar-attendance-xlsx-auth.json 2>/dev/null || true
            exit 1
          fi
          # All protected endpoints must reject anonymous access with 401,
          # rather than crashing in route bootstrap/authentication with 500.
          for route in /api/admin/stats /api/admin/roles /api/admin/zones /api/admin/users /api/admin/attendance-report /api/admin/company-work /api/admin/company-work/sources/0/download; do
            code="$(curl --silent --show-error --location --max-time 25 -o /tmp/khatyar-protected-route.json -w '%{http_code}' "${base}${route}" || true)"
            echo "Anonymous GET ${route} -> HTTP ${code}"
            if [ "${code}" != "401" ]; then
              echo "ERROR: authenticated API returned unexpected HTTP status before authentication: ${route}" >&2
              cat /tmp/khatyar-protected-route.json 2>/dev/null || true
              exit 1
            fi
          done
          # OTP validation must never send SMS for an empty username.
          for policy in app-login-config web-login-config; do
            curl --fail --silent --show-error --max-time 25 "${base}/api/session/${policy}" -o /tmp/khatyar-login-policy.json
            php -r '$v=json_decode(file_get_contents("/tmp/khatyar-login-policy.json"),true); if (!in_array($v["method"]??null,["password","sms_otp","bale_otp"],true)) exit(1);'
            echo "GET /api/session/${policy}: valid configured login method"
          done
          otp_code="$(curl --silent --show-error --location --max-time 25 -X POST -H 'Content-Type: application/json' --data '{}' -o /tmp/khatyar-otp-empty.json -w '%{http_code}' "${base}/api/session/otp-request" || true)"
          echo "POST /api/session/otp-request (empty user) -> HTTP ${otp_code}"
          if [ "${otp_code}" != "400" ]; then
            echo "ERROR: OTP route failed before input validation" >&2
            cat /tmp/khatyar-otp-empty.json 2>/dev/null || true
            exit 1
          fi
          me_code="$(curl --silent --show-error --location --max-time 25 -o /tmp/khatyar-me-anonymous.json -w '%{http_code}' "${base}/api/auth/me" || true)"
          echo "GET /api/auth/me (anonymous) -> HTTP ${me_code}"
          if [ "${me_code}" != "401" ]; then
            echo "ERROR: auth/me did not reject anonymous request cleanly" >&2
            cat /tmp/khatyar-me-anonymous.json 2>/dev/null || true
            exit 1
          fi
          echo "Production API/login/attendance-Excel smoke tests passed (unauthorized requests are expected to be rejected)."
