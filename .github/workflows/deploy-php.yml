      - name: Verify public homepage, login and deployed assets against committed payload
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://khat-yar.ir"
          # The public homepage lives at /; the existing React admin/login shell lives at /login.
          # In particular, never demand panel.bundle.js on the public index page.
          for rel in app/landing.html app/panel.html app/assets/panel.bundle.js app/assets/school-complaints-admin.js app/assets/school-complaints-admin.css app/assets/school-service-admin.js app/assets/public-accurate.css app/assets/organizational-public.css app/assets/login-accurate.css app/assets/organizational-login.css app/assets/login-premium.js app/assets/khatyar-reference-home-art.webp app/assets/khatyar-reference-login-art.webp app/assets/khatyar-reference-about-art.webp app/assets/khatyar-reference-contact-art.webp app/assets/khatyar-hero-emerald-v3.webp app/assets/khatyar-footer-emerald-v3.webp app/assets/khatyar-login-emerald-v3.webp app/khatyar-transparent.png; do
            local_path="deploy-payload/${rel}"
            [ -f "${local_path}" ] || continue
            case "${rel}" in
              app/landing.html) url="${base}/?deploy_verify=${GITHUB_SHA}" ;;
              app/panel.html) url="${base}/login?deploy_verify=${GITHUB_SHA}" ;;
              app/*) url="${base}/${rel#app/}?deploy_verify=${GITHUB_SHA}" ;;
