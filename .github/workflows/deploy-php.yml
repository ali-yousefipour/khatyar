name: Deploy PHP backend to shared hosting

on:
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  cancel-in-progress: false

jobs:
  deploy-php:
    name: FTP deploy PHP backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (PHP only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            php
          sparse-checkout-cone-mode: true

      - name: Sync PHP changes and deletions to FTP root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 2870352177.cloudylink.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./php/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/*.log
