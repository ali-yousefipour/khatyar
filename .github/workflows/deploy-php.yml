name: Deploy PHP backend to shared hosting

on:
  push:
    branches:
      - main
    paths:
      - 'php/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  cancel-in-progress: false

jobs:
  deploy-php:
    name: FTP deploy PHP backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy php directory by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./php/
          server-dir: /home/h301194/
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/*.log
