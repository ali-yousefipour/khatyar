name: Upload to Khatyar Host

on:
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  cancel-in-progress: false

jobs:
  deploy-php:
    name: Upload changed PHP files to Khatyar Host
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deployment payload from last 3 commits
        shell: bash
        env:
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf deploy-payload
          mkdir -p deploy-payload
          : > /tmp/php-deletions.txt

          # Always deploy exactly the union of PHP files changed by the last 3 commits.
          # No FTP state, remote listing, checksum comparison, or remote diff is used.
          COMMITS="$(git rev-list --max-count=3 "${EVENT_AFTER}")"
          echo "Commits selected for deployment:"
          printf '%s\n' "${COMMITS}"

          git diff --name-status --find-renames "${EVENT_AFTER}~3" "${EVENT_AFTER}" -- php/ > /tmp/php-diff.txt

          echo "PHP changes across the last 3 commits:"
          cat /tmp/php-diff.txt || true

          while IFS=$'\t' read -r status path1 path2; do
            [ -n "${status:-}" ] || continue

            case "${status}" in
              A|M|T)
                mkdir -p "deploy-payload/$(dirname "${path1#php/}")"
                cp "${path1}" "deploy-payload/${path1#php/}"
                ;;
              D)
                printf '%s\n' "${path1#php/}" >> /tmp/php-deletions.txt
                ;;
              R*|C*)
                mkdir -p "deploy-payload/$(dirname "${path2#php/}")"
                cp "${path2}" "deploy-payload/${path2#php/}"
                printf '%s\n' "${path1#php/}" >> /tmp/php-deletions.txt
                ;;
            esac
          done < /tmp/php-diff.txt

          sort -u /tmp/php-deletions.txt > deploy-deletions.txt

          echo "Deployment payload (local files only; no remote inspection):"
          find deploy-payload -type f -print | sort || true
          echo "Remote deletions:"
          cat deploy-deletions.txt || true

          echo "Payload file count: $(find deploy-payload -type f | wc -l)"
      - name: Install lftp for FTP transfer
        if: ${{ hashFiles('deploy-payload/**') != '' || hashFiles('deploy-deletions.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload changed PHP files to FTP root
        if: ${{ hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          : > /tmp/lftp-upload.cmd
          {
            echo 'set ftp:ssl-force false'
            echo 'set ftp:ssl-protect-data false'
            echo 'set ftp:passive-mode true'
            echo 'set ftp:prefer-epsv false'
            echo 'set net:timeout 60'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 2'
            echo 'set ssl:verify-certificate no'
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              rel="${file#deploy-payload/}"
              dir="$(dirname "${rel}")"
              if [ "${dir}" = "." ]; then
                remote_dir="/"
              else
                remote_dir="/${dir}"
              fi
              printf "mkdir -p %s\n" "${remote_dir}"
              printf "put -c %s -o %s\n" "${file}" "${remote_dir}/$(basename "${rel}")"
            done < <(find deploy-payload -type f -print | sort)
            echo 'bye'
          } >> /tmp/lftp-upload.cmd

          echo "Uploading changed PHP files:"
          find deploy-payload -type f -print | sort

          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "$(cat /tmp/lftp-upload.cmd)"
      - name: Delete removed PHP files from FTP root
        if: ${{ hashFiles('deploy-deletions.txt') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          while IFS= read -r rel; do
            [ -n "${rel}" ] || continue
            echo "Deleting remote: /${rel}"
            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}" -e "
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              set ftp:passive-mode true;
              set net:timeout 30;
              set net:max-retries 2;
              set ssl:verify-certificate no;
              rm "/${rel}";
              bye
            " || {
              echo "Warning: remote file may already be absent: /${rel}"
            }
          done < deploy-deletions.txt
