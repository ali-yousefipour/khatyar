name: Upload to Khatyar Host
# DEPLOY-RECONCILE: 20261007-v275

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-production-deploy
  cancel-in-progress: true

jobs:
  deploy-php:
    name: Upload changed PHP files to Khatyar Host
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Regenerate panel bundle before deployment
        shell: bash
        run: |
          set -euo pipefail
          cd php
          npm install --no-save --no-package-lock typescript@5.9.3
          bash ./tools/build_panel_bundle.sh
          node --check app/assets/panel.bundle.js
          grep -q "adminRequestDecision" app/assets/panel.bundle.js

      - name: Build deployment payload from this push
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git fetch origin main --force
          # The panel build step intentionally regenerates panel.bundle.js in the
          # working tree. Do not use checkout here because that fails when the
          # concurrent bundle workflow has already committed a newer bundle.
          git reset --hard origin/main

          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA=""

          if [ "${EVENT_NAME}" = "push" ]; then
            # Reconcile a small commit window so a PHP push is still deployed when
            # another automation commit (for example panel bundle regeneration)
            # lands before this workflow starts.
            TEN_COMMIT_BASE="$(git rev-list --max-count=11 "${HEAD_SHA}" | tail -n 1)"
            if [ "$(git rev-list --count "${HEAD_SHA}")" -gt 10 ] && [ -n "${TEN_COMMIT_BASE}" ]; then
              BASE_SHA="${TEN_COMMIT_BASE}"
            elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="${PUSH_BEFORE}"
            else
              BASE_SHA=""
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual deployment reconciles the last 10 commits on main.
            # Resolve the 11th commit as the diff base so the range contains exactly
            # the latest 10 commits. If fewer than 10 commits exist, fall back to
            # the root diff below.
            TEN_COMMIT_BASE="$(git rev-list --max-count=11 "${HEAD_SHA}" | tail -n 1)"
            if [ "$(git rev-list --count "${HEAD_SHA}")" -gt 10 ] && [ -n "${TEN_COMMIT_BASE}" ]; then
              BASE_SHA="${TEN_COMMIT_BASE}"
            else
              BASE_SHA=""
            fi
          else
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          echo "Deployment HEAD: ${HEAD_SHA}"
          echo "Deployment BASE: ${BASE_SHA:-<none>}"
          echo "Event: ${EVENT_NAME}"

          rm -rf deploy-payload
          mkdir -p deploy-payload
          : > deploy-deletions.txt
          : > /tmp/php-diff.txt

          if [ -n "${BASE_SHA}" ]; then
            git diff --name-status --find-renames --find-copies "${BASE_SHA}" "${HEAD_SHA}" -- php/ > /tmp/php-diff.txt
          else
            git diff-tree --root --no-commit-id --name-status --find-renames --find-copies -r "${HEAD_SHA}" -- php/ > /tmp/php-diff.txt
          fi

          echo "PHP changes in this deployment range:"
          cat /tmp/php-diff.txt || true

          while IFS=$'\t' read -r status path1 path2; do
            [ -n "${status:-}" ] || continue

            case "${status}" in
              A|M|T)
                rel="${path1#php/}"
                mkdir -p "deploy-payload/$(dirname "${rel}")"
                cp "${path1}" "deploy-payload/${rel}"
                ;;
              D)
                printf '%s\n' "${path1#php/}" >> deploy-deletions.txt
                ;;
              R*|C*)
                old_rel="${path1#php/}"
                new_rel="${path2#php/}"
                mkdir -p "deploy-payload/$(dirname "${new_rel}")"
                cp "${path2}" "deploy-payload/${new_rel}"
                printf '%s\n' "${old_rel}" >> deploy-deletions.txt
                ;;
              *)
                echo "ERROR: Unsupported PHP diff status: ${status}" >&2
                exit 1
                ;;
            esac
          done < /tmp/php-diff.txt

          sort -u deploy-deletions.txt -o deploy-deletions.txt

          payload_count="$(find deploy-payload -type f | wc -l | tr -d ' ')"
          deletion_count="$(grep -c . deploy-deletions.txt || true)"
          change_count="$(grep -c . /tmp/php-diff.txt || true)"

          echo "Deployment payload:"
          find deploy-payload -type f -print | sort || true
          echo "Remote deletions:"
          cat deploy-deletions.txt || true
          echo "PHP diff entries: ${change_count}"
          echo "Payload file count: ${payload_count}"
          echo "Deletion count: ${deletion_count}"

          if [ "${change_count}" -gt 0 ] && [ "${payload_count}" -eq 0 ] && [ "${deletion_count}" -eq 0 ]; then
            echo "ERROR: PHP changes were detected, but the deployment payload is empty." >&2
            exit 1
          fi

          if [ "${change_count}" -eq 0 ]; then
            echo "No PHP changes in this commit; skipping Khatyar Host upload."
            echo "SKIP_HOST_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      - name: Install lftp
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && (hashFiles('deploy-payload/**') != '' || hashFiles('deploy-deletions.txt') != '') }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not block the whole deployment on a slow/locked APT mirror.
          # lftp is the only external dependency needed by this job.
          if ! command -v lftp >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get install -y -qq lftp; then
              echo "Cached APT install failed; refreshing package indexes with a hard timeout..."
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y -qq lftp
            fi
          fi
          command -v lftp
          lftp --version | head -n 1

      - name: Upload changed PHP files to FTP root
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          : > /tmp/lftp-upload.cmd
          {
            echo 'set ftp:ssl-force false'
            echo 'set ftp:ssl-protect-data false'
            echo 'set ftp:passive-mode true'
            echo 'set ftp:prefer-epsv false'
            echo 'set net:timeout 60'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 2'
            echo 'set ssl:verify-certificate no'

            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              rel="${file#deploy-payload/}"

              if [ "${rel}" = "lib/routes.php" ] || [ "${rel}" = "lib/IranCalendar.php" ] || [ "${rel}" = "lib/ShiftCalc.php" ]; then
                continue
              fi

              dir="$(dirname "${rel}")"
              if [ "${dir}" = "." ]; then
                remote_dir="/"
              else
                remote_dir="/${dir}"
              fi

              local_file="${GITHUB_WORKSPACE}/${file}"
              remote_file="${remote_dir}/$(basename "${rel}")"
              printf 'put %s -o %s\n' "${local_file}" "${remote_file}"
            done < <(find deploy-payload -type f -print | sort)

            echo 'bye'
          } >> /tmp/lftp-upload.cmd

          echo "Uploading changed PHP files without remote directory creation:"
          find deploy-payload -type f -print | sort | grep -v '^deploy-payload/lib/routes.php$' || true

          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "$(cat /tmp/lftp-upload.cmd)"

          if [ -f deploy-payload/lib/routes.php ] || [ -f deploy-payload/lib/IranCalendar.php ] || [ -f deploy-payload/lib/ShiftCalc.php ]; then
            ROUTES_TOKEN="$(openssl rand -hex 32)"
            INSTALLER_NAME=".attendance-lib-install-${GITHUB_SHA}.php"

            cat > "/tmp/${INSTALLER_NAME}" <<PHP
          <?php
          declare(strict_types=1);
          \$token = '${ROUTES_TOKEN}';
          if (!hash_equals(\$token, (string)(\$_POST['token'] ?? ''))) {
              http_response_code(403);
              exit('forbidden');
          }
          \$files = [
              'routes.php' => 'routes.php',
              'IranCalendar.php' => 'IranCalendar.php',
              'ShiftCalc.php' => 'ShiftCalc.php',
          ];
          \$result = [];
          foreach (\$files as \$name => \$canonical) {
              \$src = __DIR__ . '/.attendance-deploy-' . \$name;
              \$dst = dirname(__DIR__, 2) . '/lib/' . \$canonical;
              if (!is_file(\$src)) continue;
              if (!is_writable(\$dst)) {
                  http_response_code(500);
                  exit('target ' . \$canonical . ' is not writable by PHP');
              }
              if (!copy(\$src, \$dst)) {
                  http_response_code(500);
                  exit('copy to canonical ' . \$canonical . ' failed');
              }
              \$srcSha = hash_file('sha256', \$src);
              \$dstSha = hash_file('sha256', \$dst);
              if (!\$srcSha || !\$dstSha || !hash_equals(\$srcSha, \$dstSha)) {
                  http_response_code(500);
                  exit(\$canonical . ' checksum mismatch after host-side copy');
              }
              \$result[\$canonical] = \$dstSha;
              @unlink(\$src);
          }
          @unlink(__FILE__);
          header('Content-Type: application/json; charset=utf-8');
          echo json_encode(['ok'=>true,'files'=>\$result], JSON_UNESCAPED_UNICODE);
          PHP

            : > /tmp/attendance-lib-stage.cmd
            {
              echo 'set ftp:ssl-force false'
              echo 'set ftp:ssl-protect-data false'
              echo 'set ftp:passive-mode true'
              echo 'set ftp:prefer-epsv false'
              echo 'set net:timeout 60'
              echo 'set net:max-retries 5'
              echo 'set ssl:verify-certificate no'
              for name in routes.php IranCalendar.php ShiftCalc.php; do
                if [ -f "deploy-payload/lib/$name" ]; then
                  printf 'put %s -o %s\n' "${GITHUB_WORKSPACE}/deploy-payload/lib/$name" "/app/assets/.attendance-deploy-$name"
                fi
              done
              printf 'put %s -o %s\n' "/tmp/${INSTALLER_NAME}" "/app/assets/${INSTALLER_NAME}"
              echo 'bye'
            } >> /tmp/attendance-lib-stage.cmd

            lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "$(cat /tmp/attendance-lib-stage.cmd)"

            echo "Installing protected attendance PHP libraries through the host PHP process..."
            install_url="https://app.yousefipour.ir/assets/${INSTALLER_NAME}"
            response="$(curl --fail --silent --show-error --max-time 30 \
              -X POST \
              --data-urlencode "token=${ROUTES_TOKEN}" \
              "${install_url}")"
            echo "${response}"
            echo "${response}" | grep -q '"ok":true'

            echo
            echo "Host-side attendance PHP library installation completed."
          fi

      - name: Verify uploaded FTP files
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/**') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            rel="${file#deploy-payload/}"
            if [ "${rel}" = "lib/routes.php" ] || [ "${rel}" = "lib/IranCalendar.php" ] || [ "${rel}" = "lib/ShiftCalc.php" ]; then
              echo "FTP verify skipped for ${rel} (host FTP denies direct write; host-side PHP installer verifies checksum)."
              continue
            fi
            remote="/${rel}"
            local_sha="$(sha256sum "${file}" | awk '{print $1}')"

            remote_basename="$(basename "${rel}")"
            verify_dir="${RUNNER_TEMP}/ftp-verify"
            verify_path="${verify_dir}/${remote_basename}"
            rm -rf "${verify_dir}"
            mkdir -p "${verify_dir}"

            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              set ftp:passive-mode true;
              set ftp:prefer-epsv false;
              set net:timeout 60;
              set net:max-retries 3;
              set ssl:verify-certificate no;
              lcd "${verify_dir}";
              get "${remote}";
              bye
            "

            if [ ! -f "${verify_path}" ]; then
              echo "ERROR: FTP verify download missing: ${verify_path}" >&2
              find "${verify_dir}" -maxdepth 1 -type f -print >&2 || true
              exit 1
            fi

            remote_sha="$(sha256sum "${verify_path}" | awk '{print $1}')"
            echo "FTP verify ${rel}: local=${local_sha} remote=${remote_sha}"
            [ "${local_sha}" = "${remote_sha}" ] || {
              echo "ERROR: FTP checksum mismatch for ${rel}" >&2
              exit 1
            }
          done < <(find deploy-payload -type f -print | sort)

      - name: Delete removed PHP files from FTP root
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-deletions.txt') != '' }}
        shell: bash
        env:
          FTP_HOST: 2870352177.cloudylink.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          while IFS= read -r rel; do
            [ -n "${rel}" ] || continue
            echo "Deleting remote: /${rel}"

            lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              set ftp:passive-mode true;
              set ftp:prefer-epsv false;
              set net:timeout 30;
              set net:max-retries 2;
              set ssl:verify-certificate no;
              rm "/${rel}";
              bye
            " || {
              echo "Warning: remote file may already be absent: /${rel}"
            }
          done < deploy-deletions.txt

      - name: Verify public panel after PHP upload
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/app/panel.html') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          url="https://app.yousefipour.ir/?deploy_verify=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store' \
            -A 'Khatyar-Deploy-Verify/1.0' \
            "${url}" > /tmp/live-panel.html

          grep -q 'assets/panel-build-runtime-fix.js?v=20261009.1' /tmp/live-panel.html
          grep -q 'assets/panel.bundle.js?v=20261009.2' /tmp/live-panel.html
          grep -q 'assets/school-service-admin.js?v=20261009.253' /tmp/live-panel.html
          grep -q 'نسخه 1.5.7' /tmp/live-panel.html
          ! grep -q '/api/admin/complaints/dashboard' /tmp/live-panel.html
          ! grep -q 'window.openComplaints=open;open();' /tmp/live-panel.html

          echo "Public panel verification passed for ${GITHUB_SHA}."

      - name: Verify public panel bundle after PHP upload
        if: ${{ env.SKIP_HOST_UPLOAD != 'true' && hashFiles('deploy-payload/app/assets/panel.bundle.js') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          url="https://app.yousefipour.ir/assets/panel.bundle.js?deploy_verify=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store' \
            -A 'Khatyar-Deploy-Verify/1.0' \
            "${url}" > /tmp/live-panel-bundle.js

          test -s /tmp/live-panel-bundle.js
          grep -q 'React' /tmp/live-panel-bundle.js
          echo "Public panel bundle verification passed for ${GITHUB_SHA}."

      - name: Smoke-test production API and login routes
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          base="https://app.yousefipour.ir"
          echo "Checking production API health..."
          health_code="$(curl --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache, no-store' -o /tmp/khatyar-health.json -w '%{http_code}' "${base}/api/health?smoke=${GITHUB_SHA}" || true)"
          echo "GET /api/health HTTP ${health_code}"
          cat /tmp/khatyar-health.json 2>/dev/null || true
          echo
          if [ "${health_code}" -ge 500 ] || [ "${health_code}" = "000" ]; then
            echo "ERROR: production API health endpoint failed." >&2
            exit 1
          fi
          for route in /api/session/start /api/auth/login; do
            code="$(curl --silent --show-error --location --max-time 25 -X POST -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' --data '{}' -o /tmp/khatyar-login-response.json -w '%{http_code}' "${base}${route}" || true)"
            echo "POST ${route} with empty JSON -> HTTP ${code}"
            cat /tmp/khatyar-login-response.json 2>/dev/null || true
            echo
            if [ "${code}" = "000" ] || [ "${code}" -ge 500 ]; then
              echo "ERROR: production login route returned a server/network error: ${route}" >&2
              exit 1
            fi
          done
          echo "Production API/login smoke tests passed (empty credentials are expected to be rejected)."
