name: PHP Syntax Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/php-syntax-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json, pdo, pdo_mysql
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          exit "$failed"
