name: PHP Syntax Lint

on:
  push:
    branches: [main]
    paths:
      - 'php/**/*.php'
      - '.github/workflows/php-syntax-lint.yml'
  pull_request:
    paths:
      - 'php/**/*.php'
      - '.github/workflows/php-syntax-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json, pdo, pdo_mysql
      - name: Lint every PHP file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            php -l "$file"
          done < <(find php -type f -name '*.php' -print0)
          test "$count" -gt 0
          echo "PHP syntax check completed: $count files"
      - name: Verify API bootstrap dependency chain
        shell: bash
        run: |
          set -euo pipefail
          test -f php/app/index.php
          test -f php/lib/routes.php
          grep -Fq "require \"\$ROOT/lib/routes.php\"" php/app/index.php
          grep -Fq "const SITE_VERSION = '1.3.70'" php/lib/routes.php
          grep -Fq "const APP_VERSION = '1.3.70'" php/lib/routes.php
          echo "API bootstrap dependency chain verified"
