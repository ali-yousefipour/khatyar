name: Radio channel finalize v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-channel-finalize-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[radio-channel-finalize-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply final radio fixes without checkout
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const text = s => Buffer.from(s, 'base64').toString('utf8');
            const get = async path => github.rest.repos.getContent({owner, repo, path, ref: branch});
            const put = async (path, transform, message) => {
              const r = await get(path);
              const item = Array.isArray(r.data) ? r.data[0] : r.data;
              const old = text(item.content);
              const next = transform(old);
              if (next === old) throw new Error(`No change made to ${path}`);
              await github.rest.repos.createOrUpdateFileContents({owner, repo, path, branch, message, content: Buffer.from(next,'utf8').toString('base64'), sha: item.sha});
            };
            await put('mobile/src/screens/RadioScreen.js', s => {
              const n = s.replace(/if\(Array\.isArray\(r\?\.messages\)\)\{const rows=.*?setRecent\(rows\)\}/, '');
              if (n === s) throw new Error('Live poll recent-list overwrite was not found');
              return n;
            }, 'fix(radio): keep display list bound to latest-three endpoint [radio-channel-finalize-v2]');
            await put('mobile/src/radio/RadioContext.js', s => {
              let n = s;
              const oldSounds = "const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const RADIO_SQUELCH_DELAY_MS=900;const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};";
              const newSounds = "const botPlayer=useAudioPlayer(require('../../assets/sounds/radio_bot.wav')),rogerPlayer=useAudioPlayer(require('../../assets/sounds/radio_roger_beep.wav')),eotPlayer=useAudioPlayer(require('../../assets/sounds/radio_eot.wav')),squelchPlayer=useAudioPlayer(require('../../assets/sounds/radio_squelch.wav')),courtesyPlayer=useAudioPlayer(require('../../assets/sounds/radio_courtesy_beep.wav'));const ch1Player=useAudioPlayer(require('../../assets/sounds/ch1.mp3')),ch2Player=useAudioPlayer(require('../../assets/sounds/ch2.mp3')),ch3Player=useAudioPlayer(require('../../assets/sounds/ch3.mp3')),ch4Player=useAudioPlayer(require('../../assets/sounds/ch4.mp3')),ch5Player=useAudioPlayer(require('../../assets/sounds/ch5.mp3'));const channelPlayers={1:ch1Player,2:ch2Player,3:ch3Player,4:ch4Player,5:ch5Player};const RADIO_SQUELCH_DELAY_MS=900;const playSfx=p=>{try{p.seekTo(0);p.play()}catch(e){}};";
              if (n.includes(oldSounds)) n = n.replace(oldSounds, newSounds);
              const oldSet = "const setChannel=async id=>{const cid=Number(id),c=channels.find(x=>Number(x.id)===cid);if(!c)return;setChannelIdState(cid);channelRef.current=cid;";
              const newSet = "const setChannel=async id=>{const cid=Number(id),c=channels.find(x=>Number(x.id)===cid);if(!c)return;const previousId=Number(channelRef.current||0);if(cid!==previousId){const channelPlayer=channelPlayers[cid];if(channelPlayer){try{channelPlayer.seekTo(0);channelPlayer.play()}catch(e){}}}setChannelIdState(cid);channelRef.current=cid;";
              if (n.includes(oldSet)) n = n.replace(oldSet, newSet);
              if (n === s) throw new Error('Channel audio targets were not found');
              return n;
            }, 'fix(radio): play channel-name audio on channel change [radio-channel-finalize-v2]');
            for (const path of ['.github/workflows/radio-channel-finalize.yml','.github/workflows/radio-channel-finalize-v2.yml']) {
              try { const r = await get(path); const item = Array.isArray(r.data) ? r.data[0] : r.data; await github.rest.repos.deleteFile({owner, repo, path, branch, message: `chore(radio): remove one-time finalize workflow [radio-channel-finalize-v2]`, sha: item.sha}); } catch(e) { if (e.status !== 404) throw e; }
            }
