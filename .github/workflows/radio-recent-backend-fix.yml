name: Radio recent backend fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-recent-backend-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[radio-backend-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Fix radio recent query joins
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'main';
            const path = 'php/app/radio-api-v2.php';
            const get = async p => github.rest.repos.getContent({ owner, repo, path:p, ref:branch });
            const update = async (transform, message) => {
              const r = await get(path);
              const item = Array.isArray(r.data) ? r.data[0] : r.data;
              const oldText = Buffer.from(item.content, 'base64').toString('utf8');
              const newText = transform(oldText);
              if (newText === oldText) throw new Error('No change made to radio-api-v2.php');
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch, sha:item.sha, message, content:Buffer.from(newText,'utf8').toString('base64') });
            };
            const innerJoin = "FROM radio_messages m JOIN users su ON su.id=m.sender_id LEFT JOIN roles r ON r.id=su.role_id WHERE m.channel_id=? ORDER BY m.id DESC LIMIT 3";
            const leftJoin = "FROM radio_messages m LEFT JOIN users su ON su.id=m.sender_id LEFT JOIN roles r ON r.id=su.role_id WHERE m.channel_id=? ORDER BY m.id DESC LIMIT 3";
            const innerJoinTime = "FROM radio_messages m JOIN users su ON su.id=m.sender_id LEFT JOIN roles r ON r.id=su.role_id WHERE m.channel_id=? ORDER BY m.created_at DESC,m.id DESC LIMIT 3";
            const leftJoinTime = "FROM radio_messages m LEFT JOIN users su ON su.id=m.sender_id LEFT JOIN roles r ON r.id=su.role_id WHERE m.channel_id=? ORDER BY m.created_at DESC,m.id DESC LIMIT 3";
            await update(s => {
              if (!s.includes(innerJoin)) throw new Error('responsible-recent query not found');
              return s.replace(innerJoin,leftJoin);
            }, 'fix(radio): keep recent messages when sender user row is missing [radio-backend-fix]');
            await update(s => {
              if (!s.includes(innerJoinTime)) throw new Error('latest-three query not found');
              return s.replace(innerJoinTime,leftJoinTime);
            }, 'fix(radio): make latest-three resilient to missing sender rows [radio-backend-fix]');
            const wf = await get('.github/workflows/radio-recent-backend-fix.yml');
            const item = Array.isArray(wf.data) ? wf.data[0] : wf.data;
            await github.rest.repos.deleteFile({ owner, repo, path:'.github/workflows/radio-recent-backend-fix.yml', branch, sha:item.sha, message:'chore(radio): remove one-time backend fix workflow [radio-backend-fix]' });