name: Radio recent source finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-recent-finalize.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[radio-recent-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch RadioScreen recent source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'main';
            const path = 'mobile/src/screens/RadioScreen.js';
            const b64 = s => Buffer.from(s, 'base64').toString('utf8');
            const get = async p => github.rest.repos.getContent({ owner, repo, path:p, ref:branch });
            const put = async (p, transform, message) => {
              const r = await get(p);
              const item = Array.isArray(r.data) ? r.data[0] : r.data;
              const old = b64(item.content);
              const next = transform(old);
              if (next === old) throw new Error(`No change made to ${p}`);
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path:p, branch, message, content:Buffer.from(next,'utf8').toString('base64'), sha:item.sha });
            };
            await put(path, s => {
              const old = "const loadRecent=async()=>{if(!user?.id||!channelId)return;try{const r=await request(`/radio-api-v2.php?op=latest-three&channel_id=${channelId}`,{noStore:true});const rows=Array.isArray(r?.messages)?r.messages.slice(0,3):[];setRecent(rows)}catch(_){setRecent([])}};";
              const next = "const loadRecent=async()=>{if(!user?.id||!channelId)return;try{const r=await request(`/radio-api-v2.php?op=responsible-recent&channel_id=${channelId}`,{noStore:true});const rows=Array.isArray(r?.messages)?r.messages:Array.isArray(r?.data?.messages)?r.data.messages:Array.isArray(r)?r:[];rows.sort((a,b)=>Number(b?.id||0)-Number(a?.id||0));setRecent(rows.slice(0,3))}catch(_){setRecent([])}};";
              if(!s.includes(old)) throw new Error('Expected loadRecent block was not found');
              return s.replace(old,next);
            }, 'fix(radio): use stable latest-three source [radio-recent-finalize]');
            const wf = await get('.github/workflows/radio-recent-finalize.yml');
            const wfItem = Array.isArray(wf.data) ? wf.data[0] : wf.data;
            await github.rest.repos.deleteFile({ owner, repo, path:'.github/workflows/radio-recent-finalize.yml', branch, message:'chore(radio): remove one-time finalize workflow [radio-recent-finalize]', sha:wfItem.sha });