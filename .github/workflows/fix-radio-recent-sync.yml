name: fix-radio-recent-sync
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(radio):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch RadioScreen safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('mobile/src/screens/RadioScreen.js')
          s = p.read_text(encoding='utf-8')

          old = 'lastMessage,maxTalkMs'
          if old in s and 'lastMessage,recentMessages,maxTalkMs' not in s:
              s = s.replace(old, 'lastMessage,recentMessages,maxTalkMs', 1)

          marker = 'const sortLatest='
          effect = "useEffect(()=>{if(Array.isArray(recentMessages)){setRecent(recentMessages.slice(0,3));}},[recentMessages]);"
          if effect not in s and marker in s:
              s = s.replace(marker, effect + marker, 1)

          s, n1 = re.subn(r"const sortLatest=.*?;const poll=", 'const poll=', s, count=1, flags=re.S)
          s, n2 = re.subn(r"useEffect\(\(\)=>\{loadRecent\(\);poll\(\);const t=setInterval\(\(\)=>\{loadRecent\(\);poll\(\)\},1500\);return\(\)=>clearInterval\(t\)\},\[user\?\.id,channelId,enabled,channels\.length\]\);", "useEffect(()=>{poll();const t=setInterval(poll,1500);return()=>clearInterval(t)},[user?.id,channelId,enabled]);", s, count=1)

          s = s.replace("wrap:{flex:1,backgroundColor:C.paper},content:", "wrap:{flex:1,backgroundColor:C.paper,direction:'rtl'},content:", 1)

          if 'recentMessages' not in s:
              raise SystemExit('recentMessages patch did not apply')
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'expected one recent-loader/effect replacement, got n1={n1}, n2={n2}')

          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/fix-radio-recent-sync.yml
          git add mobile/src/screens/RadioScreen.js
          git commit -m "fix(radio): isolate recent list from local poll overwrite"
          git push origin main
