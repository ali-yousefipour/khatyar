name: Verify manual Khatyar transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-manual-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify HTTPS, canonical host and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://khat-yar.ir"
          for path in / /login /assets/login-premium.js /api/health /api/app/version /api/session/app-login-config /api/session/web-login-config; do
            body="$(mktemp)"
            code="$(curl --fail-with-body --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "$base$path?verify=$GITHUB_RUN_ID")" || { echo "::error::Unreachable $path"; exit 1; }
            echo "$path HTTP $code bytes=$(wc -c < "$body")"
            test "$code" = 200
            test -s "$body"
            case "$path" in
              /api/health)
                php -r '$v=json_decode(file_get_contents($argv[1]),true); if(!is_array($v)||($v["ok"]??null)!==true||($v["db"]??null)!==true||($v["site_version"]??"")!=="2.0.2")exit(1);' "$body" ;;
              /api/app/version)
                php -r '$v=json_decode(file_get_contents($argv[1]),true); if(!is_array($v)) exit(1); echo "app_version=".($v["latest_version"]??$v["version"]??"unknown")." minimum=".($v["min_version"]??"unknown").PHP_EOL;' "$body" ;;
              /api/session/*-login-config)
                php -r '$v=json_decode(file_get_contents($argv[1]),true);if(!is_array($v)||!in_array($v["method"]??null,["password","sms_otp","bale_otp"],true))exit(1);' "$body" ;;
            esac
            rm -f "$body"
          done
      - name: Check unauthenticated login and protected routes
        shell: bash
        run: |
          set -euo pipefail
          base=https://khat-yar.ir
          for path in /api/session/start /api/auth/login; do
            code="$(curl --silent --show-error --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "$base$path")"
            echo "POST $path empty request HTTP $code"
            test "$code" = 400
          done
          for path in /api/auth/me /api/admin/users; do
            code="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base$path")"
            echo "GET $path anonymous HTTP $code"
            test "$code" = 401
          done
      - name: Verify HTTPS-only web signout
        shell: bash
        run: |
          set -euo pipefail
          base=https://khat-yar.ir
          # Cross-origin requests must be rejected, protecting the session cookie.
          cross="$(curl --silent --show-error --max-time 20 -X POST -H 'Origin: https://attacker.invalid' -H 'Content-Type: application/json' --data '{}' -o /dev/null -w '%{http_code}' "$base/api/session/web-signout")"
          echo "Cross-origin signout HTTP $cross"
          test "$cross" = 403
          # Same-origin signout must succeed even when the browser has no active session.
          same="$(curl --silent --show-error --max-time 20 -X POST -H 'Origin: https://khat-yar.ir' -H 'Content-Type: application/json' --data '{}' -o /dev/null -w '%{http_code}' "$base/api/session/web-signout")"
          echo "Same-origin signout HTTP $same"
          test "$same" = 200
          # Plain HTTP should redirect before the PHP route checks the Origin.
          result="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' -X POST -H 'Origin: http://khat-yar.ir' --data '{}' "http://khat-yar.ir/api/session/web-signout")"
          echo "HTTP logout canonical redirect: $result"
          [[ "$result" == 308\ https://khat-yar.ir/* ]]
      - name: Check GitHub Releases APK, not a domain-hosted APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v2.0.2"
          if ! gh release view "$tag" -R ali-yousefipour/khatyar-releases >/dev/null 2>&1; then
            echo "::warning::Signed v2.0.2 GitHub Release has not been published yet."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$tag" -R ali-yousefipour/khatyar-releases -p khat-yar.apk.sha256 -D "$RUNNER_TEMP/release-check" --clobber
          test -s "$RUNNER_TEMP/release-check/khat-yar.apk.sha256"
          gh release view "$tag" -R ali-yousefipour/khatyar-releases --json assets --jq '.assets[].name' | grep -qx 'khat-yar.apk'
          echo "Signed APK and checksum are present in GitHub Releases."
          echo "Public repository asset verified."
          echo "Uploaded media contents require a known media manifest or authenticated sample; this probe cannot prove all uploads copied."
