name: Android Native Debug APK Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-presence-debug-smoke.yml'
      - 'mobile/src/VehiclesPhotoCapture.js'
      - 'mobile/src/PresenceGate.js'
      - 'mobile/src/PresenceCheckWizard.js'
      - 'mobile/src/presenceLocalSchedule.js'
      - 'mobile/src/presenceAlarm.js'
      - 'mobile/src/presenceDeadlineClock.js'
      - 'mobile/scripts/test-presence-response-flow.cjs'
      - 'mobile/scripts/test-presence-local-scheduling.cjs'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/app.config.js'
      - 'mobile/scripts/test-presence-watermark-compact.cjs'
permissions:
  contents: read
concurrency:
  group: presence-debug-apk
  cancel-in-progress: false
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install locked Expo dependencies
        working-directory: mobile
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          npm config set registry https://registry.npmjs.org/
          node <<'NODE'
          const fs=require('fs'),file='package-lock.json';
          const lock=JSON.parse(fs.readFileSync(file,'utf8'));
          for(const item of Object.values(lock.packages||{})){
            if(typeof item.resolved!=='string')continue;
            if(item.resolved.startsWith('https://mirror-npm.runflare.com/'))
              item.resolved=item.resolved.replace('https://mirror-npm.runflare.com/','https://registry.npmjs.org/');
          }
          fs.writeFileSync(file,JSON.stringify(lock,null,2)+'\n');
          NODE
          npm ci --legacy-peer-deps --no-audit --no-fund --prefer-offline --loglevel=warn
      - name: Test presence contracts before native build
        working-directory: mobile
        run: |
          node scripts/test-presence-alarm.cjs
          node scripts/test-presence-camera.js
          node scripts/test-presence-system-camera.cjs
          node scripts/test-presence-response-flow.cjs
          node scripts/test-presence-wizard-lifecycle.cjs
          node scripts/test-presence-offline-fallback.cjs
          node scripts/test-presence-offline-assets.cjs
          node scripts/test-presence-watermark-compact.cjs
      - name: Generate complete Expo Android project with native alarm plugin
        working-directory: mobile
        timeout-minutes: 15
        env:
          CI: 'true'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile debug Android APK without production signing or publishing
        working-directory: mobile/android
        timeout-minutes: 42
        env:
          CI: 'true'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain --max-workers=2 --build-cache
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK for device QA only
        uses: actions/upload-artifact@v4
        with:
          name: khatyar-presence-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
