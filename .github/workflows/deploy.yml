name: Deploy PHP backend to shared hosting

on:
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: khatyar-php-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload changed PHP files to shared hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect PHP changes
        shell: bash
        run: |
          echo 'Files changed under php/ in this commit:'
          git diff --name-status HEAD^ HEAD -- php/ || true
          test -d php
          test -f php/app/panel.html

      - name: Upload changed PHP files to shared hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          local-dir: ./php/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
