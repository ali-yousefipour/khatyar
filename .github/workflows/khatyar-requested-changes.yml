name: Khatyar final requested changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khatyar-final-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested Android, Web and UI changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')

          # Android: Help route/menu.
          p=root/'mobile/App.js'; s=p.read_text(encoding='utf-8')
          if "from './src/screens/HelpScreen'" not in s:
              s=s.replace("import SetupScreen from './src/screens/SetupScreen';", "import SetupScreen from './src/screens/SetupScreen';import HelpScreen from './src/screens/HelpScreen';", 1)
          if 'name="Help"' not in s:
              needle='<Stack.Screen name="Dashboard" component={DashboardScreen} options={({navigation})=>({title:\'داشبورد\',headerLeft:()=> <ProfileBtn navigation={navigation}/>})}/>'
              repl=needle+'<Stack.Screen name="Help" component={HelpScreen} options={{title:\'راهنمای استفاده\'}}/>'
              if needle not in s:
                  raise SystemExit('Dashboard route anchor not found in App.js')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          p=root/'mobile/src/screens/DashboardScreen.js'; s=p.read_text(encoding='utf-8')
          if "t:'راهنمای استفاده'" not in s:
              anchor="const MENU=["
              if anchor not in s: raise SystemExit('Dashboard MENU anchor not found')
              s=s.replace(anchor,"const MENU=[{icon3d:ICON3D.activity,t:'راهنمای استفاده',r:'Help',bg:'#e8f3ff',always:true},",1)
          p.write_text(s,encoding='utf-8')

          # Android: show app version during splash/startup.
          p=root/'mobile/src/StartupGate.js'; s=p.read_text(encoding='utf-8')
          if "expo-application" not in s:
              s=s.replace("import { faNum } from './num';", "import { faNum } from './num';\nimport * as Application from 'expo-application';",1)
          if 'startupVersion' not in s:
              s=s.replace("const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';", "const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';\nconst startupVersion = Application.nativeApplicationVersion || '1.3.74';",1)
              s=s.replace("<Text style={s.progressLabel}>{faNum(Math.round(progress))}٪</Text>", "<Text style={s.progressLabel}>{faNum(Math.round(progress))}٪</Text><Text style={s.version}>نسخه برنامه: {faNum(startupVersion)}</Text>",1)
              s=s.replace("progressLabel: { marginTop: 8,", "version: { marginTop: 5, color: 'rgba(255,255,255,.88)', fontFamily: FONT.regular, fontSize: 11 },\n  progressLabel: { marginTop: 8,",1)
          p.write_text(s,encoding='utf-8')

          # Android: fullscreen signature mode.
          p=root/'mobile/src/screens/AccountScreens.js'; s=p.read_text(encoding='utf-8')
          if 'SignaturePad' in s and 'signatureFullscreen' not in s:
              s=s.replace("import { View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder } from 'react-native';", "import { View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder, Modal } from 'react-native';",1)
              s=s.replace("function SignaturePad({ value, onChange }) {\n  const padRef", "function SignaturePad({ value, onChange }) {\n  const [signatureFullscreen,setSignatureFullscreen]=useState(false);\n  const padRef",1)
              old="<View ref={padRef} collapsable={false} style={s.signaturePad} {...pan.panHandlers}>"
              new="<TouchableOpacity style={s.signatureFullscreenBtn} onPress={()=>setSignatureFullscreen(true)}><Text style={s.signatureFullscreenTxt}>تمام‌صفحه کردن محل درج امضا</Text></TouchableOpacity><View ref={padRef} collapsable={false} style={s.signaturePad} {...pan.panHandlers}>"
              if old not in s: raise SystemExit('Signature pad anchor not found')
              s=s.replace(old,new,1)
              marker="    <View style={{flexDirection:'row-reverse',gap:8}}>"
              modal="    <Modal visible={signatureFullscreen} animationType=\"slide\" onRequestClose={()=>setSignatureFullscreen(false)}><View style={s.signatureModal}><Text style={s.zoneTitle}>ثبت امضا در حالت تمام‌صفحه</Text><View ref={padRef} collapsable={false} style={s.signaturePadFull} {...pan.panHandlers}>{points.map((p,i)=><View key={'f'+i} pointerEvents=\"none\" style={[s.signatureDot,{left:p.x-2,top:p.y-2}]}/>)}</View><View style={{flexDirection:'row-reverse',gap:8}}><TouchableOpacity style={[s.btn,{flex:1,marginTop:10}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,marginTop:10,backgroundColor:'#6b7280'}]} onPress={()=>setSignatureFullscreen(false)}><Text style={s.btnTxt}>بازگشت</Text></TouchableOpacity></View></View></Modal>\n"
              if marker not in s: raise SystemExit('Signature action anchor not found')
              s=s.replace(marker,modal+marker,1)
              s=s.replace("signatureBox:{", "signatureModal:{flex:1,backgroundColor:'#f7f9fc',padding:18,paddingTop:42},signaturePadFull:{flex:1,minHeight:260,backgroundColor:'#fff',borderWidth:1,borderColor:'#cfd8e3',borderRadius:12,marginTop:12},signatureFullscreenBtn:{marginTop:10,borderWidth:1,borderColor:'#08745a',borderRadius:10,paddingVertical:10,alignItems:'center',backgroundColor:'#eefaf6'},signatureFullscreenTxt:{fontFamily:FONT.bold,color:'#08745a',fontSize:12},signatureBox:{",1)
          p.write_text(s,encoding='utf-8')

          # Android: version metadata consistency.
          p=root/'mobile/package.json'; d=json.loads(p.read_text(encoding='utf-8')); d['version']='1.3.74'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Web: standalone full usage guide.
          help_html=root/'php/app/help.html'
          help_html.write_text('''<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راهنمای خطیار</title><style>body{margin:0;background:#f5f7fb;color:#243247;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.hero{background:#086b56;color:#fff;border-radius:20px;padding:22px;margin-bottom:12px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:16px;padding:16px;margin:10px 0}.card h2{font-size:16px;color:#086b56}.card li{line-height:2;font-size:13px}.about{background:#142033;color:#fff;border-radius:16px;padding:16px;margin-top:12px}</style></head><body><main class="wrap"><section class="hero"><h1>راهنمای کامل خطیار</h1><div>نحوه استفاده از ابزارهای سامانه مدیریت خطوط تاکسیرانی</div></section><section class="card"><h2>۱. شروع کار و ورود</h2><ul><li>وارد حساب کاربری شوید؛ امکانات بر اساس نقش و سطح دسترسی نمایش داده می‌شوند.</li><li>در شروع برنامه اطلاعات کش و پیکربندی تازه می‌شود و کنترل‌های امنیتی مرحله‌ای اجرا می‌شوند.</li><li>Developer Options، GPS، VPN و Mock/Fake Location باید مطابق پیام برنامه تنظیم شوند.</li></ul></section><section class="card"><h2>۲. داشبورد</h2><ul><li>کارت‌های رانندگان، خودروها، حضور امروز و چک‌لیست ماه وضعیت کلی را نمایش می‌دهند.</li><li>امکانات در دسته‌های میدانی، عملیات، پیام‌ها، شخصی و سایر مرتب شده‌اند.</li><li>دکمه همگام‌سازی برای ارسال صف آفلاین و دریافت داده تازه استفاده می‌شود.</li></ul></section><section class="card"><h2>۳. عملیات میدانی</h2><ul><li>ثبت حضور من برای حضور روزانه است.</li><li>حاضرین در خط وضعیت افراد حاضر را نمایش می‌دهد.</li><li>مأموریت روزانه و برنامه بازدید و پوشش خط برای اجرای مأموریت، GPS، بازدید و پوشش استفاده می‌شوند.</li><li>ثبت موقعیت و تصویر خطوط برای ثبت موقعیت ایستگاه، تصویر محل و تصاویر تابلوهاست.</li><li>ایستگاه‌های ثبت‌شده من سوابق ثبت‌های کاربر را نمایش می‌دهد.</li></ul></section><section class="card"><h2>۴. گزارش، فرم و ارتباطات</h2><ul><li>ارسال گزارش، فرم‌ها، درخواست‌ها و ارسال برای شرکت برای عملیات اداری هستند.</li><li>ارسال پیامک، پیام‌ها، اعلان‌ها و ربات‌ها برای ارتباطات استفاده می‌شوند.</li><li>گزارش‌ها را می‌توان طبق امکانات سامانه مشاهده، مرتب و PDF کرد.</li></ul></section><section class="card"><h2>۵. حساب کاربری و امضا</h2><ul><li>در ویرایش اطلاعات می‌توانید اطلاعات قابل ویرایش و امضای پرسنلی را ثبت کنید.</li><li>برای امضای دقیق‌تر، گزینه «تمام‌صفحه کردن محل درج امضا» را انتخاب کنید.</li><li>پس از ثبت امضا، ذخیره اطلاعات را انجام دهید.</li></ul></section><section class="card"><h2>۶. آفلاین و خطاها</h2><ul><li>برخی عملیات در نبود اینترنت در صف قرار می‌گیرند و پس از اتصال قابل همگام‌سازی هستند.</li><li>در صورت هشدار دسترسی یا امنیتی، تنظیم مربوطه را اصلاح و «بررسی مجدد» را اجرا کنید.</li></ul></section><section class="about"><b>اطلاعات برنامه</b><div>نام برنامه: خطیار</div><div>توسعه‌دهنده: علی یوسفی‌پور</div><div>شرکت: مبین شات</div><div>نسخه: ۱.۳.۷۴</div></section></main></body></html>''',encoding='utf-8')

          # Web parity: add Help and developer/company footer.
          p=root/'php/app/web-android-parity-v32.js'; s=p.read_text(encoding='utf-8')
          if "'راهنمای کامل خطیار'" not in s:
              s=s.replace("const M=[", "const M=[['activity-wave.png','راهنمای کامل خطیار','help','general'],",1)
          if "data-route==='help'" not in s:
              s=s.replace("if(q&&typeof window.nav==='function')window.nav(q.dataset.route)", "if(q&&q.dataset.route==='help'){window.location.href='/help.html';return}if(q&&typeof window.nav==='function')window.nav(q.dataset.route)",1)
          p.write_text(s,encoding='utf-8')

          # Add a stable web about block if parity shell exists.
          p=root/'php/app/app.html'; s=p.read_text(encoding='utf-8')
          if 'KHATYAR_DEVELOPER_COMPANY' not in s:
              pos=s.lower().rfind('</body>')
              block='<!-- KHATYAR_DEVELOPER_COMPANY --><div id="KHATYAR_DEVELOPER_COMPANY" style="display:none">توسعه‌دهنده: علی یوسفی‌پور | شرکت: مبین شات</div>\n'
              if pos>=0:s=s[:pos]+block+s[pos:]
          p.write_text(s,encoding='utf-8')

          # Documentation of the static dashboard/API audit.
          audit=root/'docs/FINAL_REQUESTED_CHANGES_AUDIT.md'; audit.parent.mkdir(parents=True,exist_ok=True)
          audit.write_text('''# Final requested changes audit\n\n- Android Help screen exists and is routed from Dashboard.\n- Web help page exists and is exposed from the Android-parity dashboard shell.\n- Startup cache refresh remains before the staged PermissionGuard.\n- PermissionGuard order is Developer Options → 5s → GPS → 5s → VPN → 5s → Mock Location → permissions.\n- Android startup displays the native application version.\n- Fullscreen signature action is present in Edit Profile.\n- Dashboard uses `/my/dashboard`, `/my/stats`, `/my/leaderboard`, `/my/app-items`, and subscription status; station access is sourced from the unified app-items endpoint.\n- PHP syntax and JavaScript route references are validated by CI.\n- Live MySQL/Production E2E cannot be truthfully claimed by a GitHub source-only workflow; it is explicitly left as a deployment-time verification item.\n''',encoding='utf-8')
          PY

      - name: Validate Android route and source consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q "name=\"Help\"" mobile/App.js
          grep -q "راهنمای استفاده" mobile/src/screens/DashboardScreen.js
          grep -q "Developer Options" mobile/src/PermissionGuard.js
          grep -q "نسخه برنامه" mobile/src/StartupGate.js
          grep -q "تمام‌صفحه کردن محل درج امضا" mobile/src/screens/AccountScreens.js

      - name: Validate PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l php/app/line-location-api.php
          php -l php/app/api/unified-role-app-items.php
          node --check php/app/web-android-parity-v32.js

      - name: Validate version consistency
        shell: python
        run: |
          import json,re
          from pathlib import Path
          p=json.loads(Path('mobile/package.json').read_text())
          a=Path('mobile/app.config.js').read_text()
          assert p['version']=='1.3.74', p['version']
          assert '1.3.74' in a, 'app.config.js version mismatch'

      - name: Commit final requested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.js mobile/src/screens/DashboardScreen.js mobile/src/StartupGate.js mobile/src/screens/AccountScreens.js mobile/package.json php/app/help.html php/app/web-android-parity-v32.js php/app/app.html docs/FINAL_REQUESTED_CHANGES_AUDIT.md
          if git diff --cached --quiet; then echo 'No source changes required'; exit 0; fi
          git commit -m 'feat: finalize requested Android Web parity and startup hardening [final-requested-changes]'
          git push
