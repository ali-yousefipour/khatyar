name: fix-radio-list-rtl
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'chore: retry radio list rtl repair' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply radio fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc_path = Path('mobile/src/radio/RadioContext.js')
          rc = rc_path.read_text(encoding='utf-8')
          start = rc.index('const sortRecentMessages=')
          end = rc.index(';const apply=', start) + len(';const apply=')
          new_block = r'''const sortRecentMessages=list=>{const map=new Map();for(const m of(Array.isArray(list)?list:[])){if(m&&m.id!=null)map.set(String(m.id),m)}return Array.from(map.values()).sort((a,b)=>Number(b?.id||0)-Number(a?.id||0)).slice(0,3)};const mergeRecentMessages=(prev,next)=>sortRecentMessages([...(Array.isArray(prev)?prev:[]),...(Array.isArray(next)?next:[])]);const loadRecentMessages=async()=>{if(!user?.id||!channelRef.current)return;const requestedChannel=Number(channelRef.current);try{const cr=await request('/radio-api-v2.php?op=channels',{noStore:true});if(!mountedRef.current||requestedChannel!==Number(channelRef.current))return;const fresh=extractChannels(cr),current=fresh.find(x=>Number(x.id)===requestedChannel),serverLast=Number(current?.last_message_id||0),anchor=Math.max(0,serverLast-50);const r=await request(`/radio-api-v2.php?op=poll&channel_id=${requestedChannel}&after=${anchor}`,{noStore:true});if(!mountedRef.current||requestedChannel!==Number(channelRef.current))return;const list=Array.isArray(r?.messages)?r.messages:[];lastIdRef.current=Math.max(lastIdRef.current,serverLast,...list.map(m=>Number(m?.id||0)));if(list.length)setRecentMessages(prev=>mergeRecentMessages(prev,list))}catch(e){}};const apply='''
          rc = rc[:start] + new_block + rc[end:]
          rc = rc.replace('setChannelIdState(cid);channelRef.current=cid;lastIdRef.current=Number(c.last_message_id||0);', 'setChannelIdState(cid);channelRef.current=cid;setRecentMessages([]);lastIdRef.current=Number(c.last_message_id||0);', 1)
          rc = rc.replace('poll();presence();loadRecentMessages();const t=', 'poll();presence();const t=', 1)
          rc = rc.replace('if(mountedRef.current)setRecentMessages(prev=>sortRecentMessages([...newMessages,...prev]))', 'if(mountedRef.current)setRecentMessages(prev=>mergeRecentMessages(prev,newMessages))', 1)
          rc_path.write_text(rc, encoding='utf-8')

          rs_path = Path('mobile/src/screens/RadioScreen.js')
          rs = rs_path.read_text(encoding='utf-8')
          rs = rs.replace("import{request}from'../api';", '', 1)
          rs = rs.replace(',[recent,setRecent]=useState([])', '', 1)
          rs = rs.replace(',recentBusyRef=useRef(null),recentSeqRef=useRef(0)', '', 1)
          start = rs.index('const sortLatest=')
          end = rs.index('const actualBusy=', start)
          rs = rs[:start] + rs[end:]
          rs = rs.replace('{recent.length?recent.map(m=>', '{recentMessages.length?recentMessages.map(m=>', 1)
          rs = rs.replace("{m.sender_name||'کاربر'}</Text>", "{String(m.sender_name||[m.first_name,m.last_name,m.family].filter(Boolean).join(' ')||'کاربر').trim()}</Text>", 1)
          rs = rs.replace("info:{flex:1,alignItems:'flex-end'}", "info:{flex:1,minWidth:0,alignItems:'flex-end'}")
          rs = rs.replace("name:{fontFamily", "name:{alignSelf:'stretch',lineHeight:21,fontFamily")
          rs = rs.replace("role:{fontFamily", "role:{alignSelf:'stretch',fontFamily", 1)
          rs = rs.replace("time:{fontFamily", "time:{alignSelf:'stretch',fontFamily")
          rs = rs.replace("recentRow:{borderWidth", "recentRow:{minWidth:0,borderWidth")
          rs = rs.replace("play:{borderRadius", "play:{minWidth:76,borderRadius")
          rs = rs.replace("status:{fontFamily", "status:{alignSelf:'stretch',fontFamily")
          rs_path.write_text(rs, encoding='utf-8')
          PY
      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/radio/RadioContext.js mobile/src/screens/RadioScreen.js
          git commit -m "fix(radio): stabilize recent list and rtl text" || exit 0
          git rm .github/workflows/fix-radio-list-rtl.yml
          git commit -m "chore: remove radio repair workflow"
          git push origin HEAD:main
