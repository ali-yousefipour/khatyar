name: build-android-myket

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching mobile/package.json"
        required: true
        default: "1.5.16"
  push:
    branches:
      - "main"

permissions:
  contents: write

concurrency:
  group: android-myket-${{ github.ref }}
  cancel-in-progress: false

jobs:
  myket:
    name: Build signed APK for Myket
    # Only explicit release commits trigger an automatic APK build.
    # A normal code push must not publish an unreviewed release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'ci(android-myket):') || startsWith(github.event.head_commit.message, 'ci(android-release):')
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22.23.1"
      JAVA_VERSION: "17"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./mobile/package.json').version")"
          VERSION="${VERSION:-$PACKAGE_VERSION}"
          test "$VERSION" = "$PACKAGE_VERSION" || { echo "::error::Version does not match mobile/package.json"; exit 1; }
          test "$VERSION" = "$(node -p "require('./mobile/app.config.js')({config:{}}).version")" || { echo "::error::Version does not match app.config.js"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm to local build toolchain
        run: npm install --global npm@12.0.2

      - name: Force official npm registry for GitHub Actions
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 3
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate locked Android/Expo baseline
        working-directory: mobile
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = process.env.EXPECTED_VERSION;
          const root = lock.packages && lock.packages[''];
          const checks = [
            ['package.json version', pkg.version, expected],
            ['package-lock root version', root?.version, expected],
            ['Expo SDK', pkg.dependencies?.expo, '~57.0.29'],
            ['React Native', pkg.dependencies?.['react-native'], '0.86.3'],
            ['React', pkg.dependencies?.react, '19.2.3'],
          ];
          for (const [name, actual, wanted] of checks) {
            if (actual !== wanted) {
              console.error(`::error::${name} mismatch: expected "${wanted}", got "${actual}"`);
              process.exit(1);
            }
          }
          console.log('Declared release baseline validated; lockfile will be installed with npm ci.');
          NODE

      - name: Diagnose npm dependency sources
        working-directory: mobile
        shell: bash
        run: |
          echo "npm registry: $(npm config get registry)"
          echo "npm version: $(npm --version)"
          echo "Node version: $(node --version)"
          node <<'NODE'
          const lock = require('./package-lock.json');
          const hosts = {};
          for (const [name, pkg] of Object.entries(lock.packages || {})) {
            if (!pkg.resolved || !/^https?:\/\//.test(pkg.resolved)) continue;
            const host = new URL(pkg.resolved).hostname;
            hosts[host] = (hosts[host] || 0) + 1;
          }
          console.log('Dependency tarball hosts:', JSON.stringify(hosts, null, 2));
          NODE

      - name: Normalize CI lockfile tarball URLs
        working-directory: mobile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
          let changed = 0;
          for (const [name, pkg] of Object.entries(lock.packages || {})) {
            if (!pkg.resolved || typeof pkg.resolved !== 'string') continue;
            const u = new URL(pkg.resolved);
            if (u.hostname === 'mirror-npm.runflare.com') {
              u.hostname = 'registry.npmjs.org';
              pkg.resolved = u.toString();
              changed++;
            }
            if (pkg.resolved.startsWith('https://mirror-npm.runflare.com/')) {
              throw new Error('Mirror URL remains in ' + name);
            }
          }
          fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
          console.log('Normalized ' + changed + ' Runflare tarball URLs to official npm registry.');
          NODE

      - name: Regenerate dependency lockfile for aligned Expo 57 build
        working-directory: mobile
        timeout-minutes: 12
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        shell: bash
        run: |
          npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); for(const [k,v] of Object.entries(p.dependencies)) if(l.packages[''].dependencies[k]!==v) throw Error('lock mismatch '+k)"
          echo "CI lockfile regenerated for Expo 57; no lockfile changes committed."

      - name: Install locked mobile dependencies
        working-directory: mobile
        timeout-minutes: 12
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
          npm_config_fetch_retries: "2"
          npm_config_fetch_timeout: "120000"
        shell: bash
        run: |
          set -o pipefail
          echo "Effective npm registry: $(npm config get registry)"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          echo "Starting npm ci at $(date -u +%FT%TZ)"
          npm ci --legacy-peer-deps --no-audit --no-fund --loglevel=http --foreground-scripts 2>&1 | while IFS= read -r line; do
            printf '[%s] %s\n' "$(date -u +%FT%TZ)" "$line"
          done

      - name: Verify Expo dependency tree
        working-directory: mobile
        timeout-minutes: 5
        shell: bash
        env:
          CI: "true"
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        run: |
          set -o pipefail
          echo "Expo Doctor started at $(date -u +%FT%TZ)"
          echo "Node: $(node --version); npm: $(npm --version)"
          echo "Registry: $(npm config get registry)"
          set +e
          npx --yes expo-doctor 2>&1 | while IFS= read -r line; do
            printf '[%s] %s\\n' "$(date -u +%FT%TZ)" "$line"
          done
          doctor_status=${PIPESTATUS[0]}
          set -e
          if [ "$doctor_status" -ne 0 ]; then
            echo "::warning::Expo Doctor reported dependency compatibility issues (exit $doctor_status); native APK build will run to reveal any compile errors. Review Expo Doctor logs before release."
          fi
          echo "Expo Doctor completed at $(date -u +%FT%TZ)"

      - name: Validate native config plugin syntax
        working-directory: mobile
        shell: bash
        run: |
          node --check plugins/withWifiRebornSdkCompat.js
          node --check app.config.js
          node scripts/test-company-payroll.cjs
          node scripts/test-update-contract.cjs
          node scripts/test-selfie-delivery.cjs
          node scripts/test-radio-live.cjs
          node scripts/test-radio-sfx.cjs
          node scripts/test-work-timer.cjs

      - name: Generate clean Android project
        working-directory: mobile
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify CI repository policy and Gradle baseline
        working-directory: mobile/android
        shell: bash
        run: |
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Generated Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties
          if ! grep -Fq 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties; then
            echo "::error::Unexpected Gradle wrapper version; expected Expo 57 generated Gradle 9.3.1."
            exit 1
          fi
          if grep -RniE 'maven\.myket\.ir|mirror-maven\.runflare\.com' settings.gradle* build.gradle* app/build.gradle* gradle.properties 2>/dev/null; then
            echo "::error::Iranian Maven mirrors were injected into the GitHub Actions Android project."
            exit 1
          fi
          echo "CI Maven policy validated: official Google/Maven repositories only."

      - name: Assert generated Myket release signing configuration
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("app/build.gradle").read_text()
          bt = re.search(r'\bbuildTypes\s*\{', src)
          assert bt, "buildTypes missing"
          release = re.search(r'\brelease\s*\{', src[bt.end():])
          assert release, "release build type missing"
          start = bt.end() + release.end()
          depth = 1
          i = start
          while depth and i < len(src):
              if src[i] == '{': depth += 1
              elif src[i] == '}': depth -= 1
              i += 1
          assert depth == 0, "release build block unbalanced"
          body = src[start:i-1]
          assert not re.search(r'signingConfig\s+signingConfigs\.debug', body), "Release is configured with DEBUG signing"
          assert re.search(r'signingConfig\s+signingConfigs\.myketRelease', body), "Myket release signing is not applied"
          assert 'myketRelease {' in src, "Myket signing config missing"
          print("Verified generated Gradle release signing configuration; no debug signing assignment.")
          PY

      - name: Restore Myket signing keystore
        shell: bash
        env:
          MYKET_KEYSTORE_BASE64: ${{ secrets.MYKET_KEYSTORE_BASE64 }}
          MYKET_STORE_PASSWORD: ${{ secrets.MYKET_STORE_PASSWORD }}
          MYKET_KEY_ALIAS: ${{ secrets.MYKET_KEY_ALIAS }}
          MYKET_KEY_PASSWORD: ${{ secrets.MYKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in MYKET_KEYSTORE_BASE64 MYKET_STORE_PASSWORD MYKET_KEY_ALIAS MYKET_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing repository secret: $key"; exit 1; fi
          done
          umask 077
          printf '%s' "$MYKET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myket-release.jks"
          test -s "$RUNNER_TEMP/myket-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/myket-release.jks" -storepass "$MYKET_STORE_PASSWORD" -alias "$MYKET_KEY_ALIAS" >/dev/null
          echo "MYKET_STORE_FILE=$RUNNER_TEMP/myket-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile/android
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          MYKET_BUILD: "true"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          MYKET_STORE_PASSWORD: ${{ secrets.MYKET_STORE_PASSWORD }}
          MYKET_KEY_ALIAS: ${{ secrets.MYKET_KEY_ALIAS }}
          MYKET_KEY_PASSWORD: ${{ secrets.MYKET_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # Fresh CI runners occasionally receive incomplete Maven/Plugin Portal metadata.
          # Retry only dependency-resolution failures, never compilation or bundling errors.
          for attempt in 1 2 3; do
            echo "Gradle release build attempt $attempt/3"
            log_file="$RUNNER_TEMP/myket-gradle-attempt-$attempt.log"
            if ./gradlew app:assembleRelease --no-daemon --stacktrace --console=plain --max-workers=2 --refresh-dependencies \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Could not (find|resolve|download|GET|HEAD)|Read timed out|Connection reset|Remote host terminated|PKIX path building failed|Could not parse POM' "$log_file"; then
              echo "::error::Gradle build failed; not retrying a non-dependency error (or retries exhausted)."
              exit 1
            fi
            echo "::warning::Dependency repository resolution failed; retrying with refreshed Gradle metadata."
            sleep $((attempt * 15))
          done

      - name: Verify Myket APK signature and identity
        working-directory: mobile
        env:
          MYKET_STORE_PASSWORD: ${{ secrets.MYKET_STORE_PASSWORD }}
          MYKET_KEY_ALIAS: ${{ secrets.MYKET_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          if unzip -Z1 "$APK" | grep '^lib/armeabi-v7a/' >/dev/null; then
            echo "::error::32-bit native library found in arm64-only Myket APK"
            exit 1
          fi
          if ! unzip -Z1 "$APK" | grep '^lib/arm64-v8a/' >/dev/null; then
            echo "::error::arm64-v8a native libraries missing from Myket APK"
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/myket-signature.txt"
          if grep -Eiq 'CN[[:space:]]*=[[:space:]]*Android Debug|OU[[:space:]]*=[[:space:]]*Android' "$RUNNER_TEMP/myket-signature.txt"; then
            echo "::error::Android Debug certificate detected; refusing to publish."
            exit 1
          fi
          # Inspect the actual signing certificate, not only the APK signature scheme.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:' >/dev/null

          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/myket-release.jks" -storepass "$MYKET_STORE_PASSWORD" -alias "$MYKET_KEY_ALIAS" > "$RUNNER_TEMP/myket-release-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/myket-release-cert.pem" -outform DER | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/expected-cert.sha256"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/myket-signature.txt" | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]' > "$RUNNER_TEMP/apk-cert.sha256"
          diff -u "$RUNNER_TEMP/expected-cert.sha256" "$RUNNER_TEMP/apk-cert.sha256" || { echo "::error::APK is not signed with the configured Myket release key"; exit 1; }
          if openssl x509 -in "$RUNNER_TEMP/myket-release-cert.pem" -noout -subject | grep -Eiq 'CN[[:space:]]*=[[:space:]]*Android Debug'; then
            echo "::error::Configured keystore itself contains an Android Debug certificate."
            exit 1
          fi
          echo "APK release signing certificate SHA-256: $(cat "$RUNNER_TEMP/apk-cert.sha256")"

          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/myket-signature.txt"; then
            echo "::error::APK v2 signature missing"; exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 3
          if ! "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='ir.mashhad.taxicontrol'"; then
            echo "::error::Unexpected Android package ID"; exit 1
          fi
          ACTUAL_VERSION="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -1)"
          if [ "$ACTUAL_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Signed APK version ($ACTUAL_VERSION) does not match requested version (${{ steps.version.outputs.version }})."
            exit 1
          fi
          mkdir -p ../release
          cp "$APK" ../release/khatyar-myket-${{ steps.version.outputs.version }}.apk
          cp "$APK" ../release/khatyar.apk
          (cd ../release && sha256sum "khatyar-myket-${{ steps.version.outputs.version }}.apk" > "khatyar-myket-${{ steps.version.outputs.version }}.apk.sha256")
          (cd ../release && sha256sum khatyar.apk > khatyar.apk.sha256)

      - name: Upload Myket signed APK
        uses: actions/upload-artifact@v4
        with:
          name: khatyar-myket-${{ steps.version.outputs.version }}
          path: |
            release/khatyar-myket-${{ steps.version.outputs.version }}.apk
            release/khatyar-myket-${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # GitHub Actions artifacts are downloadable as ZIP files. A GitHub Release
      # asset is published separately so the Android updater can use a direct APK URL.
      - name: Publish direct APK to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          test -s release/khatyar.apk
          test -s release/khatyar.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/khatyar.apk release/khatyar.apk.sha256 --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" release/khatyar.apk release/khatyar.apk.sha256 \
              --target "$TARGET_SHA" \
              --title "خطیار ${VERSION}" \
              --generate-notes \
              --latest
          fi
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --pattern 'khatyar.apk.sha256' --dir "$RUNNER_TEMP/release-check" --clobber
          cmp release/khatyar.apk.sha256 "$RUNNER_TEMP/release-check/khatyar.apk.sha256"
          echo "Direct APK: https://github.com/${{ github.repository }}/releases/latest/download/khatyar.apk"
          echo "Versioned APK: https://github.com/${{ github.repository }}/releases/download/$TAG/khatyar.apk"

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/myket-release.jks"
