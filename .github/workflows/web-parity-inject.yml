name: Inject web parity runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[web-parity-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested Android/Web changes
        shell: python
        run: |
          from pathlib import Path
          import re, json

          # Web parity runtime reference
          p=Path('php/app/app.html')
          if not p.exists(): raise SystemExit('php/app/app.html not found')
          text=p.read_text(encoding='utf-8')
          marker='<!-- KHATYAR_WEB_ANDROID_PARITY_V32 -->'
          tag=f'\n{marker}\n<script src="web-android-parity-v32.js?v=2" defer></script>\n'
          if marker in text:
              text=re.sub(r'\\s*<!-- KHATYAR_WEB_ANDROID_PARITY_V32 -->\\s*<script[^>]+web-android-parity-v32\\.js[^>]*></script>\\s*',tag,text,count=1)
          else:
              pos=text.lower().rfind('</body>')
              if pos<0: raise SystemExit('</body> not found in app.html')
              text=text[:pos]+tag+text[pos:]
          p.write_text(text,encoding='utf-8')

          # Android navigation: add a real Help screen and dashboard entry.
          p=Path('mobile/App.js'); s=p.read_text(encoding='utf-8')
          if "from './src/screens/HelpScreen'" not in s:
              s=s.replace("import SetupScreen from './src/screens/SetupScreen';","import SetupScreen from './src/screens/SetupScreen';import HelpScreen from './src/screens/HelpScreen';")
          if 'name="Help"' not in s:
              marker="<Stack.Screen name=\"Dashboard\" component={DashboardScreen} options={({navigation})=>({title:'داشبورد',headerLeft:()=> <ProfileBtn navigation={navigation}/>})}/>"
              replacement=marker+"<Stack.Screen name=\"Help\" component={HelpScreen} options={{title:'راهنمای استفاده'}}/>"
              if marker not in s: raise SystemExit('Dashboard route marker not found')
              s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')

          p=Path('mobile/src/screens/DashboardScreen.js'); s=p.read_text(encoding='utf-8')
          if "t:'راهنمای استفاده'" not in s:
              s=s.replace('const MENU=[',"const MENU=[{icon3d:ICON3D.activity,t:'راهنمای استفاده',r:'Help',bg:'#e8f3ff',always:true},",1)
          p.write_text(s,encoding='utf-8')

          # Version consistency
          p=Path('mobile/package.json'); d=json.loads(p.read_text(encoding='utf-8')); d['version']='1.3.74'; d['description']='خطیار — نسخه 1.3.74'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Splash version label
          p=Path('mobile/src/StartupGate.js'); s=p.read_text(encoding='utf-8')
          if "from 'expo-constants'" not in s:s=s.replace("import { faNum } from './num';","import { faNum } from './num';\nimport Constants from 'expo-constants';")
          if 'const versionLabel' not in s:s=s.replace("const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';","const MAINTENANCE_CACHE_KEY = 'startup_maintenance_status_v1';\nconst versionLabel = String(Constants.expoConfig?.version || '1.3.74');")
          if '<Text style={s.version}>' not in s:s=s.replace('<Text style={s.phase}>{phase}</Text>','<Text style={s.version}>نسخه {faNum(versionLabel)}</Text><Text style={s.phase}>{phase}</Text>')
          if 'version: {' not in s:s=s.replace('phase: { marginTop: 10,',"version: { marginTop: 7, color: '#d7eee8', fontFamily: FONT.regular, fontSize: 11, textAlign: 'center' },\n  phase: { marginTop: 6,")
          p.write_text(s,encoding='utf-8')

          # Fullscreen signature capture.
          p=Path('mobile/src/screens/AccountScreens.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder','View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, Image, ScrollView, Switch, Animated, Easing, useWindowDimensions, PanResponder, Modal')
          pat=re.compile(r'function SignaturePad\(\{ value, onChange \}\) \{.*?\n\}\n\nexport function EditProfileScreen',re.S)
          repl='''function SignaturePad({ value, onChange }) {
  const padRef=useRef(null),[points,setPoints]=useState([]),[full,setFull]=useState(false),last=useRef(null);
  const pan=useRef(PanResponder.create({onStartShouldSetPanResponder:()=>true,onMoveShouldSetPanResponder:()=>true,onPanResponderGrant:e=>{const{x,y}=e.nativeEvent;last.current={x,y};setPoints(a=>[...a,{x,y}])},onPanResponderMove:e=>{const{x,y}=e.nativeEvent,a=last.current;if(!a)return;const dx=x-a.x,dy=y-a.y,d=Math.max(1,Math.ceil(Math.sqrt(dx*dx+dy*dy)/3)),seg=[];for(let i=1;i<=d;i++)seg.push({x:a.x+dx*i/d,y:a.y+dy*i/d});last.current={x,y};setPoints(p=>[...p,...seg])},onPanResponderRelease:()=>{last.current=null},onPanResponderTerminate:()=>{last.current=null}})).current;
  const clear=()=>{setPoints([]);onChange(null)};const save=async()=>{if(!points.length)return Alert.alert('امضا','ابتدا امضای خود را رسم کنید.');try{const uri=await captureRef(padRef,{format:'png',quality:1,result:'data-uri'});onChange(uri);setFull(false);Alert.alert('امضا','امضا آماده ذخیره است.')}catch{Alert.alert('خطا','ذخیره تصویر امضا انجام نشد.')}};
  const pad=<View ref={padRef} collapsable={false} style={[s.signaturePad,full&&s.signaturePadFull]} {...pan.panHandlers}>{points.map((p,i)=><View key={i} pointerEvents="none" style={[s.signatureDot,{left:p.x-2,top:p.y-2}]}/>)}</View>;
  return <View style={s.signatureBox}><Text style={s.zoneTitle}>امضای پرسنلی</Text><Text style={s.zoneHint}>امضای خود را با انگشت داخل کادر رسم کنید.</Text>{value&&!points.length?<Image source={{uri:value}} style={s.signaturePreview} resizeMode="contain"/>:null}{pad}<View style={{flexDirection:'row-reverse',gap:8}}><TouchableOpacity style={[s.btn,{flex:1,marginTop:10}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,marginTop:10,backgroundColor:'#6b7280'}]} onPress={clear}><Text style={s.btnTxt}>پاک کردن</Text></TouchableOpacity></View><TouchableOpacity style={[s.btn,{marginTop:10,backgroundColor:'#173b61'}]} onPress={()=>setFull(true)}><Text style={s.btnTxt}>تمام‌صفحه کردن محل درج امضا</Text></TouchableOpacity><Modal visible={full} animationType="slide" onRequestClose={()=>setFull(false)}><View style={s.fullWrap}><View style={s.fullHead}><Text style={s.fullTitle}>ثبت امضا در حالت تمام‌صفحه</Text><TouchableOpacity onPress={()=>setFull(false)}><Text style={s.fullClose}>بستن</Text></TouchableOpacity></View><Text style={s.fullHint}>با انگشت امضای خود را در فضای بزرگ رسم کنید.</Text>{pad}<View style={s.fullActions}><TouchableOpacity style={[s.btn,{flex:1}]} onPress={save}><Text style={s.btnTxt}>ثبت امضا</Text></TouchableOpacity><TouchableOpacity style={[s.btn,{flex:1,backgroundColor:'#6b7280'}]} onPress={clear}><Text style={s.btnTxt}>پاک کردن</Text></TouchableOpacity></View></View></Modal></View>;
}

export function EditProfileScreen'''
          ns=pat.sub(repl,s,count=1)
          if ns==s: raise SystemExit('SignaturePad pattern not found')
          s=ns
          if 'signaturePadFull:' not in s:s=s.replace('signaturePad:',"signaturePadFull:{flex:1,minHeight:260,borderWidth:2,borderColor:CC.brand,borderStyle:'dashed',borderRadius:16,backgroundColor:'#fff',marginTop:14,position:'relative'},signaturePad:")
          if 'fullWrap:' not in s:
              i=s.rfind('});'); s=s[:i]+",fullWrap:{flex:1,backgroundColor:CC.paper,padding:16,paddingTop:28},fullHead:{flexDirection:'row-reverse',justifyContent:'space-between',alignItems:'center'},fullTitle:{fontFamily:FONT.bold,color:CC.ink,fontSize:16},fullClose:{fontFamily:FONT.bold,color:CC.brand,fontSize:13},fullHint:{fontFamily:FONT.regular,color:CC.muted,fontSize:12,textAlign:'right',marginTop:8},fullActions:{flexDirection:'row-reverse',gap:8,marginTop:12}"+s[i:]
          p.write_text(s,encoding='utf-8')

          # Keep the existing web station parity and add a concise Help entry to the runtime.
          p=Path('php/app/app-parity.js'); s=p.read_text(encoding='utf-8')
          if 'راهنمای استفاده' not in s:s=s.replace('const items=[',"const items=[['ℹ','راهنمای استفاده','help'],",1)
          if 'function showHelp' not in s:
              s=s.replace('function tool(n){',"function showHelp(){css();const body=document.getElementById('body');if(!body)return;const root=document.createElement('section');root.id='kh-help';root.className='kh-parity';root.innerHTML='<div class=\"kh-parity-card\" style=\"display:block\"><div class=\"kh-parity-title\">راهنمای کامل استفاده از خطیار</div><div class=\"kh-ls-card\"><b>شروع کار</b><div class=\"kh-ls-status\">ورود، داشبورد نقش‌محور و همگام‌سازی اطلاعات.</div><div class=\"kh-ls-status\">در شروع، کش قبل از کنترل‌های امنیتی تازه می‌شود.</div></div><div class=\"kh-ls-card\"><b>عملیات میدانی</b><div class=\"kh-ls-status\">حضور، مأموریت، بازدید، پوشش خط، GPS و ثبت تصاویر ایستگاه.</div></div><div class=\"kh-ls-card\"><b>گزارش و ارتباطات</b><div class=\"kh-ls-status\">گزارش، فرم، درخواست، پیامک، ربات، پیام و اعلان.</div></div><div class=\"kh-ls-card\"><b>حساب کاربری</b><div class=\"kh-ls-status\">ویرایش اطلاعات، امضای پرسنلی، فیش، کارکرد و تنظیمات.</div></div><div class=\"kh-ls-card\"><b>اطلاعات برنامه</b><div class=\"kh-ls-status\">توسعه‌دهنده: علی یوسفی‌پور</div><div class=\"kh-ls-status\">شرکت: مبین شات</div></div></div>';body.appendChild(root);root.scrollIntoView({behavior:'smooth'})}function tool(n){")
              s=s.replace("if(r&&typeof nav==='function')nav(r.dataset.route);","if(r&&r.dataset.route==='help'){showHelp();return;}if(r&&typeof nav==='function')nav(r.dataset.route);")
          p.write_text(s,encoding='utf-8')

          # Remove the failed helper workflows once this successful workflow takes over.
          for wf in ['.github/workflows/apply-ui-startup-hardening.yml','.github/workflows/finalize-ui-startup-hardening.yml','.github/workflows/khatyar-requested-changes.yml']:
              x=Path(wf)
              if x.exists(): x.unlink()

          # Audit report
          routes=set(re.findall(r'<Stack\.Screen name="([^"]+)"',Path('mobile/App.js').read_text(encoding='utf-8')))
          menu=set(re.findall(r"r:'([^']+)'",Path('mobile/src/screens/DashboardScreen.js').read_text(encoding='utf-8')))
          missing=sorted(menu-routes)
          report=['# Khatyar UI / Backend integration audit','',f'Android dashboard entries: {len(menu)}',f'Registered navigation screens: {len(routes)}',f'Menu entries without registered screen: {len(missing)}']+[f'- `{x}`' for x in missing]+['','Runtime note: source-level route/API wiring is verified; real HTTP/MySQL verification must run against staging/production.','Implemented: Android/Web help, staged startup checks, splash version, developer/company metadata, fullscreen signature capture, Android-oriented Web parity.']
          Path('PROJECT_UI_PARITY_AUDIT.md').write_text('\n'.join(report)+'\n',encoding='utf-8')

      - name: Validate syntax
        shell: bash
        run: |
          node --check mobile/App.js
          node --check mobile/src/PermissionGuard.js
          node --check mobile/src/StartupGate.js
          node --check mobile/src/screens/HelpScreen.js
          node --check mobile/src/screens/DashboardScreen.js
          node --check mobile/src/screens/AccountScreens.js
          node --check php/app/app-parity.js
          node -e "JSON.parse(require('fs').readFileSync('mobile/package.json','utf8')); console.log('JSON OK')"
          php -l php/app/line-location-api.php

      - name: Commit injected changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: requested help startup signature and web parity [web-parity-injected]'
          git push
