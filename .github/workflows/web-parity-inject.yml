name: Inject web parity runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[web-parity-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject runtime into web app
        shell: python
        run: |
          from pathlib import Path
          p = Path('php/app/app.html')
          marker = '<!-- KHATYAR_WEB_PARITY_V2 -->'
          if not p.exists():
              raise SystemExit('php/app/app.html not found')
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              tag = f'\n{marker}\n<script src="web-android-parity-v2.js" defer></script>\n'
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('</body> not found in app.html')
              text = text[:pos] + tag + text[pos:]
              p.write_text(text, encoding='utf-8')
      - name: Commit injected script reference
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add php/app/app.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web): load Android parity runtime [web-parity-injected]'
          git push
