name: Inject web parity runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[web-parity-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject or refresh Android parity runtime in web app
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('php/app/app.html')
          if not p.exists():
              raise SystemExit('php/app/app.html not found')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- KHATYAR_WEB_ANDROID_PARITY_V32 -->'
          tag = f'\n{marker}\n<script src="web-android-parity-v32.js?v=2" defer></script>\n'
          if marker in text:
              text = re.sub(r'\\s*<!-- KHATYAR_WEB_ANDROID_PARITY_V32 -->\\s*<script[^>]+web-android-parity-v32\\.js[^>]*></script>\\s*', tag, text, count=1)
          else:
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('</body> not found in app.html')
              text = text[:pos] + tag + text[pos:]
          p.write_text(text, encoding='utf-8')
      - name: Ensure station app item navigation and API cleanup
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('php/app/app-parity.js')
          s=p.read_text(encoding='utf-8')
          marker="if(r&&typeof nav==='function')nav(r.dataset.route);"
          repl="if(r&&r.dataset.route==='lineLocation'){window.location.href='/line-location.html';return;}if(r&&typeof nav==='function')nav(r.dataset.route);"
          if marker in s and "r.dataset.route==='lineLocation'" not in s:
              s=s.replace(marker,repl,1)
              p.write_text(s,encoding='utf-8')
          p=Path('php/app/line-location-api.php')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"if\(\$op==='roles'\)\{ll_fail\('این تنظیمات حذف شده است',404\);if\(false\)\{.*?\}\nif\(\$op==='save-role'\)","if($op==='roles')ll_fail('این تنظیمات حذف شده است',404);\nif($op==='save-role')",s,count=1,flags=re.S)
          s=re.sub(r"if\(\$op==='save-role'\)\{ll_fail\('این تنظیمات حذف شده است',404\);if\(false\)\{.*?\}\nif\(\$op==='capture'\)","if($op==='save-role')ll_fail('این تنظیمات حذف شده است',404);\nif($op==='capture')",s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Validate station API PHP syntax
        shell: bash
        run: php -l php/app/line-location-api.php
      - name: Commit injected script reference and station fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add php/app/app.html php/app/app-parity.js php/app/line-location-api.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web): finalize station app item routing and API cleanup [web-parity-injected]'
          git push
