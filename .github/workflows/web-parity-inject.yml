name: Inject web parity runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[web-parity-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject or refresh Android parity runtime in web app
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('php/app/app.html')
          if not p.exists():
              raise SystemExit('php/app/app.html not found')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- KHATYAR_WEB_ANDROID_PARITY_V32 -->'
          tag = f'\n{marker}\n<script src="web-android-parity-v32.js?v=2" defer></script>\n'
          if marker in text:
              text = re.sub(r'\\s*<!-- KHATYAR_WEB_ANDROID_PARITY_V32 -->\\s*<script[^>]+web-android-parity-v32\\.js[^>]*></script>\\s*', tag, text, count=1)
          else:
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('</body> not found in app.html')
              text = text[:pos] + tag + text[pos:]
          p.write_text(text, encoding='utf-8')
      - name: Patch station capture as role-configurable app item
        shell: python
        run: |
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')

          p=Path('mobile/src/screens/DashboardScreen.js'); s=read(p)
          old="{ icon3d: ICON3D.activity, t: 'ثبت موقعیت و تصویر خطوط', r: 'LineLocation', bg: '#e8f3ff', always: true },"
          new="{ icon3d: ICON3D.activity, t: 'ثبت ایستگاه‌ها', r: 'LineLocation', bg: '#e8f3ff' },"
          if old in s: s=s.replace(old,new,1)
          write(p,s)

          p=Path('php/app/app-parity.js'); s=read(p)
          marker="['🛣','خطوط تاکسیرانی','lines'],"
          if marker in s and "['📍','ثبت ایستگاه‌ها','lineLocation']" not in s:
              s=s.replace(marker,marker+"['📍','ثبت ایستگاه‌ها','lineLocation'],",1)
          oldroute="function route(n){try{if(typeof window.nav==='function'){window.nav(n);return;}if(typeof window.navigate==='function'){window.navigate(n);return;}}catch(e){}}"
          newroute="function route(n){try{if(n==='lineLocation'){window.location.href='/line-location.html';return;}if(typeof window.nav==='function'){window.nav(n);return;}if(typeof window.navigate==='function'){window.navigate(n);return;}}catch(e){}}"
          if oldroute in s: s=s.replace(oldroute,newroute,1)
          extra_js=";fetch('/api/my/app-items',{headers:{Authorization:'Bearer '+(localStorage.getItem('token')||localStorage.getItem('access')||localStorage.getItem('access_token')||'')}}).then(r=>r.ok?r.json():null).then(cfg=>{if(Array.isArray(cfg?.items)&&!cfg.items.includes('LineLocation'))root.querySelector('[data-route=\"lineLocation\"]')?.remove()}).catch(()=>{})"
          if extra_js not in s and "body.appendChild(root);root.onclick=" in s:
              s=s.replace("body.appendChild(root);root.onclick=","body.appendChild(root)"+extra_js+";root.onclick=",1)
          write(p,s)

          p=Path('php/app/line-location-api.php'); s=read(p)
          old="function ll_can($u,$what){if(ll_is_unlimited($u))return true;$p=Db::one(\"SELECT can_capture,can_view,can_manage FROM line_location_permissions WHERE role_id=?\",[$u['role_id']]);return !empty($p[$what]);}"
          new="function ll_app_item_allowed($u){if(ll_is_unlimited($u))return true;$row=Db::one(\"SELECT value FROM app_settings WHERE `key`='role_app_items'\");$cfg=$row?json_decode($row['value'],true):[];$rid=(string)($u['role_id']??'');if(!is_array($cfg)||!array_key_exists($rid,$cfg))return true;if(!is_array($cfg[$rid]))return false;return in_array('LineLocation',$cfg[$rid],true);}\nfunction ll_can($u,$what){if($what==='can_capture'||$what==='can_view')return ll_app_item_allowed($u);return false;}"
          if old in s: s=s.replace(old,new,1)
          if "if($op==='roles')" in s:
              s=s.replace("if($op==='roles'){if(!ll_can($u,'can_manage'))ll_fail('دسترسی مدیریت مجوزها ندارید',403);","if($op==='roles'){ll_fail('این تنظیمات حذف شده است',404);if(false){",1)
          if "if($op==='save-role')" in s:
              s=s.replace("if($op==='save-role'){if(!ll_can($u,'can_manage'))ll_fail('دسترسی مدیریت مجوزها ندارید',403);","if($op==='save-role'){ll_fail('این تنظیمات حذف شده است',404);if(false){",1)
          write(p,s)

          helper=r'''(function(){
          'use strict';
          if(window.__KH_STATION_APP_ITEM_SETTINGS__)return;window.__KH_STATION_APP_ITEM_SETTINGS__=true;
          const API='/api/admin/role-app-items',KEY='LineLocation';
          const ALL=['Search','PresentList','Reports','CheckIn','Requests','RequestInbox','WorkSummary','SalarySlips','CompanyRequests','Subscription','Sms','BotMessages','MySms','Forms','Cultural','Welfare','OfficialPresence','Inventory','MyDailyMission','LineVisitProgram','LineLocation','RoleDashboard','Leaderboard','ActivityReport','ExpInsurance','ExpTaxi','ExpOplic','TeamReport','TempDrivers','Outage'];
          const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const token=()=>localStorage.getItem('token')||localStorage.getItem('access')||localStorage.getItem('access_token')||'';
          async function api(method,body){const r=await fetch(API,{method,cache:'no-store',headers:{Accept:'application/json','Content-Type':'application/json',Authorization:'Bearer '+token()},body:body?JSON.stringify(body):undefined});const t=await r.text();let d={};try{d=JSON.parse(t||'{}')}catch(e){throw Error('پاسخ نامعتبر از سرور')};if(!r.ok)throw Error(d.error||'خطای سرور');return d}
          function hideLegacy(){document.querySelectorAll('body *').forEach(el=>{if(el.children.length>8)return;const t=(el.textContent||'').trim();if(/مجوز.*ثبت موقعیت.*تصویر خطوط|ثبت موقعیت و تصویر خطوط/.test(t)&&!/ثبت ایستگاه‌ها/.test(t)){let x=el;for(let i=0;i<4&&x.parentElement;i++){if((x.className||'').toString().includes('card')||x.tagName==='SECTION'||x.tagName==='ARTICLE')break;x=x.parentElement}if(x!==document.body)x.style.display='none';}})}
          function findHost(){const nodes=[...document.querySelectorAll('h1,h2,h3,h4,h5,div,span,b,strong')];const n=nodes.find(x=>/آیتم[‌ ]*های اپ|آیتم[‌ ]*های برنامه|آیتم‌های اپ/.test((x.textContent||'').trim()));if(!n)return null;return n.closest('section,article,.card,[class*=card]')||n.parentElement}
          async function mount(){hideLegacy();if(document.getElementById('kh-station-app-item-card'))return;const host=findHost();if(!host)return;let d;try{d=await api('GET')}catch(e){return}const roles=Array.isArray(d.roles)?d.roles:[],cfg=d.config&&typeof d.config==='object'?d.config:{};const card=document.createElement('div');card.id='kh-station-app-item-card';card.dir='rtl';card.style.cssText='margin-top:12px;padding:14px;border:1px solid #e4e9f2;border-radius:16px;background:#fff;font-family:Vazirmatn,Tahoma;';
          card.innerHTML='<div style="font-weight:800;font-size:14px">📍 ثبت ایستگاه‌ها</div><div style="font-size:11px;color:#667085;line-height:1.8;margin:6px 0 10px">این آیتم مانند سایر امکانات اپ بر اساس سمت کنترل می‌شود. با تیک‌زدن، «ثبت ایستگاه‌ها» در Android و Web App همان سمت نمایش داده می‌شود. تنظیمات قدیمی «مجوز ثبت موقعیت و تصویر خطوط» دیگر استفاده نمی‌شود.</div><div id="kh-station-role-list"></div><button id="kh-station-save" style="margin-top:12px;border:0;border-radius:10px;padding:10px 16px;background:#0d7a5f;color:#fff;font:inherit;font-weight:800;cursor:pointer">ذخیره تنظیمات ثبت ایستگاه‌ها</button><span id="kh-station-status" style="margin-right:10px;font-size:11px"></span>';
          const list=card.querySelector('#kh-station-role-list');roles.forEach(r=>{const rid=String(r.id),has=Object.prototype.hasOwnProperty.call(cfg,rid),checked=!has||Array.isArray(cfg[rid])&&cfg[rid].includes(KEY);const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #eef1f6;font-size:12px;cursor:pointer';row.innerHTML='<input type="checkbox" data-role="'+esc(rid)+'" '+(checked?'checked':'')+'><span>'+esc(r.title)+'</span>';list.appendChild(row)});
          (host.parentElement||host).insertBefore(card,host.nextSibling);
          card.querySelector('#kh-station-save').onclick=async()=>{const out=JSON.parse(JSON.stringify(cfg||{}));roles.forEach(r=>{const rid=String(r.id),el=card.querySelector('[data-role="'+CSS.escape(rid)+'"]'),on=!!el?.checked;if(on){if(Object.prototype.hasOwnProperty.call(out,rid)&&Array.isArray(out[rid])){if(!out[rid].includes(KEY))out[rid].push(KEY)}else delete out[rid]}else{if(Array.isArray(out[rid]))out[rid]=out[rid].filter(x=>x!==KEY);else out[rid]=ALL.filter(x=>x!==KEY)}});const st=card.querySelector('#kh-station-status');st.textContent='در حال ذخیره…';try{await api('POST',{config:out});st.textContent='ذخیره شد';st.style.color='#16804d';setTimeout(()=>st.textContent='',1800)}catch(e){st.textContent=e.message;st.style.color='#b42318'}};
          }
          const mo=new MutationObserver(()=>{hideLegacy();mount()});mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(mount,700);setTimeout(mount,1800);setTimeout(mount,3500);
          })();
          '''
          Path('php/app/assets/station-app-item-settings.js').write_text(helper,encoding='utf-8')

          p=Path('php/app/panel.html'); s=read(p)
          marker='<script defer src="assets/station-map-report-admin.js?v=2"></script>'
          if 'station-app-item-settings.js' not in s and marker in s:
              s=s.replace(marker,marker+'\n<script defer src="assets/station-app-item-settings.js?v=1"></script>',1)
          write(p,s)

          Path('STATION_APP_ITEM_IMPLEMENTATION.md').write_text('''# ثبت ایستگاه‌ها به عنوان آیتم اپ\n\n- آیتم کلید `LineLocation` است و از `role_app_items` استفاده می‌کند.\n- Android و Web App فقط برای سمت‌هایی که این آیتم برایشان فعال شده نمایش می‌دهند.\n- تنظیمات قدیمی `line_location_permissions` دیگر منبع دسترسی ثبت/مشاهده نیست و UI آن حذف/پنهان شده است.\n- پنل مدیریت، تنظیم را در بخش «آیتم‌های اپ» با Checkbox هر سمت نمایش می‌دهد.\n''',encoding='utf-8')
      - name: Commit injected script reference and station changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add php/app/app.html mobile/src/screens/DashboardScreen.js php/app/app-parity.js php/app/line-location-api.php php/app/panel.html php/app/assets/station-app-item-settings.js STATION_APP_ITEM_IMPLEMENTATION.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat: move station capture into role-based app items [web-parity-injected]'
          git push
